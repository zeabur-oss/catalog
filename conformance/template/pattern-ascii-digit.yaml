description: In a pattern, \d is an ASCII digit, as in RE2. Arabic-Indic digits do not match \d+.
id: app
template:
  metadata: {version: "1.0.0"}
  services: [{name: app}]
  inputs:
    - {name: port, required: true, validation: {pattern: '\d+'}}
manifests: |
  apiVersion: v1
  kind: ConfigMap
  metadata: {name: app, namespace: {{ .Namespace }}}
  data:
    port: "{{ .Inputs.port }}"
options:
  namespace: shop
  inputs: {port: "\u0661\u0662"}
want:
  error: {code: pattern, input: port}
