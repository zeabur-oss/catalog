description: A pattern can set the flag (?i), as in RE2. HTTPS://example.com matches (?i)https?://.+.
id: app
template:
  metadata: {version: "1.0.0"}
  services: [{name: app}]
  inputs:
    - {name: url, required: true, validation: {pattern: '(?i)https?://.+'}}
manifests: |
  apiVersion: v1
  kind: ConfigMap
  metadata: {name: app, namespace: {{ .Namespace }}}
  data:
    url: "{{ .Inputs.url }}"
options:
  namespace: shop
  inputs: {url: "HTTPS://example.com"}
want:
  objects:
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: app
        namespace: shop
        labels: {app.kubernetes.io/instance: app, app.kubernetes.io/version: "1.0.0", templates.zeabur.com/template: app}
      data: {url: "HTTPS://example.com"}
