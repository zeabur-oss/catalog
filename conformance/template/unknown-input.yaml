description: An input the template does not have is refused.
id: app
template:
  metadata: {version: "1.0.0"}
  services: [{name: app, domains: ["{{ .Domain }}"]}]
  inputs:
    - {name: adminEmail, required: true, validation: {pattern: '[^@\s]+@[^@\s]+'}}
    - {name: password, generate: {type: random, bytes: 32, encoding: base64url}, secret: {name: app-secrets, key: password}, validation: {pattern: '[A-Za-z0-9_-]{43}'}}
manifests: |
  apiVersion: v1
  kind: ConfigMap
  metadata: {name: app, namespace: {{ .Namespace }}}
  data:
    host: {{ .Domain }}
    admin: {{ .Inputs.adminEmail }}
options:
  namespace: shop
  domain: app.example.com
  clusterIssuer: letsencrypt
  inputs: {adminEmail: me@example.com, theme: dark}
want:
  error: {code: unknown-input, input: theme}
