description: "{capability: <name>} is installed when discovery serves a CRD of any component of the capability."
components:
  - id: cloudnative-pg
    provides: {capability: databases}
    detection: {crds: [clusters.postgresql.cnpg.io]}
  - id: percona-mongodb
    provides: {capability: databases}
    detection: {crds: [perconaservermongodbs.psmdb.percona.com]}
  - id: cert-manager
    provides: {capability: certificates}
    detection: {crds: [certificates.cert-manager.io]}
served:
  - {group: psmdb.percona.com, resource: perconaservermongodbs}
requires: [{capability: databases}, {capability: certificates}]
want:
  databases: installed
  certificates: missing
