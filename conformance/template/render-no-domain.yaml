description: A template whose services have no domains renders without a domain or a cluster issuer.
id: app
template:
  metadata: {version: "1.0.0"}
  services: [{name: app}]
manifests: |
  apiVersion: v1
  kind: ConfigMap
  metadata: {name: app, namespace: {{ .Namespace }}}
options:
  namespace: shop
want:
  objects:
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: app
        namespace: shop
        labels: {app.kubernetes.io/instance: app, app.kubernetes.io/version: "1.0.0", templates.zeabur.com/template: app}
