description: A reader of any other language sees the English text.
language: ja
template:            # template.yaml, with only the text fields
  security:
    summary: Runs with the restricted profile.
    locales:
      zh-TW: {summary: 以受限設定執行。}
      zh-CN: {summary: 以受限配置运行。}
    risks:
      - risk: The first visitor becomes the owner.
        mitigation: Sign in right after the deploy.
        locales:
          zh-TW: {risk: 第一個造訪的人會成為擁有者。, mitigation: 部署完馬上登入。}
          zh-CN: {risk: 第一个访问的人会成为所有者。, mitigation: 部署完马上登录。}
  inputs:
    - name: adminEmail
      label: Admin email
      description: The email of the first account.
      locales:
        zh-TW: {label: 管理員電子郵件, description: 第一個帳號的電子郵件。}
        zh-CN: {label: 管理员邮箱, description: 第一个账号的邮箱。}
want:
  summary: Runs with the restricted profile.
  risks:
    - {risk: The first visitor becomes the owner., mitigation: Sign in right after the deploy.}
  inputs:
    adminEmail: {label: Admin email, description: The email of the first account.}
