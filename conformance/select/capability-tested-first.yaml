description: >
  A capability name resolves to a component tested on the distribution before
  one that is recommended.
components:
  - id: loki
    provides: {capability: logs}
    defaults: {single-node: recommended, multi-node: recommended}
    distributions: [k3s, rke2, kubesolo]
    testedOn:
      - {distribution: k3s, platforms: [linux/amd64]}
  - id: victoria-logs
    provides: {capability: logs}
    defaults: {single-node: optional, multi-node: optional}
    distributions: [k3s, rke2, kubesolo]
    testedOn:
      - {distribution: k3s, platforms: [linux/amd64]}
      - {distribution: rke2, platforms: [linux/amd64]}
config:
  profile: multi-node
  distribution: rke2
  platform: linux/amd64
  enable: [logs]
want:
  components:
    - {id: loki, why: default}
    - {id: victoria-logs, why: enabled}
  warnings:
    - {kind: untested, component: loki, distribution: rke2}
