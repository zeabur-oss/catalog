description: A component unsupported on the profile is left out. When enable names it, a warning says so.
components:
  - id: longhorn
    provides: {capability: replicated-storage}
    defaults: {single-node: unsupported, multi-node: recommended}
    distributions: [k3s, rke2, kubesolo]
    testedOn:
      - {distribution: k3s, platforms: [linux/amd64]}
      - {distribution: rke2, platforms: [linux/amd64]}
config:
  profile: single-node
  distribution: k3s
  platform: linux/amd64
  enable: [longhorn]
want:
  leftOut:
    longhorn: {reason: unsupported, profile: single-node}
  warnings:
    - {kind: left-out, component: longhorn}
