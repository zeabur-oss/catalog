description: A chosen component that needs a disabled component is an error.
components:
  - id: cert-manager
    provides: {capability: certificates}
    defaults: {single-node: recommended, multi-node: recommended}
    distributions: [k3s, rke2, kubesolo]
    testedOn:
      - {distribution: k3s, platforms: [linux/amd64]}
      - {distribution: rke2, platforms: [linux/amd64]}
      - {distribution: kubesolo, platforms: [linux/amd64]}
  - id: traefik
    provides: {capability: ingress}
    defaults: {single-node: recommended, multi-node: recommended}
    distributions: [k3s, rke2, kubesolo]
    testedOn:
      - {distribution: k3s, platforms: [linux/amd64]}
      - {distribution: rke2, platforms: [linux/amd64]}
      - {distribution: kubesolo, platforms: [linux/amd64]}
    installOrder:
      single-node: [cert-manager, traefik]
      multi-node: [cert-manager, traefik]
config:
  profile: multi-node
  distribution: k3s
  platform: linux/amd64
  disable: [certificates]
want:
  error: {kind: needs-disabled, component: traefik, dependency: cert-manager}
