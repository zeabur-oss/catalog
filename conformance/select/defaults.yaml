description: The components recommended for the profile are installed. Optional and unsupported ones are not.
components:
  - id: traefik
    provides: {capability: ingress}
    defaults: {single-node: recommended, multi-node: recommended}
    distributions: [k3s, rke2, kubesolo]
    testedOn:
      - {distribution: k3s, platforms: [linux/amd64]}
      - {distribution: rke2, platforms: [linux/amd64]}
      - {distribution: kubesolo, platforms: [linux/amd64]}
  - id: victoria-logs
    provides: {capability: logs}
    defaults: {single-node: optional, multi-node: recommended}
    distributions: [k3s, rke2, kubesolo]
    testedOn:
      - {distribution: k3s, platforms: [linux/amd64]}
      - {distribution: rke2, platforms: [linux/amd64]}
      - {distribution: kubesolo, platforms: [linux/amd64]}
  - id: longhorn
    provides: {capability: replicated-storage}
    defaults: {single-node: unsupported, multi-node: recommended}
    distributions: [k3s, rke2, kubesolo]
    testedOn:
      - {distribution: k3s, platforms: [linux/amd64]}
      - {distribution: rke2, platforms: [linux/amd64]}
config:
  profile: single-node
  distribution: k3s
  platform: linux/amd64
want:
  components:
    - {id: traefik, why: default}
