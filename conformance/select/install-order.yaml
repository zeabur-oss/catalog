description: >
  The install order is each chosen component's installOrder, taken in id order,
  with each component once. A component only another one needs is installed as
  a dependency.
components:
  - id: zeabur-builder
    provides: {capability: builds}
    defaults: {single-node: optional, multi-node: optional}
    distributions: [k3s, rke2, kubesolo]
    testedOn:
      - {distribution: k3s, platforms: [linux/amd64]}
      - {distribution: rke2, platforms: [linux/amd64]}
      - {distribution: kubesolo, platforms: [linux/amd64]}
    installOrder:
      single-node: [cert-manager, zeabur-builder]
      multi-node: [cert-manager, zeabur-builder]
  - id: cert-manager
    provides: {capability: certificates}
    defaults: {single-node: recommended, multi-node: recommended}
    distributions: [k3s, rke2, kubesolo]
    testedOn:
      - {distribution: k3s, platforms: [linux/amd64]}
      - {distribution: rke2, platforms: [linux/amd64]}
      - {distribution: kubesolo, platforms: [linux/amd64]}
  - id: traefik
    provides: {capability: ingress}
    defaults: {single-node: recommended, multi-node: recommended}
    distributions: [k3s, rke2, kubesolo]
    testedOn:
      - {distribution: k3s, platforms: [linux/amd64]}
      - {distribution: rke2, platforms: [linux/amd64]}
      - {distribution: kubesolo, platforms: [linux/amd64]}
    installOrder:
      single-node: [cert-manager, traefik]
      multi-node: [cert-manager, traefik]
  - id: victoria-logs
    provides: {capability: logs}
    defaults: {single-node: recommended, multi-node: recommended}
    distributions: [k3s, rke2, kubesolo]
    testedOn:
      - {distribution: k3s, platforms: [linux/amd64]}
      - {distribution: rke2, platforms: [linux/amd64]}
      - {distribution: kubesolo, platforms: [linux/amd64]}
    installOrder:
      single-node: [victoria-metrics-operator, victoria-logs]
      multi-node: [victoria-metrics-operator, victoria-logs]
  - id: victoria-metrics-operator
    provides: {capability: observability-operator}
    defaults: {single-node: optional, multi-node: optional}
    distributions: [k3s, rke2, kubesolo]
    testedOn:
      - {distribution: k3s, platforms: [linux/amd64]}
      - {distribution: rke2, platforms: [linux/amd64]}
      - {distribution: kubesolo, platforms: [linux/amd64]}
config:
  profile: multi-node
  distribution: rke2
  platform: linux/amd64
  enable: [zeabur-builder]
want:
  components:
    - {id: cert-manager, why: default}
    - {id: traefik, why: default}
    - {id: victoria-metrics-operator, why: dependency}
    - {id: victoria-logs, why: default}
    - {id: zeabur-builder, why: enabled}
