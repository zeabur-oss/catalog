description: >
  disable takes out a default by its capability or its id. Naming a known
  component that is not chosen is not an error.
components:
  - id: traefik
    provides: {capability: ingress}
    defaults: {single-node: recommended, multi-node: recommended}
    distributions: [k3s, rke2, kubesolo]
    testedOn:
      - {distribution: k3s, platforms: [linux/amd64]}
      - {distribution: rke2, platforms: [linux/amd64]}
      - {distribution: kubesolo, platforms: [linux/amd64]}
  - id: victoria-logs
    provides: {capability: logs}
    defaults: {single-node: recommended, multi-node: recommended}
    distributions: [k3s, rke2, kubesolo]
    testedOn:
      - {distribution: k3s, platforms: [linux/amd64]}
      - {distribution: rke2, platforms: [linux/amd64]}
      - {distribution: kubesolo, platforms: [linux/amd64]}
  - id: metrics-server
    provides: {capability: metrics}
    defaults: {single-node: recommended, multi-node: recommended}
    distributions: [k3s, rke2, kubesolo]
    testedOn:
      - {distribution: k3s, platforms: [linux/amd64]}
      - {distribution: rke2, platforms: [linux/amd64]}
      - {distribution: kubesolo, platforms: [linux/amd64]}
  - id: gatus
    provides: {capability: uptime-probes}
    defaults: {single-node: optional, multi-node: optional}
    distributions: [k3s, rke2, kubesolo]
    testedOn:
      - {distribution: k3s, platforms: [linux/amd64]}
      - {distribution: rke2, platforms: [linux/amd64]}
      - {distribution: kubesolo, platforms: [linux/amd64]}
config:
  profile: multi-node
  distribution: k3s
  platform: linux/amd64
  disable: [logs, metrics-server, uptime-probes]
want:
  components:
    - {id: traefik, why: default}
