description: An enable name that is no capability or component id in the catalog is an error.
components:
  - id: ingress/traefik
    defaults: {single-node: recommended, multi-node: recommended}
    distributions: [k3s, rke2, kubesolo]
    testedOn:
      - {distribution: k3s, platforms: [linux/amd64]}
      - {distribution: rke2, platforms: [linux/amd64]}
      - {distribution: kubesolo, platforms: [linux/amd64]}
config:
  profile: multi-node
  distribution: k3s
  platform: linux/amd64
  enable: [queue]
want:
  error: {kind: unknown, name: queue}
