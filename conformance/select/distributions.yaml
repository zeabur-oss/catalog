description: >
  distributions is a hard limit. A component is left out on any other
  distribution. When enable names it, a warning says so.
components:
  - id: system-upgrade-controller
    provides: {capability: node-updates}
    defaults: {single-node: optional, multi-node: optional}
    distributions: [k3s, rke2]
    testedOn:
      - {distribution: k3s, platforms: [linux/amd64]}
      - {distribution: rke2, platforms: [linux/amd64]}
config:
  profile: single-node
  distribution: kubesolo
  platform: linux/amd64
  enable: [system-upgrade-controller]
want:
  leftOut:
    system-upgrade-controller: {reason: distributions, distributions: [k3s, rke2]}
  warnings:
    - {kind: left-out, component: system-upgrade-controller}
