description: >
  testedOn lists the platforms where a distribution passed. A default whose
  test passed on k3s for amd64 only is installed on k3s for arm64 with a warning.
components:
  - id: traefik
    provides: {capability: ingress}
    defaults: {single-node: recommended, multi-node: recommended}
    distributions: [k3s, rke2, kubesolo]
    testedOn:
      - {distribution: k3s, platforms: [linux/amd64, linux/arm64]}
  - id: victoria-logs
    provides: {capability: logs}
    defaults: {single-node: recommended, multi-node: recommended}
    distributions: [k3s, rke2, kubesolo]
    testedOn:
      - {distribution: k3s, platforms: [linux/amd64]}
config:
  profile: single-node
  distribution: k3s
  platform: linux/arm64
want:
  components:
    - {id: traefik, why: default}
    - {id: victoria-logs, why: default}
  warnings:
    - {kind: untested, component: victoria-logs, distribution: k3s}
