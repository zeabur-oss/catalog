description: >
  A client may add components it needs on top of the defaults. They count as
  defaults. A capability name with no recommended component resolves to the
  first optional one in id order.
components:
  - id: cloudnative-pg
    provides: {capability: databases}
    defaults: {single-node: optional, multi-node: optional}
    distributions: [k3s, rke2, kubesolo]
    testedOn:
      - {distribution: k3s, platforms: [linux/amd64]}
      - {distribution: rke2, platforms: [linux/amd64]}
      - {distribution: kubesolo, platforms: [linux/amd64]}
  - id: percona
    provides: {capability: databases}
    defaults: {single-node: optional, multi-node: optional}
    distributions: [k3s, rke2, kubesolo]
    testedOn:
      - {distribution: k3s, platforms: [linux/amd64]}
      - {distribution: rke2, platforms: [linux/amd64]}
      - {distribution: kubesolo, platforms: [linux/amd64]}
config:
  profile: multi-node
  distribution: rke2
  platform: linux/amd64
  add: [databases]
want:
  components:
    - {id: cloudnative-pg, why: default}
