description: A default not tested on the distribution is installed with a warning.
components:
  - id: ingress/traefik
    defaults: {single-node: recommended, multi-node: recommended}
    testedOn:
      - {distribution: k3s, platforms: [linux/amd64]}
      - {distribution: rke2, platforms: [linux/amd64]}
      - {distribution: kubesolo, platforms: [linux/amd64]}
  - id: logs/victoria-logs
    defaults: {single-node: recommended, multi-node: recommended}
    testedOn:
      - {distribution: k3s, platforms: [linux/amd64]}
      - {distribution: kubesolo, platforms: [linux/amd64]}
config:
  profile: multi-node
  distribution: rke2
  platform: linux/amd64
want:
  components:
    - {id: ingress/traefik, why: default}
    - {id: logs/victoria-logs, why: default}
  warnings:
    - {kind: untested, component: logs/victoria-logs, distribution: rke2}
