description: A component that enable names and that was not tested on the distribution is installed with a warning.
components:
  - id: victoria-logs
    provides: {capability: logs}
    defaults: {single-node: optional, multi-node: optional}
    distributions: [k3s, rke2, kubesolo]
    testedOn:
      - {distribution: k3s, platforms: [linux/amd64]}
      - {distribution: rke2, platforms: [linux/amd64]}
config:
  profile: single-node
  distribution: kubesolo
  platform: linux/amd64
  enable: [victoria-logs]
want:
  components:
    - {id: victoria-logs, why: enabled}
  warnings:
    - {kind: untested, component: victoria-logs, distribution: kubesolo}
