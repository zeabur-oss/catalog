description: A component that enable names and that was not tested on the distribution is installed with a warning.
components:
  - id: logs/victoria-logs
    defaults: {single-node: optional, multi-node: optional}
    testedOn:
      - {distribution: k3s, platforms: [linux/amd64]}
      - {distribution: rke2, platforms: [linux/amd64]}
config:
  profile: single-node
  distribution: kubesolo
  platform: linux/amd64
  enable: [logs/victoria-logs]
want:
  components:
    - {id: logs/victoria-logs, why: enabled}
  warnings:
    - {kind: untested, component: logs/victoria-logs, distribution: kubesolo}
