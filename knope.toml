# Change files in .changeset/ and release pull requests (CONTRIBUTING.md, "Releases").
[package]
versioned_files = [
  { path = "flake.nix", regex = '\n        version = "(?<version>[^"]+)";' },
]
changelog = "CHANGELOG.md"

[changes]
ignore_conventional_commits = true

[[workflows]]
name = "prepare-release"

[[workflows.steps]]
type = "PrepareRelease"

[[workflows]]
name = "document-change"

[[workflows.steps]]
type = "CreateChangeFile"
