# Kubernetes versions every profile is rendered and schema-checked against
# (helm template --kube-version, then kubeconform). Keep the newest four minors.
versions: ["1.34.0", "1.35.0", "1.36.0", "1.37.0"]

# smoke and full clusters are kind: one node for single-node, three for multi-node.
# Keep the minor equal to the RKE2 release below; kube-apiserver in flake.nix,
# which the check tier runs, follows that release. The Zeabur installer's pins
# (crates/zeabur-installer-plan/src/pins.rs in zeabur) follow these before a
# release. Distributions differ little for these
# components; see docs/reference/distributions.mdx.
e2e:
  version: v1.37.0 # renovate: docker kindest/node

# The k3s, rke2 and kubesolo profiles install that distribution on the runner
# and test every component that single-node supports and whose distributions
# allow it, with the single-node values. Templates run on kind only. The API
# publishes these pinned versions with the measurements, so a reader can tell
# which distributions a component passed on. sha256 is the checksum of each release asset; change it
# with the version. The Zeabur installer pins the same k3s and RKE2 releases
# before a release.
k3s:
  version: v1.37.2+k3s1 # renovate: github-releases k3s-io/k3s
  sha256:
    amd64: 265b3ee6a3198ef14033c63ef46cbb32370d83795199fb6d1b01f21575eddbda # k3s
    arm64: a779ccf1e5e2e33a62f5a29c2f1c0bbf99431e100579d4c10f0aa0742a6aa84b # k3s-arm64
  installScript: ed01f89fd977bf20ac1516bbebf8370bf3ddbaa55dac8aba610956a4c78cc00b # install.sh at the tag

rke2:
  version: v1.37.2+rke2r1 # renovate: github-releases rancher/rke2
  sha256:
    amd64: 0568f48d772c7feff7056062225d5ba82fb3f73ea7acaea63862fe601dae6d92 # rke2.linux-amd64.tar.gz
    arm64: 849bf989b079e330f73d142259b1be4d2fd487927431555e7544cf1687627822 # rke2.linux-arm64.tar.gz
  # RKE2 ships no storage class. The Zeabur installer adds this one.
  localPath:
    version: v0.0.37 # renovate: github-releases rancher/local-path-provisioner
    sha256: 9781b39c24f3f651bd6d6e41b561e04e4904bbdb6d4f8c7a6009df3a702dcd65 # deploy/local-path-storage.yaml

# KubeSolo enforces no NetworkPolicy and has one node. The helm controller is
# the standalone k3s-io one that the Zeabur installer deploys.
kubesolo:
  version: v1.2.3 # renovate: github-releases portainer/kubesolo
  sha256:
    amd64: 177e1832bac16b92968c2a8ff6a40448d98d1a195bc71f04870c8e7fa7905331
    arm64: fa63b4c7cc3ffe620564272dd26f235244008c6c8eaf876d6538ee4802e7cb2a
  helmController:
    version: v0.17.9 # renovate: github-releases k3s-io/helm-controller
    sha256: 53da110ca271b6d6415e84bfc5ffe47d726fa35d1fb3acda47e6649ee05d4791 # deploy-cluster-scoped.yaml
