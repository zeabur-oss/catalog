# Kubernetes versions every profile is rendered and schema-checked against
# (helm template --kube-version, then kubeconform). Keep the newest four minors.
versions: ["1.34.0", "1.35.0", "1.36.0", "1.37.0"]

# L1 and L2 clusters are kind: one node for single-node, three for multi-node.
# Keep the minor equal to the RKE2 release that the Zeabur installer pins
# (crates/zeabur-installer-plan/src/pins.rs); kube-apiserver in flake.nix, which
# L0 runs, follows the same release. Distributions differ little for these
# components; see README.
e2e:
  version: v1.36.4 # renovate: docker kindest/node
