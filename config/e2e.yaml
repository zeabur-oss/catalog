# Test-only values merged after the profile values in e2e runs. They make a
# component installable on kind and are never part of a recommendation.
overrides:
  metrics/metrics-server:
    metrics-server: |
      args:
        # kind's kubelets serve self-signed certificates.
        - --metric-resolution=15s
        - --kubelet-insecure-tls
  ingress/traefik:
    traefik: |
      service:
        # kind has no load balancer; helm --wait would wait for an external IP forever.
        type: NodePort
  replicated-storage/longhorn:
    longhorn: |
      defaultSettings:
        # e2e uninstalls after every test; the chart refuses to without it.
        deletingConfirmationFlag: true

# Components whose workloads cannot become ready without external credentials
# CI does not have. e2e installs them without waiting for their workloads, runs
# their smoke checks, uninstalls them and checks for residue, but does not
# measure them.
unready:
  # The operator exits when it cannot mint an auth key with its OAuth client.
  - remote-access/tailscale-operator

# Test-only text replacements in manifests releases, per component and release.
# A replacement that matches nothing fails the run.
replacements:
  certificates/cert-manager:
    issuers:
      # Every CI install registers ACME accounts; Let's Encrypt production allows
      # 10 per IP every 3 hours, staging 50, so both issuers use staging.
      https://acme-v02.api.letsencrypt.org/directory: https://acme-staging-v02.api.letsencrypt.org/directory

# Input values for template e2e runs, for every template that declares the
# input. A value is a text/template with .ID, the template, and .S3, the
# SeaweedFS S3 gateway the run starts when a value uses it: .S3.Endpoint
# (https://<host>), .S3.Host, .S3.CIDR (the gateway Pod) and .S3.Bucket. Its
# certificate comes from a test CA. The Secret e2e-s3 in the template's
# namespace holds its credentials (ACCESS_KEY_ID and ACCESS_SECRET_KEY,
# AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY, access-key and secret-key) and
# the CA as ca.crt. Every value is disposable test data.
templateInputs:
  backupDestination: 's3://{{ .S3.Bucket }}/{{ .ID }}/postgresql'
  backupEndpoint: '{{ .S3.Endpoint }}'
  backupSecret: e2e-s3
  backupCASecret: e2e-s3
  backupCidr: '{{ .S3.CIDR }}'
  backupRegion: us-east-1
  adminCidr: 192.0.2.10/32
  adminEmail: admin@example.test
  ownerEmail: owner@example.test
  providerSecret: e2e-provider

# Per template: input values (they replace templateInputs), objects to apply
# in the namespace first, and smoke checks to skip with the reason.
templates:
  browserless:
    inputs: {licenseOptIn: I-ACCEPT-BROWSERLESS-LICENSE}
  dify:
    inputs:
      licenseOptIn: I-ACCEPT-DIFY-SINGLE-WORKSPACE
      dragonflyLicenseOptIn: I-ACCEPT-DRAGONFLY-BUSL-1.1
      dragonflyBackupDestination: 's3://{{ .S3.Bucket }}/dify/dragonfly'
      dragonflyBackupEndpoint: '{{ .S3.Host }}'
      dragonflyBackupRegion: us-east-1
      dragonflyBackupCidr: '{{ .S3.CIDR }}'
      storageEndpoint: '{{ .S3.Endpoint }}'
      storageRegion: us-east-1
      storageBucket: '{{ .S3.Bucket }}'
      storageSecret: e2e-s3
      storageCASecret: e2e-s3
      storageCidr: '{{ .S3.CIDR }}'
    skipSmoke:
      Initial Dragonfly S3 snapshot completed: >-
        Dragonfly takes no custom CA for its S3 snapshots, and the test
        gateway's certificate comes from a test CA.
  ghost:
    inputs:
      smtpHost: smtp.example.test
      smtpPort: "587"
      smtpFrom: ghost@example.test
      smtpSecret: e2e-smtp
    setup: |
      apiVersion: v1
      kind: Secret
      metadata: {name: e2e-smtp}
      stringData: {username: e2e, password: e2e}
  hermes-agent-custom-provider:
    inputs:
      model: e2e-model
      providerEndpoint: https://llm.example.test/v1
      adminDomain: admin.hermes-agent-custom-provider.example.test
    setup: &provider |
      apiVersion: v1
      kind: Secret
      metadata: {name: e2e-provider}
      stringData: {api-key: e2e, OPENAI_API_KEY: e2e}
  hermes-agent-openrouter:
    inputs: {model: e2e-model}
    setup: *provider
  librechat:
    inputs:
      licenseOptIn: I-ACCEPT-MONGODB-SSPL
      mongoBackupBucket: '{{ .S3.Bucket }}'
      mongoBackupPrefix: librechat/mongodb
      mongoBackupSecret: e2e-s3
    setup: *provider
    skipSmoke:
      mongodb-initial-backup: >-
        Percona's s3 storage takes no custom CA, and the test gateway's
        certificate comes from a test CA.
  litellm:
    inputs: {licenseOptIn: I-ACCEPT-LITELLM-ENTERPRISE-LICENSE}
  lobechat:
    inputs: {licenseOptIn: I-ACCEPT-LOBEHUB-COMMUNITY}
    setup: *provider
  n8n:
    inputs: {licenseOptIn: I-ACCEPT-N8N-SUSTAINABLE-USE}
  n8n-ai-brain:
    inputs: {licenseOptIn: I-ACCEPT-N8N-SUSTAINABLE-USE}
  n8n-sqlite:
    inputs: {licenseOptIn: I-ACCEPT-N8N-SUSTAINABLE-USE}
  open-webui:
    inputs: {licenseOptIn: I-ACCEPT-OPENWEBUI-LICENSE}
  openclaw:
    inputs:
      llmBaseUrl: https://llm.example.test/v1
      llmModel: e2e-model
    setup: *provider
  openclaw-browser-sandbox:
    inputs: {clientApp: openclaw, trustOptIn: I-ACCEPT-SINGLE-OWNER-BROWSER}
  uptime-kuma:
    inputs: {monitorCidr: 192.0.2.0/24}
  wordpress:
    inputs:
      backupBucket: '{{ .S3.Bucket }}'
      backupEndpoint: '{{ .S3.Host }}:443'
      backupEndpointPort: "443"
      backupEndpointCIDR: '{{ .S3.CIDR }}'
      backupCredentialsSecret: e2e-s3
