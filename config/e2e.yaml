# Test-only values merged after the profile values in e2e runs. They make a
# component installable on kind and are never part of a recommendation.
overrides:
  metrics-server:
    metrics-server: |
      args:
        # kind's kubelets serve self-signed certificates.
        - --metric-resolution=15s
        - --kubelet-insecure-tls
  traefik:
    traefik: |
      service:
        # kind has no load balancer; helm --wait would wait for an external IP forever.
        type: NodePort
  longhorn:
    longhorn: |
      defaultSettings:
        # e2e uninstalls after every test; the chart refuses to without it.
        deletingConfirmationFlag: true

# Components whose workloads cannot become ready without external credentials
# CI does not have. e2e installs them without waiting for their workloads, runs
# their smoke checks, uninstalls them and checks for residue, but does not
# measure them.
unready:
  # The operator exits when it cannot mint an auth key with its OAuth client.
  - tailscale-operator

# What the smoke tier tests when a shared file changes: tools/, go.*, flake.*,
# another config/ file or a workflow. Component and template IDs.
smokeRepresentative:
  - cert-manager
  - traefik
  - victoria-logs
  - metrics-server
  - victoria-metrics
  - browserless

# Smoke checks to skip, per component, with the reason. A check that does not
# exist fails the run.
skipSmoke:
  cert-manager:
    # The ACME issuers need Let's Encrypt, and e2e does not depend on outside
    # services. They never become Ready in CI, and nothing else waits for them.
    acme-issuers: needs Let's Encrypt

# Input values for template e2e runs, for every template that declares the
# input. A value is a text/template with .ID, the template, and .S3, the
# SeaweedFS S3 gateway the run starts when a value uses it: .S3.Endpoint
# (https://<host>) and .S3.Bucket. Its certificate comes from a test CA. The
# Secret e2e-s3 in the template's namespace holds its credentials (access-key
# and secret-key) and the CA as ca.crt. Every value is disposable test data.
templateInputs:
  adminEmail: admin@example.test
  ownerEmail: owner@example.test
  providerSecret: e2e-provider

# Per template: input values (they replace templateInputs), objects to apply
# in the namespace first, and smoke checks to skip with the reason.
templates:
  dify:
    inputs:
      storageEndpoint: '{{ .S3.Endpoint }}'
      storageRegion: us-east-1
      storageBucket: '{{ .S3.Bucket }}'
      storageSecret: e2e-s3
      storageCASecret: e2e-s3
      storageCAFile: /storage-ca/ca.crt
  ghost:
    inputs:
      smtpHost: smtp.example.test
      smtpPort: "587"
      smtpSecure: "false"
      smtpFrom: ghost@example.test
      smtpSecret: e2e-smtp
    setup: |
      apiVersion: v1
      kind: Secret
      metadata: {name: e2e-smtp}
      stringData: {username: e2e, password: e2e}
  hermes-agent:
    # No providerEndpoint: the test renders the OpenRouter default.
    inputs:
      model: e2e-model
      adminDomain: admin.hermes-agent.example.test
    setup: &provider |
      apiVersion: v1
      kind: Secret
      metadata: {name: e2e-provider}
      stringData: {api-key: e2e, OPENAI_API_KEY: e2e}
  librechat:
    setup: *provider
  lobechat:
    setup: *provider
  openclaw:
    inputs:
      llmBaseUrl: https://llm.example.test/v1
      llmModel: e2e-model
    setup: *provider
  openclaw-browser-sandbox:
    inputs: {clientApp: openclaw}
