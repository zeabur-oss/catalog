# Lint levels live in Cargo.toml [workspace.lints].
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-indexing-slicing-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true
avoid-breaking-exported-api = false

# Proper nouns that doc_markdown would otherwise ask to wrap in backticks.
doc-valid-idents = ["ClusterIP", "HelmChart", "HelmChartConfig", "ServiceAccount", "StatefulSet", "DaemonSet", "APIService", "GatewayClass", "IngressClass", "CustomResourceDefinition", "NetworkPolicy", "NetworkPolicies", "PersistentVolumeClaim", "PersistentVolumeClaims", "CloudNativePG", "VictoriaLogs", "VictoriaMetrics", "KubeSolo", "TypeScript", "SemVer", ".."]
