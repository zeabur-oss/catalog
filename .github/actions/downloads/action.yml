# The chart and manifest downloads and the Go caches.
name: downloads
description: Restores and saves the chart, manifest and Go caches
runs:
  using: composite
  steps:
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/catalog
          ~/.cache/go-build
          ~/go/pkg/mod
        key: downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'components/**') }}
        restore-keys: downloads-${{ runner.os }}-${{ runner.arch }}-
