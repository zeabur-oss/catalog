name: release

# Tag vX.Y.Z or vX.Y.Z-<pre-release> on main: the shared release validates, builds and signs the catalog, then leaves a
# draft. Manual run: rehearse.
on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to rehearse (v0.1.1, v0.1.2-beta.1); a rehearsal never publishes"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: zeabur-oss/.github/.github/workflows/release.yml@bc2fba94d807c947f554f3b75be5623d86473067 # main
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    with:
      name: Zeabur Catalog
      version: ${{ inputs.version }}
      # The release is data, the same on every platform; it was built on arm64 before.
      platforms: '[{"os": "linux", "arch": "arm64", "runner": "ubuntu-26.04-arm"}]'
