# On a tag vX.Y.Z: L0 (ci.yml) and L2 (e2e.yml) on the commit, then zeabur-oss/.github's shared
# release runs the stages of scripts/release.sh: check the version against flake.nix and
# CHANGELOG.md, validate and `nix build .#release` (Zeabur builds the same output at its pinned
# commit), sign index.json, bundle.tar.gz and checksums.txt with cosign keyless, attest every asset,
# attach them to a draft release and verify the draft. A maintainer checks the draft and publishes
# it; releases are immutable once published. Run by hand, it rehearses without publishing.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to rehearse or verify (v0.1.1); a rehearsal never publishes"
        required: true
      verify_only:
        description: "Verify the existing draft release of this version; build and publish nothing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    if: ${{ !inputs.verify_only }}
    uses: ./.github/workflows/ci.yml

  e2e:
    if: ${{ !inputs.verify_only }}
    uses: ./.github/workflows/e2e.yml

  release:
    needs: [checks, e2e]
    if: >-
      ${{ !cancelled() &&
          ((needs.checks.result == 'success' && needs.e2e.result == 'success') || inputs.verify_only) }}
    uses: zeabur-oss/.github/.github/workflows/release.yml@0badbf68744c7690d1b5b613071044bc12b002be # main
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    with:
      name: Zeabur Catalog
      version: ${{ inputs.version }}
      verify-only: ${{ inputs.verify_only == true }}
      # The release is data, the same on every platform; it was built on arm64 before.
      platforms: '[{"os": "linux", "arch": "arm64", "runner": "ubuntu-26.04-arm"}]'
