name: Release

# Tag vX.Y.Z or vX.Y.Z-<pre-release> on main: build the bundle and the static API, sign their
# SHA256SUMS, attest them, create the draft release with them, and verify the draft against a
# rebuild. A maintainer publishes the draft. Manual run: rehearse, which builds and publishes
# nothing.
on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to rehearse, as in flake.nix (v0.1.1); a rehearsal never publishes"
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: nix develop --command bash -eo pipefail {0}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  build:
    runs-on: instabox-small
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Nix
        uses: zeabur-oss/.github/actions/ci-setup@2d9e5e7eab9be03f9822ee9497639d4051f8b04d # main
      - name: Install the packages
        run: bun install --frozen-lockfile
      - name: The version is flake.nix's, with a CHANGELOG.md section, on main
        run: |
          bun x zeabur-oss-release check-tag "$VERSION" --changelog CHANGELOG.md \
            --version "$(nix eval --raw .#catalog.version)" ${{ github.event_name != 'push' && '--rehearsal' || '' }}
      - name: Build the bundle and the static API
        run: scripts/ci/release.sh "$VERSION" assets
      - name: Upload the assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assets
          path: assets
          if-no-files-found: error
          retention-days: 7

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: instabox-small
    timeout-minutes: 15
    permissions:
      contents: write # the draft
      id-token: write
      attestations: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Nix
        uses: zeabur-oss/.github/actions/ci-setup@2d9e5e7eab9be03f9822ee9497639d4051f8b04d # main
      - name: Install the packages
        run: bun install --frozen-lockfile
      - name: Download the assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: assets
          path: assets
      - name: Sign and attest the checksums, and create the draft release with the assets
        uses: zeabur-oss/.github/actions/release-draft@fe73a0c68d3ef4b7557f15f7987f59f555714788 # main
        with:
          version: ${{ env.VERSION }}
          name: Zeabur Catalog
          docs: https://oss.zeabur.com/docs/catalog/

  verify:
    needs: release
    runs-on: instabox-small
    timeout-minutes: 60
    permissions:
      # GitHub shows a draft release only to a token that can push.
      contents: write
      attestations: read
    steps:
      - name: Download the draft's files and verify them
        uses: zeabur-oss/.github/actions/release-verify@fe73a0c68d3ef4b7557f15f7987f59f555714788 # main
        with:
          version: ${{ env.VERSION }}
      - name: Check that a rebuild at the tag makes the same bytes
        run: |
          scripts/ci/release.sh "$VERSION" rebuilt
          for file in rebuilt/*; do
            cmp "$file" "downloaded/${file#rebuilt/}" ||
              { echo "::error::${file#rebuilt/} differs from a rebuild at $VERSION"; exit 1; }
          done
