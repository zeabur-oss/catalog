# On a semver tag: validate, build index.json and bundle.tar.gz, write
# checksums.txt, sign all three with cosign keyless (GitHub OIDC) and publish
# them on the GitHub release.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  id-token: write # cosign keyless signing

jobs:
  release:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/determinate-nix-action@d0c908e6cbe9f89f36ed8205a3ab6f092636916a # v3.23.1
      - name: Validate and build
        run: |
          nix develop -c sh -c '
            go test ./... &&
            go run ./tools/cmd/catalog validate &&
            go run ./tools/cmd/catalog index &&
            go run ./tools/cmd/catalog render
          '
          mkdir dist
          cp index.json dist/
          tar --sort=name --mtime="@0" --owner=0 --group=0 --numeric-owner -czf dist/bundle.tar.gz \
            index.json components templates schema config measurements LICENSE README.md
          (cd dist && sha256sum bundle.tar.gz index.json > checksums.txt)
      - name: Sign
        run: |
          cd dist
          for f in bundle.tar.gz index.json checksums.txt; do
            nix develop .. -c cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' dist/* --title '${{ github.ref_name }}' --generate-notes --verify-tag
