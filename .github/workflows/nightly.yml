# Every night and on demand: L2, the full e2e matrix. Opens a pull request
# with the idle memory and CPU it measured for components and templates, so
# measurements/ is only ever written by CI. The pull request is zeabur-oss-bot's:
# GitHub signs its commit, and CI runs on it, which it would not for GITHUB_TOKEN.
name: nightly

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-kind:
    uses: ./.github/workflows/e2e.yml
    with:
      profiles: single-node,multi-node

  e2e-hosts:
    uses: ./.github/workflows/e2e.yml
    with:
      profiles: k3s,rke2,kubesolo

  pull-request:
    needs: [e2e-kind, e2e-hosts]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-slim
    # Holds zeabur-oss-bot's key (see vendorhash.yml).
    environment: vendorhash
    permissions:
      contents: read
    steps:
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.ZEABUR_OSS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.ZEABUR_OSS_BOT_PRIVATE_KEY }}
          repositories: catalog
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: measurements-*
          path: downloaded/
      - name: Merge measurements from every job
        run: |
          mkdir -p downloaded
          go run ./tools/cmd/catalog merge downloaded
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.token.outputs.token }}
          # Commits through the API as zeabur-oss-bot, which the sign-off must name for DCO.
          sign-commits: true
          branch: ci/measurements
          title: "chore: update measured resource usage"
          commit-message: |
            chore: update measured resource usage

            Signed-off-by: zeabur-oss-bot[bot] <349476329+zeabur-oss-bot[bot]@users.noreply.github.com>
          body: Idle memory and CPU of components and templates, measured by the e2e workflow on kind, k3s, RKE2 and KubeSolo.
          add-paths: measurements/
