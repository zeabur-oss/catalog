# A pull request with the e2e label runs the full tier on the components and
# templates it affects, on single-node, and on each new push while the label
# stays. It writes no measurements and opens no pull request.
name: e2e-label

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read

# Another label starts a run that does nothing: a group of its own, so it cancels no tests.
concurrency:
  group: >-
    e2e-label-${{ github.event.pull_request.number }}${{
    github.event.action == 'labeled' && github.event.label.name != 'e2e'
    && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  ids:
    # A label event for any other label does not start a run.
    if: >-
      contains(github.event.pull_request.labels.*.name, 'e2e') &&
      (github.event.action != 'labeled' || github.event.label.name == 'e2e')
    runs-on: ubuntu-26.04
    outputs:
      ids: ${{ steps.list.outputs.ids }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - id: list
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          since=$(git merge-base "origin/$BASE_REF" HEAD)
          matrix=$(go run ./tools/cmd/catalog list -tier full -profiles single-node -since "$since")
          echo "ids=$(jq -r '[.include[] | .component // .template] | unique | join(",")' <<< "$matrix")" >> "$GITHUB_OUTPUT"

  full:
    needs: ids
    if: needs.ids.outputs.ids != ''
    uses: ./.github/workflows/e2e.yml
    with:
      profiles: single-node
      components: ${{ needs.ids.outputs.ids }}
      measure: false
