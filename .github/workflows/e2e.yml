# full: installs each component in a fresh cluster, on amd64 and arm64:
# dependencies first, idle memory and CPU once they are stable, health and
# smoke checks, uninstall and residue check. components, or else stale, narrows what
# runs. profiles picks the profiles of one call; a matrix holds at most 256 jobs, so
# weekly.yml calls it once for kind and once for the host distributions.
# - single-node and multi-node run on kind, one node and three. single-node
#   amd64 also installs every template with the components it requires, runs
#   its smoke checks, then measures its idle memory and CPU.
# - k3s, rke2 and kubesolo install that distribution on the runner and test
#   the components of single-node that their distributions allow, and record
#   a measurement for each.
name: e2e

on:
  workflow_call:
    inputs:
      profiles:
        description: Full tier profiles, separated by commas
        type: string
        required: true
      components:
        description: Component or template IDs, separated by commas, empty runs all
        type: string
        required: false
      stale:
        description: Without components, only what has no passing run of its current files
        type: boolean
        default: false
      measure:
        description: Write measurements and check the budget
        type: boolean
        default: true
    outputs:
      ran:
        description: Whether the matrix had a job
        value: ${{ jobs.matrix.outputs.ran }}
  # A manual run, such as one distribution and a few components. Only
  # weekly.yml opens the measurements pull request.
  workflow_dispatch:
    inputs:
      profiles:
        description: Full tier profiles, separated by commas
        type: string
        required: true
      components:
        description: Component or template IDs, separated by commas, empty runs all
        type: string
        required: false
      stale:
        description: Without components, only what has no passing run of its current files
        type: boolean
        default: false
      measure:
        description: Write measurements and check the budget
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-slim
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      ran: ${{ fromJSON(steps.list.outputs.matrix).include[0] != null }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: list
        env:
          PROFILES: ${{ inputs.profiles }}
          IDS: ${{ inputs.components }}
          STALE: ${{ inputs.stale }}
        run: |
          flags=()
          if [ -n "$IDS" ]; then flags+=(-ids "$IDS"); elif [ "$STALE" = true ]; then flags+=(-stale); fi
          echo "matrix=$(go run ./tools/cmd/catalog list -tier full -profiles "$PROFILES" "${flags[@]}")" >> "$GITHUB_OUTPUT"

  e2e:
    needs: matrix
    if: fromJSON(needs.matrix.outputs.matrix).include[0]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    strategy:
      fail-fast: false
      # The organisation runs 20 jobs at once and weekly.yml calls this twice: 12 at most,
      # so pull requests still get runners.
      max-parallel: 6
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.matrix).include }}
    name: ${{ matrix.profile }} ${{ matrix.arch }} ${{ matrix.component || matrix.template }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: iSCSI module for Longhorn
        if: matrix.component == 'longhorn'
        run: sudo modprobe iscsi_tcp
      # A distribution on the host runs without Docker, as on a server the
      # Zeabur installer sets up; KubeSolo requires it. Stopping Docker leaves
      # its netfilter rules behind, among them the FORWARD policy DROP: pod
      # traffic to the outside is forwarded without a mark that kube-proxy
      # accepts, so CoreDNS cannot reach its upstream and pods resolve no
      # external name. Remove the rules as uninstalling Docker would; the
      # security table holds the runner's own rules and stays.
      - name: Remove Docker for a host distribution
        if: contains(fromJSON('["k3s", "rke2", "kubesolo"]'), matrix.profile)
        run: |
          sudo systemctl stop docker.socket docker.service
          for ipt in iptables ip6tables; do
            for table in filter nat; do
              sudo "$ipt" -t "$table" -F
              sudo "$ipt" -t "$table" -X
            done
            sudo "$ipt" -P FORWARD ACCEPT
          done
      - name: e2e
        env:
          PROFILE: ${{ matrix.profile }}
          ID: ${{ matrix.component || matrix.template }}
          MEASURE: ${{ inputs.measure }}
        run: |
          flags=()
          [ "$MEASURE" = true ] && flags+=(-write)
          nix develop -c go run ./tools/cmd/catalog e2e -tier full -profile "$PROFILE" "${flags[@]}" "$ID"
      - name: Keep only this job's measurement
        if: always() && inputs.measure
        env:
          FILE: measurements/${{ matrix.component && format('components/{0}', matrix.component) || format('templates/{0}', matrix.template) }}.json
        run: mkdir -p measurements && find measurements -type f ! -path "$FILE" -delete
      - id: name
        if: always() && inputs.measure
        env:
          NAME: ${{ matrix.profile }}-${{ matrix.arch }}-${{ matrix.component || format('template-{0}', matrix.template) }}
        run: echo "name=${NAME//\//-}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && inputs.measure
        with:
          name: measurements-${{ steps.name.outputs.name }}
          path: measurements/
          if-no-files-found: ignore

  budget:
    needs: e2e
    if: inputs.measure && contains(inputs.profiles, 'single-node')
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: measurements-single-node-amd64-*
          path: measurements/
          merge-multiple: true
      # Budget renders each component to read its replicas, which needs helm.
      - run: nix develop -c go run ./tools/cmd/catalog budget
