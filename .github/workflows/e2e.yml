# L2: installs every component in a fresh cluster each, on amd64 and arm64:
# dependencies first, the previous release when its version differs (upgrade
# test), idle memory and CPU once they are stable, health and smoke checks,
# uninstall and residue check. profiles picks the profiles of one call; a
# matrix holds at most 256 jobs, so nightly.yml calls it once for kind and once
# for the host distributions.
# - single-node and multi-node run on kind, one node and three. single-node
#   amd64 also installs every template with the components it requires, runs
#   its smoke checks, then measures its idle memory and CPU.
# - k3s, rke2 and kubesolo install that distribution on the runner and test
#   the components of single-node that their distributions allow. Their
#   measurements are keyed <profile>-<architecture>-<version>, and the index's
#   testedOn is derived from them.
name: e2e

on:
  workflow_call:
    inputs:
      profiles:
        description: L2 profiles, separated by commas
        type: string
        required: true

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-slim
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: list
        env:
          PROFILES: ${{ inputs.profiles }}
        run: echo "matrix=$(go run ./tools/cmd/catalog list -tier l2 -profiles "$PROFILES")" >> "$GITHUB_OUTPUT"

  e2e:
    needs: matrix
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.matrix).include }}
    name: ${{ matrix.profile }} ${{ matrix.arch }} ${{ matrix.component || matrix.template }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: iSCSI module for Longhorn
        if: matrix.component == 'replicated-storage/longhorn'
        run: sudo modprobe iscsi_tcp
      # A distribution on the host runs without Docker, as on a server the
      # Zeabur installer sets up; KubeSolo requires it. Stopping Docker leaves
      # its netfilter rules behind, among them the FORWARD policy DROP: pod
      # traffic to the outside is forwarded without a mark that kube-proxy
      # accepts, so CoreDNS cannot reach its upstream and pods resolve no
      # external name. Remove the rules as uninstalling Docker would; the
      # security table holds the runner's own rules and stays.
      - name: Remove Docker for a host distribution
        if: contains(fromJSON('["k3s", "rke2", "kubesolo"]'), matrix.profile)
        run: |
          sudo systemctl stop docker.socket docker.service
          for ipt in iptables ip6tables; do
            for table in filter nat; do
              sudo "$ipt" -t "$table" -F
              sudo "$ipt" -t "$table" -X
            done
            sudo "$ipt" -P FORWARD ACCEPT
          done
      - name: Previous release (upgrade test)
        if: matrix.component
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --pattern index.json --output previous.json || true
      - name: e2e
        env:
          PROFILE: ${{ matrix.profile }}
          ID: ${{ matrix.component || matrix.template }}
        run: |
          previous=()
          [ -f previous.json ] && previous=(-previous previous.json)
          nix develop -c go run ./tools/cmd/catalog e2e -tier l2 -profile "$PROFILE" -write "${previous[@]}" "$ID"
      - name: Keep only this job's measurement
        if: always()
        env:
          FILE: measurements/${{ matrix.component || format('templates/{0}', matrix.template) }}.json
        run: find measurements -type f ! -path "$FILE" -delete
      - id: name
        if: always()
        env:
          NAME: ${{ matrix.profile }}-${{ matrix.arch }}-${{ matrix.component || format('template-{0}', matrix.template) }}
        run: echo "name=${NAME//\//-}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: measurements-${{ steps.name.outputs.name }}
          path: measurements/
          if-no-files-found: ignore

  budget:
    needs: e2e
    if: contains(inputs.profiles, 'single-node')
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: measurements-single-node-amd64-*
          path: measurements/
          merge-multiple: true
      - run: go run ./tools/cmd/catalog budget
