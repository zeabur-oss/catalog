# Installs every component on kind, one node for single-node and three for
# multi-node: dependencies first, smoke test, idle memory and CPU, uninstall,
# residue check, and an upgrade from the latest release when its version
# differs, on amd64 and arm64. Pull requests and pushes test only the
# components they change and their dependents, or every component when a
# shared file (config, tools, the cluster) changes.
name: e2e

on:
  workflow_call:

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-slim
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - id: list
        env:
          SINCE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: echo "matrix=$(go run ./tools/cmd/catalog list -since "$SINCE")" >> "$GITHUB_OUTPUT"

  e2e:
    needs: matrix
    if: fromJSON(needs.matrix.outputs.matrix).include[0]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.matrix).include }}
    name: ${{ matrix.profile }} ${{ matrix.arch }} ${{ matrix.component }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/determinate-nix-action@d0c908e6cbe9f89f36ed8205a3ab6f092636916a # v3.23.1
      - name: Create kind cluster
        run: |
          nix develop -c kind create cluster --wait 5m \
            --image 'kindest/node:${{ fromJSON(needs.matrix.outputs.matrix).version }}' \
            $([ '${{ matrix.profile }}' = multi-node ] && echo --config .github/kind.yaml)
      # Longhorn attaches volumes over iSCSI from each node; kind's nodes ship
      # without an initiator, and the module comes from the runner's kernel.
      - name: Longhorn node prerequisites
        if: matrix.component == 'replicated-storage/longhorn'
        run: |
          sudo modprobe iscsi_tcp
          for node in $(nix develop -c kind get nodes); do
            docker exec "$node" sh -c 'apt-get update -qq && apt-get install -y -qq open-iscsi nfs-common && systemctl enable --now iscsid'
          done
      - name: Previous release (upgrade test)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --pattern index.json --output previous.json || true
      - name: e2e
        run: |
          nix develop -c go run ./tools/cmd/catalog e2e -profile '${{ matrix.profile }}' -write \
            $([ -f previous.json ] && echo -previous previous.json) '${{ matrix.component }}'
      - name: Keep only this component's measurement
        if: always()
        run: find measurements -type f ! -path 'measurements/${{ matrix.component }}.json' -delete
      - id: name
        run: echo "name=$(echo '${{ matrix.profile }}-${{ matrix.arch }}-${{ matrix.component }}' | tr / -)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: measurements-${{ steps.name.outputs.name }}
          path: measurements/
          if-no-files-found: ignore

  budget:
    needs: e2e
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: measurements-single-node-amd64-*
          path: measurements/
          merge-multiple: true
      - run: go run ./tools/cmd/catalog budget
