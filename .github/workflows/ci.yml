# Each check job runs scripts/ci/<job>.sh in the Nix dev shell, the same as locally: Go tests and
# lint, then validate, render, template lint and a server-side dry run on a local API server, then
# nix build .#release. Rulesets require check / ok.
# smoke runs in the merge queue: it installs and smoke tests what changed since the queue's base,
# what it needs and what installs it, in groups. A merge group that changes no component or
# template has an empty matrix and skips the job, so require smoke-ok, which fails only when a
# smoke job failed. CONTRIBUTING.md lists what each tier checks.
# full is e2e.yml, which weekly.yml calls.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "30 17 * * *" # every job on main, which also keeps main's caches warm
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request stops its older run; a push to main does not stop the schedule.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@64a6547509a1911f03c4b1e62965ef9f2b4c39b6 # main
      - run: nix develop -c scripts/ci/lint.sh

  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@64a6547509a1911f03c4b1e62965ef9f2b4c39b6 # main
      - run: nix develop -c scripts/ci/test.sh

  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@64a6547509a1911f03c4b1e62965ef9f2b4c39b6 # main
      - run: nix develop -c scripts/ci/check.sh

  release:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@64a6547509a1911f03c4b1e62965ef9f2b4c39b6 # main
      - run: nix develop -c scripts/ci/release.sh
        env:
          CI_ARTIFACTS: ${{ runner.temp }}/ci-artifacts
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/ci-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  zizmor:
    uses: zeabur-oss/.github/.github/workflows/zizmor.yml@64a6547509a1911f03c4b1e62965ef9f2b4c39b6 # main

  ok:
    name: check / ok
    if: always()
    needs: [lint, test, check, release, zizmor]
    runs-on: ubuntu-slim
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  dco:
    uses: zeabur-oss/.github/.github/workflows/dco.yml@6ab106525ce16169ab0ecfebe4b0248e096797fa # main

  smoke-matrix:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-slim
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - id: list
        env:
          BASE: ${{ github.event.merge_group.base_sha }}
        run: echo "matrix=$(go run ./tools/cmd/catalog list -tier smoke -since "$BASE")" >> "$GITHUB_OUTPUT"

  smoke:
    needs: [smoke-matrix]
    if: github.event_name == 'merge_group' && fromJSON(needs.smoke-matrix.outputs.matrix).include[0]
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.smoke-matrix.outputs.matrix).include }}
    name: smoke ${{ matrix.ids }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: iSCSI module for Longhorn
        if: contains(matrix.ids, 'replicated-storage/longhorn')
        run: sudo modprobe iscsi_tcp
      - name: e2e
        env:
          IDS: ${{ matrix.ids }}
        run: |
          # shellcheck disable=SC2086 # IDS is a list of IDs
          nix develop -c go run ./tools/cmd/catalog e2e -tier smoke $IDS

  # The check to require. A smoke job that is skipped, because the run is not the merge queue's,
  # or the matrix is empty, counts as passed here.
  smoke-ok:
    if: always()
    needs: [smoke-matrix, smoke]
    runs-on: ubuntu-slim
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
