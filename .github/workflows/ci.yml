# L0 on every pull request, in the merge queue and on main: the jobs of scripts/ci.sh (Go tests,
# lint, validate, render, template lint, a server-side dry run on a local API server and
# nix build .#release), run by zeabur-oss/.github's shared CI, and the DCO check. L1 in the merge
# queue and on main: install and smoke test what changed and what installs it, in groups; the
# shared CI has no dynamic matrix, so L1 stays here. CONTRIBUTING.md lists what each tier checks.
# L2 is e2e.yml, which nightly.yml and release.yml call. release.yml calls this workflow too.
name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  l0:
    uses: zeabur-oss/.github/.github/workflows/ci.yml@0badbf68744c7690d1b5b613071044bc12b002be # main
    with:
      runner: ubuntu-26.04

  dco:
    uses: zeabur-oss/.github/.github/workflows/dco.yml@0badbf68744c7690d1b5b613071044bc12b002be # main

  # Not when release.yml calls this workflow: L2 there tests everything L1 would.
  l1-matrix:
    if: github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-slim
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - id: list
        env:
          SINCE: ${{ github.event.merge_group.base_sha || github.event.before }}
        run: echo "matrix=$(go run ./tools/cmd/catalog list -tier l1 -since "$SINCE")" >> "$GITHUB_OUTPUT"

  l1:
    needs: [l0, l1-matrix]
    if: fromJSON(needs.l1-matrix.outputs.matrix).include[0]
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.l1-matrix.outputs.matrix).include }}
    name: l1 ${{ matrix.ids }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: iSCSI module for Longhorn
        if: contains(matrix.ids, 'replicated-storage/longhorn')
        run: sudo modprobe iscsi_tcp
      - name: e2e
        env:
          IDS: ${{ matrix.ids }}
        run: |
          # shellcheck disable=SC2086 # IDS is a list of IDs
          nix develop -c go run ./tools/cmd/catalog e2e -tier l1 $IDS
