# Each check job runs scripts/ci/<job>.sh in the Nix dev shell, the same as locally: Go tests and
# lint, then validate, render, template lint and a server-side dry run on a local API server, also of
# an upgrade from the pull request's base and a profile switch, then nix build .#release. Rulesets
# require check / ok. docs runs the website's check of docs/ (locally: bun scripts/docs-check.ts
# <this checkout> in the website).
# smoke runs in the merge queue: it installs and smoke tests what changed since the queue's base,
# what it needs and what installs it, in groups. A merge group that changes no component or
# template has an empty matrix and skips the job, so require smoke-ok, which fails only when a
# smoke job failed. CONTRIBUTING.md lists what each tier checks.
# full is e2e.yml, which weekly.yml calls.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "30 17 * * *" # every job on main, which also keeps main's caches warm
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request stops its older run; a push to main does not stop the schedule.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: instabox-medium
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Nix
        uses: zeabur-oss/.github/actions/ci-setup@993db7daf21a752dc7d3940f227e03478ee613cc # main
      - name: Lint
        run: nix develop -c scripts/ci/lint.sh

  test:
    runs-on: instabox-medium
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Nix
        uses: zeabur-oss/.github/actions/ci-setup@993db7daf21a752dc7d3940f227e03478ee613cc # main
      - name: Test
        run: nix develop -c scripts/ci/test.sh

  rust:
    runs-on: instabox-medium
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Nix
        uses: zeabur-oss/.github/actions/ci-setup@993db7daf21a752dc7d3940f227e03478ee613cc # main
      - name: Rust
        run: nix develop -c scripts/ci/rust.sh

  check:
    runs-on: instabox-medium
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The history of origin/main, to find the merge-base to dry-run an upgrade from.
          fetch-depth: 0
      - name: Set up Nix
        uses: zeabur-oss/.github/actions/ci-setup@993db7daf21a752dc7d3940f227e03478ee613cc # main
      - name: Check the catalog
        run: nix develop -c scripts/ci/check.sh

  release:
    runs-on: instabox-medium
    timeout-minutes: 120
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Nix
        uses: zeabur-oss/.github/actions/ci-setup@993db7daf21a752dc7d3940f227e03478ee613cc # main
      - name: Build the release
        run: nix develop -c scripts/ci/release.sh
        env:
          CI_ARTIFACTS: ${{ runner.temp }}/ci-artifacts
      - name: Upload the release files
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/ci-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  docs:
    runs-on: instabox-small
    timeout-minutes: 10
    steps:
      - uses: zeabur-oss/website/.github/actions/docs-check@a87b42163152b49e81886eb222e1853388f80d1e # main

  ok:
    name: check / ok
    if: always()
    needs: [lint, test, rust, check, release, docs]
    runs-on: instabox-small
    timeout-minutes: 5
    steps:
      - name: Fail if a job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1


  smoke-matrix:
    if: github.event_name == 'merge_group'
    runs-on: instabox-small
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: List the components to smoke test
        id: list
        env:
          BASE: ${{ github.event.merge_group.base_sha }}
        run: echo "matrix=$(go run ./tools/cmd/catalog list -tier smoke -since "$BASE")" >> "$GITHUB_OUTPUT"

  smoke:
    needs: [smoke-matrix]
    if: github.event_name == 'merge_group' && fromJSON(needs.smoke-matrix.outputs.matrix).include[0]
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.smoke-matrix.outputs.matrix).include }}
    name: smoke ${{ matrix.ids }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Nix
        uses: zeabur-oss/.github/actions/ci-setup@993db7daf21a752dc7d3940f227e03478ee613cc # main
      - name: Restore the downloads
        uses: ./.github/actions/downloads
      - name: iSCSI module for Longhorn
        if: contains(matrix.ids, 'longhorn')
        run: sudo modprobe iscsi_tcp
      - name: e2e
        env:
          IDS: ${{ matrix.ids }}
        run: |
          # shellcheck disable=SC2086 # IDS is a list of IDs
          nix develop -c go run ./tools/cmd/catalog e2e -tier smoke $IDS

  # The check to require. A smoke job that is skipped, because the run is not the merge queue's,
  # or the matrix is empty, counts as passed here.
  smoke-ok:
    if: always()
    needs: [smoke-matrix, smoke]
    runs-on: instabox-small
    timeout-minutes: 5
    steps:
      - name: Fail if a smoke job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
