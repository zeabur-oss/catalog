# Keeps and searches log history with low memory and disk use. It is Apache-2.0,
# unlike Loki, and runs on the VictoriaMetrics operator.
apiVersion: catalog.zeabur.com/v1
kind: Component
metadata:
  name: VictoriaLogs
  summary: Keeps and searches logs.
  locales:
    zh-TW:
      summary: "保存並搜尋日誌。"
    zh-CN:
      summary: "保存并搜索日志。"
  license: Apache-2.0
  homepage: https://docs.victoriametrics.com/victorialogs/
resources:
  work:
    - name: load
      # Peak over idle of vlsingle and vlagent on K3s with 12 project namespaces of 36 pods
      # logging every 100 ms and three loops of 1 h range queries: 81 MiB over 53 MiB. With
      # Traefik and kube-system logging every 10 ms the work was about 45 MiB.
      use: {memory: 64Mi}

provides: {capability: logs}
defaults:
  single-node: recommended
  multi-node: recommended
distributions: [k3s, rke2, kubesolo]
kubeVersion: ">=1.34.0-0"
persistsData: true
requires: [{component: victoria-metrics-operator}]

releases:
  - name: logs
    type: inline
    namespace: observability
    manifests: |
      # The log store.
      apiVersion: operator.victoriametrics.com/v1
      kind: VLSingle
      metadata:
        name: victoria-logs
        namespace: observability
      spec:
        # Two weeks, or less when the volume reaches 8GiB of its 10Gi.
        retentionPeriod: 14d
        retentionMaxDiskSpaceUsageBytes: 8GiB
        storage:
          resources:
            requests: {storage: 10Gi}
        extraArgs:
          # Caches stop at 128MiB instead of 60% of the limit.
          memory.allowedBytes: 128MiB
          search.maxConcurrentRequests: "2"
          defaultParallelReaders: "2"
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {memory: 384Mi}
      ---
      # One collector per node, reading container logs.
      apiVersion: operator.victoriametrics.com/v1
      kind: VLAgent
      metadata:
        name: collector
        namespace: observability
      spec:
        k8sCollector:
          enabled: true
          # Their lines are noise that shares the 8GiB budget with the project logs, and
          # observability would feed the collector's own errors back.
          excludeFilter: kubernetes.pod_namespace:in(kube-system, kube-public, kube-node-lease, observability)
        # Namespace, pod and container suffice; labels add cardinality. The
        # operator (v0.75.0) passes no flag for k8sCollector.includePodLabels:
        # false, and vlagent's default is true.
        extraArgs:
          kubernetesCollector.includePodLabels: "false"
          # kube-apiserver's audit log, under the /var/lib the collector already mounts
          # read-only. K3s and RKE2 write it in their own directory, and only
          # control-plane nodes have the file. Rotated backups are followed, not read again.
          fileCollector.glob: /var/lib/rancher/*/server/logs/audit.log
          fileCollector.extraFields: '{"app":"kube-apiserver-audit","node":"%{NODE_NAME}"}'
          fileCollector.streamFields: app,node
          fileCollector.timeField: stageTimestamp
          fileCollector.msgField: requestURI
          envflag.enable: "true"
        extraEnvs:
          - name: NODE_NAME
            valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
        remoteWriteSettings:
          queues: 1
          # What the node keeps while the log store is down.
          maxDiskUsagePerURL: 512MiB
        remoteWrite:
          - url: http://vlsingle-victoria-logs.observability.svc:9428/internal/insert
        resources:
          requests: {cpu: 20m, memory: 16Mi}
          limits: {memory: 128Mi}
      ---
      # Only the collector, the metrics stack's vmagent (the operator's scrape of
      # /metrics) and Zeabur Proxy in the zeabur namespace reach the log store.
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: victoria-logs
        namespace: observability
      spec:
        podSelector:
          matchLabels: {app.kubernetes.io/name: vlsingle, app.kubernetes.io/instance: victoria-logs}
        policyTypes: [Ingress]
        ingress:
          - ports: [{port: 9428, protocol: TCP}]
            from:
              - podSelector:
                  matchLabels: {app.kubernetes.io/name: vlagent, app.kubernetes.io/instance: collector}
              - podSelector:
                  matchLabels: {app.kubernetes.io/name: vmagent}
              # Both selectors: anyone can label a pod in their own namespace.
              - namespaceSelector:
                  matchLabels: {kubernetes.io/metadata.name: zeabur}
                podSelector:
                  matchLabels: {app.kubernetes.io/name: zeabur-proxy}

detection:
  crds: [vlsingles.operator.victoriametrics.com]
  helmCharts: [victoria-logs-single, victoria-logs-collector]
  workloads:
    - kind: Deployment
      labels: {app.kubernetes.io/name: vlsingle}
    - kind: StatefulSet
      labels: {app.kubernetes.io/name: victoria-logs-single}

security:
  summary: The collector reads pod metadata, node log files and kube-apiserver's audit log.
  podSecurity: privileged

smoke:
  - name: operational
    wait:
      - "-n observability vlsingle/victoria-logs --for=jsonpath={.status.updateStatus}=operational"
      - "-n observability vlagent/collector --for=jsonpath={.status.updateStatus}=operational"

leftovers: [persistentvolumeclaims]
