# Puts a Service or Ingress on the tailnet with no port open to the internet. An
# Ingress gets a MagicDNS name with a Let's Encrypt certificate, so a host
# without a domain still serves trusted HTTPS; a Service is proxied as it is,
# without TLS. Optional: it needs a Tailscale account, and an Ingress needs
# HTTPS and MagicDNS enabled on the tailnet.
apiVersion: catalog.zeabur.com/v1
kind: Component
metadata:
  name: Tailscale Kubernetes operator
  summary: Puts services on your tailnet with trusted HTTPS and no port open to the internet.
  locales:
    zh-TW:
      summary: "把服務放上你的 tailnet，提供受信任的 HTTPS，不必對網際網路開放連接埠。"
    zh-CN:
      summary: "把服务放到你的 tailnet 上，提供受信任的 HTTPS，无需对互联网开放端口。"
  license: BSD-3-Clause
  homepage: https://tailscale.com/kb/1236/kubernetes-operator
provides: {capability: remote-access}
defaults:
  single-node: optional
  multi-node: optional

distributions: [k3s, rke2, kubesolo]
kubeVersion: ">=1.34.0-0"
inputs:
  - name: oauthClientId
    description: >
      The operator uses the Tailscale OAuth client with this ID. The client
      needs write scope for Services, Devices Core and Auth Keys, and the tag
      tag:k8s-operator. The tailnet policy must make tag:k8s-operator an owner
      of tag:k8s, the proxies' default tag.
    secret: {name: operator-oauth, key: client_id, namespace: tailscale}
    required: true
    testValue: catalog-ci
  - name: oauthClientSecret
    description: The operator authenticates with this OAuth client secret.
    secret: {name: operator-oauth, key: client_secret, namespace: tailscale}
    required: true
    testValue: catalog-ci

releases:
  - name: tailscale-operator
    type: helm
    namespace: tailscale
    repo: https://pkgs.tailscale.com/helmcharts
    chart: tailscale-operator
    version: 1.104.7
    chartDigest: sha256:55d1df3c16b2ac1871908b78f37b4c341b963b3bb626ab1c18ed48b69620ef8b
    values: |
      oauth:
        # Empty, so the chart renders no Secret; the operator mounts
        # operator-oauth, created from the inputs before install.
        clientId: ""
        clientSecret: ""
      operatorConfig:
        image:
          # Pinned by digest; a tag alone can move. Always pulls on every restart.
          repository: tailscale/k8s-operator
          tag: v1.104.7@sha256:51ba104ff02afcc39f93189415c8b2f44fb6037e8592d626bfa52c3c8afc02f6
          pullPolicy: IfNotPresent
      proxyConfig:
        # The proxies the operator creates, pinned by digest.
        image:
          repository: tailscale/tailscale
          tag: v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
      apiServerProxyConfig:
        # No Kubernetes API proxy and no impersonation ClusterRole.
        mode: "false"
        allowImpersonation: "false"
    profiles:
      single-node: |
        operatorConfig:
          resources:
            # Chart sets none; one controller and one tailnet node.
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 256Mi}
      multi-node: |
        operatorConfig:
          resources:
            # More Services and Ingresses to reconcile.
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}

detection:
  crds: [proxyclasses.tailscale.com, connectors.tailscale.com]
  helmCharts: [tailscale-operator]
  ingressControllers: [tailscale.com/ts-ingress]

security:
  summary: >
    Creates, updates and deletes Services and Ingresses (and their status) in
    every namespace; reads nodes and EndpointSlices; manages
    ValidatingAdmissionPolicies and their bindings. In its own namespace it
    manages Secrets, ConfigMaps, ServiceAccounts, StatefulSets, Deployments,
    Roles and RoleBindings. Installs eight CRDs (connectors, dnsconfigs,
    peerrelays, proxyclasses, proxygrouppolicies, proxygroups, recorders,
    tailnets) and the IngressClass tailscale.
  podSecurity: privileged

smoke:
  - name: crds-established
    wait:
      - {resource: crd/proxyclasses.tailscale.com, condition: condition=Established}
      - {resource: crd/connectors.tailscale.com, condition: condition=Established}
