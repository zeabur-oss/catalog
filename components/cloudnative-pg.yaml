# Runs PostgreSQL clusters from a Cluster object in the tenant's namespace:
# replicas, failover, and backups to S3 through the Barman Cloud plugin.
apiVersion: catalog.zeabur.com/v1
kind: Component
metadata:
  name: CloudNativePG
  summary: Runs PostgreSQL databases with failover and backups to S3.
  locales:
    zh-TW:
      summary: "執行 PostgreSQL 資料庫，支援故障切換和備份到 S3。"
    zh-CN:
      summary: "运行 PostgreSQL 数据库，支持故障切换和备份到 S3。"
  license: Apache-2.0
  homepage: https://cloudnative-pg.io
provides: {capability: databases}
defaults:
  single-node: optional
  multi-node: optional
distributions: [k3s, rke2, kubesolo]
kubeVersion: ">=1.29.0-0"
# The Barman Cloud plugin talks to the operator over mTLS from cert-manager.
requires: [{capability: certificates}]
persistsData: true

releases:
  - name: cloudnative-pg
    type: helm
    namespace: cnpg-system
    releaseName: cnpg
    repo: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    version: 0.29.1
    chartDigest: sha256:b53d3991fe84bcf38767e7702cae78666265427a127a26fff168ab4207d2b1df
    values: |
      # Pinned by digest; a tag alone can move.
      image:
        repository: ghcr.io/cloudnative-pg/cloudnative-pg
        tag: 1.30.1@sha256:923c267ec29636db3bee20f993d0ec4973fa22998e1adad37da79e4d32b5bc07
      config:
        # Reconcile Clusters in every namespace.
        clusterWide: true
      monitoring:
        # No Prometheus operator assumed; metrics stay on the pod port.
        podMonitorEnabled: false
        grafanaDashboard:
          create: false
    profiles:
      single-node: |
        resources:
          # Idles near 40Mi; grows with Clusters. Chart sets none.
          requests: {cpu: 10m, memory: 56Mi}
          limits: {memory: 256Mi}
      multi-node: |
        # Leader election keeps one active; the webhook stays up during drains.
        replicaCount: 2
        resources:
          # Single-node's request; the leader uses about 45Mi on a two-node
          # cluster with apps. The limit leaves room for more Clusters.
          requests: {cpu: 10m, memory: 56Mi}
          limits: {memory: 512Mi}

  # Must share the operator's namespace; it registers itself with the operator.
  - name: plugin-barman-cloud
    type: helm
    namespace: cnpg-system
    repo: https://cloudnative-pg.github.io/charts
    chart: plugin-barman-cloud
    version: 0.8.1
    chartDigest: sha256:9ad0b9e56da2777a1a0269feaf7215e18297e9c8b5730e04acb27b5d462e9456
    values: |
      # Pinned by digest; a tag alone can move. The chart joins registry and
      # repository. registry comes second, so Renovate reads both.
      image:
        repository: cloudnative-pg/plugin-barman-cloud
        registry: ghcr.io
        tag: v0.15.1@sha256:c75acad19a36e8176cfe2885761ff1b836c6ef977d7257e298c99a28b5c302ef
      certificate:
        # Self-signed issuer for the operator-plugin mTLS, made by the chart.
        createIssuer: true
    profiles:
      single-node: |
        resources:
          # Idles near 18Mi, about 30Mi on a cluster with apps; backups run in
          # the instance sidecar, not here.
          requests: {cpu: 10m, memory: 32Mi}
          limits: {memory: 128Mi}
      multi-node: |
        resources:
          # Uses about 30Mi on a two-node cluster with apps; the limit leaves
          # room for more Clusters.
          requests: {cpu: 10m, memory: 32Mi}
          limits: {memory: 256Mi}

detection:
  crds: [clusters.postgresql.cnpg.io, objectstores.barmancloud.cnpg.io]
  helmCharts: [cloudnative-pg, plugin-barman-cloud]
  workloads:
    - kind: Deployment
      labels: {app.kubernetes.io/name: cloudnative-pg}
    - kind: Deployment
      labels: {app.kubernetes.io/name: plugin-barman-cloud}

security:
  summary: Manages pods, Services, Secrets and PVCs for Clusters in every namespace.
  podSecurity: restricted

# The chart annotates its CRDs helm.sh/resource-policy: keep.
leftovers: [customresourcedefinitions, persistentvolumeclaims]

smoke:
  - name: one-instance-cluster
    manifest: |
      apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      metadata: {name: smoke, namespace: catalog-smoke}
      spec:
        instances: 1
        storage: {size: 1Gi}
    wait: ["-n catalog-smoke cluster/smoke --for=condition=Ready"]
    # initdb pulls the PostgreSQL image first.
    timeout: 600s
  - name: object-store
    manifest: |
      apiVersion: barmancloud.cnpg.io/v1
      kind: ObjectStore
      metadata: {name: smoke, namespace: catalog-smoke}
      spec:
        retentionPolicy: 7d
        configuration:
          destinationPath: s3://smoke/
          endpointURL: http://s3.invalid:9000
          s3Credentials:
            accessKeyId: {name: smoke-s3, key: ACCESS_KEY_ID}
            secretAccessKey: {name: smoke-s3, key: ACCESS_SECRET_KEY}
    wait: ["-n cnpg-system deployment/plugin-barman-cloud --for=condition=Available"]
