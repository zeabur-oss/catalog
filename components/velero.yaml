# Backs up the whole cluster to S3 for disaster recovery. It can touch any
# namespace, so it is for administrators only.
apiVersion: catalog.zeabur.com/v1
kind: Component
metadata:
  name: Velero
  summary: Backs up and restores the whole cluster; database backups don't need it.
  locales:
    zh-TW:
      summary: "備份並還原整個叢集，資料庫備份不需要它。"
    zh-CN:
      summary: "备份并还原整个集群，数据库备份不需要它。"
  license: Apache-2.0
  homepage: https://velero.io
provides: {capability: volume-backup}
defaults:
  single-node: optional
  multi-node: optional

distributions: [k3s, rke2, kubesolo]
kubeVersion: ">=1.16.0-0"
inputs:
  - name: bucket
    description: Velero stores backups in this S3 bucket.
    path: configuration.backupStorageLocation.0.bucket
    required: true
    testValue: catalog-ci
  - name: s3Url
    description: >
      Velero connects to this S3 endpoint URL; any S3-compatible service works.
      Use https: the store encrypts each backup with the backupKey input, and
      S3 servers refuse that encryption over plain HTTP.
    path: configuration.backupStorageLocation.0.config.s3Url
    required: true
    testValue: http://minio.invalid:9000
  - name: region
    description: The bucket's region; S3-compatible services that have none accept the default.
    path: configuration.backupStorageLocation.0.config.region
    default: us-east-1
  - name: credentials
    description: Velero reads the bucket's credentials from this AWS-style credentials file.
    secret: {name: velero-credentials, key: cloud, namespace: velero}
    required: true
    testValue: "[default]\naws_access_key_id=ci\naws_secret_access_key=ci\n"
  - name: caCert
    description: >
      The CA certificate, in PEM, that signs the S3 endpoint's certificate,
      such as a self-hosted MinIO's own CA. Leave it empty for a store with a
      public certificate.
    secret: {name: velero-ca, key: ca.crt, namespace: velero}
    # Velero fails when caCertRef names a missing Secret, so the Secret always
    # exists; an empty CA keeps the system CAs.
    default: ""
  - name: repositoryPassword
    description: >
      Kopia encrypts file-system backups with this password. Without the
      Secret, Velero uses its built-in password, which is public.
    secret: {name: velero-repo-credentials, key: repository-password, namespace: velero}
    generate: {type: random, bytes: 64, encoding: hex}
  - name: backupKey
    description: >
      The S3 server encrypts every backup object, Secrets included, with this
      SSE-C key. The AWS plugin needs exactly 32 bytes.
    secret: {name: velero-backup-key, key: key, namespace: velero}
    generate: {type: random, bytes: 24, encoding: base64url}
  - name: fileBackup
    description: >
      Off by default. Set true to install the node agent on every node, so
      Velero can copy volume files with Kopia. The agent runs as root, mounts
      host paths, holds Velero's cluster-admin token, and needs the velero
      namespace to allow the privileged Pod Security level. Each Backup and
      Schedule must then set defaultVolumesToFsBackup to true. While the input
      is false, such a backup fails partly.
    path: deployNodeAgent
    default: false

releases:
  - name: velero
    type: helm
    namespace: velero
    repo: https://vmware-tanzu.github.io/helm-charts
    chart: velero
    version: 12.2.5
    chartDigest: sha256:faf074aacc580ddffa63e85582cafd54b3dde018442af9623a710a3825f644b8
    values: |
      # Pinned by digest; a tag alone can move.
      image:
        repository: docker.io/velero/velero
        tag: v1.18.4@sha256:c89fb5b6d1fd6afd368e0f483e6f5555fd62851a1eada8ac5c72482e674ca17b
      # The chart sets no security context; the namespace enforces Pod Security restricted.
      # The image runs as the name cnb, so runAsNonRoot needs its numeric ids from /etc/passwd.
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 1002
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      # Pod Security restricted requires both settings.
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
      initContainers:
        # AWS plugin covers any S3-compatible store; v1.14.x matches Velero 1.18.
        - name: velero-plugin-for-aws
          image: velero/velero-plugin-for-aws:v1.14.4@sha256:c85a7fa803569e3128c33e4f5766f84ab156c8d171c9f1dd2715581d45ce98fa
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - mountPath: /target
              name: plugins
      credentials:
        # Secret comes from the credentials input, not the chart.
        useSecret: true
        existingSecret: velero-credentials
      configuration:
        backupStorageLocation:
          # One S3 location; bucket and URL are inputs.
          - name: default
            provider: aws
            default: true
            # The caCert input; Velero checks the store's certificate with it.
            caCertRef: {name: velero-ca, key: ca.crt}
            config:
              region: us-east-1
              s3ForcePathStyle: "true"
              # Velero writes Secrets into the backup as they are. The
              # store encrypts them with the backupKey input (SSE-C).
              customerKeyEncryptionSecret: velero-backup-key/key
        # Kopia file-system backups work on any storage class, local-path included.
        uploaderType: kopia
        # No node agent by default, so no volume copy. Backups opt in with fileBackup.
        defaultVolumesToFsBackup: false
      # CSI snapshots need per-driver setup; use file-system backups instead.
      snapshotsEnabled: false
    profiles:
      single-node: |
        resources:
          # Idle between backups; chart sets none.
          requests: {cpu: 20m, memory: 64Mi}
          limits: {memory: 512Mi}
      multi-node: |
        resources:
          # Bigger clusters, bigger backup item lists.
          requests: {cpu: 50m, memory: 128Mi}
          limits: {memory: 1Gi}

detection:
  crds: [backups.velero.io, schedules.velero.io]
  helmCharts: [velero]
  workloads:
    - kind: Deployment
      labels: {app.kubernetes.io/name: velero}

security:
  summary: >
    Bound to cluster-admin; reads and restores every object. By default no
    Pod is privileged and the velero namespace needs only the baseline Pod
    Security level. With the fileBackup input, a root node agent on every
    node holds the same token, mounts host paths and needs the privileged level.
  podSecurity: restricted

# The chart's crds/ directory: Helm never deletes it.
leftovers: [customresourcedefinitions]

# e2e runs these against an HTTPS S3 store with a test CA (config/e2e.yaml).
smoke:
  - name: store
    wait:
      - {resource: backupstoragelocation/default, namespace: velero, condition: "jsonpath={.status.phase}=Available"}
  - name: backup
    manifest: |
      apiVersion: velero.io/v1
      kind: Backup
      metadata: {name: smoke, namespace: velero}
      spec:
        includedNamespaces: [catalog-smoke]
        ttl: 1h0m0s
    wait:
      - {resource: backup/smoke, namespace: velero, condition: "jsonpath={.status.phase}=Completed"}
  # The same store and credentials as default, without caCertRef: only the
  # certificate check can fail.
  - name: store-without-ca
    manifest: |
      apiVersion: velero.io/v1
      kind: BackupStorageLocation
      metadata: {name: smoke-without-ca, namespace: velero}
      spec:
        provider: aws
        objectStorage: {bucket: e2e}
        config: {region: us-east-1, s3ForcePathStyle: "true", s3Url: "https://s3.catalog-e2e-s3.svc"}
    wait:
      - {resource: backupstoragelocation/smoke-without-ca, namespace: velero, condition: "jsonpath={.status.phase}=Unavailable"}
  # The store refuses to read the backup without the SSE-C key and returns it
  # with the key.
  - name: backup-key
    manifest: |
      apiVersion: batch/v1
      kind: Job
      metadata: {name: smoke-backup-key, namespace: velero}
      spec:
        backoffLimit: 0
        template:
          spec:
            restartPolicy: Never
            securityContext:
              runAsNonRoot: true
              runAsUser: 100
              seccompProfile: {type: RuntimeDefault}
            containers:
              - name: curl
                image: curlimages/curl:8.17.0@sha256:935d9100e9ba842cdb060de42472c7ca90cfe9a7c96e4dacb55e79e560b3ff40
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities: {drop: [ALL]}
                command:
                  - sh
                  - -euc
                  - |
                    id=$(sed -n 's/^aws_access_key_id=//p' /credentials/cloud)
                    secret=$(sed -n 's/^aws_secret_access_key=//p' /credentials/cloud)
                    key=$(cat /backup-key/key)
                    md5=$(printf '%s' "$key" | md5sum | cut -c1-32 | sed 's/../\\x&/g')
                    get() {
                      curl -sS -o /dev/null -w '%{http_code}' --cacert /ca/ca.crt \
                        --aws-sigv4 aws:amz:us-east-1:s3 -u "$id:$secret" "$@" \
                        https://s3.catalog-e2e-s3.svc/e2e/backups/smoke/smoke.tar.gz
                    }
                    without=$(get)
                    with=$(get -H 'x-amz-server-side-encryption-customer-algorithm: AES256' \
                      -H "x-amz-server-side-encryption-customer-key: $(printf '%s' "$key" | base64)" \
                      -H "x-amz-server-side-encryption-customer-key-MD5: $(printf "$md5" | base64)")
                    echo "without the key: $without, with it: $with"
                    [ "$without" = 400 ] && [ "$with" = 200 ]
                volumeMounts:
                  - {name: credentials, mountPath: /credentials, readOnly: true}
                  - {name: ca, mountPath: /ca, readOnly: true}
                  - {name: backup-key, mountPath: /backup-key, readOnly: true}
            volumes:
              - {name: credentials, secret: {secretName: velero-credentials}}
              - {name: ca, secret: {secretName: velero-ca}}
              - {name: backup-key, secret: {secretName: velero-backup-key}}
    wait:
      - {resource: job/smoke-backup-key, namespace: velero, condition: condition=Complete}
