# Runs SeaweedFS from a Seaweed object in the tenant's namespace and serves its
# S3 API, with buckets, users, keys and policies as objects. Beta: almost all of
# the chart comes from one maintainer, and its features and CRDs still change
# from release to release.
apiVersion: catalog.zeabur.com/v1
kind: Component
metadata:
  name: SeaweedFS Operator
  summary: Runs SeaweedFS object storage with an S3 API, in beta.
  locales:
    zh-TW:
      summary: "執行提供 S3 API 的 SeaweedFS 物件儲存，目前為 Beta。"
    zh-CN:
      summary: "运行提供 S3 API 的 SeaweedFS 对象存储，目前为 Beta。"
  license: Apache-2.0
  homepage: https://github.com/seaweedfs/seaweedfs-operator
provides: {capability: object-storage}
defaults:
  single-node: optional
  multi-node: optional
distributions: [k3s, rke2, kubesolo]
kubeVersion: ">=1.34.0-0"
# The webhook's serving certificate comes from cert-manager.
requires: [{capability: certificates}]
persistsData: true

releases:
  - name: seaweedfs-operator
    type: helm
    namespace: seaweedfs-operator
    repo: https://seaweedfs.github.io/seaweedfs-operator/
    chart: seaweedfs-operator
    version: 0.1.45
    chartDigest: sha256:eabb13261b42784f556f8ddf6929e7613242585232c006bd5e0fa0f2767008a8
    values: |
      # Pinned by digest; a tag alone can move. An empty registry lets
      # repository hold the full name, which Renovate looks up.
      image:
        registry: ""
        repository: chrislusf/seaweedfs-operator
        tag: 1.0.42@sha256:dbb2437d178fc0c3c461f34f5c762eaf42cdcea03c8328edab1b9695dd7896b6
      webhook:
        certManager:
          # cert-manager issues the webhook certificate instead of the chart's
          # certgen hook Job.
          enabled: true
        # Restricted Pod Security; the chart's default.
        podSecurityContext:
          runAsNonRoot: true
          runAsUser: 65532
          fsGroup: 65532
          seccompProfile: {type: RuntimeDefault}
      grafanaDashboard:
        # On by default; no Grafana assumed.
        enabled: false
      # Restricted Pod Security; the chart leaves out the seccomp profile.
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
    profiles:
      single-node: |
        resources:
          # The chart asks for 100m and 50Mi; it idles lower.
          requests: {cpu: 10m, memory: 64Mi}
          limits: {memory: 256Mi}
      multi-node: |
        # Leader election keeps one active; survives a drain.
        replicaCount: 2
        resources:
          # Single-node's request; the leader uses about 52Mi on a two-node
          # cluster with apps. The limit leaves room for more clusters and buckets.
          requests: {cpu: 10m, memory: 64Mi}
          limits: {memory: 512Mi}

detection:
  crds: [seaweeds.seaweed.seaweedfs.com]
  helmCharts: [seaweedfs-operator]
  workloads:
    - kind: Deployment
      labels: {app.kubernetes.io/name: seaweedfs-operator}

security:
  summary: >
    Manages pods, StatefulSets, Services, Secrets, PVCs, Jobs and Ingresses
    for Seaweed objects in every namespace, and calls each cluster's admin API.
  podSecurity: restricted

# The CRDs carry helm.sh/resource-policy: keep.
# The chart annotates its CRDs helm.sh/resource-policy: keep.
leftovers: [customresourcedefinitions, persistentvolumeclaims]

smoke:
  - name: one-node-s3
    manifest: |
      # Proves SeaweedFS runs under restricted Pod Security.
      apiVersion: v1
      kind: Namespace
      metadata:
        name: catalog-smoke
        labels: {pod-security.kubernetes.io/enforce: restricted}
      ---
      apiVersion: seaweed.seaweedfs.com/v1
      kind: Seaweed
      metadata: {name: smoke, namespace: catalog-smoke}
      spec:
        image: chrislusf/seaweedfs:4.51
        volumeServerDiskCount: 1
        master:
          replicas: 1
          podSecurityContext: &pod
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile: {type: RuntimeDefault}
          containerSecurityContext: &container
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
        volume:
          replicas: 1
          requests: {storage: 1Gi}
          podSecurityContext: *pod
          containerSecurityContext: *container
        filer:
          replicas: 1
          podSecurityContext: *pod
          containerSecurityContext: *container
        s3:
          replicas: 1
          podSecurityContext: *pod
          containerSecurityContext: *container
    wait:
      # The operator creates the S3 gateway after master, volume and filer.
      - "-n catalog-smoke deployment/smoke-s3 --for=create"
      - "-n catalog-smoke deployment/smoke-s3 --for=condition=Available"
    # Pulls the SeaweedFS image and starts master, volume and filer in turn.
    timeout: 600s
