# Builds container images from Git in the cluster, with a Dockerfile or
# Railpack, and keeps them in zot, an OCI registry installed with it, so builds
# need no external registry account. Zeabur OSS needs it to deploy services from
# Git. Optional: without it, services deploy from images only. Nodes pull from
# zot at the fixed address of the clusterIp input; the zot-node DaemonSet points
# each node there and gives it zot's CA.
apiVersion: catalog.zeabur.com/v1
kind: Component
metadata:
  name: Zeabur Builder
  summary: Builds images from your Git repositories and keeps them in the cluster, so services can deploy from Git.
  locales:
    zh-TW:
      summary: "從 Git 儲存庫建置映像檔並存放在叢集裡，讓服務可以從 Git 部署。"
    zh-CN:
      summary: "从 Git 仓库构建镜像并存放在集群里，让服务可以从 Git 部署。"
  license: Apache-2.0
  homepage: https://github.com/zeabur-oss/builder
defaults:
  single-node: optional
  multi-node: optional
distributions: [k3s, rke2, kubesolo]
kubeVersion: ">=1.34.0-0"
# zot's images.
persistsData: true
# zot's certificates.
requires: [{capability: certificates}]
resources:
  work:
    - name: build
      # The build pod, which the controller creates and no render shows. A copy
      # of buildkitd.resources in the chart. Change it with the chart.
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "1", memory: 1Gi}
      # buildkitd running one small Railpack build, pushing to zot.
      use: {memory: 500Mi}

inputs:
  # A node's container runtime cannot resolve zot.zot.svc. With a fixed
  # ClusterIP, the zot-node DaemonSet sends zot.zot.svc:5000 there on each
  # node, and the certificate names that address.
  - name: clusterIp
    description: >
      A free address in the cluster's Service CIDR for the registry's Service.
      Zeabur picks one when you leave it empty. Nodes pull built images from
      this address.
    release: zot
    path: service.clusterIP
    generate: {type: clusterIP}

provides:
  capability: builds
  registry:
    host: zot.zot.svc:5000
    ca: {name: registry-ca, key: ca.crt, namespace: builder-system}

# Only builds, installers and nodes reach zot, so an app can't pull other
# projects' images.
networkPolicies: |
  apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata:
    name: zot-builder
    namespace: zot
  spec:
    podSelector:
      matchLabels: {app.kubernetes.io/name: zot}
    policyTypes: [Ingress]
    ingress:
      - from:
          - namespaceSelector:
              matchLabels: {kubernetes.io/metadata.name: builder-system}
            podSelector:
              matchLabels: {app.kubernetes.io/name: buildkitd}
          - namespaceSelector:
              matchLabels: {kubernetes.io/metadata.name: builder-system}
            podSelector:
              matchLabels: {app.kubernetes.io/name: zeabur-builder}
          # Any Pod in a project namespace can set this label.
          - namespaceSelector:
              matchLabels: {zeabur.com/project: "true"}
            podSelector:
              matchExpressions:
                - {key: builder.zeabur.com/buildrun, operator: Exists}
        ports:
          - {port: 5000, protocol: TCP}

releases:
  # Before the chart: the CA that signs zot-tls, and the key that signs push
  # tokens.
  - name: tls
    type: inline
    namespace: zot
    manifests: |
      # Signs the CA below; nothing else uses it.
      apiVersion: cert-manager.io/v1
      kind: Issuer
      metadata:
        name: zot-selfsigned
        namespace: zot
      spec:
        selfSigned: {}
      ---
      # A CA of its own: no public CA signs *.svc names. Nodes and buildkitd
      # trust ca.crt from the zot-tls Secret; to use a CA you already
      # distribute, point zot-tls at your own issuer instead. Ten years,
      # because every node holds a copy and rotating it means redistributing.
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: zot-ca
        namespace: zot
      spec:
        isCA: true
        commonName: zot-ca
        secretName: zot-ca
        duration: 87600h
        privateKey:
          algorithm: ECDSA
          size: 256
        issuerRef:
          kind: Issuer
          name: zot-selfsigned
      ---
      apiVersion: cert-manager.io/v1
      kind: Issuer
      metadata:
        name: zot-ca
        namespace: zot
      spec:
        ca:
          secretName: zot-ca
      ---
      # The key that signs push tokens. Zeabur Builder reads tls.key and signs
      # a short-lived token for each push; zot checks it with tls.crt. Only
      # the key matters, so a renewal keeps it (rotationPolicy: Never). zot
      # reads tls.crt once at start: to rotate the key, delete the Secret
      # zot-token-signer, wait for cert-manager to issue it again, and restart
      # zot.
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: zot-token-signer
        namespace: zot
      spec:
        commonName: zot-token-signer
        secretName: zot-token-signer
        duration: 87600h
        privateKey:
          algorithm: Ed25519
          encoding: PKCS8
          rotationPolicy: Never
        issuerRef:
          kind: Issuer
          name: zot-selfsigned

  - name: zot
    type: helm
    namespace: zot
    repo: https://zotregistry.dev/helm-charts
    chart: zot
    version: 0.1.134
    chartDigest: sha256:5b4f617b2fe4ce3d21b8071f7992501d9ec8310f5e83fad20afe137760f84bb0
    values: |
      # Pinned by digest; a tag alone can move.
      image:
        repository: ghcr.io/project-zot/zot
        tag: v2.1.22@sha256:96cda11459ce6f8c60da3b03f03e9f67fd11b3ae2d82c4c04c92b3c608996080
      service:
        # Anyone may pull: never on node ports (the chart's
        # default is NodePort).
        type: ClusterIP
        port: 5000
        # Set by the clusterIp input; the certificate below names it.
        clusterIP: ""
      httpGet:
        # The probes must speak TLS once zot does.
        scheme: HTTPS
      # StatefulSet with a volumeClaimTemplate; images survive restarts.
      persistence: true
      pvc:
        # One size for both profiles: volumeClaimTemplates can't change, so a
        # profile switch would stop the upgrade. local-path ignores the size;
        # on Longhorn, grow the claim when about 20 builds of a few apps no
        # longer fit.
        storage: 20Gi
      # The restricted Pod Security level. The image has no user of its own,
      # so any UID works; fsGroup gives it the volume and the mounted Secrets.
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        # A process gains no privilege that its parent lacks.
        allowPrivilegeEscalation: false
        capabilities:
          # zot binds port 5000 and needs no capability.
          drop: [ALL]
      extraObjects:
        # The serving certificate; the pod starts once its Secret exists.
        # localhost and 127.0.0.1 let a node pull through a loopback
        # port-forward; the last address is the fixed ClusterIP, or ::1 when
        # there is none. zot reloads the certificate when cert-manager renews
        # it.
        - apiVersion: cert-manager.io/v1
          kind: Certificate
          metadata:
            name: zot-tls
            namespace: zot
          spec:
            secretName: zot-tls
            dnsNames:
              - zot.zot.svc
              - zot.zot.svc.cluster.local
              - localhost
            ipAddresses:
              - 127.0.0.1
              - '{{ .Values.service.clusterIP | default "::1" }}'
            privateKey:
              algorithm: ECDSA
              size: 256
            issuerRef:
              kind: Issuer
              name: zot-ca
        # A node's container runtime cannot resolve zot.zot.svc. On each node,
        # this points it at the fixed ClusterIP, which kube-proxy routes and
        # the certificate above names, with zot's CA: a hosts.toml in the
        # registry directory of K3s, RKE2 or KubeSolo. containerd reads the
        # file at each pull, so no restart is needed, and the distributions
        # keep it when they restart. Without a fixed ClusterIP it writes
        # nothing. The file and the CA stay on the node when zot goes.
        - apiVersion: apps/v1
          kind: DaemonSet
          metadata:
            name: zot-node
            namespace: zot
          spec:
            selector:
              matchLabels: {app.kubernetes.io/name: zot-node}
            template:
              metadata:
                labels: {app.kubernetes.io/name: zot-node}
              spec:
                automountServiceAccountToken: false
                # Every node pulls built images, the control plane too.
                tolerations: [{operator: Exists}]
                containers:
                  - name: registry-host
                    image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
                    env:
                      - name: ADDRESS
                        value: '{{ .Values.service.clusterIP }}'
                    command: [sh, -c]
                    args:
                      - |
                        set -eu
                        [ -n "$ADDRESS" ] || exec sleep 2147483647
                        case "$ADDRESS" in
                          *:*) at="[$ADDRESS]:5000" ;;
                          *) at="$ADDRESS:5000" ;;
                        esac
                        put() { cmp -s "$1" "$2" && rm "$1" || mv "$1" "$2"; }
                        while :; do
                          for d in rancher/k3s/agent/etc/containerd/certs.d \
                                   rancher/rke2/agent/etc/containerd/certs.d \
                                   kubesolo/containerd/registry; do
                            [ -d "/host/${d%/*}" ] || continue
                            dir="$d/zot.zot.svc:5000"
                            mkdir -p "/host/$dir"
                            cp /ca/ca.crt "/host/$dir/.ca.crt"
                            put "/host/$dir/.ca.crt" "/host/$dir/ca.crt"
                            printf '%s\n' \
                              "server = \"https://$at\"" "" \
                              "[host.\"https://$at\"]" \
                              '  capabilities = ["pull", "resolve"]' \
                              "  ca = \"/var/lib/$dir/ca.crt\"" \
                              > "/host/$dir/.hosts.toml"
                            put "/host/$dir/.hosts.toml" "/host/$dir/hosts.toml"
                          done
                          # Picks up a new CA after cert-manager issues one.
                          sleep 60
                        done
                    securityContext:
                      # Root owns the registry directories on the node; no
                      # capability is needed to write as their owner.
                      runAsUser: 0
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities: {drop: [ALL]}
                      seccompProfile: {type: RuntimeDefault}
                    resources:
                      requests: {cpu: 1m, memory: 4Mi}
                      limits: {memory: 16Mi}
                    volumeMounts:
                      - {name: ca, mountPath: /ca, readOnly: true}
                      - {name: var-lib, mountPath: /host}
                volumes:
                  - name: ca
                    secret:
                      secretName: zot-tls
                      items: [{key: ca.crt, path: ca.crt}]
                  # The registry directories of the three distributions.
                  - name: var-lib
                    hostPath: {path: /var/lib, type: Directory}
      # The chart stores config in a Secret named zot-config and mounts it at
      # /etc/zot. configFiles stays empty: the chart refuses both.
      configFiles:
        config.json: null
      # The chart mounts config from its own Secret; no ConfigMap.
      mountConfig: false
      # The serving certificate. The pod waits for the Secret.
      externalSecrets:
        - secretName: zot-tls
          mountPath: /tls
      # Only tls.crt of zot-token-signer, to check tokens: zot never gets
      # the key that signs them. The pod waits for the Secret.
      extraVolumes:
        - name: token
          secret:
            secretName: zot-token-signer
            items:
              - {key: tls.crt, path: tls.crt}
      # bearer.cert reads it from here.
      extraVolumeMounts:
        - name: token
          mountPath: /token
          readOnly: true
      config:
        # Referrers and artifactType, which source archives use.
        distSpecVersion: 1.1.1
        # No search or UI extensions: they keep an index in memory. No
        # read/write timeouts: the chart's 60s cuts off large layer pushes.
        storage:
          rootDirectory: /var/lib/registry
          dedupe: true
          gc: true
          gcDelay: 2h
          gcInterval: 1h
          # Every untagged manifest goes after the delay; per repository, the
          # 20 most recently pushed tags stay. Builder pushes one tag per
          # commit, so 20 commits remain to roll back to.
          retention:
            delay: 2h
            policies:
              - repositories: ["**"]
                deleteReferrers: true
                deleteUntagged: true
                keepTags:
                  - mostRecentlyPushedCount: 20
        http:
          # All interfaces, so the Service reaches the pod.
          address: 0.0.0.0
          # The Service port.
          port: "5000"
          # The certificate and key from the zot-tls Secret.
          tls:
            cert: /tls/tls.crt
            key: /tls/tls.key
          # Pushes, deletes and source reads need a token from Zeabur Builder,
          # signed with the key of zot-token-signer. A token names each
          # repository exactly, such as team-a/api and team-a/api/source, and
          # expires. zot checks such a request against the token alone, not
          # against accessControl. realm is required, but clients send the
          # token without asking it.
          auth:
            bearer:
              realm: https://zot.zot.svc:5000/zot/auth/token
              service: zot
              cert: /token/tls.crt
          # Requests without a token. zot applies the rule with the longest
          # pattern, not the union of matches. Everyone pulls images. Nobody
          # reads source archives (<namespace>/<build>/source).
          accessControl:
            repositories:
              "**":
                anonymousPolicy: [read]
              "**/source":
                policies: []
        # Requests and errors only.
        log:
          level: info
    profiles:
      single-node: |
        resources:
          # Idles near 50Mi without extensions, 70Mi after a push; pushes stream to disk.
          requests: {cpu: 20m, memory: 104Mi}
          limits: {memory: 512Mi}
      multi-node: |
        # Still one replica: filesystem storage has a single writer, and the
        # ReadWriteOnce volume binds it to one node anyway.
        replicaCount: 1
        resources:
          # More concurrent pushes and pulls.
          requests: {cpu: 50m, memory: 128Mi}
          limits: {memory: 1Gi}

  - name: builder
    type: helm
    namespace: builder-system
    chart: oci://ghcr.io/zeabur-oss/charts/zeabur-builder
    version: 0.2.5
    chartDigest: sha256:bbcf68928d1d043888ec61c06c653d54408ec80d55e3be5d6c138a622032bc9d
    values: |
      registry:
        # zot above: images go to zot.zot.svc:5000/<namespace>/<build>.
        host: zot.zot.svc:5000
        # zot's token signer: each build pushes with a short-lived token for
        # its own repositories only.
        tokenKey:
          namespace: zot
          secret: zot-token-signer
        # zot's CA. The controller follows this Secret and publishes the CA
        # alone in builder-system/registry-ca, which buildkitd mounts and
        # provides.registry.ca names.
        caSecret:
          namespace: zot
          secret: zot-tls
        # The egress policy lets buildkitd reach zot's pods on 5000; every
        # other private address stays blocked.
        inCluster:
          namespace: zot
          podLabels: {app.kubernetes.io/name: zot}
          port: 5000
    profiles:
      single-node: |
        resources:
          # The controller only; each namespace's buildkitd sizes itself. Idles near 6Mi.
          requests: {cpu: 10m, memory: 16Mi}
          limits: {memory: 256Mi}
        extraArgs:
          # Each namespace's build cache on the node's disk.
          - --buildkitd-cache-size=10Gi
      multi-node: |
        resources:
          # More namespaces and Builds to watch.
          requests: {cpu: 20m, memory: 64Mi}
          limits: {memory: 512Mi}

detection:
  crds: [builds.builder.zeabur.com]
  helmCharts: [zeabur-builder]
  workloads:
    - kind: Deployment
      labels: {app.kubernetes.io/name: zeabur-builder}

security:
  summary: >
    Zeabur Builder: a ClusterRole that manages Builds, BuildRuns and Jobs in
    every namespace; reads Pods, Namespaces and ServiceAccounts; reads,
    creates, updates and deletes Secrets in every namespace (the Git
    credentials Builds name, and the copies it puts in build namespaces), and
    reads the zot token signer.
    Runs one privileged buildkitd per building namespace in its own namespace,
    with a user namespace and an egress policy. An admission policy limits the
    Jobs and StatefulSets it can create. zot: no RBAC, a ServiceAccount without
    roles; serves the OCI registry API over TLS on port 5000 inside the
    cluster. zot-node: a DaemonSet that runs as root on every node, without
    capabilities, and writes zot's address and CA into the container
    runtime's registry directory under /var/lib.
  podSecurity: privileged

smoke:
  - name: ready
    wait:
      - {resource: certificate/zot-tls, namespace: zot, condition: condition=Ready}
      - {resource: statefulset/zot, namespace: zot}
  # In zot's namespace: the CA it checks against is the zot-tls Secret there.
  - name: tls-v2
    manifest: |
      apiVersion: batch/v1
      kind: Job
      metadata: {name: smoke, namespace: zot}
      spec:
        backoffLimit: 6
        template:
          spec:
            restartPolicy: Never
            securityContext:
              runAsNonRoot: true
              runAsUser: 65532
              seccompProfile: {type: RuntimeDefault}
            containers:
              - name: curl
                image: curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities: {drop: [ALL]}
                args: [-sSf, --cacert, /tls/ca.crt, "https://zot.zot.svc:5000/v2/"]
                volumeMounts: [{name: tls, mountPath: /tls}]
            volumes: [{name: tls, secret: {secretName: zot-tls}}]
    wait:
      - {resource: job/smoke, namespace: zot, condition: condition=Complete}
  - name: builder-ready
    wait:
      - {resource: deployment/zeabur-builder, namespace: builder-system}
      - {resource: crd/builds.builder.zeabur.com, condition: condition=Established}

# zot's volumeClaimTemplate claims outlive the StatefulSet, with every image;
# Builder's CRDs stay, with every Build.
leftovers: [persistentvolumeclaims, customresourcedefinitions]
