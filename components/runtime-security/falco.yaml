# Flags suspicious runtime behavior (container shells, privilege escalation)
# from kernel events, and keeps each namespace's recent alerts in a PolicyReport
# there, readable with namespace admin rights. Optional: it needs a privileged
# eBPF probe and a kernel with BTF (5.8 or later).
apiVersion: catalog.zeabur.com/v1
kind: Component
metadata:
  name: Falco
  summary: Flags suspicious activity in containers, such as a shell or a privilege escalation.
  locales:
    zh-TW:
      summary: "偵測容器內的可疑行為，例如開啟 shell 或提升權限。"
    zh-CN:
      summary: "检测容器内的可疑行为，例如打开 shell 或提升权限。"
  license: Apache-2.0
  homepage: https://falco.org
defaults:
  single-node: optional
  multi-node: optional

distributions: [k3s, rke2, kubesolo]
kubeVersion: ">=1.34.0-0"
releases:
  - name: policy-report-crds
    type: manifest
    namespace: falco
    # Falcosidekick writes wgpolicyk8s.io/v1alpha2 reports; the chart lacks the CRDs.
    # Kyverno and other report producers may have installed them already.
    skipIfPresent: [policyreports.wgpolicyk8s.io]
    urls:
      - https://raw.githubusercontent.com/kubernetes-retired/wg-policy-prototypes/{version}/policy-report/crd/wgpolicyk8s.io/v1alpha2/wgpolicyk8s.io_policyreports.yaml
      - https://raw.githubusercontent.com/kubernetes-retired/wg-policy-prototypes/{version}/policy-report/crd/wgpolicyk8s.io/v1alpha2/wgpolicyk8s.io_clusterpolicyreports.yaml
    # The repository is archived; this is its last commit.
    version: ed0ca5a1c7788055074c7500915b76fc4518ed33
    urlDigests:
      - sha256:04cae1b4158ba59debed7c702e8dee4434d583cff9aa8ab00add54b6a63c56b5
      - sha256:8bb518a3f12e6cb199c8cc252970d9a8383f419e0b59e8312f4a2c1105710919

  - name: alert-readers
    type: inline
    namespace: falco
    manifests: |
      # Alerts carry command lines and file paths, so only namespace admins
      # (the built-in admin role, by aggregation) read their namespace's
      # report. Bind this role in a namespace to let others read it too.
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: falco-alert-reader
        labels:
          rbac.authorization.k8s.io/aggregate-to-admin: "true"
      rules:
        - apiGroups: [wgpolicyk8s.io]
          resources: [policyreports]
          verbs: [get, list, watch]

  - name: falco
    type: helm
    namespace: falco
    chart: oci://ghcr.io/falcosecurity/charts/falco
    version: 9.2.1
    chartDigest: sha256:0e1fb8c9a069659f19427ee96695416dc4152bb43c8fd5234108dd05c34ef3b1
    values: |
      # Pinned by digest; a tag alone can move.
      image:
        repository: falcosecurity/falco
        tag: 0.45.2@sha256:1562a643953f938e02f47319b5214d93a235f11f646d60e9b8a516fd5a64698e
      driver:
        # Built-in CO-RE eBPF probe: no kernel module or headers.
        kind: modern_ebpf
      falco:
        # JSON alerts so the log store can index fields.
        json_output: true
        json_include_output_property: true
      falcoctl:
        # Pinned by digest; a tag alone can move.
        image:
          repository: falcosecurity/falcoctl
          tag: 0.14.3@sha256:2230fb4802aafe09455b58d38f8f1faedd8f09f042e9a18fffd397e63488c023
        artifact:
          follow:
            # Rules change only with chart upgrades; no background downloads.
            enabled: false
      falcosidekick:
        # Forwards alerts to PolicyReports in the namespace they concern.
        enabled: true
        # One writer: reports are read, appended to and replaced whole, and a
        # second replica's concurrent update would be refused and its alert lost.
        replicaCount: 1
        image:
          # The chart's default repository. Renovate reads it to update the tag.
          repository: falcosecurity/falcosidekick
          # 2.35.1 writes the alert's time; earlier versions only its seconds
          # within the minute. Pinned by digest; a tag alone can move.
          tag: 2.35.1@sha256:a9bb60d2c7742febd912315ca1155839abc0199bf322c58d3adbb8b0849fadb9
        resources:
          # Idle most of the time; one report update per alert.
          requests: {cpu: 10m, memory: 32Mi}
          limits: {memory: 128Mi}
        config:
          policyreport:
            enabled: true
            # The newest 100 alerts per namespace. One alert is about 1.5 KiB and
            # holds the command line twice. At the upstream 1000, a report passes
            # the etcd limit of 1.5 MiB, and each later update fails.
            maxevents: 100
    profiles:
      single-node: |
        resources:
          # The chart asks 512Mi; one node idles well below that.
          requests: {cpu: 50m, memory: 128Mi}
          limits: {memory: 768Mi}
      multi-node: |
        resources:
          # Busier nodes mean more syscalls to evaluate.
          requests: {cpu: 100m, memory: 256Mi}
          limits: {memory: 1Gi}

detection:
  helmCharts: [falco]
  workloads:
    - kind: DaemonSet
      labels: {app.kubernetes.io/name: falco}

security:
  summary: >
    Reads pod and node metadata to enrich alerts; falcosidekick writes
    PolicyReports in every namespace.
  podSecurity: privileged
