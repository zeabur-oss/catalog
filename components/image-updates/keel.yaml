apiVersion: catalog.zeabur.com/v1
kind: Component
metadata:
  name: Keel
  description: >
    Rolls workloads annotated keel.sh/policy to a new image tag when Zeabur
    Builder calls its webhook after a push, or when polling finds one. Optional:
    only annotated workloads change.
  summary: Deploys each new image to the services you turn auto-deploy on for.
  locales:
    zh-TW:
      summary: "新的映像檔一建好，就部署到開了自動部署的服務。"
    zh-CN:
      summary: "新的镜像一构建好，就部署到开了自动部署的服务。"
  license: MPL-2.0
  homepage: https://keel.sh
maturity: independent
defaults:
  single-node: optional
  multi-node: optional
presets: [standard]

releases:
  - name: keel
    namespace: keel
    repo: https://keel-hq.github.io/keel/
    chart: keel
    version: v1.2.3
    chartDigest: sha256:ba5b56c43064f653759f81f99f6c42ec97feba98224b5dc26e414c91295c4b8b
    values: |
      image:
        # Pinned by digest; a tag alone can move. Always would hit the
        # registry on every restart.
        repository: ghcr.io/keel-hq/keel
        tag: 0.22.4@sha256:09872633675df8da591fd2c2a7a37fbe8f08e19f9972c8f64a4c1e473876ac05
        pullPolicy: IfNotPresent
      helmProvider:
        # Workload annotations only. The Helm provider rewrites release
        # values, which conflicts with whoever owns the release.
        enabled: false
      polling:
        # For workloads annotated keel.sh/trigger: poll, such as those on
        # public registries that send no webhook.
        enabled: true
        # Fewer registry requests than the chart's 1m; a workload sets
        # keel.sh/pollSchedule to poll faster.
        defaultSchedule: "@every 5m"
      service:
        # Builder posts to http://keel.keel.svc:9300/v1/webhooks/native. The
        # chart's LoadBalancer would publish an unauthenticated webhook.
        enabled: true
        type: ClusterIP
        externalPort: 9300
      rbac:
        clusterRole:
          # The chart's rules minus configmaps and pods/portforward, unused
          # with the Helm provider off.
          rules:
            - apiGroups: [""]
              resources: [namespaces, nodes]
              verbs: [get, watch, list]
            - apiGroups: [""]
              resources: [secrets]
              verbs: [get, watch, list]
            - apiGroups: ["", extensions, apps, batch]
              resources: [pods, replicasets, replicationcontrollers, statefulsets, deployments, daemonsets, jobs, cronjobs]
              verbs: [get, delete, watch, list, update]
      podSecurityContext:
        # The image runs as uid 666; enforce it and the default seccomp profile.
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containerSecurityContext:
        # Root filesystem stays writable: keel.db lives in /data.
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
      persistence:
        # keel.db holds approvals and the audit log; neither is used here.
        enabled: false
    profiles:
      single-node: |
        resources:
          # Caches annotated workloads only.
          requests: {cpu: 10m, memory: 32Mi}
          limits: {memory: 128Mi}
      multi-node: |
        resources:
          # More workloads to track. Still one replica (the chart fixes it):
          # Keel has no leader election, and two would roll each workload twice.
          requests: {cpu: 20m, memory: 64Mi}
          limits: {memory: 256Mi}

  # Port 9300 takes webhooks without credentials. Only Zeabur Builder's
  # namespace may call it, and Keel's own namespace for checks.
  - name: webhook-policy
    namespace: keel
    manifests: |
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: keel-webhook
        namespace: keel
      spec:
        podSelector:
          matchLabels: {app: keel}
        policyTypes: [Ingress]
        ingress:
          - from:
              - namespaceSelector:
                  matchLabels: {kubernetes.io/metadata.name: builder-system}
              - podSelector: {}
            ports:
              - {port: 9300, protocol: TCP}

detection:
  helmCharts: [keel]
  workloads:
    - kind: Deployment
      labels: {app: keel}

security:
  summary: >
    ClusterRole: reads, lists and watches every Secret (registry credentials of
    tracked workloads), Namespace and Node; reads, updates and deletes Pods,
    ReplicaSets, ReplicationControllers, Deployments, StatefulSets,
    DaemonSets, Jobs and CronJobs in every namespace.
  clusterWide: true
  risks:
    - risk: It reads every Secret in the cluster, so its token exposes all of them.
      mitigation: Keep its namespace admin-only; it runs as non-root with the RuntimeDefault seccomp profile and no capabilities.
    - risk: >
        Port 9300 takes webhooks without credentials: whoever can call it
        rolls any annotated workload, in any namespace, to any tag of that
        workload's repository.
      mitigation: >
        The NetworkPolicy keel-webhook lets only pods in builder-system and
        keel reach 9300; the cluster's CNI must enforce NetworkPolicy. If
        Zeabur Builder runs in another namespace, change the policy.
        basicauth with AUTHENTICATED_WEBHOOKS=true (extraEnv) makes every
        webhook but /v1/webhooks/registry require it; basicauth also enables
        the admin UI, which otherwise does not exist.

smoke:
  - name: rolls-on-native-webhook
    manifest: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: smoke
        namespace: catalog-smoke
        annotations: {keel.sh/policy: force}
      spec:
        selector: {matchLabels: {app: smoke}}
        template:
          metadata: {labels: {app: smoke}}
          spec:
            containers:
              - name: pause
                image: registry.k8s.io/pause:3.9
      ---
      # Retries until Keel has seen the Deployment; a repeated event is a no-op.
      # In Keel's namespace: the NetworkPolicy refuses catalog-smoke.
      apiVersion: batch/v1
      kind: Job
      metadata: {name: webhook, namespace: keel}
      spec:
        template:
          spec:
            restartPolicy: Never
            containers:
              - name: curl
                image: curlimages/curl:8.23.0
                command: [sh, -c]
                args:
                  - for i in 1 2 3 4 5 6; do curl -sSf -d '{"name":"registry.k8s.io/pause","tag":"3.10"}' http://keel.keel.svc:9300/v1/webhooks/native; sleep 10; done
    wait:
      - "-n catalog-smoke deployment/smoke --for=jsonpath={.spec.template.spec.containers[0].image}=registry.k8s.io/pause:3.10"
      - "-n catalog-smoke deployment/smoke --for=condition=Available"
