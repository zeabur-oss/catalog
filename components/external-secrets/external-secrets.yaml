# Copies values from an external secret store, such as OpenBao, Vault, 1Password
# or AWS Secrets Manager, into Kubernetes Secrets and keeps them in sync.
# Optional: it does nothing until you add a SecretStore.
apiVersion: catalog.zeabur.com/v1
kind: Component
metadata:
  name: External Secrets Operator
  summary: Copies secrets from a store such as Vault or 1Password into the cluster and keeps them in sync.
  locales:
    zh-TW:
      summary: "把 Vault、1Password 等外部儲存的機密複製進叢集，並保持同步。"
    zh-CN:
      summary: "把 Vault、1Password 等外部存储的密钥复制进集群，并保持同步。"
  license: Apache-2.0
  homepage: https://external-secrets.io
defaults:
  single-node: optional
  multi-node: optional
distributions: [k3s, rke2, kubesolo]
kubeVersion: ">=1.19.0-0"
requires: [{capability: certificates}]

releases:
  - name: external-secrets
    type: helm
    namespace: external-secrets
    repo: https://charts.external-secrets.io
    chart: external-secrets
    version: 2.14.0
    chartDigest: sha256:0a6d9e91b1ff50adfdbf24b50b582babfa7c5b7df42b21974ca4b3fb88ee5e34
    values: |
      # Pinned by digest; the chart's tag alone can move.
      image:
        repository: ghcr.io/external-secrets/external-secrets
        tag: v2.13.0@sha256:f799d87a6a959e597a4ba7a8d2379886292c3fcfbee678f7dc2d3566051bcb96
      # Off in the chart. Both use the health server on port 8082.
      livenessProbe:
        enabled: true
      # Ready once the controller has synced its caches.
      readinessProbe:
        enabled: true
      webhook:
        # The same image as the controller.
        image:
          repository: ghcr.io/external-secrets/external-secrets
          tag: v2.13.0@sha256:f799d87a6a959e597a4ba7a8d2379886292c3fcfbee678f7dc2d3566051bcb96
        # Off in the chart. /healthz on port 8081.
        livenessProbe:
          enabled: true
        # cert-manager issues the webhook certificate and injects its CA, so
        # the cert controller and its cluster-wide webhook RBAC are not needed.
        certManager:
          enabled: true
          cert:
            issuerRef:
              group: cert-manager.io
              kind: Issuer
              name: external-secrets-selfsigned
      # cert-manager issues the webhook certificate instead.
      certController:
        create: false
      extraObjects:
        # Signs the webhook certificate; nothing else uses it.
        - apiVersion: cert-manager.io/v1
          kind: Issuer
          metadata:
            name: external-secrets-selfsigned
            namespace: external-secrets
          spec:
            selfSigned: {}
    profiles:
      single-node: |
        resources:
          # Caches ExternalSecrets and the Secrets it owns.
          requests: {cpu: 10m, memory: 64Mi}
          limits: {cpu: 200m, memory: 256Mi}
        webhook:
          # Validates CRD writes only.
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
      multi-node: |
        # One leader and one standby, so a node drain does not stop syncs.
        replicaCount: 2
        # Only the leader reconciles.
        leaderElect: true
        # More namespaces and Secrets to cache.
        resources:
          requests: {cpu: 20m, memory: 128Mi}
          limits: {cpu: 500m, memory: 512Mi}
        webhook:
          # Two replicas: with failurePolicy Fail, no webhook means no writes
          # to its CRDs.
          replicaCount: 2
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}

detection:
  helmCharts: [external-secrets]
  crds: [externalsecrets.external-secrets.io]
  workloads:
    - kind: Deployment
      labels: {app.kubernetes.io/name: external-secrets}

security:
  summary: >
    ClusterRole: reads, creates, updates and deletes Secrets in every
    namespace; creates ServiceAccount tokens in every namespace (for
    SecretStores that authenticate as a ServiceAccount); reads ConfigMaps,
    ServiceAccounts and its own CRDs; reads and updates Namespaces; creates
    Events. The webhook has no RBAC. The chart aggregates read access to its
    CRDs into view, and write access into edit and admin.
  podSecurity: restricted

smoke:
  - name: ready
    wait:
      - "-n external-secrets certificate --all --for=condition=Ready"
      - "-n external-secrets deployment/external-secrets --for=condition=Available"
      - "-n external-secrets deployment/external-secrets-webhook --for=condition=Available"
  # The Fake provider needs no external store; the SecretStore goes through the webhook.
  - name: fake-store-sync
    manifest: |
      apiVersion: external-secrets.io/v1
      kind: SecretStore
      metadata: {name: smoke, namespace: catalog-smoke}
      spec:
        provider:
          fake:
            data:
              - key: smoke
                value: synced
      ---
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata: {name: smoke, namespace: catalog-smoke}
      spec:
        refreshInterval: 1m
        secretStoreRef: {kind: SecretStore, name: smoke}
        target: {name: smoke}
        data:
          - secretKey: value
            remoteRef: {key: smoke}
    wait:
      - "-n catalog-smoke secretstore/smoke --for=condition=Ready"
      - "-n catalog-smoke externalsecret/smoke --for=condition=Ready"
      - "-n catalog-smoke secret/smoke --for=jsonpath={.data.value}=c3luY2Vk"
