# Upgrades k3s or RKE2 and node packages one node at a time from declarative
# Plans, with cordon, drain and concurrency limits. The catalog installs it from
# upstream manifests because the Rancher chart lags behind releases.
apiVersion: catalog.zeabur.com/v1
kind: Component
metadata:
  name: System Upgrade Controller
  summary: Upgrades Kubernetes on the nodes, one node at a time.
  locales:
    zh-TW:
      summary: "逐一升級各節點上的 Kubernetes。"
    zh-CN:
      summary: "逐个升级各节点上的 Kubernetes。"
  license: Apache-2.0
  homepage: https://github.com/rancher/system-upgrade-controller
# Off by default: zeabur-installer upgrades k3s and RKE2 itself, and its apply puts back the
# version it pins on a node that a Plan upgraded. Install it for Plans that do not change the
# Kubernetes version, such as OS package upgrades.
provides: {capability: node-updates}
defaults:
  single-node: optional
  multi-node: optional
kubeVersion: ">=1.34.0-0"
# Its Plans replace the k3s or RKE2 binary (rancher/k3s-upgrade, rancher/rke2-upgrade), and its
# manifest needs a control-plane node label that other distributions (KubeSolo) do not set.
distributions: [k3s, rke2]

releases:
  - name: crds
    type: manifest
    namespace: system-upgrade
    urls:
      - https://github.com/rancher/system-upgrade-controller/releases/download/{version}/crd.yaml
    version: v0.20.2
    urlDigests:
      - sha256:1fb061e0d8bf9534da0145e614a9e03ca376cd5d1adcca17d13cfa12e211c48c
  - name: controller
    type: manifest
    namespace: system-upgrade
    urls:
      - https://github.com/rancher/system-upgrade-controller/releases/download/{version}/system-upgrade-controller.yaml
    version: v0.20.2
    urlDigests:
      - sha256:fd474b662d1f2b74ab150d95b6482869e1fd1f27ceee54b13e94b92292097969

detection:
  crds: [plans.upgrade.cattle.io]
  helmCharts: [system-upgrade-controller]
  workloads:
    - kind: Deployment
      labels: {upgrade.cattle.io/controller: system-upgrade-controller}

security:
  summary: Cordons and drains nodes, and creates privileged Jobs that run Plan images on the host.
  podSecurity: privileged
