apiVersion: catalog.zeabur.com/v1
kind: Component
metadata:
  name: zot
  description: >
    An OCI registry inside the cluster for the images Zeabur Builder builds, so
    builds need no external registry account. Optional: it serves only images
    pushed to it. Nodes pull from it at the fixed address of the cluster-ip
    input, and must trust its CA.
  license: Apache-2.0
  homepage: https://zotregistry.dev
maturity: cncf-sandbox
defaults:
  single-node: optional
  multi-node: optional
persistsData: true
requires: [certificates]

inputs:
  # A node's container runtime cannot resolve zot.zot.svc. With a fixed
  # ClusterIP, a registry mirror on each node (k3s and RKE2 registries.yaml)
  # sends zot.zot.svc:5000 there, and the certificate names that address.
  - name: cluster-ip
    description: >
      A free address in the cluster's Service CIDR for the registry's Service,
      such as 10.43.0.50 on k3s and RKE2. Nodes pull through a registry mirror
      to it. Left out: an address is assigned and only pods reach the registry.
    release: zot
    path: service.clusterIP
  # Builder pushes and reads source archives with the account of each build
  # namespace. Without an account, nobody reads a source repository.
  - name: htpasswd
    description: >
      The registry's accounts as an htpasswd file with bcrypt hashes, one line
      per build namespace, named after it. An empty file is valid: then no one
      reads source archives.
    secret: {name: zot-htpasswd, key: htpasswd, namespace: zot}
    required: true
    testValue: "ci:$2y$05$s4ySHqIe7D/T1cjpIzr91OyAkbXYw.lO9/zWLsnzvJjeu26wBQR.W"
  - name: access-control
    description: >
      Replaces the registry's accessControl. Keep the "**" and "**/source"
      rules, and add one rule per build namespace, such as "team-a/**/source"
      with policies [{users: [team-a], actions: [read, create, update,
      delete]}]. Left out: the two rules alone, so source archives stay
      closed.
    path: config.http.accessControl

releases:
  # Before the chart: the CA that signs zot-tls.
  - name: tls
    namespace: zot
    manifests: |
      # Signs the CA below; nothing else uses it.
      apiVersion: cert-manager.io/v1
      kind: Issuer
      metadata:
        name: zot-selfsigned
        namespace: zot
      spec:
        selfSigned: {}
      ---
      # A CA of its own: no public CA signs *.svc names. Nodes and buildkitd
      # trust ca.crt from the zot-tls Secret; to use a CA you already
      # distribute, point zot-tls at your own issuer instead. Ten years,
      # because every node holds a copy and rotating it means redistributing.
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: zot-ca
        namespace: zot
      spec:
        isCA: true
        commonName: zot-ca
        secretName: zot-ca
        duration: 87600h
        privateKey:
          algorithm: ECDSA
          size: 256
        issuerRef:
          kind: Issuer
          name: zot-selfsigned
      ---
      apiVersion: cert-manager.io/v1
      kind: Issuer
      metadata:
        name: zot-ca
        namespace: zot
      spec:
        ca:
          secretName: zot-ca

  - name: zot
    namespace: zot
    repo: https://zotregistry.dev/helm-charts
    chart: zot
    version: 0.1.128
    values: |
      service:
        # The registry is unauthenticated: never on node ports (the chart's
        # default is NodePort).
        type: ClusterIP
        port: 5000
        # Set by the cluster-ip input; the certificate below names it.
        clusterIP: ""
      httpGet:
        # The probes must speak TLS once zot does.
        scheme: HTTPS
      # StatefulSet with a volumeClaimTemplate; images survive restarts.
      persistence: true
      extraObjects:
        # The serving certificate; the pod starts once its Secret exists.
        # localhost and 127.0.0.1 let a node pull through a loopback
        # port-forward; the last address is the fixed ClusterIP, or ::1 when
        # there is none. zot reloads the certificate when cert-manager renews
        # it.
        - apiVersion: cert-manager.io/v1
          kind: Certificate
          metadata:
            name: zot-tls
            namespace: zot
          spec:
            secretName: zot-tls
            dnsNames:
              - zot.zot.svc
              - zot.zot.svc.cluster.local
              - localhost
            ipAddresses:
              - 127.0.0.1
              - '{{ .Values.service.clusterIP | default "::1" }}'
            privateKey:
              algorithm: ECDSA
              size: 256
            issuerRef:
              kind: Issuer
              name: zot-ca
      # The chart stores config in a Secret named zot-config and mounts it at
      # /etc/zot. configFiles stays empty: the chart refuses both.
      configFiles:
        config.json: null
      # The chart mounts config from its own Secret; no ConfigMap.
      mountConfig: false
      # The accounts for accessControl, from the htpasswd input.
      externalSecrets:
        - secretName: zot-tls
          mountPath: /tls
        - secretName: zot-htpasswd
          mountPath: /auth
      config:
        # Referrers and artifactType, which source archives use.
        distSpecVersion: 1.1.1
        # No search or UI extensions: they keep an index in memory. No
        # read/write timeouts: the chart's 60s cuts off large layer pushes.
        storage:
          rootDirectory: /var/lib/registry
          dedupe: true
          gc: true
          gcDelay: 2h
          gcInterval: 1h
          # Every untagged manifest goes after the delay; per repository, the
          # 20 most recently pushed tags stay. Builder pushes one tag per
          # commit and re-pushes buildcache each build, so the cache always
          # stays and 20 commits remain to roll back to.
          retention:
            delay: 2h
            policies:
              - repositories: ["**"]
                deleteReferrers: true
                deleteUntagged: true
                keepTags:
                  - mostRecentlyPushedCount: 20
        http:
          # All interfaces, so the Service reaches the pod.
          address: 0.0.0.0
          # The Service port.
          port: "5000"
          # The certificate and key from the zot-tls Secret.
          tls:
            cert: /tls/tls.crt
            key: /tls/tls.key
          # Accounts from the zot-htpasswd Secret.
          auth:
            htpasswd:
              path: /auth/htpasswd
          # zot applies the rule with the longest pattern, not the union of
          # matches. Images: everyone reads and writes, as before. Source
          # archives (<namespace>/<build>/source): nobody, unless a rule
          # <namespace>/**/source names the account of that namespace. Such a
          # pattern is always longer than **/source. Never add <namespace>/**
          # rules: one of them can be as long as **/source.
          accessControl:
            repositories:
              "**":
                defaultPolicy: [read, create, update, delete]
                anonymousPolicy: [read, create, update, delete]
              "**/source":
                policies: []
        # Requests and errors only.
        log:
          level: info
    profiles:
      single-node: |
        pvc:
          # About 20 builds of a few apps; resize the claim as they grow.
          storage: 20Gi
        resources:
          # Idles small without extensions; pushes stream to disk.
          requests: {cpu: 20m, memory: 64Mi}
          limits: {memory: 512Mi}
      multi-node: |
        # Still one replica: filesystem storage has a single writer, and the
        # ReadWriteOnce volume binds it to one node anyway.
        replicaCount: 1
        pvc:
          # More apps building into one registry.
          storage: 50Gi
        resources:
          # More concurrent pushes and pulls.
          requests: {cpu: 50m, memory: 128Mi}
          limits: {memory: 1Gi}

detection:
  helmCharts: [zot]
  workloads:
    - kind: StatefulSet
      labels: {app.kubernetes.io/name: zot}
    - kind: Deployment
      labels: {app.kubernetes.io/name: zot}

security:
  summary: >
    No RBAC: a ServiceAccount without roles. Serves the OCI registry API over
    TLS on port 5000 inside the cluster.
  risks:
    - risk: Any pod in the cluster can push, overwrite and pull any image anonymously.
      mitigation: >
        Narrow the "**" rule of accessControl to one repository path per
        namespace, and give Builder the push credential and nodes a pull
        credential. A NetworkPolicy can limit pushes to Builder's namespace.
    - risk: Source archives (repositories ending in /source) hold uploaded code. Only the account of the namespace in the path reads them.
      mitigation: >
        Add an htpasswd line and a "<namespace>/**/source" rule for each build
        namespace (the htpasswd and access-control inputs). Without the rule,
        that namespace's account cannot read its own archives.
    - risk: Nodes refuse to pull until they trust its CA, and a node told to skip verification trusts anything at that address.
      mitigation: >
        Set the cluster-ip input, and on every node mirror zot.zot.svc:5000 to
        https://<cluster-ip>:5000 with ca.crt from the zot-tls Secret as the
        mirror's CA: k3s or RKE2 registries.yaml (configs.<cluster-ip>:5000.tls.ca_file),
        or /etc/containerd/certs.d/zot.zot.svc:5000/hosts.toml. zeabur-installer
        does both. Give buildkitd the same CA; never set insecure_skip_verify.

smoke:
  - name: ready
    wait:
      - "-n zot certificate/zot-tls --for=condition=Ready"
      - "-n zot statefulset/zot --for=jsonpath={.status.readyReplicas}=1"
  # In zot's namespace: the CA it checks against is the zot-tls Secret there.
  - name: tls-v2
    manifest: |
      apiVersion: batch/v1
      kind: Job
      metadata: {name: smoke, namespace: zot}
      spec:
        backoffLimit: 6
        template:
          spec:
            restartPolicy: Never
            containers:
              - name: curl
                image: curlimages/curl:8.23.0
                args: [-sSf, --cacert, /tls/ca.crt, "https://zot.zot.svc:5000/v2/"]
                volumeMounts: [{name: tls, mountPath: /tls}]
            volumes: [{name: tls, secret: {secretName: zot-tls}}]
    wait: ["-n zot job/smoke --for=condition=Complete"]

# The volumeClaimTemplate's claims outlive the StatefulSet, with every image.
leftovers: [persistentvolumeclaims]
