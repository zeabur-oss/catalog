apiVersion: catalog.zeabur.com/v1
kind: Component
metadata:
  name: K8up
  description: >
    Backs up each namespace with restic to any S3-compatible store, so tenants
    can safely manage their own backups.
  summary: Backs up each project's volumes to S3-compatible storage; database backups don't need it.
  locales:
    zh-TW:
      summary: "備份各專案的磁碟區，存到相容 S3 的儲存空間，資料庫備份不需要它。"
    zh-CN:
      summary: "把各项目的卷备份到兼容 S3 的存储，数据库备份不需要它。"
  license: Apache-2.0
  homepage: https://k8up.io
defaults:
  single-node: optional
  multi-node: optional

releases:
  - name: k8up
    namespace: k8up-system
    repo: https://k8up-io.github.io/k8up
    chart: k8up
    version: 4.10.1
    chartDigest: sha256:6d8a2e69ea3b75e25de80b4d173b2858e337586edf603c485567c5bf1ec8697a
    values: |
      # Pinned by digest; a tag alone can move. The chart joins registry and
      # repository. registry comes second, so Renovate reads both.
      image:
        repository: k8up-io/k8up
        registry: ghcr.io
        tag: v2.16.1@sha256:f59bfa37c51511d5ad67e53816fb55c62d0e6411890e59bb6b965923129f30b5
      k8up:
        # Back up only PVCs annotated for backup.
        skipWithoutAnnotation: true
    profiles:
      single-node: |
        k8up:
          # No leader election with a single replica.
          enableLeaderElection: false
        resources:
          # Idle between schedules; backup Jobs have their own requests.
          requests: {cpu: 10m, memory: 32Mi}
          limits: {memory: 256Mi}
      multi-node: |
        # Keeps schedules firing through node drains.
        replicaCount: 2
        resources:
          # More schedules on bigger clusters.
          requests: {cpu: 20m, memory: 64Mi}
          limits: {memory: 512Mi}

detection:
  crds: [schedules.k8up.io, backups.k8up.io]
  helmCharts: [k8up]
  workloads:
    - kind: Deployment
      labels: {app.kubernetes.io/name: k8up}

security:
  summary: Watches K8up objects cluster-wide; backup Jobs mount PVCs in their own namespace.
  podSecurity: baseline

# The chart's crds/ directory: Helm never deletes it.
leftovers: [customresourcedefinitions]
