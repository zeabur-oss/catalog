apiVersion: catalog.zeabur.com/v1
kind: Component
metadata:
  name: Kubernetes Metrics Server
  description: >
    Serves metrics.k8s.io for HPA and `kubectl top`. It keeps no history, so it
    is the cheapest source of live CPU and memory.
  summary: Shows the CPU and memory each pod uses right now.
  locales:
    zh-TW:
      summary: "顯示每個 Pod 目前用了多少 CPU 與記憶體。"
    zh-CN:
      summary: "显示每个 Pod 当前用了多少 CPU 和内存。"
  license: Apache-2.0
  homepage: https://github.com/kubernetes-sigs/metrics-server
maturity: kubernetes-sig
alternatives:
  victoria-metrics: Adds history and alerts at a few hundred MiB.
defaults:
  single-node: recommended
  multi-node: recommended

releases:
  - name: metrics-server
    namespace: kube-system
    repo: https://kubernetes-sigs.github.io/metrics-server
    chart: metrics-server
    version: 3.14.0
    chartDigest: sha256:c2ca1185c01e6e7f53dd1b7d131f0c9b3fa50e003ed068b784563a1b5a3422a1
    values: |
      # Pinned by digest; a tag alone can move.
      image:
        repository: registry.k8s.io/metrics-server/metrics-server
        tag: v0.9.0@sha256:d9862115e7c7881280d3d75ca26bda8ffc0fc213315979575bf23ce9826205c0
      args:
        # 15s is fresh enough for live views; the default is 60s.
        - --metric-resolution=15s
    profiles:
      single-node: |
        resources:
          # The chart's 200Mi request is sized for 100+ nodes.
          requests: {cpu: 20m, memory: 48Mi}
          limits: {memory: 128Mi}
      multi-node: |
        # HPA stops while metrics.k8s.io is down; two replicas.
        replicas: 2
        podDisruptionBudget:
          # Keep one replica during node drains.
          enabled: true
          minAvailable: 1
        resources:
          # Covers clusters of a few dozen nodes.
          requests: {cpu: 50m, memory: 96Mi}
          limits: {memory: 256Mi}

detection:
  apiServices: [v1beta1.metrics.k8s.io]
  helmCharts: [metrics-server]
  k3sAddons: [metrics-server]
  workloads:
    - kind: Deployment
      labels: {app.kubernetes.io/name: metrics-server}
    - kind: Deployment
      labels: {k8s-app: metrics-server}

security:
  summary: Reads kubelet metrics; registers an aggregated API.
  clusterWide: true
