# Blocks brute-force attempts and scanners that show up in Traefik's access
# logs, for every app behind the ingress. It fails open, and the online API is
# off by default.
apiVersion: catalog.zeabur.com/v1
kind: Component
metadata:
  name: CrowdSec
  summary: Blocks brute-force attempts and scanners before they reach your services.
  locales:
    zh-TW:
      summary: "在暴力破解和掃描碰到服務之前就擋下來。"
    zh-CN:
      summary: "在暴力破解和扫描碰到服务之前就拦下来。"
  license: MIT
  homepage: https://www.crowdsec.net
defaults:
  single-node: optional
  multi-node: optional
distributions: [k3s, rke2, kubesolo]
kubeVersion: ">=1.34.0-0"
persistsData: true
requires: [{component: ingress/traefik}]

inputs:
  - name: bouncerKey
    description: The Traefik bouncer uses this key to call the CrowdSec local API.
    secret: {name: crowdsec-bouncer-key, key: key, namespace: crowdsec}
    generate: {type: random, bytes: 64, encoding: hex}
  - name: lapiSecret
    description: The local API (LAPI) signs agent sessions with this shared secret.
    secret: {name: crowdsec-lapi, key: csLapiSecret, namespace: crowdsec}
    generate: {type: random, bytes: 64, encoding: hex}
  - name: registrationToken
    description: Agents register with the local API using this token.
    secret: {name: crowdsec-lapi, key: registrationToken, namespace: crowdsec}
    generate: {type: random, bytes: 64, encoding: hex}

releases:
  - name: crowdsec
    type: helm
    namespace: crowdsec
    chart: oci://ghcr.io/crowdsecurity/helm-charts/crowdsec
    version: 0.24.2
    chartDigest: sha256:9078b83a6ba27a9a258cbdb4d8aefba6992a833041ba07317133fd61c5e6b446
    values: |
      # Pinned by digest; a tag alone can move.
      image:
        repository: crowdsecurity/crowdsec
        tag: v1.8.1@sha256:0f2523fa61ef507f15d953045cface490cc880670c62f2755ced17524107f71a
      # The runtime on k3s and mainstream distributions.
      container_runtime: containerd
      secrets:
        externalSecret:
          # Inputs, not chart-generated, so every render is identical.
          name: crowdsec-lapi
      agent:
        acquisition:
          # Traefik's JSON access log.
          - namespace: traefik
            podName: traefik-*
            program: traefik
        env:
          # Parsers and scenarios for Traefik plus generic HTTP attacks.
          - name: COLLECTIONS
            value: crowdsecurity/traefik
      lapi:
        env:
          # No data leaves the cluster unless the user opts in.
          - name: DISABLE_ONLINE_API
            value: "true"
          # Registers the Traefik bouncer (input bouncerKey).
          - name: BOUNCER_KEY_traefik
            valueFrom:
              secretKeyRef: {name: crowdsec-bouncer-key, key: key}
        persistentVolume:
          data:
            # SQLite decisions and bouncer registrations.
            enabled: true
          config:
            # Keeps machine credentials stable across restarts.
            enabled: true
    profiles:
      single-node: |
        agent:
          resources:
            # Chart asks 250Mi; an idle agent uses under 100Mi.
            requests: {cpu: 20m, memory: 48Mi}
            limits: {memory: 192Mi}
        lapi:
          resources:
            # Chart asks 500Mi; LAPI on SQLite idles far below.
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 256Mi}
      multi-node: |
        agent:
          resources:
            # One agent per node; busier logs than single-node.
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
        lapi:
          resources:
            # Headroom for more agents and decisions.
            requests: {cpu: 50m, memory: 96Mi}
            limits: {memory: 384Mi}

  # When a node restarts, its agent Pod keeps its name, and the chart's init
  # container registers that name again. The LAPI refuses it because the
  # machine exists (crowdsecurity/helm-charts#252). This Deployment evicts
  # such a Pod. Its replacement has a new name and registers.
  - name: agent-recovery
    type: inline
    namespace: crowdsec
    manifests: |
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: agent-recovery
        namespace: crowdsec
      ---
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: agent-recovery
        namespace: crowdsec
      rules:
        - apiGroups: [""]
          resources: [pods]
          verbs: [get, list]
        - apiGroups: [""]
          resources: [pods/log]
          verbs: [get]
        - apiGroups: [""]
          resources: [pods/eviction]
          verbs: [create]
      ---
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: agent-recovery
        namespace: crowdsec
      roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: agent-recovery}
      subjects: [{kind: ServiceAccount, name: agent-recovery, namespace: crowdsec}]
      ---
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: agent-recovery
        namespace: crowdsec
        labels: {app.kubernetes.io/name: agent-recovery}
      spec:
        replicas: 1
        selector:
          matchLabels: {app.kubernetes.io/name: agent-recovery}
        template:
          metadata:
            labels: {app.kubernetes.io/name: agent-recovery}
          spec:
            serviceAccountName: agent-recovery
            # sh as PID 1 ignores SIGTERM, and the loop keeps no state.
            terminationGracePeriodSeconds: 5
            securityContext:
              runAsNonRoot: true
              runAsUser: 65534
              runAsGroup: 65534
              seccompProfile: {type: RuntimeDefault}
            containers:
              # The CrowdSec image has sh, wget and yq. wget talks to the API
              # through kubectl proxy, which checks the API server's certificate.
              - name: recover
                image: crowdsecurity/crowdsec:v1.8.1@sha256:0f2523fa61ef507f15d953045cface490cc880670c62f2755ced17524107f71a
                command:
                  - sh
                  - -c
                  - |
                    api=http://127.0.0.1:8001/api/v1/namespaces/crowdsec/pods
                    init=wait-for-lapi-and-register
                    while true; do
                      # Pods whose registering init container failed and waits to run again.
                      pods=$(wget -qO- "$api?labelSelector=k8s-app%3Dcrowdsec" | yq -p json -o yaml "
                        .items[]
                        | select(.metadata.deletionTimestamp == null)
                        | select((.status.initContainerStatuses // []) | any_c(.name == \"$init\" and .ready == false and .restartCount > 0))
                        | .metadata.name")
                      for pod in $pods; do
                        # Only the LAPI's refusal of this Pod's own name, in the last run or the one before.
                        for previous in false true; do
                          if wget -qO- "$api/$pod/log?container=$init&previous=$previous&tailLines=20" | grep -qF "user '$pod': user already exist"; then
                            echo "evicting $pod: the LAPI already has a machine with its name"
                            wget -qO /dev/null --header "Content-Type: application/json" \
                              --post-data "{\"apiVersion\":\"policy/v1\",\"kind\":\"Eviction\",\"metadata\":{\"name\":\"$pod\"}}" \
                              "$api/$pod/eviction" || echo "eviction of $pod failed"
                            break
                          fi
                        done
                      done
                      sleep 30
                    done
                resources:
                  requests: {cpu: 1m, memory: 4Mi}
                  limits: {memory: 32Mi}
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities: {drop: [ALL]}
              - name: proxy
                image: registry.k8s.io/kubectl:v1.36.6@sha256:0650805141538d13ccbb6bb9e0dd647bc415bc002898357970211c4d47224396
                args:
                  - proxy
                  - --address=127.0.0.1
                  - --port=8001
                  - --accept-paths=^/api/v1/namespaces/crowdsec/pods
                resources:
                  requests: {cpu: 1m, memory: 16Mi}
                  limits: {memory: 64Mi}
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities: {drop: [ALL]}

  - name: bouncer-middleware
    type: inline
    namespace: crowdsec
    manifests: |
      # Referenced from Traefik's entrypoints as crowdsec-bouncer@kubernetescrd.
      apiVersion: traefik.io/v1alpha1
      kind: Middleware
      metadata:
        name: bouncer
        namespace: crowdsec
      spec:
        plugin:
          crowdsec-bouncer:
            enabled: true
            # Local copy of decisions; requests never wait on LAPI.
            crowdsecMode: stream
            crowdsecLapiScheme: http
            crowdsecLapiHost: crowdsec-service.crowdsec.svc.cluster.local:8080
            # Read from the Secret in the Middleware's namespace.
            crowdsecLapiKey: urn:k8s:secret:crowdsec-bouncer-key:key
            # Fail open: if LAPI is unreachable, keep serving traffic.
            updateMaxFailure: -1

contributes:
  - target: {component: ingress/traefik, release: traefik}
    values: |
      experimental:
        plugins:
          # Downloaded from plugins.traefik.io at start.
          crowdsec-bouncer:
            moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
            version: v1.8.1
      ports:
        web:
          http:
            # Every request passes the bouncer; no app opts in.
            middlewares: [crowdsec-bouncer@kubernetescrd]
        websecure:
          http:
            # Same as web.
            middlewares: [crowdsec-bouncer@kubernetescrd]
      accessLog:
        fields:
          names:
            # CrowdSec's scenarios key on the client address.
            ClientHost: keep
          headers:
            names:
              # Bot scenarios match on the user agent.
              User-Agent: keep

detection:
  helmCharts: [crowdsec]
  workloads:
    - kind: Deployment
      labels: {k8s-app: crowdsec, type: lapi}

security:
  summary: >
    The agent reads node log files read-only. agent-recovery reads Pods and
    their logs in crowdsec, and evicts an agent Pod the LAPI refuses.
  podSecurity: privileged

leftovers: [persistentvolumeclaims]

smoke:
  # Kills the sandbox of an agent Pod, as a node restart does: the Pod keeps
  # its name and its emptyDir, and its init containers run again. The Job
  # completes when an agent runs in a new sandbox on the node.
  - name: agent-restarts
    manifest: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: catalog-smoke
        labels: {pod-security.kubernetes.io/enforce: privileged}
      ---
      apiVersion: batch/v1
      kind: Job
      metadata: {name: agent-restart, namespace: catalog-smoke}
      spec:
        backoffLimit: 0
        activeDeadlineSeconds: 420
        template:
          spec:
            restartPolicy: Never
            hostPID: true
            containers:
              - name: restart
                image: crowdsecurity/crowdsec:v1.8.1@sha256:0f2523fa61ef507f15d953045cface490cc880670c62f2755ced17524107f71a
                securityContext: {privileged: true, runAsUser: 0}
                command:
                  - sh
                  - -c
                  - |
                    # The agent's crowdsec process; the LAPI's has no DISABLE_LOCAL_API.
                    agent() {
                      for p in /proc/[0-9]*; do
                        [ "$(cat $p/comm 2>/dev/null)" = crowdsec ] || continue
                        if tr '\0' '\n' < $p/environ 2>/dev/null | grep -qx DISABLE_LOCAL_API=true; then
                          echo ${p#/proc/}
                          return
                        fi
                      done
                    }
                    until old=$(agent) && [ -n "$old" ]; do sleep 5; done
                    net=$(readlink /proc/$old/ns/net)
                    for p in /proc/[0-9]*; do
                      if [ "$(cat $p/comm 2>/dev/null)" = pause ] && [ "$(readlink $p/ns/net)" = "$net" ]; then
                        echo "killing the sandbox of pid $old"
                        kill -KILL ${p#/proc/}
                      fi
                    done
                    until new=$(agent) && [ -n "$new" ] && [ "$(readlink /proc/$new/ns/net)" != "$net" ]; do sleep 5; done
                    echo "agent runs again as pid $new"
    wait:
      - -n catalog-smoke job/agent-restart --for=condition=Complete
      - -n crowdsec pod -l k8s-app=crowdsec,type=agent --for=condition=Ready
    timeout: 480s
