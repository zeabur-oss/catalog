apiVersion: catalog.zeabur.com/v1
kind: Template
metadata:
  name: n8n PostgreSQL
  version: "2.44.6"
  description: >-
    n8n 2.44.6 with external JavaScript/Python task runner and operator-managed
    PostgreSQL17. Licensed under the n8n Sustainable Use License
    (https://docs.n8n.io/sustainable-use-license/): internal business, personal
    or noncommercial use only.
  license: LicenseRef-n8n-sustainable-use AND PostgreSQL AND Apache-2.0
  # Also: https://docs.n8n.io/hosting/, https://docs.n8n.io/sustainable-use-license/
  homepage: https://github.com/n8n-io/n8n
  icon: https://img.5xcamp.us/i/2732381b-be89-478f-9f82-7d63beed4d81.png
  categories: [automation]

requires:
  - ingress/traefik
  - certificates/cert-manager
  - databases/cloudnative-pg

services:
  - name: n8n
    securityProfile: restricted
    ports: [{name: http, port: 5678}, {name: broker, port: 5679}]
    resources: {requests: {cpu: 200m, memory: 512Mi}, limits: {cpu: 2000m, memory: 2Gi}}
    domains: ['{{ .Domain }}']
  - name: task-runner
    securityProfile: restricted
    ports: [{name: database, port: 5680}]
    resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 1000m, memory: 1Gi}}
  - name: n8n-db
    securityProfile: restricted
    ports: [{name: postgresql, port: 5432}]
    resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 1000m, memory: 1Gi}}

inputs:
  - name: ownerEmail
    label: Owner email
    locales:
      zh-TW:
        label: 擁有者 Email
        description: "n8n 擁有者帳號的 Email，第一次有人連進來之前就會建立好。"
      zh-CN:
        label: 所有者邮箱
        description: "n8n 所有者账号的邮箱，第一次有人访问之前就会创建好。"
    description: Owner email; account is provisioned before first public request.
    required: true
    validation: {pattern: '^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$'}
  - name: ownerPassword
    description: Deploy-time random secret; preserve it across upgrades.
    generate: random
    secret: {name: n8n-secrets, key: owner-password}
    validation: {pattern: '^[A-Za-z0-9_-]{43}$'}
  - name: encryptionKey
    description: Deploy-time random secret; preserve it across upgrades.
    generate: random
    secret: {name: n8n-secrets, key: encryption-key}
    validation: {pattern: '^[A-Za-z0-9_-]{43}$'}
  - name: runnerToken
    description: Deploy-time random secret; preserve it across upgrades.
    generate: random
    secret: {name: n8n-secrets, key: runner-token}
    validation: {pattern: '^[A-Za-z0-9_-]{43}$'}

security:
  summary: >-
    Everything runs in its own namespace. Images are pinned by digest and
    workloads run as non-root users. Network access is kept to the minimum.
    There are no default passwords.
  locales:
    zh-TW:
      summary: "所有東西都在自己的命名空間裡執行。映像檔以 digest 固定版本，工作負載都用非 root 使用者執行，網路存取壓到最低，也沒有預設密碼。"
    zh-CN:
      summary: "所有东西都在自己的命名空间里运行。镜像以 digest 固定版本，工作负载都用非 root 用户运行，网络访问压到最低，也没有默认密码。"
  risks:
    - risk: >-
        n8n uses the Sustainable Use License. You can read the source, but it
        is not OSI-approved open source. Enterprise files have separate terms.
      mitigation: >-
        The template description names the license. Deploy only for permitted
        internal business, personal or noncommercial use. To resell hosted
        n8n, you need a separate agreement with n8n.
      locales:
        zh-TW:
          risk: "n8n 用的是 Sustainable Use License。原始碼看得到，但不算 OSI 認可的開源授權。企業版檔案另有條款。"
          mitigation: "範本說明裡有寫明授權。只能用在允許的範圍：公司內部業務、個人或非商業用途。想把 n8n 當託管服務轉賣，要另外跟 n8n 簽約。"
        zh-CN:
          risk: "n8n 用的是 Sustainable Use License。源码看得到，但不算 OSI 认可的开源许可。企业版文件另有条款。"
          mitigation: "模板说明里有写明许可。只能用在允许的范围：公司内部业务、个人或非商业用途。想把 n8n 当托管服务转售，要另外跟 n8n 签约。"
    - risk: >-
        Workflow authors can call outside providers, install code or build
        powerful integrations.
      mitigation: >-
        Only let trusted people be administrators. The task runner (the part
        that runs workflow code) is isolated, has no Kubernetes token and has a
        read-only filesystem. It cannot read environment variables. The
        dangerous executeCommand and localFileTrigger nodes are removed.
        Outbound traffic is not limited, so add an egress NetworkPolicy (a
        rule that limits outbound traffic) to keep workflows away from private
        addresses. Community package tools are enabled, so administrators must
        check each package they install.
      locales:
        zh-TW:
          risk: "工作流程的作者可以呼叫外部服務、安裝程式碼，或做出權限很大的整合。"
          mitigation: "管理員只給信任的人。任務執行器（跑工作流程程式碼的部分）是隔離的，沒有 Kubernetes 權杖，檔案系統唯讀，也讀不到環境變數。危險的 executeCommand 和 localFileTrigger 節點已經移除。對外連線沒有限制，所以請加一條 egress NetworkPolicy（限制對外連線的規則），讓工作流程連不到私有位址。社群套件工具是開啟的，管理員要自己檢查每個安裝的套件。"
        zh-CN:
          risk: "工作流的作者可以调用外部服务、安装代码，或做出权限很大的集成。"
          mitigation: "管理员只给信任的人。任务执行器（运行工作流代码的部分）是隔离的，没有 Kubernetes 令牌，文件系统只读，也读不到环境变量。危险的 executeCommand 和 localFileTrigger 节点已经移除。对外连接没有限制，所以请加一条 egress NetworkPolicy（限制对外连接的规则），让工作流连不到私有地址。社区包工具是开启的，管理员要自己检查每个安装的包。"
    - risk: >-
        On a public instance that is not set up yet, the first visitor could
        claim the owner account.
      mitigation: >-
        The template uses the managed-owner variables (n8n v2.17 and later). A
        bcrypt hash (a one-way scrambled form) of the generated Secret is set
        before n8n starts. The deployment variables set the owner email and
        password again at each restart. Public sign-up stays closed.
      locales:
        zh-TW:
          risk: "公開的實例如果還沒設定好，第一個來的訪客就能搶走擁有者帳號。"
          mitigation: "範本用的是 n8n v2.17 以後支援的託管擁有者變數。n8n 啟動前，就先把自動產生的機密做成 bcrypt 雜湊（單向打亂的形式）設好。每次重啟，部署變數都會再設定一次擁有者的 Email 和密碼。公開註冊維持關閉。"
        zh-CN:
          risk: "公开的实例如果还没设置好，第一个来的访客就能抢走所有者账号。"
          mitigation: "模板用的是 n8n v2.17 以后支持的托管所有者变量。n8n 启动前，就先把自动生成的机密做成 bcrypt 哈希（单向打乱的形式）设好。每次重启，部署变量都会再设置一次所有者的邮箱和密码。公开注册保持关闭。"
    - risk: >-
        The database pods (CloudNativePG) must call the Kubernetes API with an
        identity that the database operator creates.
      mitigation: >-
        The databases/cloudnative-pg component creates separate permissions
        for each database cluster. This exception never applies to the n8n and
        task-runner Pods.
      locales:
        zh-TW:
          risk: "資料庫 Pod（CloudNativePG）必須用資料庫 operator 建立的身分去呼叫 Kubernetes API。"
          mitigation: "databases/cloudnative-pg 元件會為每個資料庫叢集各建一組權限。這個例外絕不會套用到 n8n 和任務執行器的 Pod。"
        zh-CN:
          risk: "数据库 Pod（CloudNativePG）必须用数据库 operator 创建的身份去调用 Kubernetes API。"
          mitigation: "databases/cloudnative-pg 组件会为每个数据库集群各建一组权限。这个例外绝不会用在 n8n 和任务执行器的 Pod 上。"
    - risk: No SMTP server is configured.
      mitigation: >-
        Email invitations and password-reset mail do not work until you
        configure SMTP in n8n.
      locales:
        zh-TW:
          risk: "沒有設定 SMTP 伺服器。"
          mitigation: "你在 n8n 裡設定好 SMTP 之前，邀請信和重設密碼信都寄不出去。"
        zh-CN:
          risk: "没有设置 SMTP 服务器。"
          mitigation: "你在 n8n 里设置好 SMTP 之前，邀请邮件和重置密码邮件都发不出去。"

scalability:
  summary: Single-writer deployment; no automatic horizontal scaling.
  replicas: 1
  maxReplicas: 1
  blockers:
    - A node-local default StorageClass has no HA or snapshots.
    - >-
      Filesystem binary-data storage has a single writer; execution
      queue mode and shared binary store are not configured.
    - >-
      One PostgreSQL primary and one n8n main; scaling requires queue mode,
      Redis and shared binary storage.

upgradeNotes:
  - >-
    Breaking change: the template no longer ships its default-deny and per-pod
    NetworkPolicies, because the installer isolates project namespaces. Applying
    this version does not delete the old ones. Delete them with `kubectl delete
    networkpolicy n8n-default-deny n8n n8n-db`.
  - >-
    Breaking change: the licenseOptIn input is removed. The license is named in
    the template description. Remove licenseOptIn from saved values.
  - >-
    New installs start without database backups. Installs made before this
    version keep their backups. To turn backups on, open the database in Zeabur
    and use the Backups tab.
  - >-
    Preserve Secrets and PVCs. Back up data off-node and rehearse a restore
    before changing image digests.
  - >-
    Main n8n and runner must remain exactly 2.44.6 together; never upgrade one
    side independently. Preserve encryption key, runner token, database, binary
    files and owner password across upgrades.
  - >-
    Image rollback does not undo n8n database migrations; restore the backup
    taken before the upgrade.
  - >-
    Data lives in /home/node/.n8n. The runner token is a random Secret.
    Settings-file permissions are enforced, node environment reads are blocked,
    and the executeCommand and localFileTrigger nodes are disabled.
  - >-
    GENERIC_TIMEZONE is Asia/Taipei. Change it in the manifest if schedule
    triggers must use another timezone.
  - >-
    Owner email/password is controlled by deployment variables. Rotate
    n8n-secrets/owner-password and restart to change password; recover
    encryption-key from secure backups, never regenerate it for an existing
    database.

smoke:
  - name: workload-ready
    resource: deployment/n8n
    condition: condition=Available
    timeout: 900s
  - name: runner-ready
    resource: deployment/task-runner
    condition: condition=Available
    timeout: 900s
  - name: postgresql-ready
    resource: cluster/n8n-db
    condition: condition=Ready
    timeout: 900s