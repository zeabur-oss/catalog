apiVersion: catalog.zeabur.com/v1
kind: Template
metadata:
  name: SillyTavern
  description: >-
    The ultimate sandbox for AI storytelling and roleplaying, SillyTavern is a
    powerful, free, and open-source user interface for chatting with AI
    characters.
  license: AGPL-3.0-only
  # Also: https://docs.sillytavern.app/installation/docker/
  homepage: https://github.com/SillyTavern/SillyTavern
  icon: https://avatars.githubusercontent.com/u/134869877
  categories: [ai]

requires: [ingress/traefik, certificates/cert-manager]

services:
  - name: sillytavern
    securityProfile: restricted
    ports: [{name: http, port: 8000}]
    resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "2", memory: 2Gi}}
    domains: ['{{ .Domain }}']

inputs:
  - name: password
    description: >-
      Generated password; retrieve from Secret sillytavern-secrets, never from a
      public URL.
    generate: random
    secret: {name: sillytavern-secrets, key: password}
    validation: {pattern: '^[A-Za-z0-9_-]{43}$'}

security:
  summary: >-
    Non-root, read-only root filesystem, restricted PSS, no Kubernetes token,
    TLS ingress, default-deny with explicit Traefik, DNS and public HTTPS
    exceptions.
  egress:
    - Cluster DNS TCP/UDP 53 to kube-system CoreDNS.
    - >-
      Public IPv4 TCP 443 only; private, loopback, link-local, multicast and
      reserved ranges denied. IPv6 denied.
  risks:
    - risk: >-
        Character cards and external providers handle private conversations and
        may introduce untrusted content.
      mitigation: >-
        Use one trusted owner, keep CSRF and host validation enabled, deny
        private-address requests and network egress, keep server plugins
        disabled. A local or private LLM backend needs an added NetworkPolicy
        rule.
    - risk: AGPL obligations apply if running a modified network-accessible version.
      mitigation: >-
        This template runs the unmodified upstream image. Retain notices and
        offer corresponding source for any downstream program modifications;
        upstream source is linked.

scalability:
  summary: One instance per trusted owner; do not horizontally scale this deployment.
  replicas: 1
  maxReplicas: 1
  blockers:
    - >-
      Node-local persistent configuration, chats, backups and extensions cannot
      be safely shared by concurrent replicas.

upgradeNotes:
  - >-
    Login is HTTP Basic user zeabur and generated Secret
    sillytavern-secrets/password; TLS is mandatory.
  - >-
    Stop the Deployment, then back up all five PVCs, the generated Secret and
    browser-side data before upgrading the pinned image. In-app backups stay on
    the backups PVC and do not protect against node loss. Run an older image
    only with a data backup taken before the upgrade.
  - >-
    Security-sensitive config is reasserted on startup; server plugins and
    automatic extension code updates stay disabled. UI extensions and model
    providers remain configurable. Sessions expire after 24 hours. HTTP access
    logging is off. The host whitelist contains only the deployment domain.

smoke:
  - name: Application available
    resource: deployment/sillytavern
    condition: condition=Available
    timeout: 10m
