apiVersion: v1
kind: ConfigMap
metadata:
  name: sillytavern-bootstrap
  namespace: '{{ .Namespace }}'
  labels:
    app.kubernetes.io/name: sillytavern-bootstrap
data:
  bootstrap.cjs: 'const fs = require(''node:fs'');

    const YAML = require(''/home/node/app/node_modules/yaml'');

    const p = ''/home/node/app/config/config.yaml'';

    let config = YAML.parse(fs.readFileSync(fs.existsSync(p) ? p : ''/home/node/app/default/config.yaml'', ''utf8''));

    Object.assign(config, { listen: true, port: 8000, whitelistMode: false, enableForwardedWhitelist: false, whitelistDockerHosts:
    false, basicAuthMode: true, basicAuthUser: { username: ''zeabur'', password: process.env.ST_PASSWORD }, sessionTimeout:
    86400, disableCsrfProtection: false, securityOverride: false, allowKeysExposure: false });

    config.browserLaunch = { ...config.browserLaunch, enabled: false };

    config.hostWhitelist = { enabled: true, scan: true, hosts: [process.env.PUBLIC_DOMAIN] };

    config.privateAddressWhitelist = { enabled: true, allowUnresolvedHosts: false, allowedRanges: [], log: { blockedRequests:
    true, allowedRequests: false } };

    config.enableServerPlugins = false;

    config.enableServerPluginsAutoUpdate = false;

    config.extensions = { ...config.extensions, autoUpdate: false };

    config.logging = { ...config.logging, enableAccessLog: false };

    fs.writeFileSync(p, YAML.stringify(config), { mode: 0o600 });

    '
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sillytavern-config
  namespace: '{{ .Namespace }}'
  labels:
    app.kubernetes.io/name: sillytavern-config
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
