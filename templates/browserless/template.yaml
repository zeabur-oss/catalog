apiVersion: catalog.zeabur.com/v1
kind: Template
metadata:
  name: Browserless
  version: "latest"
  description: >-
    Authenticated headless Chromium service for trusted automation clients, with
    restricted container isolation.
  license: SSPL-1.0 OR LicenseRef-Browserless-Commercial
  # Also: https://docs.browserless.io/
  homepage: https://github.com/browserless/browserless
  icon: https://avatars.githubusercontent.com/u/51244358?s=500&v=4
  categories: [automation]

requires: [ingress/traefik, certificates/cert-manager]

services:
  - name: browserless
    securityProfile: restricted
    ports: [{name: web, port: 3000}]
    resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "2", memory: 2Gi}}
    domains: ['{{ .Domain }}']

inputs:
  - name: licenseOptIn
    label: License agreement
    locales:
      zh-TW:
        label: 授權同意
        description: "Browserless 採用 SSPL，不是 OSI 認可的開源授權；閉源的商業網站、App 或 CI 可能需要買商業授權。確認適用的授權後再同意。"
      zh-CN:
        label: 许可协议
        description: "Browserless 采用 SSPL，不是 OSI 认可的开源许可证；闭源的商业网站、App 或 CI 可能需要购买商业许可。确认适用的许可后再同意。"
    description: >-
      Read Browserless LICENSE: SSPL is not OSI-approved; closed-source
      commercial sites/apps/CI may require a commercial license. Enter
      I-ACCEPT-BROWSERLESS-LICENSE after you confirm which license applies to
      your use.
    required: true
    validation: {pattern: ^I-ACCEPT-BROWSERLESS-LICENSE$}
  - name: token
    description: >-
      Generated Browserless bearer/query token. Retrieve from
      browserless-secrets/token through authorized Kubernetes access; never put
      the value in a URL logged by a proxy.
    generate: random
    secret: {name: browserless-secrets, key: token}
    validation: {pattern: '^[A-Za-z0-9_-]{43}$'}

security:
  summary: >-
    Restricted non-root read-only container; authenticated API, no
    service-account token, default-deny ingress. Outbound traffic is not
    limited. Do not share one instance between untrusted tenants.
  risks:
    - risk: >-
        Upstream Chromium launch forces --no-sandbox; a browser exploit can
        compromise the container, its Browserless token and other browser
        session contents.
      mitigation: >-
        Only trusted API clients; keep image patched, run this service in an
        isolated tenant namespace on dedicated nodes for sensitive browsing,
        retain restricted admission and do not grant SYS_ADMIN or host access.
        Do not share one instance between untrusted tenants.
    - risk: >-
        Browser automation can be used for SSRF; application-level
        private-network blocking defaults off.
      mitigation: >-
        File protocol, GET-style browser calls and CORS are disabled. The
        template does not limit outbound traffic, so the browser can open
        private, cluster and cloud metadata addresses. Pods of other templates
        accept connections only from their own peers. Add an egress
        NetworkPolicy that blocks private ranges before untrusted clients use
        the API.
    - risk: >-
        SSPL/commercial dual license has non-OSI obligations and restricted
        closed-source commercial scenarios.
      mitigation: >-
        Deployment requires the license acknowledgment. The acknowledgment does
        not grant a license. Confirm the applicable license, and get legal
        advice for commercial integration.
    - risk: >-
        A shared token authorizes high-trust automation and may appear in client
        URLs/access logs.
      mitigation: >-
        Generate it at deploy time, use the upstream Authorization header where
        supported, restrict Kubernetes Secret/log access, redact query strings
        in external proxies and rotate token after disclosure.

scalability:
  summary: >-
    One stateless instance, four concurrent and four queued sessions; active
    browser sessions cannot migrate.
  replicas: 1
  maxReplicas: 1
  blockers:
    - >-
      Session and CDP/WebSocket connections are process-local; reconnect/retry
      policy is the caller responsibility.
    - CPU, memory and shared-memory usage bound browser concurrency.
    - No HPA is enabled. More replicas need session-aware routing.
    - Concurrency is set to four sessions. Load-test the node before you raise it.
    - >-
      Readiness removes the endpoint while the queue is full. The 90-second
      termination window drains short work only.

upgradeNotes:
  - >-
    Before each digest update, check the upstream license, browser security
    fixes, and changes to the start command, paths or UID. Keep the previous
    digest for rollback.
  - >-
    Drain/reconnect clients before replacing the Pod; running browser sessions
    and ephemeral downloads are lost.
  - >-
    No persistent browser profiles, cookies, metrics or downloads are retained;
    export any needed artifacts through the authenticated API before restart.
  - >-
    The only state to back up is the token in browserless-secrets. Back it up
    with access control. Rotate the token if a browser compromise or a log
    exposed it.

smoke:
  - name: browserless-ready
    resource: deployment/browserless
    condition: condition=Available
    timeout: 300s
  - name: authentication-required
    resource: deployment/browserless
    condition: condition=Available
    timeout: 300s
    http: {service: browserless, port: 3000, path: /pressure, status: 401}
