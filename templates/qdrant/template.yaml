apiVersion: catalog.zeabur.com/v1
kind: Template
metadata:
  name: Qdrant
  version: "v1.20.0-unprivileged"
  description: Qdrant vector database with API key authentication and data on a persistent volume.
  license: Apache-2.0
  homepage: https://qdrant.tech/
  icon: https://github.com/qdrant.png
  categories: [databases, ai]

requires: [ingress/traefik, certificates/cert-manager]

services:
  - name: qdrant
    securityProfile: restricted
    ports: [{name: http, port: 6333}, {name: grpc, port: 6334}]
    resources: {requests: {cpu: 200m, memory: 512Mi}, limits: {cpu: "2", memory: 2Gi}}
    domains: ['{{ .Domain }}']

inputs:
  - name: apiKey
    description: >-
      API key for every REST and gRPC request, sent in the api-key header.
      Generated at installation.
    generate: random
    secret: {name: qdrant-secrets, key: api-key}
    validation: {pattern: '^[A-Za-z0-9_-]{43}$'}

security:
  summary: >-
    The official image runs as an unprivileged user (UID 1000) with a read-only
    root filesystem, no service-account token and no extra Linux capabilities.
    Every Qdrant request needs the API key.
  locales:
    zh-TW:
      summary: "官方映像檔以一般使用者（UID 1000）執行，根檔案系統唯讀，沒有 service-account token，也沒有額外的 Linux 權限。每個 Qdrant 請求都要帶 API 金鑰。"
    zh-CN:
      summary: "官方镜像以普通用户（UID 1000）运行，根文件系统只读，没有 service-account token，也没有额外的 Linux 权限。每个 Qdrant 请求都要带 API 密钥。"
  risks:
    - risk: The REST API and the web dashboard are public through the Ingress.
      mitigation: >-
        Every request needs the generated API key, except the health
        endpoints. Keep the key on your servers, and create JWT or read-only
        keys for other clients.
      locales:
        zh-TW:
          risk: "REST API 和網頁管理介面都透過 Ingress 對外公開。"
          mitigation: "除了健康檢查端點，每個請求都要帶自動產生的 API 金鑰。金鑰只放在你的伺服器上，給其他用戶端用的話，另外建立 JWT 或唯讀金鑰。"
        zh-CN:
          risk: "REST API 和网页管理界面都通过 Ingress 对外公开。"
          mitigation: "除了健康检查端点，每个请求都要带自动生成的 API 密钥。密钥只放在你的服务器上，给其他客户端用的话，另外创建 JWT 或只读密钥。"
    - risk: The gRPC port is not exposed through the Ingress.
      mitigation: >-
        Pods in the same namespace with the label
        templates.zeabur.com/qdrant-client=true can reach REST on port 6333 and
        gRPC on port 6334. From outside the cluster, use REST over the Ingress.
      locales:
        zh-TW:
          risk: "gRPC 連接埠不會透過 Ingress 對外開放。"
          mitigation: "同一個命名空間裡，帶有標籤 templates.zeabur.com/qdrant-client=true 的 Pod 可以連 6333 的 REST 和 6334 的 gRPC。從叢集外面連的話，請走 Ingress 的 REST。"
        zh-CN:
          risk: "gRPC 端口不会通过 Ingress 对外开放。"
          mitigation: "同一个命名空间里，带有标签 templates.zeabur.com/qdrant-client=true 的 Pod 可以连 6333 的 REST 和 6334 的 gRPC。从集群外面连的话，请走 Ingress 的 REST。"
    - risk: >-
        Outbound traffic is not limited, so a snapshot URL can point at
        private addresses.
      mitigation: >-
        Upload snapshots through the API, or add an egress NetworkPolicy that
        limits where Qdrant can fetch from.
      locales:
        zh-TW:
          risk: "往外的網路流量沒有限制，所以快照網址可以指向內網位址。"
          mitigation: "用 API 上傳快照，或是加上 egress NetworkPolicy，限制 Qdrant 能從哪裡下載。"
        zh-CN:
          risk: "向外的网络流量没有限制，所以快照网址可以指向内网地址。"
          mitigation: "用 API 上传快照，或者加上 egress NetworkPolicy，限制 Qdrant 能从哪里下载。"

scalability:
  summary: One node on a 20Gi volume. Distributed mode is not configured.
  replicas: 1
  maxReplicas: 1
  blockers:
    - >-
      More replicas need Qdrant distributed mode with peer discovery and a
      volume per node. The template does not configure it.
    - A node-local default StorageClass, such as local-path, has no snapshots or failover.

upgradeNotes:
  - >-
    Breaking change: the template no longer ships its default-deny and per-pod
    NetworkPolicies, because the installer isolates project namespaces. Applying
    this version does not delete the old ones. Delete them with `kubectl delete
    networkpolicy qdrant-default-deny qdrant`.
  - >-
    Create a full snapshot with the snapshot API and copy it off the node
    before you change the image digest.
  - >-
    Qdrant supports upgrades from the previous minor version only. Upgrade one
    minor version at a time. A rollback needs the snapshot taken before the
    upgrade.
  - >-
    Deleting the namespace deletes the PVC and all collections. Keep
    snapshots outside the cluster.

smoke:
  - name: qdrant-ready
    resource: statefulset/qdrant
    condition: jsonpath={.status.readyReplicas}=1
    timeout: 600s
    http: {service: qdrant, port: 6333, path: /readyz, status: 200}
  - name: api-key-required
    resource: statefulset/qdrant
    condition: jsonpath={.status.readyReplicas}=1
    timeout: 120s
    http: {service: qdrant, port: 6333, path: /collections, status: 401}
