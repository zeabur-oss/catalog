apiVersion: catalog.zeabur.com/v1
kind: Template
metadata:
  name: MariaDB
  description: >-
    MariaDB 12.3 managed by MariaDB Operator with TLS-only least-privilege
    access and native S3 backups.
  license: GPL-2.0-only AND MIT
  # Also: https://github.com/mariadb-operator/mariadb-operator
  homepage: https://github.com/MariaDB/mariadb-docker
  icon: https://github.com/MariaDB.png
  categories: [databases]

requires: [databases/mariadb-operator, certificates/cert-manager]

services:
  - name: mariadb
    securityProfile: restricted
    ports: [{name: mysql, port: 3306}]
    resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "2", memory: 1Gi}}

inputs:
  - name: databasePassword
    description: Application user password for database zeabur; username app.
    generate: random
    secret: {name: mariadb-secrets, key: password}
    validation: {pattern: '^[A-Za-z0-9_-]{43}$'}
  - name: rootPassword
    description: Local MariaDB administrator password. Applications use databasePassword.
    generate: random
    secret: {name: mariadb-secrets, key: root-password}
    validation: {pattern: '^[A-Za-z0-9_-]{43}$'}
  - name: backupBucket
    description: >-
      Existing dedicated S3-compatible bucket; restrict credentials to this
      namespace prefix. Backups must be off-node.
    required: true
    validation: {pattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'}
  - name: backupEndpoint
    description: >-
      S3 HTTPS endpoint HOST:PORT without scheme (port mandatory, for example
      s3.example.com:443); must match backupEndpointPort and resolve inside
      backupEndpointCIDR.
    required: true
    validation: {pattern: '^[a-zA-Z0-9.-]+:[0-9]{1,5}$'}
  - name: backupEndpointPort
    description: S3 destination TCP port, exactly matching backupEndpoint.
    required: true
    validation:
      pattern: ^([1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$
  - name: backupEndpointCIDR
    description: >-
      IPv4 S3 egress CIDR (prefer /32); update when endpoint DNS changes. Do not
      use 0.0.0.0/0.
    required: true
    validation: {pattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/([1-9]|[12][0-9]|3[0-2])$'}
  - name: backupRegion
    description: S3 bucket region accepted by the chosen service.
    required: true
    validation: {pattern: '^[a-zA-Z0-9-]{1,63}$'}
  - name: backupCredentialsSecret
    description: >-
      Existing namespace Secret containing ACCESS_KEY_ID and ACCESS_SECRET_KEY
      credentials, created out of band. The template does not generate cloud
      keys.
    required: true
    validation: {pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'}
  - name: backupCASecret
    description: >-
      Existing namespace Secret with ca.crt PEM trust bundle for the HTTPS S3
      endpoint, created out of band (public root bundle or private CA).
    required: true
    validation: {pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'}

security:
  summary: >-
    Restricted non-root application and MariaDB/operator-backup Pods,
    TLS-required database, generated SQL credentials, default-deny networking
    and native HTTPS S3 backups. Operator helper images are a catalog trust
    boundary.
  egress:
    - DNS TCP/UDP53 for backup Pods
    - Backup Pods to MariaDB TCP3306 and the S3 endpoint CIDR/port
  risks:
    - risk: >-
        MariaDB Operator is namespace-spanning trusted infrastructure and
        injects its controller-configured helper image into backup Jobs; Backup
        API has no image override.
      mitigation: >-
        Install the exact catalog provider and pin its image configuration
        before use. The engine init container inherits the template digest; both
        backup container contexts are restricted. MaxScale and Galera are not
        installed.
    - risk: >-
        Database storage is one 10Gi node-local local-path volume with no HA. A
        completed S3 backup does not prove that the database can be restored.
      mitigation: >-
        Use an off-node bucket with namespace-specific credentials, preserve SQL
        Secrets and TLS PKI, configure retention and run restore drills.
        Authorize clients with templates.zeabur.com/mariadb-client=true and a
        matching client egress allow; use app/zeabur with
        mariadb-secrets/password and verify the hostname and public trust bundle
        from mariadb-ca-bundle/ca.crt. Never distribute the CA signing-key
        Secret.
    - risk: >-
        Backups are daily logical dumps with no point-in-time recovery. Writes
        after the last successful backup are lost if the node or volume fails.
        The 10Gi local-path staging volumes used during backup are not a backup.
      mitigation: >-
        Take an extra on-demand Backup before risky changes and keep the bucket
        durable and encrypted on the provider side.

scalability:
  summary: One writable instance on node-local storage. There is no high availability.
  replicas: 1
  maxReplicas: 1
  blockers:
    - >-
      local-path volumes are node-local and provide no snapshots or cross-node
      failover.
    - >-
      The template runs one writable instance. Do not increase replicas without
      an application-specific storage/database design.

upgradeNotes:
  - >-
    Back up persistent application data and its database to storage outside the
    node before updating the image digest.
  - >-
    Test a restore into a separate namespace before upgrading. Database
    migrations may not be reversible.
  - >-
    The image is pinned to MariaDB 12.3.3. Major version upgrades are not
    reversible. Keep a logical dump and compatible physical backup.
  - >-
    Storage uses new operator-owned PVCs. To move from a StatefulSet-based
    MariaDB deployment, restore a logical dump into a separate namespace; do not
    adopt, mount or downgrade an old datadir. Keep old PVCs, Secrets and backups
    until a restore and application acceptance test succeeds.
  - >-
    MariaDB Operator chart26.10.1 retains PVCs on scale/delete via explicit
    Retain policy. Keep the CRD release installed while any data exists. Engine
    auto-update and mariadb-upgrade are off; check exact-version compatibility
    before each engine upgrade.
  - >-
    User app requires TLS and has SELECT, INSERT, UPDATE, DELETE, CREATE, DROP,
    ALTER and INDEX on zeabur.* only, without GRANT OPTION. Deleting the
    Database, User or Grant resources does not drop SQL data.
  - >-
    The operator reconciles SQL users from the Kubernetes resources. Changing
    startup environment variables does not rotate existing users; plan
    credential rotation together with dependent clients.
  - >-
    Initial Backup mariadb-initial-backup plus native daily scheduled Backup
    mariadb-daily-backup at03:00UTC use independent prefixes and30-day
    retention. Complete=True alone can mean failure; require Complete reason
    JobComplete and actual Job Complete=True. Rotate external S3 credentials out
    of band.

smoke:
  - name: database-ready
    resource: mariadb/mariadb
    condition: condition=Ready
    timeout: 900s
  - name: initial-native-backup-succeeded
    resource: backups.k8s.mariadb.com/mariadb-initial-backup
    condition: jsonpath={.status.conditions[?(@.type=="Complete")].reason}=JobComplete
    timeout: 900s
