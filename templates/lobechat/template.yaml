apiVersion: catalog.zeabur.com/v1
kind: Template
metadata:
  name: LobeChat
  version: "1.143.3"
  description: >-
    LobeChat chatbot UI in client-storage mode. Chats stay in each browser; a
    generated access code protects the server model key. The LobeHub Community
    License
    (https://github.com/lobehub/lobe-chat/blob/d718de7e1af2dd7281c4eaca70f627e4b9deddb1/LICENSE)
    allows unmodified commercial use; developing or distributing derivative
    works needs a commercial license.
  license: LicenseRef-LobeHub-Community
  # Also: https://github.com/lobehub/lobe-chat/blob/d718de7e1af2dd7281c4eaca70f627e4b9deddb1/LICENSE
  homepage: https://github.com/lobehub/lobe-chat
  icon: https://i.imgur.com/1N9pEHJ.png
  categories: [ai]

requires: [ingress/traefik, certificates/cert-manager]

services:
  - name: lobechat
    securityProfile: restricted
    ports: [{name: http, port: 3210}]
    resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "2", memory: 2Gi}}
    domains: ['{{ .Domain }}']

inputs:
  - name: accessCode
    description: >-
      Generated access-code; retrieve from Secret lobechat-secrets, never from a
      public URL.
    generate: random
    secret: {name: lobechat-secrets, key: access-code}
    validation: {pattern: '^[A-Za-z0-9_-]{43}$'}
  - name: providerSecret
    label: OpenAI API key secret
    locales:
      zh-TW:
        label: OpenAI API 金鑰的機密
        description: "這個專案裡現有的機密，鍵 api-key 放 OpenAI 的 API 金鑰。"
      zh-CN:
        label: OpenAI API 密钥的机密
        description: "这个项目里现有的机密，键 api-key 放 OpenAI 的 API 密钥。"
    description: Pre-existing Secret with key api-key for the OpenAI provider.
    required: true
    validation: {pattern: '^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$'}
security:
  summary: "LobeChat runs as non-root with a read-only root filesystem and the restricted Pod Security level. It has no Kubernetes token, and ingress uses TLS. Outbound traffic is not limited."
  locales:
    zh-TW:
      summary: "LobeChat 以非 root 身分執行，根檔案系統唯讀，套用 restricted 等級的 Pod Security。它沒有 Kubernetes token，Ingress 使用 TLS。對外連線沒有限制。"
    zh-CN:
      summary: "LobeChat 以非 root 身份运行，根文件系统只读，应用 restricted 级别的 Pod Security。它没有 Kubernetes token，Ingress 使用 TLS。对外连接没有限制。"
  risks:
    - risk: "The LobeHub Community License limits how you may distribute derivative works."
      mitigation: "The template description names the license. The template runs the unmodified image with its notices intact. Get commercial permission before you distribute a derivative."
      locales:
        zh-TW:
          risk: "LobeHub 社群授權限制你散布衍生作品的方式。"
          mitigation: "範本說明裡有寫明授權。範本執行的是未經修改的映像檔，聲明都完整保留。要散布衍生作品之前，請先取得商業授權許可。"
        zh-CN:
          risk: "LobeHub 社区许可限制你分发衍生作品的方式。"
          mitigation: "模板说明里有写明许可证。模板运行的是未经修改的镜像，声明都完整保留。要分发衍生作品之前，请先取得商业授权许可。"
    - risk: "Everyone who knows the shared access code uses the same instance and the same model key, and the server pays for it."
      mitigation: "Share a deployment only with users who trust each other. The code is generated with high entropy, the upstream sign-in protection is on, and ingress allows TLS only."
      locales:
        zh-TW:
          risk: "知道共用存取碼的人，都會共用同一個實例和同一把模型金鑰，費用由伺服器這邊負擔。"
          mitigation: "只把部署分享給彼此信任的使用者。存取碼是高強度隨機產生的，上游的登入保護已開啟，Ingress 只允許 TLS 連線。"
        zh-CN:
          risk: "知道共用访问码的人，都会共用同一个实例和同一把模型密钥，费用由服务器这边承担。"
          mitigation: "只把部署分享给彼此信任的用户。访问码是高强度随机生成的，上游的登录保护已开启，Ingress 只允许 TLS 连接。"

scalability:
  summary: One instance per trusted owner; do not horizontally scale this deployment.
  replicas: 1
  maxReplicas: 1
  blockers:
    - >-
      Chats are browser-local and the access code is shared. The deployment has
      no multi-tenant backend.

upgradeNotes:
  - >-
    Breaking change: the template no longer ships its default-deny and per-pod
    NetworkPolicies, because the installer isolates project namespaces. Applying
    this version does not delete the old ones. Delete them with `kubectl delete
    networkpolicy lobechat-default-deny lobechat-allow`.
  - >-
    Breaking change: the licenseOptIn input is removed. The license is named in
    the template description. Remove licenseOptIn from saved values.
  - >-
    This template runs LobeChat 1.143.3 in client-storage mode. LobeHub server
    mode uses different database, identity and storage. Do not switch the image
    to server mode without migrating user data and authentication.
  - >-
    Unmodified upstream image only. The license is named in the template
    description; derivative-work distribution needs upstream commercial permission.
  - >-
    Access code is generated; use the UI settings to supply it. Chats live in
    each browser. Export and import browser data for backups. Keep the
    access-code and provider Secrets in an encrypted external backup.
  - >-
    Before updates, check release notes, license changes and browser data
    migrations. Test import and rollback with exported histories. The runtime
    cache is disposable.

smoke:
  - name: Application available
    resource: deployment/lobechat
    condition: condition=Available
    timeout: 10m
