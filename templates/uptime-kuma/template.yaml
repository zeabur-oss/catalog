apiVersion: catalog.zeabur.com/v1
kind: Template
metadata:
  name: Uptime Kuma
  version: "2.5.7-rootless"
  description: Self-hosted uptime monitoring with persistent SQLite data.
  license: MIT
  homepage: https://github.com/louislam/uptime-kuma
  icon: https://github.com/louislam.png
  categories: [monitoring]

requires: [ingress/traefik, certificates/cert-manager]

services:
  - name: uptime-kuma
    securityProfile: restricted
    ports: [{name: http, port: 3001}]
    resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "2", memory: 1Gi}}

security:
  summary: >-
    The workloads live in their own namespace, run without root rights, use
    pinned image versions and have read-only root filesystems. They have no
    Kubernetes token and no extra Linux capabilities. Outbound traffic is not
    limited.
  locales:
    zh-TW:
      summary: "所有工作負載都放在自己的命名空間，不用 root 權限執行，映像檔版本固定，根檔案系統唯讀。它們沒有 Kubernetes token，也沒有額外的 Linux 權限。往外的網路流量沒有限制。"
    zh-CN:
      summary: "所有工作负载都放在自己的命名空间，不用 root 权限运行，镜像版本固定，根文件系统只读。它们没有 Kubernetes token，也没有额外的 Linux 权限。向外的网络流量没有限制。"
  risks:
    - risk: The first visitor can claim an installation that is not set up yet.
      mitigation: >-
        Uptime Kuma has no environment variable or init step that creates the
        owner, so the template cannot do it at deploy time. Open the domain and
        create the owner account right after the deploy finishes. Until then,
        whoever visits first becomes the owner. The monitor page, the setup
        page and the status pages are open to anyone who can reach the domain,
        and only the application's own sign-in protects the rest. To limit who
        can reach it, add an IP limit in the service's network settings.
      locales:
        zh-TW:
          risk: "還沒設定好的時候，第一個打開網站的人就能認領這個安裝。"
          mitigation: "Uptime Kuma 沒有環境變數或初始化步驟可以建立擁有者，所以範本沒辦法在部署時幫你建。部署完成後請馬上打開網域，建立擁有者帳號。在那之前，誰先進來誰就是擁有者。監控頁面、設定頁面和狀態頁面，任何連得到網域的人都看得到，其餘部分只靠應用程式自己的登入保護。想限制誰能連進來，請在服務的網路設定裡加上 IP 限制。"
        zh-CN:
          risk: "还没设置好的时候，第一个打开网站的人就能认领这个安装。"
          mitigation: "Uptime Kuma 没有环境变量或初始化步骤可以创建所有者，所以模板没办法在部署时帮你创建。部署完成后请马上打开域名，创建所有者账号。在那之前，谁先进来谁就是所有者。监控页面、设置页面和状态页面，任何连得到域名的人都看得到，其余部分只靠应用自己的登录保护。想限制谁能连进来，请在服务的网络设置里加上 IP 限制。"
    - risk: >-
        Someone could set a monitoring target that makes Uptime Kuma reach
        into your cluster or private network (an SSRF attack).
      mitigation: >-
        The template does not limit outbound traffic. Add an egress
        NetworkPolicy that allows only the destination range you approve. Never
        mount a Docker socket or turn on privileged monitoring.
      locales:
        zh-TW:
          risk: "有人可以設定監控目標，讓 Uptime Kuma 去連你的叢集或內部網路（SSRF 攻擊）。"
          mitigation: "這個範本不限制往外的網路流量。請加上 egress NetworkPolicy，只放行你核准的目的地範圍。絕對不要掛載 Docker socket，也不要開啟特權監控。"
        zh-CN:
          risk: "有人可以设置监控目标，让 Uptime Kuma 去连你的集群或内部网络（SSRF 攻击）。"
          mitigation: "这个模板不限制向外的网络流量。请加上 egress NetworkPolicy，只放行你批准的目的地范围。绝对不要挂载 Docker socket，也不要开启特权监控。"
    - risk: >-
        Ping monitors use unprivileged ICMP sockets, set through the
        net.ipv4.ping_group_range sysctl. The container has no NET_RAW
        capability. Monitors that need raw sockets or the Docker socket do not
        work.
      mitigation: >-
        Check how your CNI handles ICMP. Use HTTP, TCP or DNS monitors where
        ping fails.
      locales:
        zh-TW:
          risk: "Ping 監控用的是不需特權的 ICMP socket，靠 net.ipv4.ping_group_range 這個 sysctl 設定。容器沒有 NET_RAW 權限。需要原始 socket 或 Docker socket 的監控項目沒辦法用。"
          mitigation: "檢查你的 CNI 怎麼處理 ICMP。Ping 不通的地方，改用 HTTP、TCP 或 DNS 監控。"
        zh-CN:
          risk: "Ping 监控用的是不需特权的 ICMP socket，靠 net.ipv4.ping_group_range 这个 sysctl 设置。容器没有 NET_RAW 权限。需要原始 socket 或 Docker socket 的监控项目没办法用。"
          mitigation: "检查你的 CNI 怎么处理 ICMP。Ping 不通的地方，改用 HTTP、TCP 或 DNS 监控。"

scalability:
  summary: >-
    One writable instance on a 10Gi volume with SQLite. There is no
    high availability.
  replicas: 1
  maxReplicas: 1
  blockers:
    - >-
      A node-local default StorageClass, such as local-path, has no snapshots
      or failover.
    - >-
      The template runs one writable instance. Do not increase replicas without
      an application-specific storage/database design.

upgradeNotes:
  - >-
    A new install has no owner until someone creates it on the first visit.
    Do that right after the deploy; Uptime Kuma cannot create it from a
    Secret.
  - >-
    Back up persistent application data and its database to storage outside the
    node before updating the image digest.
  - >-
    Test a restore into a separate namespace before upgrading. Database
    migrations may not be reversible.
  - >-
    Back up /app/data while Uptime Kuma is stopped, or with a SQLite-consistent
    backup tool. A copy of a live SQLite file can be inconsistent.
  - >-
    Upgrades from 2.0 to 2.5 migrate the database schema. Test the migration on
    a restored copy first. Rolling back the image does not undo schema
    migrations.

smoke:
  - name: application-ready
    resource: statefulset/uptime-kuma
    condition: jsonpath={.status.readyReplicas}=1
    timeout: 600s
