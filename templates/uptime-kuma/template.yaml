apiVersion: catalog.zeabur.com/v1
kind: Template
metadata:
  name: Uptime Kuma
  description: Self-hosted uptime monitoring with persistent SQLite data.
  license: MIT
  homepage: https://github.com/louislam/uptime-kuma
  icon: https://github.com/louislam.png
  categories: [monitoring]

requires: [ingress/traefik, certificates/cert-manager]

services:
  - name: uptime-kuma
    securityProfile: restricted
    ports: [{name: http, port: 3001}]
    resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "2", memory: 1Gi}}

inputs:
  - name: adminCidr
    description: >-
      Administrator IPv4 source CIDR as seen by Traefik. Restricts the entire
      private monitor UI, setup and status pages. Prefer your fixed IP /32.
    required: true
    validation:
      pattern: ^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])/([1-9]|[12][0-9]|3[0-2])$
  - name: monitorCidr
    description: >-
      IPv4 CIDR containing approved monitoring targets; a broad range also
      permits probing internal services.
    required: true
    validation: {pattern: '^(?:[0-9]{1,3}\.){3}[0-9]{1,3}/(?:[0-9]|[12][0-9]|3[0-2])$'}

security:
  summary: >-
    Namespaced, digest-pinned non-root workloads with read-only roots, no API
    token, dropped capabilities and default-deny networking.
  egress:
    - Cluster DNS
    - >-
      Explicit monitorCidr destinations on all protocols; monitor definitions
      determine target ports.
  risks:
    - risk: The first visitor can claim an uninitialized installation.
      mitigation: >-
        Required adminCidr enforces Traefik ipAllowList on the entire Ingress
        before owner provisioning, even when wildcard DNS already resolves.
        Create the first owner account from the allowed network. The UI and
        status pages stay private. To publish a status page, plan a separate
        exposure after owner setup and keep the allowlist on the monitor UI.
    - risk: NAT or a reverse proxy can hide the real client source from Traefik.
      mitigation: >-
        The allowlist uses the source address Traefik sees and ignores
        client-supplied X-Forwarded-For. Check source preservation and proxy
        trust; allowing a shared load-balancer CIDR admits every Internet
        client.
    - risk: >-
        Monitoring targets can become an SSRF path into cluster or private
        infrastructure.
      mitigation: >-
        Set monitorCidr to the smallest approved destination range; never mount
        a Docker socket or enable privileged monitoring.
    - risk: >-
        Ping monitors use unprivileged ICMP sockets through the
        net.ipv4.ping_group_range sysctl. The container has no NET_RAW
        capability. Monitors that need raw sockets or the Docker socket do not
        work. Egress is IPv4 only.
      mitigation: Check ICMP handling in your CNI. Use HTTP, TCP or DNS monitors where ping fails.

scalability:
  summary: >-
    One writable instance on a 10Gi volume with SQLite. There is no
    high availability.
  replicas: 1
  maxReplicas: 1
  blockers:
    - >-
      A node-local default StorageClass, such as local-path, has no snapshots
      or failover.
    - >-
      The template runs one writable instance. Do not increase replicas without
      an application-specific storage/database design.

upgradeNotes:
  - >-
    Back up persistent application data and its database to storage outside the
    node before updating the image digest.
  - >-
    Test a restore into a separate namespace before upgrading. Database
    migrations may not be reversible.
  - >-
    Back up /app/data while Uptime Kuma is stopped, or with a SQLite-consistent
    backup tool. A copy of a live SQLite file can be inconsistent.
  - >-
    Upgrades from 2.0 to 2.5 migrate the database schema. Test the migration on
    a restored copy first. Rolling back the image does not undo schema
    migrations.

smoke:
  - name: application-ready
    resource: statefulset/uptime-kuma
    condition: jsonpath={.status.readyReplicas}=1
    timeout: 600s
