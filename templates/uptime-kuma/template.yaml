apiVersion: catalog.zeabur.com/v1
kind: Template
metadata:
  name: Uptime Kuma
  version: "2.5.7-rootless"
  description: Self-hosted uptime monitoring with persistent SQLite data.
  license: MIT
  homepage: https://github.com/louislam/uptime-kuma
  icon: https://github.com/louislam.png
  categories: [monitoring]

requires: [ingress/traefik, certificates/cert-manager]

services:
  - name: uptime-kuma
    securityProfile: restricted
    ports: [{name: http, port: 3001}]
    resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "2", memory: 1Gi}}

security:
  summary: >-
    Namespaced, digest-pinned non-root workloads with read-only roots, no API
    token, dropped capabilities and default-deny ingress. Outbound traffic is
    not limited.
  risks:
    - risk: The first visitor can claim an uninitialized installation.
      mitigation: >-
        Create the first owner account right after the deploy finishes. The
        monitor UI, setup and status pages are open to anyone who can reach
        the domain; the application has its own sign-in. To limit who can
        reach it, add an IP limit in the service's network settings.
    - risk: >-
        Monitoring targets can become an SSRF path into cluster or private
        infrastructure.
      mitigation: >-
        The template does not limit outbound traffic. Add an egress
        NetworkPolicy for the approved destination range; never mount a Docker
        socket or enable privileged monitoring.
    - risk: >-
        Ping monitors use unprivileged ICMP sockets through the
        net.ipv4.ping_group_range sysctl. The container has no NET_RAW
        capability. Monitors that need raw sockets or the Docker socket do not
        work.
      mitigation: >-
        Check ICMP handling in your CNI. Use HTTP, TCP or DNS monitors where
        ping fails.

scalability:
  summary: >-
    One writable instance on a 10Gi volume with SQLite. There is no
    high availability.
  replicas: 1
  maxReplicas: 1
  blockers:
    - >-
      A node-local default StorageClass, such as local-path, has no snapshots
      or failover.
    - >-
      The template runs one writable instance. Do not increase replicas without
      an application-specific storage/database design.

upgradeNotes:
  - >-
    Back up persistent application data and its database to storage outside the
    node before updating the image digest.
  - >-
    Test a restore into a separate namespace before upgrading. Database
    migrations may not be reversible.
  - >-
    Back up /app/data while Uptime Kuma is stopped, or with a SQLite-consistent
    backup tool. A copy of a live SQLite file can be inconsistent.
  - >-
    Upgrades from 2.0 to 2.5 migrate the database schema. Test the migration on
    a restored copy first. Rolling back the image does not undo schema
    migrations.

smoke:
  - name: application-ready
    resource: statefulset/uptime-kuma
    condition: jsonpath={.status.readyReplicas}=1
    timeout: 600s
