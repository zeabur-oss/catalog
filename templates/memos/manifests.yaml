apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: memos-data
  namespace: '{{ .Namespace }}'
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: memos-config
  namespace: '{{ .Namespace }}'
data:
  instance.json: |
    {
      "instanceSettings": [
        {"name": "instance/settings/GENERAL", "generalSetting": {"disallowUserRegistration": true}}
      ],
      "users": [
        {"name": "users/admin", "username": "admin", "role": "ADMIN", "password": "${env:ADMIN_PASSWORD}"}
      ]
    }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: memos
  namespace: '{{ .Namespace }}'
spec:
  serviceName: memos
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: memos
  template:
    metadata:
      labels:
        templates.zeabur.com/template: memos
        app.kubernetes.io/name: memos
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: memos
        image: neosmemo/memos:26.11.0@sha256:087e7dc6b76b31fcd1107a5767398b2a310ced209adb791efd8760c745dc8034
        ports:
        - name: http
          containerPort: 5230
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        env:
        - name: MEMOS_PORT
          value: '5230'
        - name: MEMOS_DATA
          value: /var/opt/memos
        - name: MEMOS_DRIVER
          value: sqlite
        - name: MEMOS_INSTANCE_URL
          value: https://{{ .Domain }}
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: memos-secrets
              key: admin-password
        volumeMounts:
        - name: data
          mountPath: /var/opt/memos
        - name: config
          mountPath: /etc/memos/config
          readOnly: true
        - name: tmp
          mountPath: /tmp
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 20
          failureThreshold: 6
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: memos-data
      - name: config
        configMap:
          name: memos-config
      - name: tmp
        emptyDir:
          sizeLimit: 512Mi
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: memos
  namespace: '{{ .Namespace }}'
spec:
  selector:
    app.kubernetes.io/name: memos
  ports:
  - name: http
    port: 5230
    targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: memos
  namespace: '{{ .Namespace }}'
  annotations:
    cert-manager.io/cluster-issuer: '{{ .ClusterIssuer }}'
spec:
  ingressClassName: traefik
  tls:
  - hosts: ['{{ .Domain }}']
    secretName: memos-tls
  rules:
  - host: '{{ .Domain }}'
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: memos
            port:
              number: 5230
