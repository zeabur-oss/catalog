security:
  summary: >-
    Restricted non-root application and MariaDB Pods, TLS-required database,
    generated SQL credentials and default-deny ingress. Operator helper images
    are a catalog trust boundary.
  risks:
    - risk: >-
        WordPress plugins and themes execute code with database and
        uploaded-file access.
      mitigation: >-
        Restrict administrators, vet plugins and keep them patched. No public
        FastCGI port; deny PHP execution in uploads and deny
        wp-config/hidden/raw backup files.
    - risk: An unconfigured WordPress installation lets the first visitor claim the site.
      mitigation: >-
        A digest-pinned official WP-CLI init container creates the admin with a
        generated password before web Pods become ready. Nothing is downloaded
        at runtime.
    - risk: MariaDB Operator is namespace-spanning trusted infrastructure.
      mitigation: >-
        Install the exact catalog provider and pin its image configuration
        before use. The engine init container inherits the template digest.
        MaxScale and Galera are not installed.
    - risk: >-
        Database backups do not include uploads, plugins or themes on the
        wordpress-data volume.
      mitigation: >-
        Preserve SQL Secrets and TLS PKI and run restore drills. Quiesce
        WordPress and archive the wordpress-data volume and Secrets at the same
        recovery point as the database.

scalability:
  summary: >-
    One WordPress Pod and one MariaDB writer, each on a 10Gi volume. There is
    no automatic horizontal scaling.
  replicas: 1
  maxReplicas: 1
  blockers:
    - A node-local default StorageClass has no HA, snapshots or cross-node failover.

upgradeNotes:
  - >-
    New installs start without database backups. Installs made before this
    version keep their backups. To turn backups on, open the database in Zeabur
    and use the Backups tab.
  - >-
    A Backup of the MariaDB gives its Pods the labels
    templates.zeabur.com/template: wordpress and app.kubernetes.io/component:
    backup in spec.podMetadata. MariaDB accepts connections from these Pods.
    Zeabur adds the labels to the Backups it creates.
  - >-
    Preserve Secrets and PVCs. Back up data off-node and rehearse a restore
    before changing image digests.
  - >-
    WordPress runs PHP 8.3 on PHP-FPM (UID 82) behind unprivileged NGINX (UID
    101). MariaDB is 11.4 LTS. Uploads are capped at 256MiB, PHP memory at 1GiB
    and execution time at 300s.
  - >-
    WordPress connects to MariaDB with TLS and verifies the server certificate
    against mariadb-ca-bundle/ca.crt. The trust bundle is built at Pod start;
    restart WordPress after a MariaDB CA rotation.
  - >-
    The wordpress SQL user has SELECT, INSERT, UPDATE, DELETE, CREATE, DROP,
    ALTER and INDEX on zeabur.* only, without GRANT OPTION. Plugins that need
    other privileges or MySQL-only SQL can fail.
  - >-
    WordPress core/plugins/themes on the persistent HTML volume update through
    WordPress; changing the seed image does not overwrite existing content.
    Apply security updates in the admin UI or via /tools/wp inside the WordPress
    container; retain backups for rollback.
  - >-
    Admin username is admin; retrieve wordpress-secrets/admin-password securely.
    Initial installation is automatic; do not rerun core install against an
    existing database. Domain is fixed via WP_HOME/WP_SITEURL; use pinned
    /tools/wp search-replace for stored links.
  - >-
    Database storage uses new operator-owned PVCs. To move from a
    StatefulSet-based deployment, restore a logical dump and the uploads into a
    separate namespace; do not adopt, mount or downgrade an old datadir. Verify
    URLs, plugins, TLS and admin login, then move traffic. Keep old PVCs,
    Secrets and backups until a restore and application acceptance test
    succeeds.
  - >-
    MariaDB Operator chart26.10.1 retains PVCs on scale/delete via explicit
    Retain policy. Keep the CRD release installed while any data exists. Engine
    auto-update is off; check exact-version compatibility before each engine
    upgrade. Image changes do not reverse SQL migrations.

smoke:
  - name: workload-ready
    resource: deployment/wordpress
    condition: condition=Available
    timeout: 900s
  - name: database-ready
    resource: mariadb/mariadb
    condition: condition=Ready
    timeout: 900s