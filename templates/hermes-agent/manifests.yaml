apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-bootstrap
  namespace: '{{ .Namespace }}'
data:
  provider-config.py: |
    import os
    from pathlib import Path
    import yaml
    path = Path(os.environ["HERMES_HOME"]) / "config.yaml"
    config = yaml.safe_load(path.read_text()) if path.exists() else None
    config = config or {}
    model = config.get("model") or {}
    model["provider"] = "custom"
    model["base_url"] = os.environ["LLM_BASE_URL"]
    model["api_key"] = os.environ["LLM_API_KEY"]
    model["default"] = os.environ["LLM_MODEL"]
    config["model"] = model
    path.write_text(yaml.safe_dump(config, sort_keys=False, allow_unicode=True))
    path.chmod(0o600)
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-data
  namespace: '{{ .Namespace }}'
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
  namespace: '{{ .Namespace }}'
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-agent
  template:
    metadata:
      labels:
        templates.zeabur.com/template: hermes-agent
        app.kubernetes.io/name: hermes-agent
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsUser: 10000
        runAsGroup: 10000
        runAsNonRoot: true
        fsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: provider-config
        image: nousresearch/hermes-agent:v2026.7.7.2@sha256:9c841866021c54c4596849f6135717e8a4d52ba510b7f52c50aef1de1a283973
        command:
        - /opt/hermes/.venv/bin/python
        - /bootstrap/provider-config.py
        env:
        - name: HOME
          value: /opt/data
        - name: HERMES_HOME
          value: /opt/data
        - name: LLM_MODEL
          value: '{{ .Inputs.model }}'
        - name: LLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: '{{ .Inputs.providerSecret }}'
              key: api-key
        - name: LLM_BASE_URL
          value: '{{ if .Inputs.providerEndpoint }}{{ .Inputs.providerEndpoint }}{{ else }}https://openrouter.ai/api/v1{{ end }}'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
        - name: data
          mountPath: /opt/data
        - name: bootstrap
          mountPath: /bootstrap
          readOnly: true
      containers:
      - name: hermes-agent
        image: nousresearch/hermes-agent:v2026.7.7.2@sha256:9c841866021c54c4596849f6135717e8a4d52ba510b7f52c50aef1de1a283973
        command:
        - /opt/hermes/.venv/bin/hermes
        - gateway
        - run
        env:
        - name: HOME
          value: /opt/data
        - name: HERMES_HOME
          value: /opt/data
        - name: HERMES_WRITE_SAFE_ROOT
          value: /opt/data
        - name: HERMES_DISABLE_LAZY_INSTALLS
          value: '1'
        - name: API_SERVER_ENABLED
          value: 'true'
        - name: API_SERVER_HOST
          value: 0.0.0.0
        - name: API_SERVER_PORT
          value: '5000'
        - name: GATEWAY_ALLOW_ALL_USERS
          value: 'false'
        - name: API_SERVER_KEY
          valueFrom:
            secretKeyRef:
              name: hermes-secrets
              key: api-key
        - name: LLM_MODEL
          value: '{{ .Inputs.model }}'
        - name: LLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: '{{ .Inputs.providerSecret }}'
              key: api-key
        - name: LLM_BASE_URL
          value: '{{ if .Inputs.providerEndpoint }}{{ .Inputs.providerEndpoint }}{{ else }}https://openrouter.ai/api/v1{{ end }}'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - name: api
          containerPort: 5000
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
            ephemeral-storage: 256Mi
          limits:
            cpu: '2'
            memory: 2Gi
            ephemeral-storage: 2Gi
        startupProbe:
          httpGet:
            path: /health
            port: api
          periodSeconds: 5
          failureThreshold: 120
        readinessProbe:
          httpGet:
            path: /health
            port: api
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: api
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
        volumeMounts:
        - name: data
          mountPath: /opt/data
        - name: tmp
          mountPath: /tmp
      - name: dashboard
        image: nousresearch/hermes-agent:v2026.7.7.2@sha256:9c841866021c54c4596849f6135717e8a4d52ba510b7f52c50aef1de1a283973
        command:
        - /opt/hermes/.venv/bin/hermes
        - dashboard
        - --host
        - 0.0.0.0
        - --port
        - '9119'
        - --no-open
        env:
        - name: HOME
          value: /opt/data
        - name: HERMES_HOME
          value: /opt/data
        - name: HERMES_WRITE_SAFE_ROOT
          value: /opt/data
        - name: HERMES_DISABLE_LAZY_INSTALLS
          value: '1'
        - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
          value: admin
        - name: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hermes-secrets
              key: dashboard-password
        - name: HERMES_DASHBOARD_BASIC_AUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: hermes-secrets
              key: dashboard-session-key
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - name: dashboard
          containerPort: 9119
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
        startupProbe:
          tcpSocket:
            port: dashboard
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          tcpSocket:
            port: dashboard
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: dashboard
          periodSeconds: 30
          failureThreshold: 5
        volumeMounts:
        - name: data
          mountPath: /opt/data
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: hermes-data
      - name: tmp
        emptyDir:
          sizeLimit: 1Gi
      - name: bootstrap
        configMap:
          name: hermes-bootstrap
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-agent
  namespace: '{{ .Namespace }}'
spec:
  selector:
    app.kubernetes.io/name: hermes-agent
  ports:
  - name: dashboard
    port: 9119
    targetPort: dashboard
  - name: api
    port: 5000
    targetPort: api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes-api
  namespace: '{{ .Namespace }}'
  annotations:
    cert-manager.io/cluster-issuer: '{{ .ClusterIssuer }}'
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - '{{ .Domain }}'
    secretName: hermes-api-tls
  rules:
  - host: '{{ .Domain }}'
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: hermes-agent
            port:
              name: api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes-dashboard
  namespace: '{{ .Namespace }}'
  annotations:
    cert-manager.io/cluster-issuer: '{{ .ClusterIssuer }}'
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - '{{ .Inputs.adminDomain }}'
    secretName: hermes-dashboard-tls
  rules:
  - host: '{{ .Inputs.adminDomain }}'
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: hermes-agent
            port:
              name: dashboard
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-agent-default-deny
  namespace: '{{ .Namespace }}'
spec:
  podSelector: {matchLabels: {templates.zeabur.com/template: hermes-agent}}
  policyTypes: [Ingress]
  ingress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-traffic
  namespace: '{{ .Namespace }}'
spec:
  podSelector:
    matchLabels:
      templates.zeabur.com/template: hermes-agent
      app.kubernetes.io/name: hermes-agent
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
          - traefik
          - kube-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
    ports:
    - protocol: TCP
      port: 9119
    - protocol: TCP
      port: 5000
