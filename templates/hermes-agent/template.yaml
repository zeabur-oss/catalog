apiVersion: catalog.zeabur.com/v1
kind: Template
metadata:
  name: Hermes Agent
  version: "v2026.7.7.2"
  description: >-
    Hermes gateway, authenticated API and protected dashboard with
    OpenRouter or another OpenAI-compatible provider.
  license: MIT
  homepage: https://github.com/NousResearch/hermes-agent
  icon: https://raw.githubusercontent.com/NousResearch/hermes-agent/main/website/static/img/logo.png
  categories: [ai, automation]

requires: [ingress/traefik, certificates/cert-manager]

services:
  - name: hermes-agent
    securityProfile: restricted
    ports: [{name: dashboard, port: 9119}, {name: api, port: 5000}]
    resources: {requests: {cpu: 300m, memory: 768Mi}, limits: {cpu: 2500m, memory: 3Gi}}
    domains: ['{{ .Inputs.adminDomain }}', '{{ .Domain }}']

inputs:
  - name: providerSecret
    label: Provider API key secret
    locales:
      zh-TW:
        label: 模型服務 API 金鑰的機密
        description: "這個專案裡現有的機密，鍵 api-key 放模型服務的 API 金鑰；沒有填 API 端點時放 OpenRouter 的金鑰。"
      zh-CN:
        label: 模型服务 API 密钥的机密
        description: "这个项目里现有的机密，键 api-key 放模型服务的 API 密钥；没有填 API 端点时放 OpenRouter 的密钥。"
    description: >-
      Existing namespaced Secret with key api-key that holds the provider API
      key, an OpenRouter key when providerEndpoint is empty.
    required: true
    validation: {pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'}
  - name: model
    label: Model
    locales:
      zh-TW:
        label: 模型
        description: "模型服務上的模型名稱，需要時包含擁有者或路徑。"
      zh-CN:
        label: 模型
        description: "模型服务上的模型名称，需要时包含所有者或路径。"
    description: Provider model identifier including owner/path where required.
    required: true
    validation: {pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]{0,199}$'}
  - name: apiKey
    description: >-
      Generated API bearer key; retrieve hermes-secrets/api-key through
      authorized Kubernetes access.
    generate: random
    secret: {name: hermes-secrets, key: api-key}
    validation: {pattern: '^[A-Za-z0-9_-]{43}$'}
  - name: providerEndpoint
    label: API endpoint
    locales:
      zh-TW:
        label: API 端點
        description: "公開的 OpenAI 相容 HTTPS 端點（TCP 443），需要的話包含 /v1。留空就用 OpenRouter（https://openrouter.ai/api/v1）。"
      zh-CN:
        label: API 端点
        description: "公网的 OpenAI 兼容 HTTPS 端点（TCP 443），需要的话包含 /v1。留空就用 OpenRouter（https://openrouter.ai/api/v1）。"
    description: >-
      Public OpenAI-compatible HTTPS endpoint on TCP443, including its /v1
      suffix if required. If it is empty, the template uses OpenRouter
      (https://openrouter.ai/api/v1).
    required: false
    default: https://openrouter.ai/api/v1
    validation: {pattern: '^https://[A-Za-z0-9.-]+(:443)?(/[A-Za-z0-9._~/-]*)?$'}
  - name: adminDomain
    label: Dashboard domain
    locales:
      zh-TW:
        label: 管理介面網域
        description: "管理介面另外使用的 HTTPS 網域。"
      zh-CN:
        label: 管理界面域名
        description: "管理界面单独使用的 HTTPS 域名。"
    description: Separate HTTPS dashboard hostname.
    required: true
    validation: {pattern: '^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$'}
  - name: dashboardPassword
    description: Independent generated dashboard password for user admin.
    generate: random
    secret: {name: hermes-secrets, key: dashboard-password}
    validation: {pattern: '^[A-Za-z0-9_-]{43}$'}
  - name: dashboardSessionKey
    description: Independent generated dashboard session-signing key.
    generate: random
    secret: {name: hermes-secrets, key: dashboard-session-key}
    validation: {pattern: '^[A-Za-z0-9_-]{43}$'}

security:
  summary: >-
    Restricted pod as UID 10000 with no capabilities, no escalation, read-only
    root, bounded writable paths, authenticated API, messaging deny-by-default. Outbound traffic is not limited.
  risks:
    - risk: >-
        Agent tools invoke subprocesses and execute code from high-trust users.
      mitigation: >-
        No host socket/path, privileged mode or service-account credentials.
        Outbound traffic is not limited, so agent tasks can reach private and
        cloud metadata addresses; add an egress NetworkPolicy to block them.
        Malicious skills, prompts or web content can take over agent state and
        credentials. Give each trust boundary its own namespace, and use
        dedicated nodes for untrusted users.
    - risk: >-
        Persistent state contains provider credentials, conversations, memories
        and executable skills.
      mitigation: >-
        One writer, trusted skills, disabled lazy installs, encrypted off-node
        backups taken with the gateway stopped, and restore rehearsal. After a
        restore, check file ownership, provider access and messaging allowlists
        before routing clients. A node-local StorageClass has no HA or snapshots.
    - risk: Dashboard exposes high-trust administration of tools, profiles and secrets.
      mitigation: >-
        Separate generated Basic-auth and session keys, and a separate
        hostname. The dashboard is open to anyone who can reach that hostname,
        so keep the generated password private. To limit who can reach it, add
        an IP limit in the service's network settings.

scalability:
  summary: >-
    One supervised writer with a 10Gi PVC; profile/session state is
    local to this instance.
  replicas: 1
  maxReplicas: 1
  blockers:
    - >-
      Profile gateways, scheduler, locks and sessions are not distributed
      shared-nothing state.
    - A node-local StorageClass has no snapshots or cross-node HA.
    - Provider quotas and CPU/memory limit concurrent browser/tool subprocesses.

upgradeNotes:
  - >-
    Breaking change: the template no longer ships its default-deny and per-pod
    NetworkPolicies, because the installer isolates project namespaces. Applying
    this version does not delete the old ones. Delete them with `kubectl delete
    networkpolicy hermes-agent-default-deny hermes-traffic`.
  - >-
    Breaking change: the adminCidr input and its allowlist are removed. The
    dashboard is open to anyone who can reach adminDomain and signs in with the
    generated password. Remove adminCidr from saved values.
  - >-
    This template replaces hermes-agent-custom-provider and
    hermes-agent-openrouter. From hermes-agent-custom-provider, install
    hermes-agent in the same namespace with the same inputs. The objects keep
    their names, so the hermes-data PVC and the hermes-secrets Secret stay.
  - >-
    From hermes-agent-openrouter, leave providerEndpoint empty and give
    adminDomain for the dashboard. Add the keys
    dashboard-password and dashboard-session-key to hermes-secrets, and keep
    api-key. The API moves from TCP 8642 to TCP 5000, so update clients that
    connect to the Service.
  - >-
    Back up /opt/data consistently before upgrades. Upstream migrates persisted
    configuration during startup, and an older image may not read migrated
    state. Roll back by restoring the backup.
  - >-
    The pod does not use the image's /init supervisor. The gateway and the
    dashboard run as separate containers as UID 10000, which owns /opt/data.
    After each image update, check that both start without root.
  - >-
    Before the gateway starts, an init container writes the provider,
    endpoint, key and model into the config. Startup fails when that config is
    invalid.
  - >-
    The smoke check tests the API listener only. Send one request through the
    provider to confirm inference.
  - >-
    Keep messaging deny-by-default; configure explicit allowed messaging
    identities before enabling any external channel. Never restore
    GATEWAY_ALLOW_ALL_USERS=true.
  - >-
    Only trusted skills/plugins; lazy dependency installation is disabled and
    application code remains read-only. Integrations that need extra packages
    need a custom image.

smoke:
  - name: hermes-api-ready
    resource: deployment/hermes-agent
    condition: condition=Available
    timeout: 600s
    http: {service: hermes-agent, port: 5000, path: /health, status: 200}
