apiVersion: catalog.zeabur.com/v1
kind: Template
metadata:
  name: nginx
  # renovate: depName=nginxinc/nginx-unprivileged
  version: "1.31-alpine"
  summary: An NGINX web server over HTTPS.
  firstUse: "After deploy, open https://<your domain>. It shows the plain text Hello from Nginx deployed on Zeabur! and needs no login. To serve your own site, edit ConfigMap nginx and restart the Deployment."
  locales:
    zh-TW:
      summary: "透過 HTTPS 提供服務的 NGINX 網頁伺服器。"
      firstUse: "部署後開啟 https://<你的網域>，會看到純文字 Hello from Nginx deployed on Zeabur!，不需要登入。要放自己的網站，請編輯 ConfigMap nginx，再重新啟動 Deployment。"
    zh-CN:
      summary: "通过 HTTPS 提供服务的 NGINX 网页服务器。"
      firstUse: "部署后打开 https://<你的域名>，会看到纯文本 Hello from Nginx deployed on Zeabur!，不需要登录。要放自己的网站，请编辑 ConfigMap nginx，再重启 Deployment。"
  license: BSD-2-Clause AND Apache-2.0
  # Also: https://github.com/nginx/docker-nginx-unprivileged
  homepage: https://nginx.org/
  docs: https://nginx.org/en/docs/beginners_guide.html

requires: [{component: traefik}, {component: cert-manager}]

services:
  - name: nginx
    podSecurity: restricted
    ports: [{name: http, port: 8080}]
    domains: ['{{ .Domain }}']
    resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {cpu: 500m, memory: 128Mi}}

security:
  summary: >-
    The Pod has no Kubernetes API access. It runs as non-root UID 101 with a
    read-only filesystem and no extra system privileges. It makes no outbound
    connections.
  locales:
    zh-TW:
      summary: "Pod 不能存取 Kubernetes API。以非 root 的 UID 101 執行，檔案系統唯讀，沒有任何額外的系統權限，也不會對外連線。"
    zh-CN:
      summary: "Pod 不能访问 Kubernetes API。以非 root 的 UID 101 运行，文件系统只读，没有任何额外的系统权限，也不会对外连接。"
  risks: []

smoke:
  - name: nginx-ready
    resource: deployment/nginx
    timeout: 180s
    http:
      service: nginx
      port: 8080
      path: /
      status: 200
      contains: Hello from Nginx deployed on Zeabur!
