apiVersion: catalog.zeabur.com/v1
kind: Template
metadata:
  name: Ghost
  version: "6-alpine"
  description: >-
    Ghost 6 publishing with a real MySQL dependency, persistent content and
    external SMTP.
  license: MIT AND GPL-2.0-only
  # Also: https://github.com/docker-library/mysql, https://github.com/TryGhost/ghost-docker
  homepage: https://github.com/TryGhost/Ghost
  icon: https://github.com/TryGhost.png
  categories: [cms]

requires: [ingress/traefik, certificates/cert-manager]

services:
  - name: ghost
    securityProfile: restricted
    ports: [{name: http, port: 2368}]
    resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "2", memory: 1Gi}}
  - name: ghost-mysql
    securityProfile: restricted
    ports: [{name: mysql, port: 3306}]
    resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "2", memory: 1Gi}}

inputs:
  - name: databasePassword
    description: Password for the least-privilege ghost MySQL application user.
    generate: random
    secret: {name: ghost-secrets, key: database-password}
    validation: {pattern: '^[A-Za-z0-9_-]{43}$'}
  - name: mysqlRootPassword
    description: Local MySQL administrator password; never used by Ghost.
    generate: random
    secret: {name: ghost-secrets, key: root-password}
    validation: {pattern: '^[A-Za-z0-9_-]{43}$'}
  - name: smtpHost
    label: SMTP host
    locales:
      zh-TW:
        label: SMTP 主機
        description: "寄送系統信件用的外部 SMTP 主機名稱。"
      zh-CN:
        label: SMTP 主机
        description: "发送系统邮件用的外部 SMTP 主机名。"
    description: External SMTP hostname for transactional email.
    required: true
    validation: {pattern: '^[A-Za-z0-9](?:[A-Za-z0-9.-]*[A-Za-z0-9])?$'}
  - name: smtpPort
    label: SMTP port
    locales:
      zh-TW:
        label: SMTP 連接埠
        description: "465（直接 TLS）或 587（STARTTLS）。"
      zh-CN:
        label: SMTP 端口
        description: "465（直接 TLS）或 587（STARTTLS）。"
    description: 'SMTP TLS port: 465 for implicit TLS or 587 for STARTTLS.'
    required: true
    validation: {pattern: ^(465|587)$}
  - name: smtpFrom
    label: Sender address
    locales:
      zh-TW:
        label: 寄件人地址
        description: "系統信件的寄件人 Email。"
      zh-CN:
        label: 发件人地址
        description: "系统邮件的发件人邮箱。"
    description: Transactional mail From address.
    required: true
    validation: {pattern: '^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$'}
  - name: smtpSecret
    label: SMTP credentials secret
    locales:
      zh-TW:
        label: SMTP 認證資訊的機密
        description: "這個專案裡現有的機密，含 SMTP 服務的 username 和 password。部署前先建立。"
      zh-CN:
        label: SMTP 凭证的机密
        description: "这个项目里现有的机密，含 SMTP 服务的 username 和 password。部署前先创建。"
    description: >-
      Existing namespace Secret containing username and password for your SMTP
      provider. Create it before deploying.
    required: true
    validation: {pattern: '^[a-z0-9](?:[a-z0-9.-]*[a-z0-9])?$'}

security:
  summary: >-
    Namespaced, digest-pinned non-root workloads with read-only roots, no API
    token, dropped capabilities. Outbound traffic is not limited.
  risks:
    - risk: The initial Ghost setup page allows the first visitor to create the site owner.
      mitigation: >-
        Complete the native setup right after the deploy finishes. /ghost and
        its APIs are open to anyone who can reach the domain; Ghost has its own
        sign-in. To limit who can reach /ghost, add an IP limit in the
        service's network settings.
    - risk: MySQL runs as a plain StatefulSet without an operator.
      mitigation: >-
        Keep one replica, protect both MySQL and content backups off-node, and
        add a catalog MySQL operator before promising HA or automated PITR.
    - risk: >-
        Transactional SMTP and newsletter providers are external dependencies.
      mitigation: >-
        Supply a preexisting SMTP Secret, configure Mailgun in Ghost for bulk
        newsletters, and protect provider credentials in backups. Self-hosted
        ActivityPub and Tinybird analytics are not included.

scalability:
  summary: >-
    One writable instance backed by one volume. The template has no high
    availability.
  replicas: 1
  maxReplicas: 1
  blockers:
    - >-
      A node-local default StorageClass, such as local-path, has no snapshots
      or failover.
    - >-
      A single writable application instance is intentional; do not increase
      replicas without an application-specific storage/database design.

upgradeNotes:
  - >-
    Breaking change: the template no longer ships its default-deny and per-pod
    NetworkPolicies, because the installer isolates project namespaces. Applying
    this version does not delete the old ones. Delete them with `kubectl delete
    networkpolicy ghost-default-deny ghost-network ghost-mysql-network`.
  - >-
    Back up persistent application data and its database to storage outside the
    node before updating the image digest.
  - >-
    Restore into a separate namespace before upgrading. Image rollback does not
    reverse Ghost or MySQL schema migrations.
  - >-
    Fresh deployments use MySQL 8.4 LTS, which Ghost's official hosting guide
    supports. Existing 8.0 volumes require a rehearsed backup/restore or
    supported upgrade. MySQL 8.4 disables mysql_native_password by default;
    migrate those users to caching_sha2_password before upgrading.
  - >-
    MySQL initialization credentials apply only to empty data directories; use
    SQL for subsequent rotation. Back up MySQL and Ghost content together.

smoke:
  - name: application-ready
    resource: statefulset/ghost
    condition: jsonpath={.status.readyReplicas}=1
    timeout: 600s
  - name: mysql-ready
    resource: statefulset/ghost-mysql
    condition: jsonpath={.status.readyReplicas}=1
    timeout: 600s
