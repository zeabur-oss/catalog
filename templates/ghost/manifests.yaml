apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ghost-data
  namespace: '{{ .Namespace }}'
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ghost
  namespace: '{{ .Namespace }}'
spec:
  serviceName: ghost
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ghost
  template:
    metadata:
      labels:
        templates.zeabur.com/template: ghost
        app.kubernetes.io/name: ghost
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: ghost
        image: ghost:6-alpine@sha256:4195f6c405e40230cd10c0770425cf500c1f542a96e9f6584c11649c150e5a89
        ports:
        - name: http
          containerPort: 2368
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '2'
            memory: 1Gi
        env:
        - name: url
          value: https://{{ .Domain }}
        - name: database__client
          value: mysql
        - name: database__connection__host
          value: moco-ghost-mysql-primary
        - name: database__connection__database
          value: ghost
        - name: database__connection__user
          value: ghost
        - name: database__connection__port
          value: '3306'
        - name: database__connection__password
          valueFrom:
            secretKeyRef:
              name: ghost-mysql-app
              key: password
        - name: mail__transport
          value: SMTP
        - name: mail__from
          value: '{{ .Inputs.smtpFrom }}'
        - name: mail__options__host
          value: '{{ .Inputs.smtpHost }}'
        - name: mail__options__port
          value: '{{ .Inputs.smtpPort }}'
        - name: mail__options__secure
          value: '{{ .Inputs.smtpSecure }}'
        - name: mail__options__requireTLS
          value: 'true'
        - name: mail__options__auth__user
          valueFrom:
            secretKeyRef:
              name: '{{ .Inputs.smtpSecret }}'
              key: username
        - name: mail__options__auth__pass
          valueFrom:
            secretKeyRef:
              name: '{{ .Inputs.smtpSecret }}'
              key: password
        - name: logging__transports
          value: '["stdout"]'
        volumeMounts:
        - name: data
          mountPath: /var/lib/ghost/content
        - name: tmp
          mountPath: /tmp
        startupProbe:
          tcpSocket:
            port: http
          failureThreshold: 120
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /ghost/api/admin/site/
            port: http
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: http
          periodSeconds: 20
          failureThreshold: 6
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: ghost-data
      - name: tmp
        emptyDir:
          sizeLimit: 512Mi
      terminationGracePeriodSeconds: 60
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ghost-setup
  namespace: '{{ .Namespace }}'
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        templates.zeabur.com/template: ghost
        app.kubernetes.io/name: ghost-setup
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: setup
        image: ghost:6-alpine@sha256:4195f6c405e40230cd10c0770425cf500c1f542a96e9f6584c11649c150e5a89
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        env:
        - name: DOMAIN
          value: '{{ .Domain }}'
        - name: OWNER_EMAIL
          value: '{{ .Inputs.ownerEmail }}'
        - name: OWNER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ghost-secrets
              key: admin-password
        command:
        - node
        - -e
        - |
          const http = require('http');
          const call = (method, body) => new Promise((ok, fail) => {
            const r = http.request({host: 'ghost', port: 2368, path: '/ghost/api/admin/authentication/setup/', method,
              headers: {Host: process.env.DOMAIN, 'X-Forwarded-Proto': 'https', 'Content-Type': 'application/json'}},
              (res) => { let d = ''; res.on('data', (c) => d += c); res.on('end', () => ok({status: res.statusCode, body: d})); });
            r.on('error', fail);
            r.end(body);
          });
          (async () => {
            for (let i = 0; i < 300; i++) {
              try {
                const g = await call('GET');
                if (g.status === 200) {
                  if (JSON.parse(g.body).setup[0].status) return;
                  const p = await call('POST', JSON.stringify({setup: [{name: 'Owner', email: process.env.OWNER_EMAIL,
                    password: process.env.OWNER_PASSWORD, blogTitle: process.env.DOMAIN}]}));
                  if (p.status === 200 || p.status === 201) return;
                  console.error('setup answered', p.status);
                }
              } catch (e) {}
              await new Promise((r) => setTimeout(r, 2000));
            }
            process.exit(1);
          })();
---
apiVersion: v1
kind: Service
metadata:
  name: ghost
  namespace: '{{ .Namespace }}'
spec:
  selector:
    app.kubernetes.io/name: ghost
  ports:
  - name: http
    port: 2368
    targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ghost
  namespace: '{{ .Namespace }}'
  annotations:
    cert-manager.io/cluster-issuer: '{{ .ClusterIssuer }}'
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - '{{ .Domain }}'
    secretName: ghost-tls
  rules:
  - host: '{{ .Domain }}'
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ghost
            port:
              number: 2368
---
# The annotations name the database and the Secret of its user, so Zeabur OSS
# connects services as that user. MOCO's pods run as 10000.
apiVersion: moco.cybozu.com/v1beta2
kind: MySQLCluster
metadata:
  name: ghost-mysql
  namespace: '{{ .Namespace }}'
  annotations:
    zeabur.com/app-database: ghost
    zeabur.com/app-secret: ghost-mysql-app
spec:
  replicas: 1
  podTemplate:
    metadata:
      labels:
        templates.zeabur.com/template: ghost
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: mysqld
        image: ghcr.io/cybozu-go/moco/mysql:8.4.10.1@sha256:bdb88ae2023dcba0218bf900c7f39117c7a6e4101de6b5c8f62774c1d897b68a
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '2'
            memory: 1Gi
        securityContext: &system
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
    overwriteContainers:
    - name: agent
      securityContext: *system
    - name: moco-init
      securityContext: *system
    - name: copy-moco-init
      securityContext: *system
    - name: slow-log
      securityContext: *system
  volumeClaimTemplates:
  - metadata:
      name: mysql-data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
---
# MOCO makes no database. This Job waits for the primary, then makes the ghost
# database and user as moco-writable. The passwords go in through a file
# descriptor and standard input, so no process's arguments hold them.
apiVersion: batch/v1
kind: Job
metadata:
  name: ghost-mysql-app-setup
  namespace: '{{ .Namespace }}'
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        templates.zeabur.com/template: ghost
        app.kubernetes.io/name: ghost-mysql-app-setup
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: setup
        image: ghcr.io/cybozu-go/moco/mysql:8.4.10.1@sha256:bdb88ae2023dcba0218bf900c7f39117c7a6e4101de6b5c8f62774c1d897b68a
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        env:
        - name: HOST
          value: moco-ghost-mysql-primary
        - name: WRITABLE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: moco-ghost-mysql
              key: WRITABLE_PASSWORD
        - name: APP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ghost-mysql-app
              key: password
        command:
        - bash
        - -c
        - |
          set -eu
          sql() { mysql --defaults-extra-file=<(printf '[client]\npassword=%s\n' "$WRITABLE_PASSWORD") -h "$HOST" -u moco-writable "$@"; }
          for _ in $(seq 120); do sql -e 'SELECT 1' >/dev/null 2>&1 && break; sleep 5; done
          sql <<SQL
          CREATE DATABASE IF NOT EXISTS ghost;
          CREATE USER IF NOT EXISTS 'ghost'@'%' IDENTIFIED BY '$APP_PASSWORD';
          GRANT ALL ON ghost.* TO 'ghost'@'%';
          SQL
