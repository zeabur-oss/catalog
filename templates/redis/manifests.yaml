apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis
  namespace: '{{ .Namespace }}'
automountServiceAccountToken: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: '{{ .Namespace }}'
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis
  namespace: '{{ .Namespace }}'
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes: [Ingress, Egress]
  ingress:
  - from:
    - podSelector:
        matchLabels:
          templates.zeabur.com/database-client: redis
    - podSelector:
        matchLabels:
          templates.zeabur.com/dragonfly-backup: redis
    ports:
    - protocol: TCP
      port: 6379
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dragonfly-operator-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: dragonfly-operator
    ports:
    - protocol: TCP
      port: 9999
  egress:
  - {{ dnsEgress }}
  - to:
    - ipBlock:
        cidr: '{{ .Inputs.backupCidr }}'
    ports:
    - protocol: TCP
      port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-initial
  namespace: '{{ .Namespace }}'
spec:
  podSelector:
    matchLabels:
      templates.zeabur.com/dragonfly-backup: redis
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  - {{ dnsEgress }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: redis-initial
  namespace: '{{ .Namespace }}'
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        templates.zeabur.com/dragonfly-backup: redis
    spec:
      restartPolicy: Never
      serviceAccountName: redis
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: snapshot
        image: docker.dragonflydb.io/dragonflydb/dragonfly:v2.0.2@sha256:061f00b201b58e12f974e4e96c761a881ee1c05e9d8ee967466a604b7299753b
        command: [/bin/sh, -ec]
        args:
        - |
          until test "$(redis-cli -h redis --raw -e PING 2>/dev/null)" = PONG; do sleep 2; done
          snapshot="dump-$(date -u +%Y-%m-%dT%H:%M:%S)"
          test "$(redis-cli -h redis --raw -e SAVE DF "$BACKUP_DESTINATION" "$snapshot")" = OK
          info="$(redis-cli -h redis --raw -e INFO persistence | tr -d '\r')"
          printf '%s\n' "$info" | grep -qx 'saving:0'
          printf '%s\n' "$info" | grep -Fqx "last_saved_file:${BACKUP_DESTINATION}/${snapshot}-summary.dfs"
          printf '%s\n' "$info" | grep -Eq '^last_success_save:[1-9][0-9]*$'
          test "$(redis-cli -h redis --raw -e LASTSAVE)" -gt 0
          printf 'Completed native Dragonfly S3 snapshot: %s/%s-summary.dfs\n' "$BACKUP_DESTINATION" "$snapshot"
        env:
        - name: REDISCLI_AUTH
          valueFrom:
            secretKeyRef:
              name: redis-secrets
              key: password
        - name: BACKUP_DESTINATION
          value: '{{ .Inputs.backupDestination }}'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
---
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: redis
  namespace: '{{ .Namespace }}'
spec:
  replicas: 1
  image: docker.dragonflydb.io/dragonflydb/dragonfly:v2.0.2@sha256:061f00b201b58e12f974e4e96c761a881ee1c05e9d8ee967466a604b7299753b
  serviceAccountName: redis
  args:
  - --proactor_threads=1
  - --maxmemory=768mb
  - --cache_mode=false
  - --dbnum=16
  - --logtostderr=true
  - --s3_endpoint={{ .Inputs.backupEndpoint }}
  - --s3_use_https=true
  - --s3_ec2_metadata=false
  authentication:
    passwordFromSecret:
      name: redis-secrets
      key: password
  env:
  - name: AWS_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: '{{ .Inputs.backupSecret }}'
        key: ACCESS_KEY_ID
  - name: AWS_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: '{{ .Inputs.backupSecret }}'
        key: ACCESS_SECRET_KEY
  - name: AWS_REGION
    value: '{{ .Inputs.backupRegion }}'
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  # Do not set snapshot.persistentVolumeClaimSpec with an S3 URI: this chart
  # uses snapshot.dir as mountPath, which would produce an invalid Pod.
  snapshot:
    dir: '{{ .Inputs.backupDestination }}'
    cron: '*/5 * * * *'
    enableOnMasterOnly: true
