apiVersion: catalog.zeabur.com/v1
kind: Template
metadata:
  name: Dragonfly (Redis-compatible)
  description: >-
    Authenticated Redis-compatible Dragonfly endpoint with operator-managed S3
    snapshots.
  license: BUSL-1.1 AND Apache-2.0
  # Also: https://github.com/dragonflydb/dragonfly-operator, https://github.com/dragonflydb/dragonfly/blob/v2.0.2/LICENSE.md
  homepage: https://github.com/dragonflydb/dragonfly
  icon: https://service-icons.zeabur.com/marketplace/redis.svg
  categories: [databases]

requires: [databases/dragonfly-operator]

services:
  - name: redis
    securityProfile: restricted
    ports: [{name: redis, port: 6379}]
    resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 1000m, memory: 1Gi}}

inputs:
  - name: licenseOptIn
    description: >-
      Read Dragonfly v2.0.2 BUSL-1.1: no third-party hosted/managed Dragonfly
      service or in-memory data store product under its Additional Use Grant. A
      separate license may be required. Type I-ACCEPT-DRAGONFLY-BUSL-1.1.
    required: true
    validation: {pattern: ^I-ACCEPT-DRAGONFLY-BUSL-1\.1$}
  - name: redisPassword
    description: Deploy-time generated endpoint password; preserve across upgrades.
    generate: random
    secret: {name: redis-secrets, key: password}
    validation: {pattern: '^[A-Za-z0-9_-]{43}$'}
  - name: backupDestination
    description: Existing S3 bucket and unique Dragonfly snapshot prefix.
    required: true
    validation:
      pattern: ^s3://[a-z0-9][a-z0-9.-]+/[A-Za-z0-9_-]+(/[A-Za-z0-9_-]+)*$
  - name: backupEndpoint
    description: >-
      S3-compatible endpoint DNS name using HTTPS TCP443 with a publicly trusted
      certificate; omit scheme. A custom CA is not supported.
    required: true
    validation: {pattern: '^[A-Za-z0-9][A-Za-z0-9.-]+$'}
  - name: backupRegion
    description: Region for the existing S3 snapshot bucket.
    required: true
    validation: {pattern: '^[A-Za-z0-9-]+$'}
  - name: backupSecret
    description: >-
      Existing namespaced S3 credentials Secret with ACCESS_KEY_ID and
      ACCESS_SECRET_KEY. The template does not generate cloud keys.
    required: true
    validation: {pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'}
  - name: backupCidr
    description: IPv4 CIDR for the S3 HTTPS endpoint as seen by the CNI.
    required: true
    validation: {pattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[12][0-9]|3[0-2])$'}

security:
  summary: >-
    Authenticated, digest-pinned Dragonfly CR; nonroot UID999 restricted pods
    with tokenless service account; namespace default deny and scoped
    operator-only admin access.
  egress: [CoreDNS TCP/UDP53., S3 snapshot endpoint CIDR TCP443.]
  risks:
    - risk: >-
        The Dragonfly engine is BUSL-1.1 source-available software. The
        Apache-2.0 operator license does not apply to the engine. The v2.0.2
        license changes to Apache-2.0 on 2030-11-01.
      mitigation: >-
        Required exact licenseOptIn=I-ACCEPT-DRAGONFLY-BUSL-1.1. Do not offer a
        third-party hosted or managed Dragonfly service or an in-memory data
        store product without a commercial license.
    - risk: >-
        Dragonfly speaks the Redis protocol but does not run Redis modules.
        TimeSeries, T-Digest and AutoSuggest are unsupported, Search and Bloom
        are partial, and MODULE LOAD is unsupported. Default Lua scripts must
        declare their keys.
      mitigation: >-
        Check each client's commands, Lua scripts and transactions before
        cutover. Migrate data logically; do not load old AOF or RDB files.
    - risk: >-
        Writes after the last successful S3 snapshot are lost on crash.
        Snapshots run every five minutes; if snapshots fail, the loss window
        grows. There is no AOF or point-in-time recovery.
      mitigation: >-
        The initial authenticated synchronous SAVE Job must complete. Monitor
        scheduled snapshot uploads, apply bucket lifecycle rules and rehearse
        restores in an isolated namespace.
    - risk: >-
        Eviction is disabled (--cache_mode=false). Writes fail when the memory
        limit is reached.
      mitigation: Size the memory limit for the full data set and monitor memory use.
    - risk: Dragonfly admin port 9999 is unauthenticated.
      mitigation: >-
        No public Service or Ingress exposes the admin port. NetworkPolicy
        allows 9999 only from the catalog operator namespace.

scalability:
  summary: >-
    One operator-managed in-memory Dragonfly instance. Native S3 snapshots hold
    the recovery state. There is no HA.
  replicas: 1
  maxReplicas: 1
  blockers:
    - Single instance has no service continuity during pod/node failure.
    - Recovery restores the last successful snapshot only.
    - Redis cluster mode is disabled.

upgradeNotes:
  - >-
    The endpoint is redis:6379 with redis-secrets/password and 16 logical
    databases. Authorized same-namespace clients require
    templates.zeabur.com/database-client=redis.
  - >-
    Preserve generated Secrets and S3 snapshots. Durability comes from
    five-minute scheduled snapshots; writes after the last successful snapshot
    are lost. Do not mount Redis Stack or Valkey AOF or RDB files into
    Dragonfly.
  - >-
    Applications that use Redis modules (Search, JSON, TimeSeries, Bloom or
    others) need separate compatibility testing before migration.
  - >-
    Callers that use dynamic undeclared keys in Lua scripts need a changed
    engine configuration and a performance check.
  - Password rotation requires a coordinated restart of the engine and all clients.
  - >-
    The S3 credentials need list, get and put permissions, plus multipart upload
    if the endpoint requires it. Use a dedicated prefix.
  - >-
    Job/redis-initial runs once. Reapplying it does not take a new snapshot.
    Before each upgrade, run a separately named Job with the same SAVE command
    and confirm it completes.
  - >-
    Startup autoload selects the newest LastModified matching
    dump-YYYY-MM-DDTHH:MM:SS-summary.dfs and all corresponding shards from the
    exact S3 prefix. Keep the summary file and every DFS shard file. A wrong or
    empty prefix starts an empty database. Restore with the same engine version
    and verify sentinel keys and logical DBs in isolation before allowing
    writers.
  - >-
    Read the pinned BUSL-1.1 restrictions before deploying. Use of the
    self-hosted template does not grant a hosted-service license.

smoke:
  - name: Dragonfly ready
    resource: dragonfly/redis
    condition: jsonpath={.status.phase}=Ready
    timeout: 900s
  - name: Initial S3 snapshot completed
    resource: job/redis-initial
    condition: condition=Complete
    timeout: 600s
