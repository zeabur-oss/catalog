apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-data
  namespace: {{ .Namespace }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 10Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: {{ .Namespace }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: n8n}
  template:
    metadata:
      labels: {app.kubernetes.io/name: n8n, templates.zeabur.com/template: n8n-ai-brain}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: n8n
          image: n8nio/n8n:2.44.6@sha256:d02752c6ab446ae9db8deec2f9cc887c378f77cdcad31650814df936b7386dfb
          env:
            - {name: DB_TYPE, value: postgresdb}
            - {name: DB_POSTGRESDB_HOST, value: n8n-db-rw}
            - {name: DB_POSTGRESDB_DATABASE, value: n8n}
            - {name: DB_POSTGRESDB_USER, value: n8n}
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom:
                secretKeyRef: {name: n8n-db-app, key: password}
            - {name: DB_POSTGRESDB_SSL_ENABLED, value: 'true'}
            - {name: DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED, value: 'true'}
            - name: DB_POSTGRESDB_SSL_CA
              valueFrom:
                secretKeyRef: {name: n8n-db-ca, key: ca.crt}
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef: {name: app-secrets, key: encryption-key}
            - name: N8N_USER_MANAGEMENT_JWT_SECRET
              valueFrom:
                secretKeyRef: {name: app-secrets, key: jwt-key}
            - name: N8N_RUNNERS_AUTH_TOKEN
              valueFrom:
                secretKeyRef: {name: app-secrets, key: runner-token}
            - {name: N8N_RUNNERS_MODE, value: external}
            - {name: N8N_RUNNERS_BROKER_LISTEN_ADDRESS, value: '0.0.0.0'}
            - {name: N8N_NATIVE_PYTHON_RUNNER, value: 'true'}
            - {name: N8N_HOST, value: '{{ .Domain }}'}
            - {name: N8N_PROTOCOL, value: https}
            - {name: WEBHOOK_URL, value: 'https://{{ .Domain }}/'}
            - {name: N8N_EDITOR_BASE_URL, value: 'https://{{ .Domain }}/'}
            - {name: N8N_PROXY_HOPS, value: '1'}
            - {name: GENERIC_TIMEZONE, value: Asia/Taipei}
            - {name: TZ, value: Asia/Taipei}
            - {name: N8N_DIAGNOSTICS_ENABLED, value: 'false'}
            - {name: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS, value: 'true'}
            - {name: N8N_BLOCK_ENV_ACCESS_IN_NODE, value: 'true'}
            - {name: N8N_COMMUNITY_PACKAGES_ENABLED, value: 'false'}
          ports:
            - {name: http, containerPort: 5678}
            - {name: broker, containerPort: 5679}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 1000m, memory: 1Gi}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet: {path: /healthz/readiness, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            - {name: data, mountPath: /home/node/.n8n}
            - {name: tmp, mountPath: /tmp}
            - {name: cache, mountPath: /home/node/.cache}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: n8n-data}
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
        - name: cache
          emptyDir: {sizeLimit: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: n8n-broker
  namespace: {{ .Namespace }}
spec:
  selector: {app.kubernetes.io/name: n8n}
  ports: [{name: broker, port: 5679, targetPort: broker}]
---
apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: {{ .Namespace }}
spec:
  selector: {app.kubernetes.io/name: n8n}
  ports: [{name: http, port: 5678, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: n8n
  namespace: {{ .Namespace }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .ClusterIssuer }}
spec:
  ingressClassName: traefik
  tls:
    - hosts: [{{ .Domain }}]
      secretName: n8n-tls
  rules:
    - host: {{ .Domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: n8n
                port: {name: http}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: n8n-ai-brain-default-deny
  namespace: {{ .Namespace }}
spec:
  podSelector: {matchLabels: {templates.zeabur.com/template: n8n-ai-brain}}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: n8n-network
  namespace: {{ .Namespace }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: n8n, templates.zeabur.com/template: n8n-ai-brain}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: traefik}
          podSelector:
            matchLabels: {app.kubernetes.io/name: traefik}
      ports: [{protocol: TCP, port: 5678}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: n8n-internal
  namespace: {{ .Namespace }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: n8n, templates.zeabur.com/template: n8n-ai-brain}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: n8n-runners, templates.zeabur.com/template: n8n-ai-brain}
      ports: [{protocol: TCP, port: 5679}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: n8n-runners-network
  namespace: {{ .Namespace }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: n8n-runners, templates.zeabur.com/template: n8n-ai-brain}
  policyTypes: [Ingress, Egress]
  egress:
    - {{ dnsEgress }}
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: n8n, templates.zeabur.com/template: n8n-ai-brain}
      ports: [{protocol: TCP, port: 5679}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: n8n-db-connectivity
  namespace: {{ .Namespace }}
spec:
  podSelector:
    matchLabels: {cnpg.io/cluster: n8n-db, templates.zeabur.com/template: n8n-ai-brain}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: n8n, templates.zeabur.com/template: n8n-ai-brain}
      ports: [{protocol: TCP, port: 5432}]
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: cnpg-system}
          podSelector:
            matchLabels: {app.kubernetes.io/name: cloudnative-pg}
      ports: [{protocol: TCP, port: 8000}, {protocol: TCP, port: 5432}]
    - from:
        - podSelector:
            matchLabels: {cnpg.io/cluster: n8n-db, templates.zeabur.com/template: n8n-ai-brain}
      ports: [{protocol: TCP, port: 5432}, {protocol: TCP, port: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n-runners
  namespace: {{ .Namespace }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: n8n-runners}
  template:
    metadata:
      labels: {app.kubernetes.io/name: n8n-runners, templates.zeabur.com/template: n8n-ai-brain}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: runners
          image: n8nio/runners:2.44.6@sha256:255e69ed23d8b3866e593f6e105e7e12cafc81c4d1966a8f8702115af1032461
          env:
            - {name: N8N_RUNNERS_TASK_BROKER_URI, value: 'http://n8n-broker:5679'}
            - name: N8N_RUNNERS_AUTH_TOKEN
              valueFrom:
                secretKeyRef: {name: app-secrets, key: runner-token}
          ports: [{name: health, containerPort: 5680}]
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 1000m, memory: 1Gi}
          startupProbe:
            httpGet: {path: /healthz, port: health}
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet: {path: /healthz, port: health}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            periodSeconds: 20
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
---
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: n8n-db
  namespace: {{ .Namespace }}
spec:
  inheritedMetadata:
    labels:
      templates.zeabur.com/template: n8n-ai-brain
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17-minimal-trixie@sha256:1f10c3907a0da5ea3da137a3e79315b5d5a67da64212a2ede38f824cf9014f93
  enableSuperuserAccess: false
  enablePDB: true
  postgresUID: 26
  postgresGID: 26
  seccompProfile: {type: RuntimeDefault}
  bootstrap:
    initdb:
      database: n8n
      owner: n8n
      encoding: UTF8
  storage:
    size: 10Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: '1', memory: 1Gi}
---
