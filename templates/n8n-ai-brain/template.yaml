apiVersion: catalog.zeabur.com/v1
kind: Template
metadata:
  name: n8n (AI Brain)
  version: "2.44.6"
  description: >-
    Workflow automation with PostgreSQL17 and isolated external code runners.
    Licensed under the n8n Sustainable Use License
    (https://docs.n8n.io/sustainable-use-license/): internal business,
    personal or noncommercial use only.
  license: LicenseRef-n8n-Sustainable-Use AND PostgreSQL AND Apache-2.0
  # Also: https://cloudnative-pg.io/
  homepage: https://github.com/n8n-io/n8n
  icon: https://github.com/n8n-io.png
  categories: [ai, automation]

requires:
  - ingress/traefik
  - certificates/cert-manager
  - databases/cloudnative-pg

services:
  - name: n8n
    securityProfile: restricted
    ports: [{name: http, port: 5678}, {name: broker, port: 5679}]
    resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 1000m, memory: 1Gi}}
    domains: ['{{ .Domain }}']
  - {name: n8n-runners, securityProfile: restricted, ports: [{name: health, port: 5680}], resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 1000m, memory: 1Gi}}}
  - name: n8n-db
    securityProfile: restricted
    ports: [{name: postgresql, port: 5432}]
    resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 1000m, memory: 1Gi}}

inputs:
  - name: ownerEmail
    label: Owner email
    locales:
      zh-TW:
        label: 擁有者 Email
        description: "n8n 擁有者帳號的 Email，第一次有人連進來之前就會建立好。密碼會自動產生，放在機密 app-secrets 的 owner-password。"
      zh-CN:
        label: 所有者邮箱
        description: "n8n 所有者账号的邮箱，第一次有人访问之前就会创建好。密码会自动生成，放在机密 app-secrets 的 owner-password。"
    description: >-
      Owner email; the account is provisioned before the first public request.
      The password is generated in app-secrets/owner-password.
    required: true
    validation: {pattern: '^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$'}
  - name: ownerPassword
    description: Generated owner password; preserve it across upgrades.
    generate: random
    secret: {name: app-secrets, key: owner-password}
    validation: {pattern: '^[A-Za-z0-9_-]{43}$'}
  - name: encryptionKey
    description: >-
      Encryption key for stored workflow credentials. Preserve permanently with
      encrypted backups.
    generate: random
    secret: {name: app-secrets, key: encryption-key}
    validation: {pattern: '^[A-Za-z0-9_-]{43}$'}
  - name: runnerToken
    description: Shared authentication token for isolated external JavaScript/Python runners.
    generate: random
    secret: {name: app-secrets, key: runner-token}
    validation: {pattern: '^[A-Za-z0-9_-]{43}$'}
  - name: jwtKey
    description: Persistent user-management JWT secret.
    generate: random
    secret: {name: app-secrets, key: jwt-key}
    validation: {pattern: '^[A-Za-z0-9_-]{43}$'}

security:
  summary: >-
    Non-root restricted app and isolated external runners, no app API tokens,
    read-only roots. The editor, webhooks and forms are open on the public HTTPS
    domain. Runners reach only n8n and DNS; other outbound traffic is not
    limited. CNPG owns scoped database RBAC/tokens.
  unauthenticated: [n8n-runners]
  risks:
    - risk: >-
        n8n is fair-code under the Sustainable Use License, which restricts use
        and distribution. It is not OSI open source.
      mitigation: >-
        The template description names the license. Use only under the
        internal-business, personal or noncommercial grants, or obtain a
        separate license.
    - risk: >-
        Workflow authors can access
        connected credentials and public webhook triggers can be abused.
      mitigation: >-
        The owner is created before n8n starts, from ownerEmail and a generated
        password in app-secrets/owner-password, so no visitor can claim it. The
        editor, webhooks and forms are open to anyone who can reach the domain;
        n8n has its own sign-in. To limit who can reach them, add an IP limit in the
        service's network settings. Authenticate each webhook in workflow
        design. Limit authors to trusted operators; the instance is no sandbox
        for untrusted tenant workflows. Community package installation is
        disabled.
    - risk: >-
        The runners execute workflow code and have no sign-in of their own.
      mitigation: >-
        They keep a NetworkPolicy that admits no incoming connections and lets
        them reach only n8n and DNS. It is the only NetworkPolicy in the
        template; namespace isolation covers the rest.
    - risk: >-
        CNPG instance managers require Kubernetes API permissions.
      mitigation: >-
        Use the catalog CNPG installation and operator-managed scoped service
        accounts.
    - risk: N8N_PROXY_HOPS=1 assumes Traefik is the only proxy in front of n8n.
      mitigation: >-
        Change N8N_PROXY_HOPS if you add another proxy or load balancer that
        sets forwarding headers.

scalability:
  summary: >-
    One n8n main, one runner and one PostgreSQL primary. RWO volumes on a
    node-local StorageClass have no HA.
  replicas: 1
  maxReplicas: 1
  blockers:
    - >-
      Horizontal n8n execution requires separately designed queue mode, worker
      runners, shared binary storage and Redis/Valkey; no naive replica
      increase.
    - >-
      A node-local StorageClass has no snapshots. Database backups do not
      include the application PVC or the encryption key: stop n8n and copy the
      PVC and encrypted app-secrets off-node.

upgradeNotes:
  - >-
    Breaking change: the template no longer ships its default-deny and per-pod
    NetworkPolicies, because the installer isolates project namespaces. Applying
    this version does not delete the old ones. Delete them with `kubectl delete
    networkpolicy n8n-ai-brain-default-deny n8n-network n8n-internal
    n8n-db-connectivity`. n8n-runners-network stays.
  - >-
    New installs start without database backups. Installs made before this
    version keep their backups. To turn backups on, open the database in Zeabur
    and use the Backups tab.
  - >-
    PostgreSQL 17 runs as a CNPG Cluster with generated least-privilege app
    credentials and CA-verified TLS.
  - >-
    Back up PostgreSQL, restore it to a separate cluster and preserve n8n
    encryption/JWT keys plus application PVC before upgrade. After restore,
    check that stored credentials decrypt and workflows run. Never rotate the
    encryption key without upstream credential migration.
  - >-
    Keep n8n and external runner image versions identical. Read n8n database
    migration notes and PostgreSQL minor changes; never change database major
    through an ordinary digest update. Do not downgrade n8n after it has
    migrated the database.
  - >-
    Breaking change: ownerEmail is a new required input. The owner now comes
    from deployment variables, as in the n8n template: change the password by
    editing app-secrets/owner-password and restarting n8n.
  - >-
    Breaking change: the adminCidr and licenseOptIn inputs are removed, and so
    are the admin allowlist and the separate webhook route. The editor and all
    routes are now open on the domain; add an IP limit in the service's
    network settings if you need one. Remove both inputs from saved values.
  - >-
    GENERIC_TIMEZONE and TZ are Asia/Taipei. Change them in the manifest if
    schedule triggers must use another timezone.
  - >-
    No SMTP server is configured. Invitations and password-reset mail need SMTP
    settings.

smoke:
  - name: database-ready
    resource: cluster/n8n-db
    condition: condition=Ready
    timeout: 600s
    sql: {cluster: n8n-db, database: n8n, query: SELECT 1, expect: "1"}
  - name: n8n-ready
    resource: deployment/n8n
    condition: condition=Available
    timeout: 600s
    http: {service: n8n, port: 5678, path: /healthz/readiness, status: 200}
  - name: runners-ready
    resource: deployment/n8n-runners
    condition: condition=Available
    timeout: 600s
