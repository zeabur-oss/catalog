apiVersion: catalog.zeabur.com/v1
kind: Template
metadata:
  name: Error pages
  version: "1.30.5-alpine-slim"
  description: >-
    Serves a maintenance page and error pages (404, 502, 503, 504) from HTML in a
    ConfigMap, for Traefik errors middlewares and Ingress or HTTPRoute backends
    in the same namespace.
  license: BSD-2-Clause AND Apache-2.0
  # Also: https://github.com/nginx/docker-nginx-unprivileged
  homepage: https://nginx.org/
  icon: https://www.svgrepo.com/show/373924/nginx.svg
  categories: [web-servers]

requires: [ingress/traefik]

services:
  - name: error-pages
    securityProfile: restricted
    # pages: GET /<status>.html. maintenance: status 503 and maintenance.html for every request.
    ports: [{name: pages, port: 8080}, {name: maintenance, port: 8081}]
    resources: {requests: {cpu: 5m, memory: 8Mi}, limits: {cpu: 100m, memory: 32Mi}}

security:
  summary: "The pod cannot reach the Kubernetes API. It runs as non-root UID 101 with a read-only filesystem and no extra capabilities, and it makes no outbound connections. The Service and the ConfigMap of pages carry the label zeabur.com/page-server=true, which Zeabur uses to find the page server."
  locales:
    zh-TW:
      summary: "Pod 無法存取 Kubernetes API。它以非 root 的 UID 101 執行，檔案系統唯讀，沒有多餘的權限，也不會主動對外連線。Service 和放頁面的 ConfigMap 都帶有 zeabur.com/page-server=true 標籤，Zeabur 靠這個標籤找到頁面伺服器。"
    zh-CN:
      summary: "Pod 无法访问 Kubernetes API。它以非 root 的 UID 101 运行，文件系统只读，没有多余的权限，也不会主动对外连接。Service 和存放页面的 ConfigMap 都带有 zeabur.com/page-server=true 标签，Zeabur 靠这个标签找到页面服务器。"
  risks:
    - risk: "Anyone who can edit the ConfigMap changes what visitors see."
      mitigation: "Give edit rights on ConfigMaps only to people who may change the site. The server sends the HTML as is and runs no code."
      locales:
        zh-TW:
          risk: "能編輯 ConfigMap 的人，就能改變訪客看到的內容。"
          mitigation: "只把 ConfigMap 的編輯權限給可以修改網站的人。伺服器會原封不動送出 HTML，不會執行任何程式。"
        zh-CN:
          risk: "能编辑 ConfigMap 的人，就能改变访客看到的内容。"
          mitigation: "只把 ConfigMap 的编辑权限给可以修改网站的人。服务器会原样送出 HTML，不会执行任何代码。"

scalability:
  summary: >-
    Stateless responses; replicas can scale horizontally. The pages come from
    the ConfigMap, and the kubelet updates them in every pod.
  replicas: 1
  maxReplicas: 10
  blockers:
    - >-
      One replica shows no pages while its pod restarts or moves. Add replicas
      and a PodDisruptionBudget when the maintenance page must stay up during
      node drains.

upgradeNotes:
  - >-
    Breaking change: the template no longer ships its default-deny and per-pod
    NetworkPolicies, because the installer isolates project namespaces. Applying
    this version does not delete the old ones. Delete them with `kubectl delete
    networkpolicy error-pages-default-deny error-pages`.
  - >-
    Check the nginx configuration in the error-pages-nginx ConfigMap and the
    image vulnerability reports before you accept a digest update.
  - No data migration. A rollback only reverts the image.

smoke:
  - name: pages
    resource: deployment/error-pages
    condition: condition=Available
    timeout: 180s
    http:
      service: error-pages
      port: 8080
      path: /502.html
      status: 200
      contains: Bad gateway
  - name: maintenance-port
    resource: deployment/error-pages
    condition: condition=Available
    timeout: 60s
    http:
      service: error-pages
      port: 8081
      path: /any/path
      status: 503
      contains: Down for maintenance
