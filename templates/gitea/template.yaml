apiVersion: catalog.zeabur.com/v1
kind: Template
metadata:
  name: Gitea
  version: "28.2.0-rootless"
  description: >-
    Gitea Git hosting over HTTPS, with repositories and LFS objects on a
    persistent volume and PostgreSQL 18 managed by CloudNativePG.
  license: MIT AND PostgreSQL AND Apache-2.0
  # Also: https://cloudnative-pg.io/
  homepage: https://about.gitea.com/
  icon: https://github.com/go-gitea.png
  categories: [developer-tools]

requires:
  - ingress/traefik
  - certificates/cert-manager
  - databases/cloudnative-pg

services:
  - name: gitea
    securityProfile: restricted
    ports: [{name: http, port: 3000}]
    resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "2", memory: 1Gi}}
    domains: ['{{ .Domain }}']
  - name: gitea-db
    securityProfile: restricted
    ports: [{name: postgresql, port: 5432}]
    resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}

inputs:
  - name: adminPassword
    description: >-
      Password of the administrator gitea_admin, created at the first start.
      Change it in Gitea after you sign in; the Secret is not applied again.
    generate: random
    secret: {name: gitea-secrets, key: admin-password}
    validation: {pattern: '^[A-Za-z0-9_-]{43}$'}
  - name: secretKey
    description: Encrypts stored credentials such as two-factor secrets. Keep it for the life of the database.
    generate: random
    secret: {name: gitea-secrets, key: secret-key}
    validation: {pattern: '^[A-Za-z0-9_-]{43}$'}
  - name: internalToken
    description: Authenticates Git hooks to the Gitea web process.
    generate: random
    secret: {name: gitea-secrets, key: internal-token}
    validation: {pattern: '^[A-Za-z0-9_-]{43}$'}
  - name: jwtSecret
    description: Signs OAuth2 tokens. Rotating it signs out OAuth2 clients.
    generate: random
    secret: {name: gitea-secrets, key: jwt-secret}
    validation: {pattern: '^[A-Za-z0-9_-]{43}$'}
  - name: lfsJwtSecret
    description: Signs Git LFS tokens.
    generate: random
    secret: {name: gitea-secrets, key: lfs-jwt-secret}
    validation: {pattern: '^[A-Za-z0-9_-]{43}$'}

security:
  summary: "The rootless image runs as UID 1000 with a read-only root filesystem, no service-account token and all capabilities dropped. Outbound traffic is not limited. Sign-up is closed and the install page is locked."
  locales:
    zh-TW:
      summary: "免 root 的映像檔以 UID 1000 執行，根檔案系統唯讀，沒有服務帳號 token，所有額外權限都拿掉了。對外連線沒有限制。註冊已關閉，安裝頁面也鎖住了。"
    zh-CN:
      summary: "免 root 的镜像以 UID 1000 运行，根文件系统只读，没有服务账号 token，所有额外权限都去掉了。对外连接没有限制。注册已关闭，安装页面也锁住了。"
  risks:
    - risk: "If the install page is not locked, the first visitor can configure the server."
      mitigation: "INSTALL_LOCK is true and the settings come from environment variables. Before Gitea starts, an init container creates the gitea_admin account with the generated password."
      locales:
        zh-TW:
          risk: "安裝頁面如果沒鎖，第一個來的訪客就能設定這台伺服器。"
          mitigation: "INSTALL_LOCK 設為 true，設定都來自環境變數。Gitea 啟動前，初始化容器會用產生好的密碼建立 gitea_admin 帳號。"
        zh-CN:
          risk: "安装页面如果没锁，第一个来的访客就能配置这台服务器。"
          mitigation: "INSTALL_LOCK 设为 true，配置都来自环境变量。Gitea 启动前，初始化容器会用生成好的密码创建 gitea_admin 账号。"
    - risk: "Anyone could register an account."
      mitigation: "DISABLE_REGISTRATION is true. The administrator creates users in Site Administration."
      locales:
        zh-TW:
          risk: "任何人都可以自己註冊帳號。"
          mitigation: "DISABLE_REGISTRATION 設為 true。使用者由管理員在網站管理裡建立。"
        zh-CN:
          risk: "任何人都可以自己注册账号。"
          mitigation: "DISABLE_REGISTRATION 设为 true。用户由管理员在站点管理里创建。"
    - risk: "Git over SSH does not work."
      mitigation: "The Ingress carries HTTP only, so the SSH server is off. Clone and push over HTTPS with a password or an access token."
      locales:
        zh-TW:
          risk: "無法使用 SSH 存取 Git。"
          mitigation: "Ingress 只轉送 HTTP，所以 SSH 伺服器是關閉的。請用 HTTPS 搭配密碼或存取 token 來 clone 和 push。"
        zh-CN:
          risk: "无法使用 SSH 访问 Git。"
          mitigation: "Ingress 只转发 HTTP，所以 SSH 服务器是关闭的。请用 HTTPS 搭配密码或访问 token 来 clone 和 push。"
    - risk: "Webhooks, mirrors and repository migrations make the server send requests to addresses that users choose."
      mitigation: "Gitea blocks private webhook targets by default. The template does not limit outbound traffic. To limit it, add an egress NetworkPolicy. No SMTP server is set up, so Gitea sends no email."
      locales:
        zh-TW:
          risk: "Webhook、鏡像和儲存庫遷移，都會讓伺服器去連使用者指定的位址。"
          mitigation: "Gitea 預設會擋掉指向私有位址的 webhook。範本沒有限制對外連線，想限制的話，請加上 egress NetworkPolicy。範本沒有設定 SMTP 伺服器，所以 Gitea 不會寄信。"
        zh-CN:
          risk: "Webhook、镜像和仓库迁移，都会让服务器去访问用户指定的地址。"
          mitigation: "Gitea 默认会拦截指向私有地址的 webhook。模板没有限制对外连接，想限制的话，请添加 egress NetworkPolicy。模板没有配置 SMTP 服务器，所以 Gitea 不会发邮件。"
    - risk: "The CloudNativePG database instances call the Kubernetes API with an identity that the operator creates."
      mitigation: "The databases/cloudnative-pg component creates the RBAC permissions for each cluster. The Gitea Pod has no token."
      locales:
        zh-TW:
          risk: "CloudNativePG 的資料庫實例會用 operator 建立的身分呼叫 Kubernetes API。"
          mitigation: "databases/cloudnative-pg 元件會為每個叢集建立對應的 RBAC 權限。Gitea 的 Pod 沒有 token。"
        zh-CN:
          risk: "CloudNativePG 的数据库实例会用 operator 创建的身份调用 Kubernetes API。"
          mitigation: "databases/cloudnative-pg 组件会为每个集群创建对应的 RBAC 权限。Gitea 的 Pod 没有 token。"
    - risk: "Repositories and LFS objects live on the volume, so the database backup does not include them."
      mitigation: "Back up the gitea-data volume separately, for example with gitea dump. Try a restore before you go to production."
      locales:
        zh-TW:
          risk: "儲存庫和 LFS 物件放在磁碟區上，資料庫備份不會包含它們。"
          mitigation: "請另外備份 gitea-data 磁碟區，例如用 gitea dump。正式上線前，先演練一次還原。"
        zh-CN:
          risk: "仓库和 LFS 对象放在卷上，数据库备份不会包含它们。"
          mitigation: "请另外备份 gitea-data 卷，例如用 gitea dump。正式上线前，先演练一次恢复。"

scalability:
  summary: One Gitea instance on a 20Gi volume, with one PostgreSQL primary.
  replicas: 1
  maxReplicas: 1
  blockers:
    - >-
      Repositories, LFS objects, the code indexer and sessions are on a
      ReadWriteOnce volume. More replicas need shared storage, a shared queue
      and a shared session store.
    - A node-local default StorageClass, such as local-path, has no snapshots or failover.

upgradeNotes:
  - >-
    Database backups are off when the template is installed. To turn them on,
    open the database in Zeabur and use the Backups tab.
  - >-
    Back up the database and the gitea-data volume, and keep gitea-secrets,
    before you change the image digest. Without secret-key, stored two-factor
    and OAuth secrets cannot be decrypted.
  - >-
    The init container runs gitea migrate before the new version starts. Old
    and new versions cannot run together. A rollback needs the database
    backup taken before the upgrade.
  - >-
    Deleting the namespace deletes the volume and the database. Backups in S3
    stay.

smoke:
  - name: postgresql-ready
    resource: cluster/gitea-db
    condition: condition=Ready
    timeout: 900s
  - name: gitea-ready
    resource: deployment/gitea
    condition: condition=Available
    timeout: 900s
    http: {service: gitea, port: 3000, path: /api/healthz, status: 200, contains: pass}
  - name: authentication-required
    resource: deployment/gitea
    condition: condition=Available
    timeout: 120s
    http: {service: gitea, port: 3000, path: /api/v1/user, status: 401}
  - name: administrator-created
    resource: cluster/gitea-db
    condition: condition=Ready
    timeout: 120s
    sql:
      cluster: gitea-db
      database: gitea
      query: SELECT count(*) FROM "user" WHERE is_admin
      expect: "1"