apiVersion: catalog.zeabur.com/v1
kind: Template
metadata:
  name: PostgreSQL
  description: >-
    PostgreSQL 18 managed by CloudNativePG, with Barman Cloud WAL archiving and
    scheduled base backups.
  license: PostgreSQL AND Apache-2.0
  # Also: https://cloudnative-pg.io/, https://github.com/cloudnative-pg/plugin-barman-cloud
  homepage: https://www.postgresql.org/
  icon: https://cdn.zeabur.com/marketplace/postgresql.svg
  categories: [databases]

requires: [databases/cloudnative-pg]

services:
  - name: postgresql
    securityProfile: restricted
    ports: [{name: postgresql, port: 5432}]
    resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}

inputs:
  - name: backupDestination
    description: >-
      Dedicated S3 bucket and unique prefix for this cluster, e.g.
      s3://company-backups/postgres-prod/; never reuse a prefix from another
      cluster.
    required: true
    validation: {pattern: '^s3://[a-z0-9][a-z0-9.-]+/[A-Za-z0-9/_-]+$'}
  - name: backupEndpoint
    description: >-
      S3-compatible HTTPS endpoint with a publicly trusted certificate. Must use
      TCP 443.
    required: true
    validation: {pattern: '^https://[a-zA-Z0-9.-]+(:443)?$'}
  - name: backupSecret
    description: >-
      Existing namespaced Secret containing ACCESS_KEY_ID and ACCESS_SECRET_KEY,
      supplied out of band. Node identity is not used.
    required: true
    validation: {pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'}
  - name: backupCidr
    description: >-
      IPv4 CIDR for the S3 endpoint. Egress is allowed by CIDR only; update this
      if its addresses change.
    required: true
    validation: {pattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[12][0-9]|3[0-2])$'}
  - name: kubeApiCidr
    description: >-
      IPv4 CIDR for the Kubernetes API as seen by the enforcing CNI (service or
      endpoint IP).
    required: true
    validation: {pattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[12][0-9]|3[0-2])$'}

security:
  summary: >-
    Namespaced Cluster only; CNPG owns narrowly scoped per-cluster RBAC and
    generated credentials. PostgreSQL instances run non-root under namespace
    restricted admission. No public database Service.
  egress:
    - DNS to kube-system kube-dns TCP/UDP53
    - Explicit API CIDR TCP443/6443
    - Explicit S3 CIDR TCP443
    - Cluster peer replication TCP5432/8000
  risks:
    - risk: >-
        CNPG instance managers need Kubernetes API access. The operator creates
        their ServiceAccounts, RBAC and projected tokens. The template creates
        no Role or binding.
      mitigation: >-
        Use the catalog operator; inspect generated roles and restrict
        tenant/operator namespaces. Keep token automount on for operands; the
        operator needs it.
    - risk: >-
        Local-path volumes are node-local, with no snapshots or cross-node
        availability. S3 credentials and endpoint are external prerequisites.
      mitigation: >-
        Barman archives WAL continuously and takes an immediate and a daily
        02:00 UTC base backup, kept for 7 days. Confirm a completed Backup and
        run a restore drill into a new namespace before production. Never count
        replicas on one node as HA.
    - risk: >-
        The catalog operator version controls sidecar images and Pod hardening.
        The Cluster imageName sets only the PostgreSQL image.
      mitigation: >-
        Check the generated Pods; admission enforces restricted. Pin the catalog
        release.
    - risk: NetworkPolicy inputs are IPv4 only.
      mitigation: IPv6-only clusters need an extended NetworkPolicy.

scalability:
  summary: >-
    One primary instance by default, 10Gi local-path storage. Scale with CNPG
    instances and separate-node anti-affinity after checking capacity and
    replication; writes stay on a single primary. No application HPA.
  replicas: 1
  maxReplicas: 3
  blockers:
    - Single-node local-path cannot survive node loss without restore.
    - CNPG operator and Barman plugin must be installed and compatible.
    - Backups need reachable S3 and valid credentials; test restore separately.
    - >-
      The PodDisruptionBudget (enablePDB) protects the single instance from
      voluntary eviction and can block node drains.

upgradeNotes:
  - >-
    Connect to postgresql-rw:5432, database zeabur, owner app, with credentials
    from the operator-generated postgresql-app Secret. Superuser access is
    disabled. Client Pods in the same namespace need the label
    templates.zeabur.com/postgresql-client=true.
  - >-
    Minor versions: check the new digest, take a backup and roll through CNPG.
    Do not replace PVCs.
  - >-
    Major versions: use a CNPG major-upgrade or logical migration procedure and
    test extension compatibility. Never change PostgreSQL major as an ordinary
    image update.
  - >-
    Backup/postgresql-initial runs only at first install. Before an upgrade,
    confirm a recent completed Backup.
  - >-
    Uninstall retains data only if PVC retention and owner references permit it;
    export backups and inspect deletion plan first.

smoke:
  - name: cluster-ready
    resource: cluster/postgresql
    condition: condition=Ready
    timeout: 600s
    sql: {cluster: postgresql, database: zeabur, query: SELECT 1, expect: "1"}
  - name: initial-base-backup
    resource: backup/postgresql-initial
    condition: jsonpath={.status.phase}=completed
    timeout: 600s
