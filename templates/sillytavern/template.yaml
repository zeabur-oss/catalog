apiVersion: catalog.zeabur.com/v1
kind: Template
metadata:
  name: SillyTavern
  version: "1.19.0"
  description: >-
    Private LLM frontend with generated Basic authentication and persistent
    conversations.
  license: AGPL-3.0-only
  homepage: https://github.com/SillyTavern/SillyTavern
  icon: https://github.com/SillyTavern.png
  categories: [ai]

requires: [ingress/traefik, certificates/cert-manager]

services:
  - name: sillytavern
    securityProfile: restricted
    ports: [{name: http, port: 8000}]
    resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 1000m, memory: 1Gi}}
    domains: ['{{ .Domain }}']

inputs:
  - name: basicPassword
    description: >-
      Basic authentication password for username user; generated, never a shared
      default.
    generate: random
    secret: {name: app-secrets, key: basic-password}
    validation: {pattern: '^[A-Za-z0-9_-]{43}$'}

security:
  summary: >-
    SillyTavern runs without root rights, with a read-only root filesystem, no
    service-account token and no extra Linux capabilities. Only Traefik can
    reach it, over HTTPS. Outbound traffic is not limited.
  locales:
    zh-TW:
      summary: "SillyTavern 不用 root 權限執行，根檔案系統唯讀，沒有 service-account token，也沒有額外的 Linux 權限。只有 Traefik 能透過 HTTPS 連到它。往外的網路流量沒有限制。"
    zh-CN:
      summary: "SillyTavern 不用 root 权限运行，根文件系统只读，没有 service-account token，也没有额外的 Linux 权限。只有 Traefik 能通过 HTTPS 连到它。向外的网络流量没有限制。"
  risks:
    - risk: >-
        A signed-in user can set up outbound model and API connections, and can
        read the stored provider keys and chats.
      mitigation: >-
        This is meant for one trusted user. Access uses a generated Basic auth
        password over HTTPS. SillyTavern blocks private addresses on its own,
        but the template does not limit outbound traffic. Do not share the
        credentials with people you do not trust.
      locales:
        zh-TW:
          risk: "登入的使用者可以設定對外的模型和 API 連線，也能看到存放的供應商金鑰和聊天紀錄。"
          mitigation: "這是設計給單一可信任的使用者用的。存取靠自動產生的 Basic auth 密碼，並走 HTTPS。SillyTavern 自己會擋內網位址，但這個範本不限制往外的網路流量。不要把帳密分享給你不信任的人。"
        zh-CN:
          risk: "登录的用户可以设置对外的模型和 API 连接，也能看到存放的供应商密钥和聊天记录。"
          mitigation: "这是设计给单个可信任的用户用的。访问靠自动生成的 Basic auth 密码，并走 HTTPS。SillyTavern 自己会挡内网地址，但这个模板不限制向外的网络流量。不要把账号密码分享给你不信任的人。"
    - risk: Plugins and extensions run code on the server or scripts in the browser.
      mitigation: >-
        Server plugins are turned off. Automatic extension updates and model
        downloads are turned off too. Read the code of each extension before
        you install it.
      locales:
        zh-TW:
          risk: "外掛和擴充功能會在伺服器上執行程式，或是在瀏覽器裡執行腳本。"
          mitigation: "伺服器外掛已關閉，擴充功能的自動更新和模型下載也都關閉了。安裝每個擴充功能之前，先看過它的程式碼。"
        zh-CN:
          risk: "插件和扩展会在服务器上运行代码，或者在浏览器里运行脚本。"
          mitigation: "服务器插件已关闭，扩展的自动更新和模型下载也都关闭了。安装每个扩展之前，先看过它的代码。"

scalability:
  summary: >-
    One replica. On a node-local StorageClass, node loss requires manual
    recovery from off-node backups.
  replicas: 1
  maxReplicas: 1
  blockers:
    - Sessions and rate limits are per process; multiple replicas are not supported
    - >-
      A node-local StorageClass has no snapshots. In-app chat backups stay on
      the same PVC and do not protect against node loss

upgradeNotes:
  - >-
    Breaking change: the template no longer ships its default-deny and per-pod
    NetworkPolicies, because the installer isolates project namespaces. Applying
    this version does not delete the old ones. Delete them with `kubectl delete
    networkpolicy sillytavern-default-deny sillytavern-network`.
  - >-
    Pin 1.19.0 by registry index digest; preserve app-secrets and all PVC
    subdirectories before updates.
  - >-
    Stop the Deployment before copying the PVC off-node. A node-local
    StorageClass has no snapshots or failover. Restore with the same generated
    authentication secret. Do not run an older image on a PVC that a newer
    version has migrated.
  - >-
    Login is HTTP Basic user user with the password in
    app-secrets/basic-password. SillyTavern keeps its session secret in the data
    directory.
  - >-
    config.yaml is rebuilt from the ConfigMap at each start; settings changed
    only in the file are lost. Edit the ConfigMap instead. The host whitelist
    contains only the deployment domain; render the template again if the domain
    changes.

smoke:
  - name: sillytavern-ready
    resource: deployment/sillytavern
    condition: condition=Available
    timeout: 300s
    http: {service: sillytavern, port: 8000, path: /, status: 401}
