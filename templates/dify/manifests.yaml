apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: dify-dragonfly
  namespace: '{{ .Namespace }}'
spec:
  replicas: 1
  image: docker.dragonflydb.io/dragonflydb/dragonfly:v2.0.2@sha256:061f00b201b58e12f974e4e96c761a881ee1c05e9d8ee967466a604b7299753b
  serviceAccountName: dify-dragonfly
  args:
  - --proactor_threads=2
  - --maxmemory=1536mb
  - --cache_mode=false
  - --dbnum=16
  - --logtostderr=true
  # Dify trigger debug Lua computes inbox keys not declared in KEYS.
  # Preserve that behavior; Dragonfly serializes these scripts globally.
  - --default_lua_flags=allow-undeclared-keys
  - --s3_endpoint={{ .Inputs.dragonflyBackupEndpoint }}
  - --s3_use_https=true
  - --s3_ec2_metadata=false
  authentication:
    passwordFromSecret:
      name: dify-secrets
      key: redis-password
  env:
  - name: AWS_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: '{{ .Inputs.backupSecret }}'
        key: ACCESS_KEY_ID
  - name: AWS_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: '{{ .Inputs.backupSecret }}'
        key: ACCESS_SECRET_KEY
  - name: AWS_REGION
    value: '{{ .Inputs.dragonflyBackupRegion }}'
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: '2'
      memory: 2Gi
  # Snapshot PVCs cannot be combined with an S3 dir in chart v1.7.1.
  snapshot:
    dir: '{{ .Inputs.dragonflyBackupDestination }}'
    cron: '*/5 * * * *'
    enableOnMasterOnly: true
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: dify-db
  namespace: '{{ .Namespace }}'
  labels:
    app.kubernetes.io/name: dify-db
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16-standard-trixie@sha256:f105e137d731f6ac4f69667383f2373345ce8b72dadcc10ab6d385a7a32d6e7f
  enableSuperuserAccess: false
  enablePDB: true
  postgresUID: 26
  postgresGID: 26
  seccompProfile:
    type: RuntimeDefault
  bootstrap:
    initdb:
      database: dify
      owner: app
      encoding: UTF8
      postInitApplicationSQL:
      - CREATE EXTENSION IF NOT EXISTS vector;
      - CREATE DATABASE dify_plugin OWNER app;
  storage:
    storageClass: local-path
    size: 20Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: '2'
      memory: 2Gi
  postgresql:
    parameters:
      shared_buffers: 256MB
      max_connections: '200'
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: dify-db-backups
