apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: dify-db-backups
  namespace: '{{ .Namespace }}'
  labels:
    app.kubernetes.io/name: dify-db-backups
spec:
  retentionPolicy: 7d
  configuration:
    destinationPath: '{{ .Inputs.backupDestination }}'
    endpointURL: '{{ .Inputs.backupEndpoint }}'
    s3Credentials:
      accessKeyId:
        name: '{{ .Inputs.backupSecret }}'
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: '{{ .Inputs.backupSecret }}'
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
  instanceSidecarConfiguration:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: '1'
        memory: 512Mi
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: dify-db-daily
  namespace: '{{ .Namespace }}'
  labels:
    app.kubernetes.io/name: dify-db-daily
spec:
  schedule: 0 0 2 * * *
  immediate: true
  backupOwnerReference: self
  cluster:
    name: dify-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dify-db-connectivity
  namespace: '{{ .Namespace }}'
  labels:
    app.kubernetes.io/name: dify-db-connectivity
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: dify-db
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          templates.zeabur.com/postgresql-client: 'true'
    ports:
    - protocol: TCP
      port: 5432
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cnpg-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: cloudnative-pg
    ports:
    - protocol: TCP
      port: 8000
    - protocol: TCP
      port: 5432
  - from:
    - podSelector:
        matchLabels:
          cnpg.io/cluster: dify-db
    ports:
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 8000
  egress:
  - {{ dnsEgress }}
  - to:
    - ipBlock:
        cidr: '{{ .Inputs.kubeApiCidr }}'
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 6443
  - to:
    - ipBlock:
        cidr: '{{ .Inputs.backupCidr }}'
    ports:
    - protocol: TCP
      port: 443
  - to:
    - podSelector:
        matchLabels:
          cnpg.io/cluster: dify-db
    ports:
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dify-default-deny
  namespace: '{{ .Namespace }}'
  labels:
    app.kubernetes.io/name: dify-default-deny
spec:
