apiVersion: apps/v1
kind: Deployment
metadata:
  name: dify-sandbox
  namespace: '{{ .Namespace }}'
  labels:
    app.kubernetes.io/name: dify-sandbox
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dify-sandbox
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dify-sandbox
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: dify-sandbox
        image: docker.io/langgenius/dify-sandbox:0.2.15@sha256:750e1111426ef31a9217b81c98cccfb750f17b182af3221102e420afa9f0928e
        ports:
        - name: http
          containerPort: 8194
        env:
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: dify-secrets
              key: sandbox-key
        - name: SANDBOX_PORT
          value: '8194'
        - name: ENABLE_NETWORK
          value: 'true'
        - name: ENABLE_PRELOAD
          value: 'false'
        - name: HTTP_PROXY
          value: http://dify-proxy:3128
        - name: HTTPS_PROXY
          value: http://dify-proxy:3128
        - name: WORKER_TIMEOUT
          value: '15'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
            add:
            - SYS_CHROOT
            - SETUID
            - SETGID
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '2'
            memory: 2Gi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: sandbox
          mountPath: /var/sandbox
        - name: opt
          mountPath: /opt
        - name: logs
          mountPath: /logs
        command:
        - /bin/bash
        - -ec
        args:
        - export NODEJS_PATH="$NODE_DIR/bin/node"; exec /main
        readinessProbe:
          tcpSocket:
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
        livenessProbe:
          tcpSocket:
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
        startupProbe:
          tcpSocket:
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 30
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 1Gi
      - name: sandbox
        emptyDir:
          sizeLimit: 2Gi
      - name: opt
        emptyDir:
          sizeLimit: 2Gi
      - name: logs
        emptyDir:
          sizeLimit: 2Gi
      initContainers:
      - name: prepare-runner
        image: docker.io/langgenius/dify-sandbox:0.2.15@sha256:750e1111426ef31a9217b81c98cccfb750f17b182af3221102e420afa9f0928e
        command:
        - /bin/bash
        - -ec
        args:
        - cp -a /opt/. /seed-opt/; tar -xf "$NODE_TAR_XZ" -C /seed-opt; if [ -d /var/sandbox ]; then cp -a /var/sandbox/.
          /seed-sandbox/; fi
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '2'
            memory: 2Gi
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          runAsGroup: 0
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - FSETID
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: opt
          mountPath: /seed-opt
        - name: sandbox
          mountPath: /seed-sandbox
        - name: tmp
          mountPath: /tmp
