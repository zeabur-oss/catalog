apiVersion: v1
kind: ConfigMap
metadata:
  name: dify-gateway-config
  namespace: '{{ .Namespace }}'
  labels:
    app.kubernetes.io/name: dify-gateway-config
data:
  nginx.conf: "worker_processes auto;\npid /tmp/nginx.pid;\nerror_log /dev/stderr warn;\nevents { worker_connections 1024;\
    \ }\nhttp {\n  include /etc/nginx/mime.types;\n  default_type application/octet-stream;\n  access_log /dev/stdout;\n \
    \ client_body_temp_path /tmp/client;\n  proxy_temp_path /tmp/proxy;\n  fastcgi_temp_path /tmp/fastcgi;\n  uwsgi_temp_path\
    \ /tmp/uwsgi;\n  scgi_temp_path /tmp/scgi;\n  client_max_body_size 100m;\n  proxy_set_header Host $host;\n  proxy_set_header\
    \ X-Forwarded-For $proxy_add_x_forwarded_for;\n  proxy_set_header X-Forwarded-Proto https;\n  proxy_set_header X-Forwarded-Port\
    \ 443;\n  proxy_http_version 1.1;\n  proxy_set_header Connection \"\";\n  proxy_buffering off;\n  proxy_read_timeout 3600s;\n\
    \  proxy_send_timeout 3600s;\n  server {\n    listen 8080;\n    server_name _;\n    location ~ ^/(console/api|api|v1|files|mcp|triggers)(/|$)\
    \ { proxy_pass http://dify-api:5001; }\n    location ~ ^/e/([^/]+)(/.*)?$ {\n      set $hook_id $1;\n      proxy_pass\
    \ http://dify-plugin:5002;\n      proxy_set_header Dify-Hook-Url https://$host$request_uri;\n      proxy_redirect ~^/(?!e/)(.+)$\
    \ /e/$hook_id/$1;\n    }\n    location / { proxy_pass http://dify-web:3000; }\n  }\n}\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dify
  namespace: '{{ .Namespace }}'
  labels:
    app.kubernetes.io/name: dify
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dify
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dify
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: dify
        image: docker.io/nginxinc/nginx-unprivileged:1.31.7-alpine@sha256:b5047b9b76845eac124358373c6852377c52e4b05834a47647e955dd91cb8f1e
        ports:
        - name: http
          containerPort: 8080
        env: []
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '2'
            memory: 2Gi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: config
          mountPath: /config
          readOnly: true
        command:
        - nginx
        - -c
        - /config/nginx.conf
        - -g
        - daemon off;
        readinessProbe:
          tcpSocket:
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
        livenessProbe:
          tcpSocket:
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
        startupProbe:
          tcpSocket:
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 30
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 1Gi
      - name: config
        configMap:
          name: dify-gateway-config
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dify-gateway-default-deny
  namespace: '{{ .Namespace }}'
