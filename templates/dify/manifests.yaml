        - name: INNER_API_KEY_FOR_PLUGIN
          valueFrom:
            secretKeyRef:
              name: dify-secrets
              key: app-key
        - name: INNER_API_KEY
          valueFrom:
            secretKeyRef:
              name: dify-secrets
              key: app-key
        - name: PLUGIN_DAEMON_KEY
          valueFrom:
            secretKeyRef:
              name: dify-secrets
              key: app-key
        - name: CODE_EXECUTION_API_KEY
          valueFrom:
            secretKeyRef:
              name: dify-secrets
              key: sandbox-key
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: '{{ .Inputs.storageSecret }}'
              key: access-key
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: '{{ .Inputs.storageSecret }}'
              key: secret-key
        - name: CELERY_BROKER_URL
          value: redis://:$(REDIS_PASSWORD)@dify-dragonfly:6379/1
        - name: MODE
          value: beat
        - name: MIGRATION_ENABLED
          value: 'false'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 2Gi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: storage
          mountPath: /app/api/storage
        readinessProbe:
          exec:
            command:
            - /app/api/.venv/bin/python
            - -c
            - import pathlib; assert b'celery' in pathlib.Path('/proc/1/cmdline').read_bytes()
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          exec:
            command:
            - /app/api/.venv/bin/python
            - -c
            - import pathlib; assert b'celery' in pathlib.Path('/proc/1/cmdline').read_bytes()
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 6
        startupProbe:
          exec:
            command:
            - /app/api/.venv/bin/python
            - -c
            - import pathlib; assert b'celery' in pathlib.Path('/proc/1/cmdline').read_bytes()
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 20
        command:
        - /bin/bash
        - -ec
        args:
        - exec celery -A app.celery beat --schedule=/tmp/celerybeat-schedule --loglevel=INFO
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 1Gi
      - name: storage
        emptyDir:
          sizeLimit: 1Gi
