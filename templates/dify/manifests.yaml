apiVersion: batch/v1
kind: Job
metadata:
  name: dify-dragonfly-initial
  namespace: '{{ .Namespace }}'
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        templates.zeabur.com/dragonfly-backup: dify-dragonfly
    spec:
      restartPolicy: Never
      serviceAccountName: dify-dragonfly
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: snapshot
        image: docker.dragonflydb.io/dragonflydb/dragonfly:v2.0.2@sha256:061f00b201b58e12f974e4e96c761a881ee1c05e9d8ee967466a604b7299753b
        command: [/bin/sh, -ec]
        args:
        - |
          until test "$(redis-cli -h dify-dragonfly --raw -e PING 2>/dev/null)" = PONG; do sleep 2; done
          snapshot="dump-$(date -u +%Y-%m-%dT%H:%M:%S)"
          test "$(redis-cli -h dify-dragonfly --raw -e SAVE DF "$BACKUP_DESTINATION" "$snapshot")" = OK
          info="$(redis-cli -h dify-dragonfly --raw -e INFO persistence | tr -d '\r')"
          printf '%s\n' "$info" | grep -qx 'saving:0'
          printf '%s\n' "$info" | grep -Fqx "last_saved_file:${BACKUP_DESTINATION}/${snapshot}-summary.dfs"
          printf '%s\n' "$info" | grep -Eq '^last_success_save:[1-9][0-9]*$'
          test "$(redis-cli -h dify-dragonfly --raw -e LASTSAVE)" -gt 0
          printf 'Completed native Dragonfly S3 snapshot: %s/%s-summary.dfs\n' "$BACKUP_DESTINATION" "$snapshot"
        env:
        - name: REDISCLI_AUTH
          valueFrom:
            secretKeyRef:
              name: dify-secrets
              key: redis-password
        - name: BACKUP_DESTINATION
          value: '{{ .Inputs.dragonflyBackupDestination }}'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
