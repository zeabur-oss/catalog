apiVersion: catalog.zeabur.com/v1
kind: Template
metadata:
  name: Dify
  version: "1.18.0"
  description: >-
    Dify LLM app development platform with PostgreSQL/pgvector, a Dragonfly
    queue, a code sandbox and S3 object storage.
  license: LicenseRef-Dify-Modified-Apache-2.0 AND BUSL-1.1 AND Apache-2.0 AND PostgreSQL
  # Also: https://github.com/langgenius/dify-sandbox, https://cloudnative-pg.io/docs/, https://github.com/dragonflydb/dragonfly, https://github.com/dragonflydb/dragonfly-operator
  homepage: https://github.com/langgenius/dify
  icon: https://registry.npmmirror.com/@lobehub/icons-static-png/latest/files/dark/dify-color.png
  categories: [ai]

requires:
  - databases/cloudnative-pg
  - databases/dragonfly-operator
  - ingress/traefik
  - certificates/cert-manager

services:
  - name: dify
    securityProfile: restricted
    ports: [{name: http, port: 8080}]
    resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "2", memory: 2Gi}}
    domains: ['{{ .Domain }}']
  - name: dify-api
    securityProfile: restricted
    ports: [{name: http, port: 5001}]
    resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "2", memory: 2Gi}}
  - {name: dify-worker, securityProfile: restricted, resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "2", memory: 2Gi}}}
  - {name: dify-beat, securityProfile: restricted, resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "2", memory: 2Gi}}}
  - name: dify-web
    securityProfile: restricted
    ports: [{name: http, port: 3000}]
    resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "2", memory: 2Gi}}
  - name: dify-plugin
    securityProfile: restricted
    ports: [{name: http, port: 5002}]
    resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "2", memory: 2Gi}}
  - name: dify-sandbox
    securityProfile: baseline
    ports: [{name: http, port: 8194}]
    resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "2", memory: 2Gi}}
    baselineJustification: >-
      Only this isolated code runner runs as root: SYS_CHROOT/SETUID/SETGID
      establish the chroot and per-execution identities before upstream inner
      seccomp, CHOWN gives each Python script to the run user and DAC_OVERRIDE
      lets root open it. The
      prepare-runner init alone uses CHOWN/DAC_OVERRIDE/FOWNER/FSETID to copy image-bundled runtime ownership
      and modes into emptyDir. Neither container permits escalation or
      privileged mode; all ordinary pods remain restricted.
  - name: dify-proxy
    securityProfile: restricted
    ports: [{name: http, port: 3128}]
    resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "2", memory: 2Gi}}
  - name: dify-dragonfly
    securityProfile: restricted
    ports: [{name: redis, port: 6379}]
    resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "2", memory: 2Gi}}
  - name: dify-db
    securityProfile: restricted
    ports: [{name: postgresql, port: 5432}]
    resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "2", memory: 2Gi}}

inputs:
  - name: dragonflyLicenseOptIn
    label: Dragonfly license agreement
    locales:
      zh-TW:
        label: Dragonfly 授權同意
        description: "Dragonfly 採用 BUSL-1.1。要把 Dragonfly 當成託管服務或記憶體資料庫產品提供給別人，需要另外取得授權。讀過授權後再同意。"
      zh-CN:
        label: Dragonfly 许可协议
        description: "Dragonfly 采用 BUSL-1.1。要把 Dragonfly 作为托管服务或内存数据库产品提供给他人，需要另外取得许可。读完许可后再同意。"
    description: >-
      Dragonfly engine is BUSL-1.1 source-available. Offering third parties a
      hosted/managed Dragonfly service or an in-memory data store product needs
      a separate license. Read the pinned license and type
      I-ACCEPT-DRAGONFLY-BUSL-1.1.
    required: true
    validation: {pattern: ^I-ACCEPT-DRAGONFLY-BUSL-1\.1$}
  - name: adminCidr
    label: Administrator IP range
    locales:
      zh-TW:
        label: 管理員 IP 範圍
        description: "只有這個 IPv4 範圍能開啟主控台和建立第一個擁有者，以 Traefik 看到的來源位址為準；公開的應用程式和 API 不受影響。建議填你固定 IP 的 /32。"
      zh-CN:
        label: 管理员 IP 范围
        description: "只有这个 IPv4 范围能打开控制台和创建第一个所有者，以 Traefik 看到的来源地址为准；公开的应用和 API 不受影响。建议填你固定 IP 的 /32。"
    description: >-
      Administrator IPv4 source CIDR as Traefik sees it. Restricts all console
      API and first-owner setup; public apps and APIs remain public. Prefer your
      fixed IP /32.
    required: true
    validation:
      pattern: ^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])/([1-9]|[12][0-9]|3[0-2])$
  - name: appKey
    description: Generated app-key; retrieve from Secret dify-secrets, never from a public URL.
    generate: random
    secret: {name: dify-secrets, key: app-key}
    validation: {pattern: '^[A-Za-z0-9_-]{43}$'}
  - name: redisPassword
    description: >-
      Generated redis-password; retrieve from Secret dify-secrets, never from a
      public URL.
    generate: random
    secret: {name: dify-secrets, key: redis-password}
    validation: {pattern: '^[A-Za-z0-9_-]{43}$'}
  - name: sandboxKey
    description: >-
      Generated sandbox-key; retrieve from Secret dify-secrets, never from a
      public URL.
    generate: random
    secret: {name: dify-secrets, key: sandbox-key}
    validation: {pattern: '^[A-Za-z0-9_-]{43}$'}
  - name: storageEndpoint
    label: Storage endpoint
    locales:
      zh-TW:
        label: 儲存空間端點
        description: "現有的 S3 相容儲存空間 HTTPS 端點（TCP 443），用來存文件、模型加密金鑰和上傳的檔案。"
      zh-CN:
        label: 存储端点
        description: "现有的 S3 兼容存储 HTTPS 端点（TCP 443），用来存文档、模型加密密钥和上传的文件。"
    description: >-
      Existing HTTPS S3-compatible object storage endpoint on TCP443 for
      documents, model encryption keys and uploaded files.
    required: true
    validation: {pattern: '^https://[A-Za-z0-9.-]+(:443)?$'}
  - name: storageRegion
    label: Storage region
    locales:
      zh-TW:
        label: 儲存空間區域
        description: "S3 儲存桶所在的區域。"
      zh-CN:
        label: 存储区域
        description: "S3 存储桶所在的区域。"
    description: Region for the S3-compatible storage bucket.
    required: true
    validation: {pattern: '^[A-Za-z0-9-]+$'}
  - name: storageBucket
    label: Storage bucket
    locales:
      zh-TW:
        label: 儲存桶
        description: "現有的私有 S3 儲存桶，只給這個應用程式使用。"
      zh-CN:
        label: 存储桶
        description: "现有的私有 S3 存储桶，只给这个应用使用。"
    description: Existing private S3 bucket dedicated to this application.
    required: true
    validation: {pattern: '^[a-z0-9][a-z0-9.-]+$'}
  - name: storageSecret
    label: Storage credentials secret
    locales:
      zh-TW:
        label: 儲存空間認證資訊的機密
        description: "這個專案裡現有的機密，含 access-key 和 secret-key 兩個鍵。"
      zh-CN:
        label: 存储凭证的机密
        description: "这个项目里现有的机密，含 access-key 和 secret-key 两个键。"
    description: >-
      Existing namespaced S3 application credentials Secret with keys access-key
      and secret-key.
    required: true
    validation: {pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'}
  - name: storageCASecret
    label: Storage CA secret
    locales:
      zh-TW:
        label: 儲存空間 CA 的機密
        description: "儲存空間用私有 CA 簽發憑證時才填：這個專案裡現有的機密，鍵 ca.crt 放 PEM 格式的 CA 憑證。公開信任的憑證請留空。"
      zh-CN:
        label: 存储 CA 的机密
        description: "存储使用私有 CA 签发证书时才填：这个项目里现有的机密，键 ca.crt 放 PEM 格式的 CA 证书。公共信任的证书请留空。"
    description: >-
      Optional existing namespaced Secret with key ca.crt, the PEM CA that
      signed the storage endpoint certificate. Set it for a private CA. Leave
      it empty for a publicly trusted certificate.
    required: false
    validation: {pattern: '^([a-z0-9]([-a-z0-9]*[a-z0-9])?)?$'}
  - name: licenseOptIn
    label: Dify license agreement
    locales:
      zh-TW:
        label: Dify 授權同意
        description: "Dify 採用修改過的 Apache 授權：沒有書面許可只能用一個工作區，前端的標誌和版權資訊都要保留。確認後再同意。"
      zh-CN:
        label: Dify 许可协议
        description: "Dify 采用修改过的 Apache 许可证：没有书面许可只能用一个工作区，前端的标志和版权信息都要保留。确认后再同意。"
    description: >-
      Dify modified Apache license: one workspace only without written
      permission; keep all frontend logo/copyright. Type
      I-ACCEPT-DIFY-SINGLE-WORKSPACE.
    required: true
    validation: {pattern: ^I-ACCEPT-DIFY-SINGLE-WORKSPACE$}

security:
  summary: >-
    Restricted application/Dragonfly/gateway/proxy pods and a narrowly justified
    baseline sandbox. Default-deny ingress with directional rules; the sandbox
    reaches only the proxy and DNS, and other outbound traffic is not limited;
    generated secrets, TLS ingress, operator-owned PostgreSQL/pgvector and
    Dragonfly.
  risks:
    - risk: >-
        Dragonfly engine is BUSL-1.1 source-available and excludes third-party
        hosted/managed service or in-memory data store product offerings under
        its Additional Use Grant.
      mitigation: >-
        Required exact dragonflyLicenseOptIn=I-ACCEPT-DRAGONFLY-BUSL-1.1.
        Operate only within the pinned license grant or obtain a separate
        license; the Apache-2.0 operator does not relicense its engine. The
        pinned engine license changes to Apache-2.0 on 2030-11-01.
    - risk: >-
        Dragonfly keeps data in memory only until you turn on snapshots. A
        restart loses queued or unacknowledged tasks, locks and cache.
      mitigation: >-
        Turn on Dragonfly backups in Zeabur. DB0/cache and DB1/Celery remain
        separate; cache_mode=false avoids queue eviction. Stop beat/producers
        and drain workers before a restart; reconcile jobs and idempotency
        after it. Old Valkey AOF, RDB or PVC data is not imported.
    - risk: >-
        The sandbox container has CAP_CHOWN and CAP_DAC_OVERRIDE, because Dify
        sandbox gives each Python script to its run user and then opens it as
        root. With DAC_OVERRIDE, root in the sandbox can read and write files
        it does not own inside the container.
      mitigation: >-
        Only the sandbox gets them, next to SYS_CHROOT/SETUID/SETGID. It still
        drops all other capabilities, permits no escalation and runs user code
        under the upstream seccomp filter with a separate user.
    - risk: Dify trigger/debug Lua scripts access keys outside their declared KEYS.
      mitigation: >-
        Dragonfly runs with allow-undeclared-keys. These scripts run with global
        serialization and can reduce queue throughput.
    - risk: >-
        Unauthenticated first-owner setup and console administration must not be
        reachable by arbitrary public clients.
      mitigation: >-
        Required adminCidr restricts /console/api through a higher-priority
        Traefik ipAllowList router; other public app/API routes remain
        unchanged. The allowlist uses the source address Traefik sees and
        ignores client X-Forwarded-For. Check NAT and proxy source preservation;
        allowing a shared load-balancer CIDR admits every client. Use a fixed
        administrator address or a private ingress. Before you create the owner,
        check that a request from outside adminCidr gets a Traefik denial.
    - risk: Dify license restricts multi-workspace operation and frontend branding changes.
      mitigation: >-
        Required exact acknowledgement limits deployment to one workspace unless
        written upstream permission exists. Unmodified frontend images retain
        branding.
    - risk: >-
        Code runner needs root to set up chroot and drop to unique per-execution
        identities.
      mitigation: >-
        Baseline-only exception with minimal caps and RuntimeDefault plus
        upstream inner seccomp, generated API key, isolated
        no-database-credential pod, proxy-only egress and bounded resources.
    - risk: Plugins run trusted third-party code and access configured model integrations.
      mitigation: >-
        Keep FORCE_VERIFYING_SIGNATURE true, disable remote debugging/install
        listener, only trusted administrator installs; one trust boundary and
        restricted pod identity.
    - risk: >-
        CNPG instance managers require scoped Kubernetes API permissions.
      mitigation: >-
        Use the catalog operator and its scoped service account.

scalability:
  summary: One instance per trusted owner; do not horizontally scale this deployment.
  replicas: 1
  maxReplicas: 1
  blockers:
    - >-
      One API migrator, one beat scheduler, single Dragonfly instance,
      plugin state on one RWO volume, and one supported licensed workspace.
    - >-
      External S3 object storage must exist. A node-local StorageClass has no HA
      or snapshots.

upgradeNotes:
  - >-
    New installs start without database backups. Installs made before this
    version keep their backups. To turn backups on, open the database in Zeabur
    and use the Backups tab.
  - >-
    Read and explicitly accept the Dify modified Apache license: exactly one
    workspace unless separately authorized; keep frontend logos and copyright
    unchanged.
  - >-
    From Dify 1.13: back up the database first, because migration 5578e028b2f2
    (1.17.1) cannot be reversed. Scale dify-worker and dify-beat to 0 before
    the upgrade, so that old workers do not take new queue entries; the API
    migrates the database at start. Then run
    `flask backfill-plugin-auto-upgrade` once in dify-api (1.15), or plugin
    auto-upgrade settings stop working. Keep PASSWORD_PEPPER unset: setting it
    makes every existing password fail. The plugin daemon now migrates its own
    database at start.
  - >-
    Sandbox 0.2.15 runs each Python and JavaScript execution under its own UID.
    Check code-runner protocol and syscall changes during upgrades.
  - >-
    Preserve CNPG application credentials, generated encryption/queue/sandbox
    Secrets, PostgreSQL backups, external S3 documents/keys, and
    plugin storage PVC before updates. The Dify app key and the S3 key objects
    are needed to decrypt model provider configuration. Stop writers before
    filesystem exports.
  - >-
    PostgreSQL uses the CNPG standard image with pgvector as the vector store.
    To migrate an existing instance that uses Weaviate, reindex its data into
    pgvector. Do not change the PostgreSQL major version with an image-only
    rollout; migrate logically or use a CNPG major upgrade.
  - >-
    Application object storage is an existing S3-compatible bucket with your
    credentials. To migrate an existing instance, copy its objects into the
    bucket.
  - >-
    Only API runs migrations; beat remains a single scheduler; plugin storage
    remains a single-node PVC. Preserve queue credentials and DB0/DB1
    separation; stop beat/producers, drain workers and checkpoint before
    cutover. Reconcile lost/replayed tasks and expired locks after recovery. Old
    Valkey AOF, RDB or PVC data is not imported. Dragonfly does not provide
    Redis Stack modules; data that depends on them needs a separate migration.
  - >-
    Dragonfly requires a separate BUSL-1.1 acknowledgement. Offering third
    parties a hosted/managed Dragonfly or an in-memory data store product needs
    a separate license.

smoke:
  - name: dify available
    resource: deployment/dify
    condition: condition=Available
    timeout: 15m
  - name: dify-api available
    resource: deployment/dify-api
    condition: condition=Available
    timeout: 15m
  - name: dify-worker available
    resource: deployment/dify-worker
    condition: condition=Available
    timeout: 15m
  - name: dify-beat available
    resource: deployment/dify-beat
    condition: condition=Available
    timeout: 15m
  - name: dify-web available
    resource: deployment/dify-web
    condition: condition=Available
    timeout: 15m
  - name: dify-plugin available
    resource: deployment/dify-plugin
    condition: condition=Available
    timeout: 15m
  - name: dify-sandbox available
    resource: deployment/dify-sandbox
    condition: condition=Available
    timeout: 15m
  - name: dify-web reads system features from dify-api
    resource: deployment/dify-web
    condition: condition=Available
    timeout: 15m
    http: {service: dify-web, port: 3000, path: /signin, status: 200, contains: sso_enforced_for_signin}
  - name: dify-proxy available
    resource: deployment/dify-proxy
    condition: condition=Available
    timeout: 15m
  - name: Database ready
    resource: cluster/dify-db
    condition: condition=Ready
    timeout: 15m
  - name: Queue ready
    resource: dragonfly/dify-dragonfly
    condition: jsonpath={.status.phase}=Ready
    timeout: 10m