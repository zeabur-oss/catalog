apiVersion: catalog.zeabur.com/v1
kind: Template
metadata:
  name: Halo
  version: "2.27.1"
  description: >-
    Halo publishing with persistent site assets and CloudNativePG PostgreSQL 16.
  license: GPL-3.0-only AND PostgreSQL
  # Also: https://cloudnative-pg.io/
  homepage: https://github.com/halo-dev/halo
  icon: https://github.com/halo-dev.png
  categories: [cms]

requires:
  - databases/cloudnative-pg
  - ingress/traefik
  - certificates/cert-manager

services:
  - name: halo
    securityProfile: restricted
    ports: [{name: http, port: 8090}]
    resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "2", memory: 2Gi}}
  - name: halo-db
    securityProfile: restricted
    ports: [{name: postgresql, port: 5432}]
    resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "2", memory: 1Gi}}

security:
  summary: >-
    Restricted non-root application, read-only root and no API token; PostgreSQL
    operands are managed by the catalog CloudNativePG operator with their scoped
    service-account exception. Default-deny ingress; outbound traffic is not
    limited.
  risks:
    - risk: >-
        CNPG instance managers need the Kubernetes API and a scoped
        service-account token; the template cannot directly harden
        operator-generated Pods.
      mitigation: >-
        Trust the pinned catalog operator, enforce namespace Pod Security
        restricted and inspect the generated Pods.
    - risk: The first visitor can initialize the Halo administrator account.
      mitigation: >-
        Finish initialization with kubectl port-forward before publishing
        Ingress DNS and restrict Traefik externally during provisioning.
    - risk: Database backups do not include local Halo attachments, plugins or themes.
      mitigation: >-
        Back up the Halo PVC off-node as well as the database, and
        test a coordinated restore. The built-in Halo backup also stays on the
        node.

scalability:
  summary: One writable instance on one volume, with no failover.
  replicas: 1
  maxReplicas: 1
  blockers:
    - >-
      A node-local default StorageClass, such as local-path, has no snapshots
      or failover.
    - >-
      A single writable application instance is intentional; do not increase
      replicas without an application-specific storage/database design.
    - >-
      The database runs one PostgreSQL instance. More instances need multi-node
      replicated storage; a replica count edit alone is not enough.

upgradeNotes:
  - >-
    New installs start without database backups. Installs made before this
    version keep their backups. To turn backups on, open the database in Zeabur
    and use the Backups tab.
  - >-
    Back up persistent application data and its database to storage outside the
    node before updating the image digest.
  - >-
    Database migrations can be one-way. Restore a copy into a separate namespace
    and test the upgrade there first: migrations, login, publishing, file access
    and plugin loading.
  - >-
    Keep PostgreSQL major version 16. The pinned image is PostgreSQL 16.15 on
    Debian trixie. Upgrade the operator only through the catalog.
  - >-
    Halo keeps its work directory in /var/lib/halo. To move an existing install,
    copy the contents of its .halo2 directory into this volume. Do not copy the
    parent /root directory.
  - >-
    CNPG generates halo-db-app credentials; never overwrite or regenerate that
    Secret during re-render.

smoke:
  - name: application-ready
    resource: statefulset/halo
    condition: jsonpath={.status.readyReplicas}=1
    timeout: 600s
  - name: postgresql-ready
    resource: cluster/halo-db
    condition: condition=Ready
    timeout: 900s