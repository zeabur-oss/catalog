apiVersion: catalog.zeabur.com/v1
kind: Template
metadata:
  name: Halo
  version: "2.27.1"
  description: >-
    Halo publishing with persistent site assets and CloudNativePG PostgreSQL 16.
  license: GPL-3.0-only AND PostgreSQL
  # Also: https://cloudnative-pg.io/
  homepage: https://github.com/halo-dev/halo
  icon: https://github.com/halo-dev.png
  categories: [cms]

requires:
  - databases/cloudnative-pg
  - ingress/traefik
  - certificates/cert-manager

services:
  - name: halo
    securityProfile: restricted
    ports: [{name: http, port: 8090}]
    resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "2", memory: 2Gi}}
  - name: halo-db
    securityProfile: restricted
    ports: [{name: postgresql, port: 5432}]
    resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "2", memory: 1Gi}}

inputs:
  - name: adminPassword
    description: >-
      Generated password of the Halo super administrator admin; retrieve it
      from Secret halo-secrets, key admin-password.
    generate: random
    secret: {name: halo-secrets, key: admin-password}
    validation: {pattern: '^[A-Za-z0-9_-]{43}$'}

security:
  summary: "The Halo app runs as non-root with a restricted profile, a read-only root filesystem and no API token. The catalog CloudNativePG operator manages PostgreSQL, and its pods have one exception: a limited service-account token. Outbound traffic is not limited."
  locales:
    zh-TW:
      summary: "Halo 應用程式以非 root 身分執行，套用受限設定，根檔案系統唯讀，沒有 API token。PostgreSQL 由目錄裡的 CloudNativePG operator 管理，它的 Pod 有一個例外：一個權限受限的服務帳號 token。對外連線沒有限制。"
    zh-CN:
      summary: "Halo 应用以非 root 身份运行，套用受限配置，根文件系统只读，没有 API token。PostgreSQL 由目录里的 CloudNativePG operator 管理，它的 Pod 有一个例外：一个权限受限的服务账号 token。对外连接没有限制。"
  risks:
    - risk: "The CloudNativePG instance manager needs the Kubernetes API and a limited service-account token. The template cannot harden the Pods that the operator creates."
      mitigation: "Trust the pinned catalog operator. Enforce the restricted Pod Security level on the namespace, and inspect the Pods the operator generates."
      locales:
        zh-TW:
          risk: "CloudNativePG 的 instance manager 需要使用 Kubernetes API 和一個權限受限的服務帳號 token。範本沒辦法直接加固 operator 產生的 Pod。"
          mitigation: "信任固定版本的目錄 operator。在命名空間套用 restricted 等級的 Pod Security，並檢查 operator 產生的 Pod。"
        zh-CN:
          risk: "CloudNativePG 的 instance manager 需要使用 Kubernetes API 和一个权限受限的服务账号 token。模板没办法直接加固 operator 生成的 Pod。"
          mitigation: "信任固定版本的目录 operator。在命名空间应用 restricted 级别的 Pod Security，并检查 operator 生成的 Pod。"
    - risk: "If Halo has not been set up yet, the first visitor can create the administrator account."
      mitigation: "At the first start, the template creates the super administrator admin with a generated password from the Secret halo-secrets, so there is no open setup step. Sign in as admin and change the password in the console."
      locales:
        zh-TW:
          risk: "如果 Halo 還沒完成初始化，第一個來的訪客就能建立管理員帳號。"
          mitigation: "第一次啟動時，範本會用 halo-secrets 機密裡產生的密碼建立超級管理員 admin，所以沒有開放的設定步驟。請以 admin 登入，並在控制台改掉密碼。"
        zh-CN:
          risk: "如果 Halo 还没完成初始化，第一个来的访客就能创建管理员账号。"
          mitigation: "第一次启动时，模板会用 halo-secrets 机密里生成的密码创建超级管理员 admin，所以没有开放的设置步骤。请以 admin 登录，并在控制台修改密码。"
    - risk: "Database backups do not include Halo's local attachments, plugins or themes."
      mitigation: "Back up the Halo PVC off the node as well as the database, and test a restore of both together. The built-in Halo backup also stays on the node."
      locales:
        zh-TW:
          risk: "資料庫備份不包含 Halo 的本機附件、外掛和主題。"
          mitigation: "除了資料庫，也要把 Halo 的 PVC 備份到節點以外的地方，並測試兩者一起還原。Halo 內建的備份同樣只存在節點上。"
        zh-CN:
          risk: "数据库备份不包含 Halo 的本地附件、插件和主题。"
          mitigation: "除了数据库，也要把 Halo 的 PVC 备份到节点之外的地方，并测试两者一起恢复。Halo 内置的备份同样只存在节点上。"

scalability:
  summary: One writable instance on one volume, with no failover.
  replicas: 1
  maxReplicas: 1
  blockers:
    - >-
      A node-local default StorageClass, such as local-path, has no snapshots
      or failover.
    - >-
      A single writable application instance is intentional; do not increase
      replicas without an application-specific storage/database design.
    - >-
      The database runs one PostgreSQL instance. More instances need multi-node
      replicated storage; a replica count edit alone is not enough.

upgradeNotes:
  - >-
    The super administrator admin is created at the first start with the
    password in halo-secrets/admin-password. The password is used only when no
    administrator exists, so a restored installation keeps its administrators.
  - >-
    Database backups are off when the template is installed. To turn them on,
    open the database in Zeabur and use the Backups tab.
  - >-
    Back up persistent application data and its database to storage outside the
    node before updating the image digest.
  - >-
    Database migrations can be one-way. Restore a copy into a separate namespace
    and test the upgrade there first: migrations, login, publishing, file access
    and plugin loading.
  - >-
    Keep PostgreSQL major version 16. The pinned image is PostgreSQL 16.15 on
    Debian trixie. Upgrade the operator only through the catalog.
  - >-
    Halo keeps its work directory in /var/lib/halo. To move an existing install,
    copy the contents of its .halo2 directory into this volume. Do not copy the
    parent /root directory.
  - >-
    CNPG generates halo-db-app credentials; never overwrite or regenerate that
    Secret during re-render.

smoke:
  - name: application-ready
    resource: statefulset/halo
    condition: jsonpath={.status.readyReplicas}=1
    timeout: 600s
  - name: postgresql-ready
    resource: cluster/halo-db
    condition: condition=Ready
    timeout: 900s