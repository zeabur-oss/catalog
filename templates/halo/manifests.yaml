apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: halo-data
  namespace: '{{ .Namespace }}'
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: halo
  namespace: '{{ .Namespace }}'
spec:
  serviceName: halo
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: halo
  template:
    metadata:
      labels:
        templates.zeabur.com/template: halo
        app.kubernetes.io/name: halo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: halo
        image: halohub/halo:2.27.1@sha256:cc28f8bab142b79bf1bc5bdb07c2e0746821af5c814705e72b5beda6e9cabbc9
        ports:
        - name: http
          containerPort: 8090
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 2Gi
        env:
        - name: HALO_WORK_DIR
          value: /var/lib/halo
        - name: SPRING_CONFIG_LOCATION
          value: optional:classpath:/;optional:file:/var/lib/halo/
        - name: HALO_EXTERNAL_URL
          value: https://{{ .Domain }}
        - name: SPRING_R2DBC_URL
          value: r2dbc:pool:postgresql://halo-db-rw:5432/halo
        - name: SPRING_SQL_INIT_PLATFORM
          value: postgresql
        - name: HALO_SECURITY_INITIALIZER_SUPERADMINUSERNAME
          value: admin
        - name: HALO_SECURITY_INITIALIZER_SUPERADMINPASSWORD
          valueFrom:
            secretKeyRef:
              name: halo-secrets
              key: admin-password
        - name: JVM_OPTS
          value: -XX:MaxRAMPercentage=70 -Djava.io.tmpdir=/tmp
        - name: SPRING_R2DBC_USERNAME
          valueFrom:
            secretKeyRef:
              name: halo-db-app
              key: username
        - name: SPRING_R2DBC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: halo-db-app
              key: password
        volumeMounts:
        - name: data
          mountPath: /var/lib/halo
        - name: tmp
          mountPath: /tmp
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          failureThreshold: 120
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          periodSeconds: 20
          failureThreshold: 6
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: halo-data
      - name: tmp
        emptyDir:
          sizeLimit: 512Mi
      terminationGracePeriodSeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: halo
  namespace: '{{ .Namespace }}'
spec:
  selector:
    app.kubernetes.io/name: halo
  ports:
  - name: http
    port: 8090
    targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: halo
  namespace: '{{ .Namespace }}'
  annotations:
    cert-manager.io/cluster-issuer: '{{ .ClusterIssuer }}'
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - '{{ .Domain }}'
    secretName: halo-tls
  rules:
  - host: '{{ .Domain }}'
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: halo
            port:
              number: 8090
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: halo-db
  namespace: '{{ .Namespace }}'
spec:
  inheritedMetadata:
    labels:
      templates.zeabur.com/template: halo
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16-minimal-trixie@sha256:fc189febbe8c683dcf7399b93d25af3ad7a4d74c061875db300c41f0ad85f77a
  enableSuperuserAccess: false
  enablePDB: true
  postgresUID: 26
  postgresGID: 26
  seccompProfile:
    type: RuntimeDefault
  bootstrap:
    initdb:
      database: halo
      owner: halo
      encoding: UTF8
  storage:
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: '2'
      memory: 1Gi
  postgresql:
    parameters:
      shared_buffers: 128MB
      max_connections: '100'
