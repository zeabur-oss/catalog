apiVersion: v1
kind: ServiceAccount
metadata:
  name: mongodb-operand
  namespace: '{{ .Namespace }}'
automountServiceAccountToken: false
---
apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDB
metadata:
  name: mongodb
  namespace: '{{ .Namespace }}'
  finalizers:
  - percona.com/delete-psmdb-pods-in-order
spec:
  crVersion: 1.23.1
  image: docker.io/percona/percona-server-mongodb:8.0.32-14@sha256:5ba5f240d2dc98bc6236ab1d79c0862c4b62dba9d98cd0ffdf716c30473d2d11
  initImage: docker.io/percona/percona-server-mongodb-operator:1.23.1@sha256:78c87b933e184b9af36dbb0078751862c75934c1521c33d3be4d0a38aa58dd0a
  initContainerSecurityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
      - ALL
    seccompProfile:
      type: RuntimeDefault
    runAsUser: 1001
    runAsGroup: 1001
  imagePullPolicy: IfNotPresent
  updateStrategy: SmartUpdate
  upgradeOptions:
    apply: disabled
    setFCV: false
  tls:
    mode: requireTLS
    allowInvalidCertificates: false
  unsafeFlags:
    replsetSize: true
  secrets:
    users: mongodb-system-users
  logcollector:
    enabled: false
  sharding:
    enabled: false
  replsets:
  - name: rs0
    size: 1
    serviceAccountName: mongodb-operand
    env:
    - name: HOME
      value: /
    podSecurityContext: &id001
      runAsNonRoot: true
      runAsUser: 1001
      runAsGroup: 1001
      fsGroup: 1001
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext: &id002
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
      capabilities:
        drop:
        - ALL
      seccompProfile:
        type: RuntimeDefault
      runAsUser: 1001
      runAsGroup: 1001
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 2000m
        memory: 2Gi
    livenessProbe:
      failureThreshold: 6
      periodSeconds: 30
      timeoutSeconds: 10
      startupDelaySeconds: 7200
    readinessProbe:
      failureThreshold: 8
      periodSeconds: 10
      timeoutSeconds: 5
    volumeSpec:
      persistentVolumeClaim:
        storageClassName: local-path
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
    expose:
      enabled: false
    podDisruptionBudget:
      maxUnavailable: 1
  users:
  - name: app
    db: zeabur
    passwordSecretRef:
      name: mongodb-app-password
      key: password
    roles:
    - name: readWrite
      db: zeabur
  backup:
    enabled: true
    image: docker.io/percona/percona-backup-mongodb:2.15.0@sha256:12dcba7f1b55e00eb1b49dac51427d942c221b826d621d6bfad926a9d959a7c5
    serviceAccountName: mongodb-operand
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    podSecurityContext: *id001
    containerSecurityContext: *id002
    storages:
      s3:
        type: s3
        s3:
          bucket: '{{ .Inputs.backupBucket }}'
          prefix: '{{ .Inputs.backupPrefix }}'
          region: '{{ .Inputs.backupRegion }}'
          endpointUrl: '{{ .Inputs.backupEndpoint }}'
          credentialsSecret: '{{ .Inputs.backupSecret }}'
          insecureSkipTLSVerify: false
    tasks:
    - name: daily
      enabled: true
      schedule: 0 2 * * *
      retention:
        count: 7
        type: count
        deleteFromStorage: true
      storageName: s3
      compressionType: gzip
      type: logical
    pitr:
      enabled: true
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: '{{ .Namespace }}'
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongodb
  namespace: '{{ .Namespace }}'
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: mongodb
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: psmdb-operator
      podSelector:
        matchLabels:
          app.kubernetes.io/name: psmdb-operator
    ports:
    - protocol: TCP
      port: 27017
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/instance: mongodb
    ports:
    - protocol: TCP
      port: 27017
  - from:
    - podSelector:
        matchLabels:
          templates.zeabur.com/database-client: mongodb
    ports:
    - protocol: TCP
      port: 27017
  egress:
  - {{ dnsEgress }}
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/instance: mongodb
    ports:
    - protocol: TCP
      port: 27017
  - to:
    - ipBlock:
        cidr: '{{ .Inputs.backupCidr }}'
    ports:
    - protocol: TCP
      port: 443
---
apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDBBackup
metadata:
  name: mongodb-initial
  namespace: '{{ .Namespace }}'
spec:
  clusterName: mongodb
  storageName: s3
  type: logical
  compressionType: gzip
  startingDeadlineSeconds: 1800
