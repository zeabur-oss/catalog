apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: meilisearch-data
  namespace: '{{ .Namespace }}'
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: meilisearch
  namespace: '{{ .Namespace }}'
spec:
  serviceName: meilisearch
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: meilisearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: meilisearch
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: meilisearch
        image: getmeili/meilisearch:v1.55.0@sha256:ff546679970126f8822e15d1b6a06bfbff1f2ce2e43f810cfb5258012f92de5c
        ports:
        - name: http
          containerPort: 7700
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 2Gi
        env:
        - name: MEILI_ENV
          value: production
        - name: MEILI_MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: meilisearch-secrets
              key: master-key
        - name: MEILI_NO_ANALYTICS
          value: 'true'
        - name: MEILI_DB_PATH
          value: /meili_data/data.ms
        - name: MEILI_DUMP_DIR
          value: /meili_data/dumps
        - name: MEILI_SNAPSHOT_DIR
          value: /meili_data/snapshots
        - name: MEILI_MAX_INDEXING_MEMORY
          value: '1073741824'
        volumeMounts:
        - name: data
          mountPath: /meili_data
        - name: tmp
          mountPath: /tmp
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          failureThreshold: 120
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 20
          failureThreshold: 6
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: meilisearch-data
      - name: tmp
        emptyDir:
          sizeLimit: 2Gi
      terminationGracePeriodSeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: meilisearch
  namespace: '{{ .Namespace }}'
spec:
  selector:
    app.kubernetes.io/name: meilisearch
  ports:
  - name: http
    port: 7700
    targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: meilisearch
  namespace: '{{ .Namespace }}'
  annotations:
    cert-manager.io/cluster-issuer: '{{ .ClusterIssuer }}'
spec:
  ingressClassName: traefik
  tls:
  - hosts: ['{{ .Domain }}']
    secretName: meilisearch-tls
  rules:
  - host: '{{ .Domain }}'
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: meilisearch
            port:
              number: 7700
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: '{{ .Namespace }}'
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: meilisearch
  namespace: '{{ .Namespace }}'
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: meilisearch
  policyTypes: [Ingress, Egress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik
      podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
    ports:
    - protocol: TCP
      port: 7700
  - from:
    - podSelector:
        matchLabels:
          templates.zeabur.com/meilisearch-client: 'true'
    ports:
    - protocol: TCP
      port: 7700
  egress: []
