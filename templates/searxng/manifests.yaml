apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng
  namespace: {{ .Namespace }}
data:
  settings.yml: |
    use_default_settings: true
    general:
      instance_name: SearXNG
    server:
      bind_address: 0.0.0.0
      port: 8080
      base_url: https://{{ .Domain }}/
      limiter: false
      public_instance: false
      image_proxy: true
    search:
      formats: [html, json]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: {{ .Namespace }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: searxng}
  template:
    metadata:
      labels: {app.kubernetes.io/name: searxng, templates.zeabur.com/template: searxng}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 977
        runAsGroup: 977
        fsGroup: 977
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: searxng
          image: searxng/searxng:2026.10.24-ef0ec03da@sha256:7c7cbe509429e82755104b2a95f52085a98633c95d53f44e4e905fa3a59f08c8
          env:
            - {name: SEARXNG_BASE_URL, value: 'https://{{ .Domain }}/'}
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef: {name: app-secrets, key: signing-key}
            - {name: FORCE_OWNERSHIP, value: 'false'}
            - {name: GRANIAN_HOST, value: '0.0.0.0'}
          ports: [{name: http, containerPort: 8080}]
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 1000m, memory: 1Gi}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            - {name: config, mountPath: /etc/searxng, readOnly: true}
            - {name: cache, mountPath: /var/cache/searxng}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: searxng}
        - name: cache
          emptyDir: {sizeLimit: 256Mi}
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: searxng
  namespace: {{ .Namespace }}
spec:
  selector: {app.kubernetes.io/name: searxng}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: searxng
  namespace: {{ .Namespace }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .ClusterIssuer }}
spec:
  ingressClassName: traefik
  tls:
    - hosts: [{{ .Domain }}]
      secretName: searxng-tls
  rules:
    - host: {{ .Domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: searxng
                port: {name: http}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: searxng-default-deny
  namespace: {{ .Namespace }}
spec:
  podSelector: {matchLabels: {templates.zeabur.com/template: searxng}}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: searxng-network
  namespace: {{ .Namespace }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: searxng, templates.zeabur.com/template: searxng}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: traefik}
          podSelector:
            matchLabels: {app.kubernetes.io/name: traefik}
      ports: [{protocol: TCP, port: 8080}]
