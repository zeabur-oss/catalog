        - name: tmp
          mountPath: /tmp
          readOnly: false
        ports:
        - name: http
          containerPort: 3000
        readinessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
        startupProbe:
          tcpSocket:
            port: 3000
          failureThreshold: 120
          periodSeconds: 5
      volumes:
      - name: tmp
        emptyDir: {}
