# Converted and hardened from supabase-community/supabase-kubernetes 0.8.0 (Apache-2.0).
apiVersion: v1
kind: ConfigMap
metadata:
  name: supabase-backup-scripts
  namespace: '{{ .Namespace }}'
  labels:
    app.kubernetes.io/name: supabase-backup-scripts
    app.kubernetes.io/part-of: supabase
data:
  controller.py: |
    import json, os, pathlib, signal, ssl, time, urllib.request, urllib.error
    state = pathlib.Path("/state/lock")
    work = pathlib.Path("/work")
    names = json.loads(os.environ["DEPLOYMENTS"])
    namespace = pathlib.Path("/var/run/secrets/supabase/namespace").read_text().strip()
    host = os.environ["KUBERNETES_SERVICE_HOST"]
    if ":" in host: host = "[" + host + "]"
    base = "https://" + host + ":" + os.environ.get("KUBERNETES_SERVICE_PORT_HTTPS", "443")
    context = ssl.create_default_context(cafile="/var/run/secrets/supabase/ca.crt")
    def api(name, replicas=None):
        # Re-read the projected 600-second token for every request; never cache the rotating credential.
        token = pathlib.Path("/var/run/secrets/supabase/token").read_text().strip()
        headers = {"Authorization": "Bearer " + token}
        body = None
        if replicas is not None:
            headers["Content-Type"] = "application/merge-patch+json"
            body = json.dumps({"spec": {"replicas": replicas}}).encode()
        url = base + "/apis/apps/v1/namespaces/" + namespace + "/deployments/" + name + "/scale"
        req = urllib.request.Request(url, data=body, headers=headers, method="PATCH" if body is not None else "GET")
        with urllib.request.urlopen(req, context=context, timeout=20) as response:
            return json.load(response)
    def stop(signum, frame):
        raise SystemExit(128 + signum)
    signal.signal(signal.SIGTERM, stop)
    signal.signal(signal.SIGINT, stop)
    try:
        state.mkdir()  # Atomic, persisted lock shared by initial Job and every CronJob.
    except FileExistsError:
        (work / "result").write_text("1")
        raise RuntimeError("Another backup or interrupted maintenance owns /state/lock; inspect persisted state")
    counts = {}
    saved = False
    restored = False
    try:
        deadline = time.monotonic() + 600
        for name in names:
            while True:
                try:
                    counts[name] = api(name)["spec"]["replicas"]
                    break
                except urllib.error.HTTPError as error:
                    if error.code != 404 or time.monotonic() >= deadline: raise
                    time.sleep(2)
        with (state / "replicas.json").open("x") as file:
            json.dump(counts, file)
            file.flush()
            os.fsync(file.fileno())
        directory = os.open(state, os.O_RDONLY)
        os.fsync(directory)
        os.close(directory)
        saved = True
        for name in names: api(name, 0)
        while any(api(name).get("status", {}).get("replicas", 0) != 0 for name in names):
            if time.monotonic() >= deadline: raise TimeoutError("Workloads did not quiesce")
            time.sleep(2)
        # Scale status can stop counting terminating Pods. All declared app Pods have a 30-second grace period.
        time.sleep(35)
        (work / "quiesced").touch()
        deadline = time.monotonic() + 2700
        while not (work / "result").exists():
            if time.monotonic() >= deadline: raise TimeoutError("Backup exceeded maintenance window")
            time.sleep(2)
        if (work / "result").read_text().strip() != "0": raise RuntimeError("Backup failed; restoring original scales")
    except BaseException:
        (work / "result").write_text("1")
        raise
    finally:
        if saved:
            failures = []
            for name, replicas in counts.items():
                for attempt in range(6):
                    try:
                        api(name, replicas)
                        break
                    except Exception:
                        if attempt == 5: failures.append(name)
                        else: time.sleep(5)
            if failures:
                raise RuntimeError("Manual scale recovery required; persisted state retained for " + ",".join(failures))
            restored = True
            (state / "replicas.json").unlink()
        if not saved or restored: state.rmdir()
  dump.sh: |
    set -eu
    umask 007
    trap 's=$?; if [ "$s" -ne 0 ]; then printf "%s" "$s" > /work/result; fi' EXIT
    while [ ! -f /work/quiesced ]; do
      if [ -f /work/result ]; then exit 1; fi
      sleep 2
    done
    until pg_isready -h supabase-db -p 5432 -U supabase_admin -d postgres; do sleep 2; done
    mkdir -p /work/dumps
    # The encrypted snapshot also preserves SCRAM role verifiers needed for exact password restoration.
    pg_dumpall --globals-only > /work/dumps/globals.sql
    pg_dump -Fc --create -d postgres -f /work/dumps/postgres.dump
    pg_dump -Fc --create -d _supabase -f /work/dumps/_supabase.dump
    printf '%s\n' 'Supabase PostgreSQL 17 logical backup taken with apps stopped; no WAL archive or point-in-time recovery.' > /work/dumps/contract.txt
    touch /work/dump-ready
  backup.sh: |
    set -eu
    umask 007
    if [ -f /secrets/backup/ca.crt ]; then export RESTIC_CACERT=/secrets/backup/ca.crt; fi
    trap 's=$?; printf "%s" "$s" > /work/result' EXIT
    while [ ! -f /work/dump-ready ]; do
      if [ -f /work/result ]; then exit 1; fi
      sleep 2
    done
    if ! restic cat config; then restic init; fi
    restic backup --host supabase --tag consistent-maintenance \
      /work/dumps /data/objects /data/functions /data/snippets /data/pg-config /data/backup-state /secrets
    restic snapshots --latest 1 --tag consistent-maintenance
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: supabase-pg-config
  namespace: '{{ .Namespace }}'
  labels:
    app.kubernetes.io/name: supabase-pg-config
    app.kubernetes.io/part-of: supabase
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
