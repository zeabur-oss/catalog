apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: supabase-gateway
  namespace: '{{ .Namespace }}'
  labels:
    app.kubernetes.io/name: supabase-gateway
    app.kubernetes.io/part-of: supabase
  annotations:
    cert-manager.io/cluster-issuer: '{{ .ClusterIssuer }}'
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - '{{ .Domain }}'
    secretName: supabase-tls
  rules:
  - host: '{{ .Domain }}'
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: supabase-kong
            port:
              number: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: supabase-default-deny
  namespace: '{{ .Namespace }}'
  labels:
    app.kubernetes.io/name: supabase-default-deny
    app.kubernetes.io/part-of: supabase
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: supabase-dns
  namespace: '{{ .Namespace }}'
  labels:
    app.kubernetes.io/name: supabase-dns
    app.kubernetes.io/part-of: supabase
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - {{ dnsEgress }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
