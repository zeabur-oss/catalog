# Converted and hardened from supabase-community/supabase-kubernetes 0.8.0 (Apache-2.0).
apiVersion: v1
kind: ConfigMap
metadata:
  name: supabase-functions-router
  namespace: '{{ .Namespace }}'
  labels:
    app.kubernetes.io/name: supabase-functions-router
    app.kubernetes.io/part-of: supabase
data:
  index.ts: |
    // Hardened local router: no network imports and no privileged worker for OPTIONS or anonymous API keys.
    const encoder = new TextEncoder();
    const key = await crypto.subtle.importKey("raw", encoder.encode(Deno.env.get("JWT_SECRET")!),
      { name: "HMAC", hash: "SHA-256" }, false, ["verify"]);
    const decode = (s: string) => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));
    const headers = { "Access-Control-Allow-Origin": Deno.env.get("SITE_ORIGIN")!,
      "Access-Control-Allow-Headers": "authorization, apikey, content-type", "Access-Control-Allow-Methods": "GET, POST, PUT, PATCH, DELETE, OPTIONS" };
    Deno.serve(async (req: Request) => {
      if (req.method === "OPTIONS") return new Response(null, { status: 204, headers });
      try {
        const authorization = req.headers.get("authorization") ?? "";
        if (!authorization.startsWith("Bearer ")) throw new Error("Bearer token required");
        const token = authorization.slice(7).split(".");
        if (token.length !== 3) throw new Error("Invalid JWT");
        const h = JSON.parse(new TextDecoder().decode(decode(token[0])));
        const claims = JSON.parse(new TextDecoder().decode(decode(token[1])));
        if (h.alg !== "HS256" || !await crypto.subtle.verify("HMAC", key, decode(token[2]), encoder.encode(token[0] + "." + token[1])))
          throw new Error("Invalid JWT signature");
        const now = Date.now() / 1000;
        if (typeof claims.exp !== "number" || claims.exp <= now || (claims.nbf && claims.nbf > now)) throw new Error("Expired or inactive JWT");
        if (!["authenticated", "service_role"].includes(claims.role)) throw new Error("User authentication required");
        if (!["supabase", Deno.env.get("AUTH_ISSUER")].includes(claims.iss)) throw new Error("Invalid issuer");
      } catch {
        return Response.json({ error: "Authenticated user or service-role JWT required" }, { status: 401, headers });
      }
      const name = new URL(req.url).pathname.split("/")[1];
      if (!name || !/^[A-Za-z][A-Za-z0-9_-]{0,63}$/.test(name) || ["main", "router"].includes(name))
        return Response.json({ error: "Invalid function name" }, { status: 404, headers });
      try {
        const envVars = Object.entries(Deno.env.toObject());
        const worker = await EdgeRuntime.userWorkers.create({ servicePath: "/home/deno/functions/" + name,
          memoryLimitMb: 150, workerTimeoutMs: 60000, noModuleCache: false, importMapPath: null, envVars });
        return await worker.fetch(req);
      } catch {
        return Response.json({ error: "Function unavailable" }, { status: 500, headers });
      }
    });
  health.ts: |
    // Authenticated operational endpoint; application functions are persisted beside this directory.
    Deno.serve(() => Response.json({ service: "supabase-edge-runtime", status: "ok" }));
---
