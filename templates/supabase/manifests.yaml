apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: supabase-db
  namespace: '{{ .Namespace }}'
  labels:
    app.kubernetes.io/name: supabase-db
    app.kubernetes.io/part-of: supabase
spec:
  serviceName: supabase-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: supabase-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: supabase-db
        app.kubernetes.io/part-of: supabase
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
      - name: db
        image: supabase/postgres:17.6.1.136@sha256:f371b5f3f2ac0a05703f33d6e6134515fb2498cab708fb948a0aeb7481467c00
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 2Gi
        env:
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        - name: POSTGRES_USER
          value: supabase_admin
        - name: POSTGRES_DB
          value: postgres
        - name: POSTGRES_HOST
          value: /var/run/postgresql
        - name: POSTGRES_PORT
          value: '5432'
        - name: PGPORT
          value: '5432'
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: supabase-credentials
              key: admin-db-password
        - name: POSTGRES_DEVELOPER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: supabase-credentials
              key: developer-db-password
        - name: AUTH_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: supabase-credentials
              key: auth-db-password
        - name: STORAGE_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: supabase-credentials
              key: storage-db-password
        - name: REST_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: supabase-credentials
              key: rest-db-password
        - name: POOLER_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: supabase-credentials
              key: pooler-db-password
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: supabase-credentials
              key: jwt-secret
        volumeMounts:
        - name: tmp
          mountPath: /tmp
          readOnly: false
        - name: data
          mountPath: /var/lib/postgresql/data
          readOnly: false
        - name: socket
          mountPath: /var/run/postgresql
          readOnly: false
        - name: initdb
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
        - name: bootstrap
          mountPath: /bootstrap
          readOnly: true
        - name: bootstrap
          mountPath: /etc/postgresql.schema.sql
          subPath: final.sql
          readOnly: true
        - name: pg-config
          mountPath: /etc/postgresql-custom
          readOnly: false
        ports:
        - name: http
          containerPort: 5432
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -h
            - 127.0.0.1
            - -U
            - postgres
            - -d
            - postgres
          periodSeconds: 5
        startupProbe:
          tcpSocket:
            port: 5432
          failureThreshold: 120
          periodSeconds: 5
        args:
        - postgres
        - -c
        - config_file=/etc/postgresql/postgresql.conf
        - -c
        - data_directory=/var/lib/postgresql/data/pgdata
        - -c
        - hba_file=/bootstrap/pg_hba.conf
        - -c
        - log_min_messages=warning
        - -c
        - unix_socket_permissions=0770
      volumes:
      - name: tmp
        emptyDir: {}
      - name: initdb
        emptyDir: {}
      - name: bootstrap
        configMap:
          name: supabase-db-bootstrap
          defaultMode: 292
      - name: pg-config
        persistentVolumeClaim:
          claimName: supabase-pg-config
      - name: keys
        secret:
          secretName: supabase-credentials
          defaultMode: 288
          items:
          - key: pgsodium-root-key
            path: pgsodium-root-key
      - name: socket
        emptyDir: {}
      initContainers:
      - name: prepare-database
        image: supabase/postgres:17.6.1.136@sha256:f371b5f3f2ac0a05703f33d6e6134515fb2498cab708fb948a0aeb7481467c00
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        env: []
        volumeMounts:
        - name: tmp
          mountPath: /tmp
          readOnly: false
        - name: initdb
          mountPath: /initdb
          readOnly: false
        - name: bootstrap
          mountPath: /bootstrap
          readOnly: true
        - name: pg-config
          mountPath: /pg-config
          readOnly: false
        - name: keys
          mountPath: /keys
          readOnly: true
        command:
        - /bin/sh
        - -ec
        - |
          set -eu
          cp -R /docker-entrypoint-initdb.d/. /initdb/
          cp /bootstrap/98-webhooks.sql /initdb/init-scripts/98-webhooks.sql
          cp /bootstrap/99-jwt.sql /initdb/init-scripts/99-jwt.sql
          cp /bootstrap/97-_supabase.sql /initdb/migrations/97-_supabase.sql
          cp /bootstrap/99-realtime.sql /initdb/migrations/99-realtime.sql
          cp /bootstrap/99-pooler.sql /initdb/migrations/99-pooler.sql
          if [ ! -f /pg-config/.initialized ]; then
            cp -R /etc/postgresql-custom/. /pg-config/
            touch /pg-config/.initialized
          fi
          if [ -f /pg-config/pgsodium_root.key ]; then
            cmp /keys/pgsodium-root-key /pg-config/pgsodium_root.key
          else
            umask 027
            cat /keys/pgsodium-root-key > /pg-config/pgsodium_root.key
          fi
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: local-path
      resources:
        requests:
          storage: 20Gi
