apiVersion: v1
kind: ServiceAccount
metadata:
  name: supabase-backup
  namespace: '{{ .Namespace }}'
  labels:
    app.kubernetes.io/name: supabase-backup
    app.kubernetes.io/part-of: supabase
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: supabase-backup
  namespace: '{{ .Namespace }}'
  labels:
    app.kubernetes.io/name: supabase-backup
    app.kubernetes.io/part-of: supabase
rules:
- apiGroups:
  - apps
  resources:
  - deployments/scale
  resourceNames:
  - supabase-auth
  - supabase-rest
  - supabase-realtime
  - supabase-storage
  - supabase-imgproxy
  - supabase-meta
  - supabase-studio
  - supabase-supavisor
  - supabase-functions
  - supabase-kong
  verbs:
  - get
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: supabase-backup
  namespace: '{{ .Namespace }}'
  labels:
    app.kubernetes.io/name: supabase-backup
    app.kubernetes.io/part-of: supabase
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: supabase-backup
subjects:
- kind: ServiceAccount
  name: supabase-backup
  namespace: '{{ .Namespace }}'
---
apiVersion: batch/v1
kind: Job
metadata:
  name: supabase-initial-backup
  namespace: '{{ .Namespace }}'
  labels:
    app.kubernetes.io/name: supabase-initial-backup
    app.kubernetes.io/part-of: supabase
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: supabase-backup
        app.kubernetes.io/part-of: supabase
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 120
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: supabase-db
            topologyKey: kubernetes.io/hostname
      containers:
      - name: maintenance-controller
        image: python:3.14.0-alpine3.22@sha256:8373231e1e906ddfb457748bfc032c4c06ada8c759b7b62d9c73ec2a3c56e710
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        env:
        - name: DEPLOYMENTS
          value: '["supabase-auth", "supabase-rest", "supabase-realtime", "supabase-storage", "supabase-imgproxy", "supabase-meta",
            "supabase-studio", "supabase-supavisor", "supabase-functions", "supabase-kong"]'
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        volumeMounts:
        - name: tmp
          mountPath: /tmp
          readOnly: false
        - name: scripts
          mountPath: /scripts
          readOnly: true
        - name: work
          mountPath: /work
          readOnly: false
        - name: backup-state
          mountPath: /state
          readOnly: false
        - name: kube-api
          mountPath: /var/run/secrets/supabase
          readOnly: true
        command:
        - python3
        - /scripts/controller.py
      - name: postgres-native-dump
        image: supabase/postgres:17.6.1.136@sha256:f371b5f3f2ac0a05703f33d6e6134515fb2498cab708fb948a0aeb7481467c00
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 1Gi
        env:
        - name: PGHOST
          value: supabase-db
        - name: PGPORT
          value: '5432'
        - name: PGUSER
          value: supabase_admin
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: supabase-credentials
              key: admin-db-password
        volumeMounts:
        - name: tmp
          mountPath: /tmp
          readOnly: false
        - name: scripts
          mountPath: /scripts
          readOnly: true
        - name: work
          mountPath: /work
          readOnly: false
        command:
        - /bin/sh
        - /scripts/dump.sh
      - name: encrypted-s3-snapshot
        image: restic/restic:0.18.1@sha256:39d9072fb5651c80d75c7a811612eb60b4c06b32ffe87c2e9f3c7222e1797e76
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 1Gi
        env:
        - name: RESTIC_REPOSITORY
          value: s3:{{ .Inputs.backupEndpoint }}/{{ .Inputs.backupBucket }}/{{ .Inputs.backupPrefix }}
        - name: RESTIC_PASSWORD_FILE
          value: /secrets/install/backup-password
        - name: RESTIC_CACHE_DIR
          value: /tmp/restic
        - name: AWS_DEFAULT_REGION
          value: '{{ .Inputs.backupRegion }}'
        - name: AWS_EC2_METADATA_DISABLED
          value: 'true'
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: '{{ .Inputs.backupSecret }}'
              key: ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: '{{ .Inputs.backupSecret }}'
              key: ACCESS_SECRET_KEY
        volumeMounts:
        - name: tmp
          mountPath: /tmp
          readOnly: false
        - name: scripts
          mountPath: /scripts
          readOnly: true
        - name: work
          mountPath: /work
          readOnly: false
        - name: objects
          mountPath: /data/objects
          readOnly: true
        - name: functions
          mountPath: /data/functions
          readOnly: true
        - name: snippets
          mountPath: /data/snippets
          readOnly: true
        - name: pg-config
          mountPath: /data/pg-config
          readOnly: true
        - name: backup-state
          mountPath: /data/backup-state
          readOnly: true
        - name: install-secrets
          mountPath: /secrets/install
          readOnly: true
        - name: backup-secrets
          mountPath: /secrets/backup
          readOnly: true
        - name: smtp-secrets
          mountPath: /secrets/smtp
          readOnly: true
        command:
        - /bin/sh
        - /scripts/backup.sh
      volumes:
      - name: tmp
        emptyDir: {}
      - name: scripts
        configMap:
          name: supabase-backup-scripts
          defaultMode: 292
      - name: work
        emptyDir: {}
      - name: backup-state
        persistentVolumeClaim:
          claimName: supabase-backup-state
      - name: objects
        persistentVolumeClaim:
          claimName: supabase-objects
      - name: functions
        persistentVolumeClaim:
          claimName: supabase-functions
      - name: snippets
        persistentVolumeClaim:
          claimName: supabase-snippets
      - name: pg-config
        persistentVolumeClaim:
          claimName: supabase-pg-config
      - name: install-secrets
        secret:
          secretName: supabase-credentials
          defaultMode: 288
      - name: backup-secrets
        secret:
          secretName: '{{ .Inputs.backupSecret }}'
          defaultMode: 288
      - name: smtp-secrets
        secret:
          secretName: '{{ .Inputs.smtpSecret }}'
          defaultMode: 288
      - name: kube-api
        projected:
          defaultMode: 288
          sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 600
          - configMap:
              name: kube-root-ca.crt
              items:
              - key: ca.crt
                path: ca.crt
          - downwardAPI:
              items:
              - path: namespace
                fieldRef:
                  fieldPath: metadata.namespace
      serviceAccountName: supabase-backup
      restartPolicy: Never
---
