# Converted and hardened from supabase-community/supabase-kubernetes 0.8.0 (Apache-2.0).
apiVersion: v1
kind: ConfigMap
metadata:
  name: supabase-pooler-config
  namespace: '{{ .Namespace }}'
  labels:
    app.kubernetes.io/name: supabase-pooler-config
    app.kubernetes.io/part-of: supabase
data:
  pooler.exs: |
    {:ok, _} = Application.ensure_all_started(:supavisor)
    %{rows: [[ver]]} = Supavisor.Repo.query!("select version()")
    {:ok, version} = Supavisor.Helpers.parse_pg_version(ver)
    params = %{
      "external_id" => System.fetch_env!("POOLER_TENANT_ID"),
      "db_host" => System.fetch_env!("POSTGRES_HOST"),
      "db_port" => System.fetch_env!("POSTGRES_PORT"),
      "db_database" => System.fetch_env!("POSTGRES_DB"),
      "require_user" => false,
      "auth_query" => "SELECT * FROM pgbouncer.get_auth($1)",
      "default_max_clients" => System.fetch_env!("POOLER_MAX_CLIENT_CONN"),
      "default_pool_size" => System.fetch_env!("POOLER_DEFAULT_POOL_SIZE"),
      "default_parameter_status" => %{"server_version" => version},
      "users" => [%{"db_user" => "pgbouncer", "db_password" => System.fetch_env!("POSTGRES_PASSWORD"),
        "mode_type" => "transaction", "pool_size" => System.fetch_env!("POOLER_DEFAULT_POOL_SIZE"), "is_manager" => true}]
    }
    if !Supavisor.Tenants.get_tenant_by_external_id(params["external_id"]) do
      {:ok, _} = Supavisor.Tenants.create_tenant(params)
    end
---
