apiVersion: catalog.zeabur.com/v1
kind: Template
metadata:
  name: Supabase
  description: >-
    Self-hosted Supabase: PostgreSQL 17, Auth, REST/GraphQL, Realtime, Storage,
    authenticated Edge Functions, Kong, Studio, Meta and Supavisor, with
    encrypted S3 maintenance backups.
  license: >-
    Apache-2.0 AND PostgreSQL AND MIT AND BSD-2-Clause AND PSF-2.0 AND
    LicenseRef-Component-Licenses
  # Also: https://github.com/supabase-community/supabase-kubernetes/tree/f8f4f11e79f330d163279d61d230c5585887d6fc, https://github.com/supabase/postgres/tree/17.6.1.136, https://github.com/supabase/supavisor/tree/v2.9.13, https://supabase.com/docs/guides/self-hosting/remove-superuser-access, https://restic.readthedocs.io/en/stable/030_preparing_a_new_repo.html
  homepage: https://github.com/supabase/supabase
  icon: https://icons.zeabur.com/supabase.png
  categories: [databases]

requires: [ingress/traefik, certificates/cert-manager]

services:
  - name: db
    securityProfile: restricted
    ports: [{name: postgresql, port: 5432}]
    resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "2", memory: 2Gi}}
  - name: auth
    securityProfile: restricted
    ports: [{name: http, port: 9999}]
    resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
  - name: realtime
    securityProfile: restricted
    ports: [{name: http, port: 4000}]
    resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
  - name: storage
    securityProfile: restricted
    ports: [{name: http, port: 5000}]
    resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
  - name: kong
    securityProfile: restricted
    ports: [{name: http, port: 8000}]
    resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
    domains: ['{{ .Domain }}']
  - name: meta
    securityProfile: restricted
    ports: [{name: http, port: 8080}]
    resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
  - name: studio
    securityProfile: restricted
    ports: [{name: http, port: 3000}]
    resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "2", memory: 1Gi}}
  - name: supavisor
    securityProfile: restricted
    ports: [{name: health, port: 4000}, {name: session, port: 5432}, {name: transaction, port: 6543}]
    resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
  - name: functions
    securityProfile: restricted
    ports: [{name: http, port: 9000}]
    resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
  - name: imgproxy
    securityProfile: restricted
    ports: [{name: http, port: 5001}]
    resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
  - name: rest
    securityProfile: restricted
    ports: [{name: http, port: 3000}]
    resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}

inputs:
  - name: siteUrl
    description: >-
      Exact HTTPS origin of the consuming frontend, without a path or trailing
      slash; used for GoTrue redirects and API CORS.
    required: true
    validation: {pattern: '^https://[a-zA-Z0-9]([a-zA-Z0-9.-]*[a-zA-Z0-9])?$'}
  - name: smtpHost
    description: >-
      SMTP submission host on TCP 587, with STARTTLS and a publicly trusted
      certificate. Email confirmation is mandatory, so Auth needs a working SMTP
      server.
    required: true
    validation: {pattern: '^[a-zA-Z0-9]([a-zA-Z0-9.-]*[a-zA-Z0-9])?$'}
  - name: smtpFrom
    description: Verified SMTP sender address for confirmation, recovery and invitation messages.
    required: true
    validation: {pattern: '^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$'}
  - name: smtpSecret
    description: >-
      Existing namespaced Secret containing username and password for the SMTP
      server; also included in encrypted backups.
    required: true
    validation: {pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'}
  - name: smtpCidr
    description: >-
      IPv4 destination CIDR of the SMTP submission endpoint. NetworkPolicy
      allows this CIDR only; a DNS name does not open egress.
    required: true
    validation: {pattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[12][0-9]|3[0-2])$'}
  - name: backupEndpoint
    description: >-
      S3-compatible HTTPS endpoint on TCP 443. The certificate must chain to
      public roots or to the optional ca.crt in backupSecret; TLS verification
      stays on.
    required: true
    validation: {pattern: '^https://[a-zA-Z0-9.-]+(:443)?$'}
  - name: backupBucket
    description: Dedicated existing S3 bucket for the encrypted restic repository.
    required: true
    validation: {pattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'}
  - name: backupPrefix
    description: >-
      Unique non-shared repository prefix for this installation; credentials
      must be limited to this bucket/prefix.
    required: true
    validation: {pattern: '^[a-z0-9][a-z0-9/_-]{2,120}$'}
  - name: backupRegion
    description: Region expected by the S3-compatible endpoint.
    required: true
    validation: {pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,62}$'}
  - name: backupSecret
    description: >-
      Existing namespaced Secret with ACCESS_KEY_ID and ACCESS_SECRET_KEY scoped
      to the backup bucket/prefix only: listing limited to the prefix, object
      get/put/delete there, and multipart permissions if the S3 service needs
      them. Optional ca.crt supplies a private S3 certificate authority.
    required: true
    validation: {pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'}
  - name: backupCidr
    description: IPv4 CIDR of the S3 HTTPS endpoint. Update after address changes.
    required: true
    validation: {pattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[12][0-9]|3[0-2])$'}
  - name: kubeApiCidr
    description: >-
      Kubernetes API service/endpoint IPv4 CIDR as seen by the CNI, used only by
      the short-lived scoped maintenance backup controller.
    required: true
    validation: {pattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[12][0-9]|3[0-2])$'}
  - name: jwtSecret
    description: >-
      Install-specific HS256 seed, retained across upgrades. Derives the anon
      and service-role keys; never use a demo value.
    generate: random
    generateBytes: 32
    generateEncoding: base64url
    secret: {name: supabase-credentials, key: jwt-secret}
    validation: {pattern: '^[A-Za-z0-9_-]{43}$'}
  - name: adminDbPassword
    description: >-
      Private Supabase administration credential, never handed to Studio, Meta,
      PostgREST, GoTrue, Storage or user functions.
    generate: random
    generateBytes: 32
    generateEncoding: base64url
    secret: {name: supabase-credentials, key: admin-db-password}
    validation: {pattern: '^[A-Za-z0-9_-]{43}$'}
  - name: developerDbPassword
    description: >-
      Restricted developer-facing postgres role credential; preserves upstream
      NOSUPERUSER demotion.
    generate: random
    generateBytes: 32
    generateEncoding: base64url
    secret: {name: supabase-credentials, key: developer-db-password}
    validation: {pattern: '^[A-Za-z0-9_-]{43}$'}
  - name: authDbPassword
    description: Dedicated supabase_auth_admin password.
    generate: random
    generateBytes: 32
    generateEncoding: base64url
    secret: {name: supabase-credentials, key: auth-db-password}
    validation: {pattern: '^[A-Za-z0-9_-]{43}$'}
  - name: storageDbPassword
    description: Dedicated supabase_storage_admin password.
    generate: random
    generateBytes: 32
    generateEncoding: base64url
    secret: {name: supabase-credentials, key: storage-db-password}
    validation: {pattern: '^[A-Za-z0-9_-]{43}$'}
  - name: restDbPassword
    description: Dedicated authenticator password; only JWT-selected API roles are available.
    generate: random
    generateBytes: 32
    generateEncoding: base64url
    secret: {name: supabase-credentials, key: rest-db-password}
    validation: {pattern: '^[A-Za-z0-9_-]{43}$'}
  - name: poolerDbPassword
    description: Dedicated pgbouncer password used by Supavisor auth_query.
    generate: random
    generateBytes: 32
    generateEncoding: base64url
    secret: {name: supabase-credentials, key: pooler-db-password}
    validation: {pattern: '^[A-Za-z0-9_-]{43}$'}
  - name: dashboardPassword
    description: >-
      Generated Basic-auth administrator password; protects all Studio routes,
      including its server APIs.
    generate: random
    generateBytes: 32
    generateEncoding: base64url
    secret: {name: supabase-credentials, key: dashboard-password}
    validation: {pattern: '^[A-Za-z0-9_-]{43}$'}
  - name: pgsodiumRootKey
    description: >-
      Persisted 32-byte pgsodium/vault root key encoded as 64 hexadecimal
      characters; preserve with every restore.
    generate: random
    generateBytes: 32
    generateEncoding: hex
    secret: {name: supabase-credentials, key: pgsodium-root-key}
    validation: {pattern: '^[a-f0-9]{64}$'}
  - name: realtimeDbKey
    description: >-
      Realtime requires exactly 16 ASCII characters: 12 random bytes encoded
      base64url gives 96 bits of entropy.
    generate: random
    generateBytes: 12
    generateEncoding: base64url
    secret: {name: supabase-credentials, key: realtime-db-key}
    validation: {pattern: '^[A-Za-z0-9_-]{16}$'}
  - name: secretKeyBase
    description: >-
      Phoenix/Supavisor signing material: 48 random bytes encoded as 64 ASCII
      characters.
    generate: random
    generateBytes: 48
    generateEncoding: base64url
    secret: {name: supabase-credentials, key: secret-key-base}
    validation: {pattern: '^[A-Za-z0-9_-]{64}$'}
  - name: poolerVaultKey
    description: >-
      Supavisor requires exactly 32 ASCII characters: 24 random bytes encoded
      base64url.
    generate: random
    generateBytes: 24
    generateEncoding: base64url
    secret: {name: supabase-credentials, key: pooler-vault-key}
    validation: {pattern: '^[A-Za-z0-9_-]{32}$'}
  - name: metaCryptoKey
    description: Postgres Meta/Studio encryption key; retained with saved metadata.
    generate: random
    generateBytes: 32
    generateEncoding: hex
    secret: {name: supabase-credentials, key: meta-crypto-key}
    validation: {pattern: '^[a-f0-9]{64}$'}
  - name: backupPassword
    description: >-
      Restic encryption password. Escrow out of band with repository
      coordinates; encrypted copies inside a snapshot cannot unlock that
      snapshot.
    generate: random
    generateBytes: 32
    generateEncoding: base64url
    secret: {name: supabase-credentials, key: backup-password}
    validation: {pattern: '^[A-Za-z0-9_-]{43}$'}
  - name: anonKey
    description: >-
      Coherently signed install-specific anon HS256 JWT, generated only by the
      explicit inputs command from jwtSecret.
    generate: jwt-hs256
    jwtFrom: jwtSecret
    jwtRole: anon
    secret: {name: supabase-credentials, key: anon-key}
    validation: {pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'}
  - name: serviceRoleKey
    description: >-
      Coherently signed install-specific service_role HS256 JWT, generated only
      by the explicit inputs command from jwtSecret.
    generate: jwt-hs256
    jwtFrom: jwtSecret
    jwtRole: service_role
    secret: {name: supabase-credentials, key: service-role-key}
    validation: {pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'}

security:
  summary: >-
    All workloads restricted and token-off. Sole explicit token is a 600-second,
    controller-only projection in backup Jobs, bound to named Deployment scale
    subresources. Separate developer/admin SQL credentials, generated coherent
    JWTs, protected Studio/private Meta, authenticated-user-only functions,
    default-deny network and encrypted backups.
  egress:
    - DNS to kube-system kube-dns TCP/UDP53
    - SMTP CIDR TCP587 from Auth only
    - S3 CIDR TCP443 from encrypted backup Jobs only
    - Kubernetes API CIDR TCP443/6443 from scoped maintenance backup Jobs only
    - >-
      Explicit same-namespace component edges; database webhooks only to
      authenticated Edge Functions by default
  risks:
    - risk: >-
        The template runs its own PostgreSQL StatefulSet without a database
        operator. The private supabase_admin role used by Realtime and Supavisor
        is a SQL superuser; that authority must not be given to developer-facing
        clients.
      mitigation: >-
        Preserve upstream postgres NOSUPERUSER migrations and separate
        passwords. Studio and Meta use the non-superuser postgres role. Do not
        expose the DB, pooler management, Meta, Realtime management or Studio
        directly. Normal Pods have no Kubernetes token; private keys and backups
        remain namespace-admin secrets.
    - risk: >-
        A consistent file-object/database backup temporarily stops all app
        Deployments and needs narrowly scoped maintenance authority. A
        SIGKILL/node loss can interrupt scale restoration.
      mitigation: >-
        The Job has named deployments/scale get+patch only, no
        Secret/Pod/Deployment API rights. It persists scales before stopping,
        uses a shared atomic PVC lock across initial/Cron Jobs, re-reads
        rotating tokens and restores in finally. If a backup Job is killed, keep
        ingress closed. From a Pod without a token, read
        /state/lock/replicas.json on the supabase-backup-state PVC. Restore
        those Deployment replica counts with your own Kubernetes identity,
        confirm the old backup Pods are stopped, keep a copy of the record, then
        remove the /state/lock directory. Do not remove the lock only because a
        CronJob is waiting.
    - risk: >-
        JWT service-role, developer SQL, root encryption and restic credentials
        must survive node/PVC loss and must never be published.
      mitigation: >-
        Generate only through the explicit inputs command, preserve the existing
        Secret on upgrades, and escrow the restic unlock key plus repository
        coordinates out of band. Encrypted snapshots include every install
        Secret, SMTP/backup credentials, object/function/snippet data and both
        Supabase databases.
    - risk: >-
        User-installed Edge Functions receive service-role/developer credentials
        and are trusted application code. An anon API key cannot invoke them.
      mitigation: >-
        Local router verifies HS256 signature, expiry, issuer and
        authenticated/service_role role before loading any worker. OPTIONS
        returns before creating a worker; reserved/router names and traversal
        paths are rejected. No remote router imports, public demo keys or
        unauthenticated privileged handler. Each function must enforce its own
        application authorization.
    - risk: >-
        local-path is node-local and all file-backed services/backups are
        intentionally co-located with the database.
      mitigation: >-
        Store encrypted repositories off-cluster with scoped S3 credentials, and
        rehearse a full restore before production. See the restore outline in
        upgradeNotes.

scalability:
  summary: >-
    One full Supabase project, one PostgreSQL 17 instance and one replica per
    app; local-path PVCs are co-located on the database node. Native logical
    plus encrypted file backup uses a deliberate daily maintenance window at
    03:00 UTC.
  replicas: 1
  maxReplicas: 1
  blockers:
    - Node-local data is not replicated and cannot survive node loss without restore.
    - >-
      File-backed Storage and function/snippet management require single-node
      co-location.
    - >-
      Automatic maintenance backups temporarily stop apps; direct unmanaged SQL
      writers and custom SQL jobs must not mutate storage metadata during that
      window.
    - >-
      Backups are daily logical dumps. There is no WAL archive or PITR. Writes
      after the last backup are lost on failure, and apps stop during each
      backup.
    - >-
      Backups cover the postgres and _supabase databases only. Additional
      databases and tablespaces are not backed up.

upgradeNotes:
  - >-
    Never skip Supabase role-demotion migrations or replace the
    supabase/postgres image with vanilla PostgreSQL; the bundled extensions and
    preloads are required.
  - >-
    Manifests are converted from the community-maintained supabase-kubernetes
    chart 0.8.0 at commit f8f4f11e79f330d163279d61d230c5585887d6fc. Supabase
    does not officially support this chart. Upstream main keeps version 0.8.0
    with different images, so compare by commit. Supavisor 2.9.13 and the
    kong:3.9.1 OSS image replace the chart versions.
  - >-
    Preserve the existing supabase-credentials Secret, pgsodium key/config and
    data PVCs; do not regenerate credentials or rerun initdb on existing data.
    Update component images together and check their SQL migrations.
  - >-
    Take a completed encrypted maintenance backup and use the full restore
    procedure before image upgrades. PostgreSQL major upgrades need a logical
    dump and restore; do not only change the image tag.
  - >-
    Existing Supavisor tenant credentials are persisted in _supabase. To rotate
    the pooler password, update the Supavisor tenant auth as well as the Secret.
  - >-
    Logflare analytics and Vector log collection are disabled. Storage uses the
    file backend on a PVC; MinIO is not installed.
  - >-
    Database webhooks reach only the Edge Functions service. Other external
    integrations need a NetworkPolicy change.
  - >-
    Restore, part 1: keep the old PVCs and repository. Suspend the backup
    CronJob, close ingress, and use a new namespace with all app Deployments at
    0 and without the initial backup Job. Run restic snapshots --tag
    consistent-maintenance, pick a completed snapshot, and restic restore
    SNAPSHOT_ID --target /restore.
  - >-
    Restore, part 2: recreate supabase-credentials from every file in
    /restore/secrets/install, and the SMTP and backup Secrets from their
    directories. Do not regenerate any key. Copy objects, functions, snippets
    and pg-config into fresh co-located claims; app files use UID 1000/fsGroup
    1000, PostgreSQL files UID 100/GID 101. Keep key and config files private.
  - >-
    Restore, part 3: start PostgreSQL from the same image with an empty
    /docker-entrypoint-initdb.d and the recovered supabase_admin password.
    Remove only the single CREATE ROLE supabase_admin statement from globals.sql
    and run it with psql --set ON_ERROR_STOP=1 --dbname=template1. Run dropdb
    --maintenance-db=template1 postgres, then pg_restore --exit-on-error
    --create --dbname=template1 for postgres.dump and then _supabase.dump.
  - >-
    Restore, part 4: restore the normal init definition. Check that
    postgres.rolsuper is false and that the Auth, Storage, Realtime, GraphQL and
    pooler schemas exist. Restore app replicas from the saved counts and test
    Auth, REST, Realtime, Storage, functions and the pooler. Do not restore an
    active backup lock. Reopen ingress, complete a new backup, then resume the
    CronJob.

smoke:
  - name: database-ready
    resource: statefulset/supabase-db
    condition: jsonpath={.status.readyReplicas}=1
    timeout: 1200s
  - name: auth-ready
    resource: deployment/supabase-auth
    condition: condition=Available
    timeout: 1200s
  - name: rest-ready
    resource: deployment/supabase-rest
    condition: condition=Available
    timeout: 1200s
  - name: realtime-ready
    resource: deployment/supabase-realtime
    condition: condition=Available
    timeout: 1200s
  - name: storage-ready
    resource: deployment/supabase-storage
    condition: condition=Available
    timeout: 1200s
  - name: imgproxy-ready
    resource: deployment/supabase-imgproxy
    condition: condition=Available
    timeout: 1200s
  - name: meta-ready
    resource: deployment/supabase-meta
    condition: condition=Available
    timeout: 1200s
  - name: studio-ready
    resource: deployment/supabase-studio
    condition: condition=Available
    timeout: 1200s
  - name: supavisor-ready
    resource: deployment/supabase-supavisor
    condition: condition=Available
    timeout: 1200s
  - name: functions-ready
    resource: deployment/supabase-functions
    condition: condition=Available
    timeout: 1200s
  - name: kong-ready
    resource: deployment/supabase-kong
    condition: condition=Available
    timeout: 1200s
  - name: initial-consistent-s3-backup
    resource: job/supabase-initial-backup
    condition: condition=Complete
    timeout: 3600s
  - name: public-studio-requires-auth
    resource: deployment/supabase-kong
    condition: condition=Available
    timeout: 300s
    http:
      service: supabase-kong
      port: 8000
      path: /api/platform/profile
      status: 401
  - name: public-functions-require-user-jwt
    resource: deployment/supabase-kong
    condition: condition=Available
    timeout: 300s
    http:
      service: supabase-kong
      port: 8000
      path: /functions/v1/health
      status: 401
  - name: metadata-not-public
    resource: deployment/supabase-kong
    condition: condition=Available
    timeout: 300s
    http: {service: supabase-kong, port: 8000, path: /pg/schemas, status: 403}
