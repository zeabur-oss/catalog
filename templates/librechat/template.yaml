apiVersion: catalog.zeabur.com/v1
kind: Template
metadata:
  name: LibreChat
  version: "latest"
  description: >-
    Authenticated AI chat with Percona-managed MongoDB, CNPG pgvector RAG and
    private community Meilisearch.
  license: MIT AND SSPL-1.0 AND PostgreSQL AND Apache-2.0
  # Also: https://github.com/danny-avila/rag_api, https://github.com/percona/percona-server-mongodb-operator, https://cloudnative-pg.io/, https://github.com/meilisearch/meilisearch
  homepage: https://github.com/danny-avila/LibreChat
  categories: [ai]

requires:
  - databases/percona-mongodb
  - databases/cloudnative-pg
  - ingress/traefik
  - certificates/cert-manager

services:
  - name: librechat
    securityProfile: restricted
    ports: [{name: http, port: 3080}]
    resources: {requests: {cpu: 500m, memory: 1Gi}, limits: {cpu: "2", memory: 3Gi}}
    domains: ['{{ .Domain }}']
  - name: rag-api
    securityProfile: restricted
    ports: [{name: http, port: 8000}]
    resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "2", memory: 2Gi}}
  - name: meilisearch
    securityProfile: restricted
    ports: [{name: http, port: 7700}]
    resources: {requests: {cpu: 200m, memory: 512Mi}, limits: {cpu: "1", memory: 2Gi}}
  - name: rag-db
    securityProfile: restricted
    ports: [{name: postgresql, port: 5432}]
    resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "2", memory: 2Gi}}
  - name: mongodb
    securityProfile: restricted
    ports: [{name: mongodb, port: 27017}]
    resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "2", memory: 2Gi}}

inputs:
  - name: licenseOptIn
    label: MongoDB license agreement
    locales:
      zh-TW:
        label: MongoDB 授權同意
        description: "Percona MongoDB 採用 SSPL-1.0。讀過第 13 條提供服務的義務後再同意。"
      zh-CN:
        label: MongoDB 许可协议
        description: "Percona MongoDB 采用 SSPL-1.0。读完第 13 条提供服务的义务后再同意。"
    description: >-
      The Percona MongoDB server uses SSPL-1.0. Read section 13 on
      service-offering obligations, then type I-ACCEPT-MONGODB-SSPL.
    required: true
    validation: {pattern: ^I-ACCEPT-MONGODB-SSPL$}
  - name: adminEmail
    label: Administrator email
    locales:
      zh-TW:
        label: 管理員 Email
        description: "第一個管理員的 Email。密碼會自動產生，放在機密 app-secrets 的 admin-password。不開放公開註冊。之後改機密不會重設已有的密碼。"
      zh-CN:
        label: 管理员邮箱
        description: "第一个管理员的邮箱。密码会自动生成，放在机密 app-secrets 的 admin-password。不开放公开注册。之后修改机密不会重置已有的密码。"
    description: >-
      Initial administrator email; password is generated in
      app-secrets/admin-password. Public registration is disabled. Changing the
      Secret later does not reset an existing password.
    required: true
    validation: {pattern: '^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$'}
  - name: providerSecret
    label: OpenAI API key secret
    locales:
      zh-TW:
        label: OpenAI API 金鑰的機密
        description: "這個專案裡現有的機密，含真實的 OPENAI_API_KEY，聊天和 RAG 嵌入都會用到。"
      zh-CN:
        label: OpenAI API 密钥的机密
        description: "这个项目里现有的机密，含真实的 OPENAI_API_KEY，聊天和 RAG 嵌入都会用到。"
    description: Existing Secret with real OPENAI_API_KEY used by chat and RAG embeddings.
    required: true
    validation: {pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'}
  - name: adminPassword
    description: adminPassword generated credential; retain during upgrades.
    generate: random
    secret: {name: app-secrets, key: admin-password}
    validation: {pattern: '^[A-Za-z0-9_-]{43}$'}
  - name: mongoPassword
    description: mongoPassword generated credential; retain during upgrades.
    generate: random
    secret: {name: app-secrets, key: mongo-password}
    validation: {pattern: '^[A-Za-z0-9_-]{43}$'}
  - name: jwtSecret
    description: jwtSecret generated credential; retain during upgrades.
    generate: random
    secret: {name: app-secrets, key: jwt-secret}
    validation: {pattern: '^[A-Za-z0-9_-]{43}$'}
  - name: jwtRefreshSecret
    description: jwtRefreshSecret generated credential; retain during upgrades.
    generate: random
    secret: {name: app-secrets, key: jwt-refresh-secret}
    validation: {pattern: '^[A-Za-z0-9_-]{43}$'}
  - name: credsKey
    description: credsKey generated credential; retain during upgrades.
    generate: random
    secret: {name: app-secrets, key: creds-key}
    validation: {pattern: '^[A-Za-z0-9_-]{43}$'}
  - name: credsIv
    description: credsIv generated credential; retain during upgrades.
    generate: random
    secret: {name: app-secrets, key: creds-iv}
    validation: {pattern: '^[A-Za-z0-9_-]{43}$'}
  - name: meiliKey
    description: meiliKey generated credential; retain during upgrades.
    generate: random
    secret: {name: app-secrets, key: meili-key}
    validation: {pattern: '^[A-Za-z0-9_-]{43}$'}

security:
  summary: >-
    Restricted non-root app pods with read-only images and no API token.
    TLS/authenticated Percona operands remain restricted with one writable-root
    exception for hardcoded /tmp TLS material. CNPG uses scoped operator-managed
    tokens. mongod requires client certificates: LibreChat presents a 90-day
    client-auth certificate from the cluster CA, renewed by cert-manager, and
    restarts when it changes.
  risks:
    - risk: >-
        Percona v1.23.1 entry scripts write hardcoded /tmp/tls.pem and
        tls-internal.pem; CR lacks a main-container /tmp mount override.
      mitigation: >-
        Explicit operator-only readOnlyRootFilesystem=false exception; keep TLS
        requireTLS, UID1001, drop ALL, no escalation, RuntimeDefault. All
        ordinary application images remain read-only; no post-reconcile mutation
        or TLS disablement.
    - risk: >-
        The MongoDB server license (SSPL-1.0) imposes service-offering
        obligations. SSPL is not OSI-approved.
      mitigation: >-
        Required exact license acknowledgment and private app-only Mongo
        service. The Apache-2.0 operator license covers only the operator.
        Meilisearch uses the MIT community image; BUSL enterprise modules are
        not included.
    - risk: >-
        CNPG instance manager requires Kubernetes API credentials.
      mitigation: >-
        The catalog operator creates a per-cluster SA/RBAC. Ordinary app and
        Percona operand tokens are disabled.
    - risk: >-
        Meilisearch has no catalog operator, and local files and databases have
        separate recovery points.
      mitigation: >-
        Hardened single-replica StatefulSet. Take coordinated backups of files,
        MongoDB, pgvector, Meilisearch dumps and generated Secrets; stop writers
        for a consistent file backup. Test a complete restore in an isolated
        namespace, including login, saved credentials, search and document
        retrieval.
    - risk: The app shows the upstream LibreChat privacy policy and terms links.
      mitigation: Configure your own privacy policy and terms of service before public use.

scalability:
  summary: >-
    One application/RAG/Meili/PG replica and one operator-managed MongoDB
    member, like the single CNPG instance. The stack has no HA.
  replicas: 1
  maxReplicas: 1
  blockers:
    - A node-local default StorageClass, such as local-path, has no snapshots or failover.
    - >-
      MongoDB runs one replica set member (unsafeFlags.replsetSize). Explicit
      MongoDB FQDNs assume the cluster DNS suffix cluster.local.
    - >-
      Application file PVC, Meili state and pgvector database are
      single-instance; no app HPA.
    - >-
      Compatible catalog CNPG and Percona operators plus real provider Secrets
      must exist. NetworkPolicies select the operators
      in namespaces psmdb-operator and cnpg-system; adjust them for other
      install locations.

upgradeNotes:
  - >-
    New installs start without database backups. Installs made before this
    version keep their backups. To turn backups on, open the database in Zeabur
    and use the Backups tab.
  - >-
    Back up persistent state off-node before accepting an image digest or schema
    migration; restore into a separate namespace before cutover.
  - >-
    Keep credsKey, credsIv, the JWT secrets and the database passwords. A new
    creds key or IV makes stored provider credentials unreadable.
  - >-
    Upgrade the app, RAG API and Meilisearch together and test sign-in, saved
    credentials, search and RAG. Restoring the previous image does not undo
    database schema or index migrations.
  - >-
    Meilisearch migrates its database in place at start (MEILI_UPGRADE_DB).
    The migration is not atomic, so take a snapshot of its volume first.
  - >-
    MongoDB feature-compatibility upgrades and Percona auto-update are off. Keep
    the operator at CR version 1.23.1 with MongoDB 8.0.32. Change
    PostgreSQL major versions through a CNPG migration and check pgvector
    compatibility.
  - >-
    mongod runs with GLIBC_TUNABLES=glibc.pthread.rseq=1, so TCMalloc uses
    per-thread caches. Without it, MongoDB 8.0 exits at start on Linux 6.19
    to 7.0.13 and on Ubuntu 7.0 kernels (SERVER-121912, SERVER-136848).
  - >-
    This version reduces the MongoDB replica set from three members to one.
    Back up MongoDB first. The operator removes rs0-1 and rs0-2 and keeps their
    PVCs. Delete those PVCs after you check the data on rs0-0.

smoke:
  - name: librechat-ready
    resource: deployment/librechat
    condition: condition=Available
    timeout: 600s
    http: {service: librechat, port: 3080, path: /health, status: 200}
  - name: rag-api-ready
    resource: deployment/rag-api
    condition: condition=Available
    timeout: 600s
    http: {service: rag-api, port: 8000, path: /health, status: 200}
  - name: meilisearch-ready
    resource: statefulset/meilisearch
    condition: jsonpath={.status.readyReplicas}=1
    timeout: 600s
    http: {service: meilisearch, port: 7700, path: /health, status: 200}
  - name: mongodb-ready
    resource: perconaservermongodb/mongodb
    condition: jsonpath={.status.state}=ready
    timeout: 1200s
  - name: pgvector-ready
    resource: cluster/rag-db
    condition: condition=Ready
    timeout: 600s
    sql:
      cluster: rag-db
      database: rag
      query: SELECT count(*) FROM pg_extension WHERE extname='vector'
      expect: "1"