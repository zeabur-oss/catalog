---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongodb-access
  namespace: '{{ .Namespace }}'
spec:
  podSelector:
    matchLabels: &id001
      app.kubernetes.io/instance: mongodb
      app.kubernetes.io/name: percona-server-mongodb
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: librechat
    ports:
    - port: 27017
      protocol: TCP
  - from:
    - podSelector:
        matchLabels: *id001
    ports:
    - port: 27017
      protocol: TCP
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: psmdb-operator
      podSelector:
        matchLabels:
          app.kubernetes.io/name: psmdb-operator
    ports:
    - port: 27017
      protocol: TCP
  egress:
  - {{ dnsEgress }}
  - to:
    - podSelector:
        matchLabels: *id001
    ports:
    - port: 27017
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
