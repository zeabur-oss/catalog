metadata:
  name: rag-db-access
  namespace: '{{ .Namespace }}'
spec:
  podSelector:
    matchLabels: &id001
      cnpg.io/cluster: rag-db
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: rag-api
    ports:
    - port: 5432
