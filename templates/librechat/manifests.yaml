---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: rag-db
  namespace: '{{ .Namespace }}'
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17-standard-trixie@sha256:1c80146a60cf8010042616c67370b2861a1877b9fcf9dd6dd2a9395aa406b568
  enableSuperuserAccess: false
  enablePDB: true
  postgresUID: 26
  postgresGID: 26
  seccompProfile:
    type: RuntimeDefault
  bootstrap:
    initdb:
      database: rag
      owner: app
      encoding: UTF8
      postInitApplicationSQL:
      - CREATE EXTENSION IF NOT EXISTS vector;
  storage:
    size: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: '2'
      memory: 2Gi
---
apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDB
metadata:
  name: mongodb
  namespace: '{{ .Namespace }}'
spec:
  crVersion: 1.23.1
  unsafeFlags:
    replsetSize: true
  image: docker.io/percona/percona-server-mongodb:8.0.32-14@sha256:5ba5f240d2dc98bc6236ab1d79c0862c4b62dba9d98cd0ffdf716c30473d2d11
  initImage: docker.io/percona/percona-server-mongodb-operator:1.23.1@sha256:78c87b933e184b9af36dbb0078751862c75934c1521c33d3be4d0a38aa58dd0a
  initContainerSecurityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities: &id001
      drop:
      - ALL
    seccompProfile: &id002
      type: RuntimeDefault
  imagePullPolicy: IfNotPresent
  updateStrategy: SmartUpdate
  upgradeOptions:
    apply: disabled
    setFCV: false
  tls:
    mode: requireTLS
    allowInvalidCertificates: false
  secrets:
    users: mongodb-system-users
    encryptionKey: mongodb-encryption-key
  sharding:
    enabled: false
  users:
  - name: librechat
    db: admin
    passwordSecretRef:
      name: app-secrets
      key: mongo-password
    roles:
    - name: readWrite
      db: LibreChat
  replsets:
  - name: rs0
    size: 1
    serviceAccountName: mongodb-operand
    # The image sets glibc.pthread.rseq=0, so TCMalloc takes rseq for per-CPU caches.
    # Kernels 6.19 to 7.0.13 break that, and mongod 8.0 then exits at start (SERVER-121912).
    # With rseq kept by glibc, TCMalloc uses per-thread caches and mongod starts.
    env:
    - name: GLIBC_TUNABLES
      value: glibc.pthread.rseq=1
    affinity:
      antiAffinityTopologyKey: kubernetes.io/hostname
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1001
      runAsGroup: 1001
      fsGroup: 1001
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext: &id003
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
      capabilities: *id001
      seccompProfile: *id002
      runAsUser: 1001
      runAsGroup: 1001
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: '2'
        memory: 2Gi
    podDisruptionBudget:
      maxUnavailable: 1
    expose:
      enabled: false
    volumeSpec:
      persistentVolumeClaim:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
