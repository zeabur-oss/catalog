        matchLabels:
          kubernetes.io/metadata.name: cnpg-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: cloudnative-pg
    ports:
    - port: 8000
      protocol: TCP
    - port: 5432
      protocol: TCP
  - from:
    - podSelector:
        matchLabels: *id001
    ports:
    - port: 5432
      protocol: TCP
  - from:
    - podSelector:
        matchLabels: *id001
    ports:
    - port: 8000
      protocol: TCP
  egress:
  - {{ dnsEgress }}
  - to:
    - ipBlock:
        cidr: '{{ .Inputs.kubeApiCidr }}'
    ports:
    - port: 443
      protocol: TCP
    - port: 6443
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-api
  namespace: '{{ .Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rag-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rag-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: rag-api
        image: ghcr.io/danny-avila/librechat-rag-api-dev-lite:latest@sha256:a62ce2221b43a9bb57fa6cb733e7047c80132960272c33d5704028f3071a1251
        ports:
        - name: http
          containerPort: 8000
        env:
        - name: HOME
          value: /tmp
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        - name: RAG_HOST
          value: 0.0.0.0
        - name: RAG_PORT
          value: '8000'
        - name: DB_HOST
          value: rag-db-rw
        - name: DB_PORT
          value: '5432'
        - name: POSTGRES_DB
          value: rag
        - name: POSTGRES_USER
          value: app
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: rag-db-app
              key: password
        - name: PGVECTOR_CREATE_EXTENSION
          value: 'false'
        - name: PGSSLMODE
          value: verify-full
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: '{{ .Inputs.providerSecret }}'
              key: OPENAI_API_KEY
        - name: RAG_UPLOAD_DIR
          value: /tmp/uploads
        - name: SCARF_NO_ANALYTICS
          value: 'true'
        - name: PGSSLROOTCERT
          value: /pg-tls/ca.crt
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 2Gi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: pg-tls
          mountPath: /pg-tls
          readOnly: true
        startupProbe:
          httpGet:
            path: /health
            port: http
          failureThreshold: 90
          periodSeconds: 5
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 6
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 1Gi
      - name: pg-tls
        secret:
          secretName: rag-db-ca
          items:
          - key: ca.crt
            path: ca.crt
---
