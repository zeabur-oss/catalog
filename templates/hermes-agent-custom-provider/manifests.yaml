apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-bootstrap
  namespace: '{{ .Namespace }}'
data:
  99-provider-config: "#!/command/with-contenv sh\nset -eu\nexec s6-setuidgid hermes\
    \ /opt/hermes/.venv/bin/python - <<'PYCONFIG'\nimport os\nfrom pathlib import\
    \ Path\nimport yaml\npath = Path(os.environ.get(\"HERMES_HOME\", \"/opt/data\"\
    )) / \"config.yaml\"\nwith path.open() as stream:\n    config = yaml.safe_load(stream)\
    \ or {}\nmodel = config.get(\"model\") or {}\nmodel[\"provider\"] = \"custom\"\
    \nmodel[\"base_url\"] = os.environ[\"LLM_BASE_URL\"]\nmodel[\"api_key\"] = os.environ[\"\
    LLM_API_KEY\"]\nmodel[\"default\"] = os.environ[\"LLM_MODEL\"]\nconfig[\"model\"\
    ] = model\nwith path.open(\"w\") as stream:\n    yaml.safe_dump(config, stream,\
    \ sort_keys=False, allow_unicode=True)\npath.chmod(0o600)\nPYCONFIG\n"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-data
  namespace: '{{ .Namespace }}'
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
  namespace: '{{ .Namespace }}'
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-agent
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        fsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: hermes-agent
        image: nousresearch/hermes-agent:v2026.7.7.2@sha256:9c841866021c54c4596849f6135717e8a4d52ba510b7f52c50aef1de1a283973
        command:
        - /init
        - /opt/hermes/docker/main-wrapper.sh
        - gateway
        - run
        env:
        - name: HERMES_HOME
          value: /opt/data
        - name: HERMES_WRITE_SAFE_ROOT
          value: /opt/data
        - name: HERMES_DISABLE_LAZY_INSTALLS
          value: '1'
        - name: S6_READ_ONLY_ROOT
          value: '1'
        - name: API_SERVER_ENABLED
          value: 'true'
        - name: API_SERVER_HOST
          value: 0.0.0.0
        - name: API_SERVER_PORT
          value: '5000'
        - name: GATEWAY_ALLOW_ALL_USERS
          value: 'false'
        - name: LLM_MODEL
          value: '{{ .Inputs.model }}'
        - name: HERMES_DASHBOARD
          value: 'true'
        - name: API_SERVER_KEY
          valueFrom:
            secretKeyRef:
              name: hermes-secrets
              key: api-key
        - name: LLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: '{{ .Inputs.providerSecret }}'
              key: api-key
        - name: LLM_BASE_URL
          value: '{{ .Inputs.providerEndpoint }}'
        - name: HERMES_DASHBOARD_HOST
          value: 0.0.0.0
        - name: HERMES_DASHBOARD_PORT
          value: '9119'
        - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
          value: admin
        - name: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hermes-secrets
              key: dashboard-password
        - name: HERMES_DASHBOARD_BASIC_AUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: hermes-secrets
              key: dashboard-session-key
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
            - SETUID
            - SETGID
            - FOWNER
            - KILL
        ports:
        - name: dashboard
          containerPort: 9119
        - name: api
          containerPort: 5000
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
            ephemeral-storage: 256Mi
          limits:
            cpu: '2'
            memory: 2Gi
            ephemeral-storage: 2Gi
        startupProbe:
          httpGet:
            path: /health
            port: api
          periodSeconds: 5
          failureThreshold: 120
        readinessProbe:
          httpGet:
            path: /health
            port: api
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: api
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
        volumeMounts:
        - name: data
          mountPath: /opt/data
        - name: run
          mountPath: /run
        - name: tmp
          mountPath: /tmp
        - name: bootstrap
          mountPath: /etc/cont-init.d/99-provider-config
          subPath: 99-provider-config
          readOnly: true
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: hermes-data
      - name: run
        emptyDir:
          sizeLimit: 256Mi
      - name: tmp
        emptyDir:
          sizeLimit: 1Gi
      - name: bootstrap
        configMap:
          name: hermes-bootstrap
          defaultMode: 365
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-agent
  namespace: '{{ .Namespace }}'
spec:
  selector:
    app.kubernetes.io/name: hermes-agent
  ports:
  - name: dashboard
    port: 9119
    targetPort: dashboard
  - name: api
    port: 5000
    targetPort: api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes-api
  namespace: '{{ .Namespace }}'
  annotations:
    cert-manager.io/cluster-issuer: '{{ .ClusterIssuer }}'
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - '{{ .Domain }}'
    secretName: hermes-api-tls
  rules:
  - host: '{{ .Domain }}'
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: hermes-agent
            port:
              name: api
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: hermes-admin-allowlist
  namespace: '{{ .Namespace }}'
spec:
  ipAllowList:
    sourceRange:
    - '{{ .Inputs.adminCidr }}'
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes-dashboard
  namespace: '{{ .Namespace }}'
  annotations:
    cert-manager.io/cluster-issuer: '{{ .ClusterIssuer }}'
    traefik.ingress.kubernetes.io/router.middlewares: '{{ .Namespace }}-hermes-admin-allowlist@kubernetescrd'
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - '{{ .Inputs.adminDomain }}'
    secretName: hermes-dashboard-tls
  rules:
  - host: '{{ .Inputs.adminDomain }}'
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: hermes-agent
            port:
              name: dashboard
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-default-deny
  namespace: '{{ .Namespace }}'
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-traffic
  namespace: '{{ .Namespace }}'
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hermes-agent
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
          - traefik
          - kube-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
    ports:
    - protocol: TCP
      port: 9119
    - protocol: TCP
      port: 5000
  egress:
  - {{ dnsEgress }}
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 0.0.0.0/8
        - 10.0.0.0/8
        - 100.64.0.0/10
        - 127.0.0.0/8
        - 169.254.0.0/16
        - 172.16.0.0/12
        - 192.0.0.0/24
        - 192.0.2.0/24
        - 192.168.0.0/16
        - 198.18.0.0/15
        - 198.51.100.0/24
        - 203.0.113.0/24
        - 224.0.0.0/4
        - 240.0.0.0/4
    ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 443
