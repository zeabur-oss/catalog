apiVersion: catalog.zeabur.com/v1
kind: Template
metadata:
  name: PostgreSQL with pgvector
  description: >-
    CloudNativePG PostgreSQL 18 standard image with pgvector enabled and Barman
    Cloud backups.
  license: PostgreSQL AND Apache-2.0
  # Also: https://github.com/cloudnative-pg/postgres-containers, https://cloudnative-pg.io/
  homepage: https://github.com/pgvector/pgvector
  icon: https://cdn.zeabur.com/marketplace/postgresql.svg
  categories: [databases]

requires: [databases/cloudnative-pg]

services:
  - name: postgresql
    securityProfile: restricted
    ports: [{name: postgresql, port: 5432}]
    resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}

inputs:
  - name: backupDestination
    description: Dedicated S3 bucket and unique prefix for this cluster.
    required: true
    validation: {pattern: '^s3://[a-z0-9][a-z0-9.-]+/[A-Za-z0-9/_-]+$'}
  - name: backupEndpoint
    description: S3 HTTPS endpoint with publicly trusted certificate on TCP443.
    required: true
    validation: {pattern: '^https://[a-zA-Z0-9.-]+(:443)?$'}
  - name: backupSecret
    description: >-
      Existing namespaced Secret containing ACCESS_KEY_ID and ACCESS_SECRET_KEY,
      supplied out of band.
    required: true
    validation: {pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'}
  - name: backupCASecret
    description: >-
      Optional existing namespaced Secret with key ca.crt, the PEM CA that
      signed the backup endpoint certificate. Set it for a private CA. Leave it
      empty for a publicly trusted certificate.
    required: false
    validation: {pattern: '^([a-z0-9]([-a-z0-9]*[a-z0-9])?)?$'}
  - name: backupCidr
    description: IPv4 CIDR for the actual S3 endpoint.
    required: true
    validation: {pattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[12][0-9]|3[0-2])$'}
  - name: kubeApiCidr
    description: IPv4 CIDR for Kubernetes API as seen by the enforcing CNI.
    required: true
    validation: {pattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[12][0-9]|3[0-2])$'}

security:
  summary: >-
    CNPG owns non-root database operands and per-cluster RBAC; no public
    database port or superuser login. SQL extension creation runs only during
    initial database bootstrap.
  egress:
    - DNS TCP/UDP53
    - Explicit API CIDR TCP443/6443
    - Explicit S3 CIDR TCP443
    - Cluster peers TCP5432/8000
  risks:
    - risk: >-
        CNPG instance-manager Pods require scoped Kubernetes API tokens managed
        by the operator. The template creates no Role or binding.
      mitigation: >-
        Check catalog operator RBAC and generated operands. Keep token automount
        on for CNPG operands; the operator needs it.
    - risk: >-
        Local-path has no snapshots or cross-node availability; extension and
        plugin images are additional supply-chain inputs.
      mitigation: >-
        Check the operator release, database digest and backups; restore-test
        with pgvector before production and upgrades.
    - risk: >-
        Barman archives WAL continuously and takes an immediate and a daily
        02:00 UTC base backup, kept for 7 days. A completed Backup does not
        prove that vectors and indexes restore correctly.
      mitigation: >-
        Adjust retention to your recovery needs. Run a restore drill with
        representative vectors before production.
    - risk: NetworkPolicy inputs are IPv4 only.
      mitigation: IPv6-only clusters need an extended NetworkPolicy.

scalability:
  summary: >-
    Single primary with 10Gi node-local volume; vector indexes may need
    substantially more memory and disk. No HPA. Read replicas require separate
    nodes and a CNPG capacity check.
  replicas: 1
  maxReplicas: 3
  blockers:
    - Node-local data requires remote backup and restore on node loss.
    - Vector dimensions, index memory and extension versions constrain migrations.
    - >-
      The PodDisruptionBudget (enablePDB) protects the single instance from
      voluntary eviction and can block node drains.

upgradeNotes:
  - >-
    Connect to postgresql-rw:5432, database zeabur, owner app, with credentials
    from the operator-generated postgresql-app Secret. Superuser access is
    disabled. Client Pods in the same namespace need the label
    templates.zeabur.com/postgresql-client=true.
  - >-
    Check PostgreSQL and pgvector release compatibility; back up and test
    restore with representative vectors.
  - >-
    Do not treat a major PostgreSQL image change as a rolling minor update; plan
    the CNPG major upgrade or logical migration.
  - >-
    postInitApplicationSQL only runs on initial bootstrap. To upgrade the
    extension, check pg_extension.extversion, pgvector release notes and index
    compatibility, then run ALTER EXTENSION vector UPDATE as a planned
    migration.
  - >-
    Backup/postgresql-initial runs only at first install. Before an upgrade,
    confirm a recent completed Backup.

smoke:
  - name: cluster-ready
    resource: cluster/postgresql
    condition: condition=Ready
    timeout: 600s
    sql:
      cluster: postgresql
      database: zeabur
      query: SELECT '[1,2,3]'::vector <-> '[1,2,4]'::vector
      expect: "1"
  - name: initial-base-backup
    resource: backup/postgresql-initial
    condition: jsonpath={.status.phase}=completed
    timeout: 600s
