apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgresql
  namespace: {{ .Namespace }}
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18-standard-trixie@sha256:d72ace96f5803b12c341bb5dac48532e8c1f92f69e8a717a59d779bfc038dea9
  enableSuperuserAccess: false
  enablePDB: true
  postgresUID: 26
  postgresGID: 26
  seccompProfile: {type: RuntimeDefault}
  bootstrap:
    initdb:
      database: zeabur
      owner: app
      encoding: UTF8
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector;
  storage:
    storageClass: local-path
    size: 10Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: '1', memory: 1Gi}
  postgresql:
    parameters:
      shared_buffers: 128MB
      max_connections: '100'
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: postgresql-backups
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: postgresql-backups
  namespace: {{ .Namespace }}
spec:
  retentionPolicy: 7d
  configuration:
    destinationPath: '{{ .Inputs.backupDestination }}'
    endpointURL: '{{ .Inputs.backupEndpoint }}'
    s3Credentials:
      accessKeyId: {name: '{{ .Inputs.backupSecret }}', key: ACCESS_KEY_ID}
      secretAccessKey: {name: '{{ .Inputs.backupSecret }}', key: ACCESS_SECRET_KEY}
    wal:
      compression: gzip
    data:
      compression: gzip
  instanceSidecarConfiguration:
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: '1', memory: 512Mi}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgresql-daily
  namespace: {{ .Namespace }}
spec:
  schedule: '0 0 2 * * *'
  immediate: true
  backupOwnerReference: self
  cluster: {name: postgresql}
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ .Namespace }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgresql-connectivity
  namespace: {{ .Namespace }}
spec:
  podSelector:
    matchLabels: {cnpg.io/cluster: postgresql}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {templates.zeabur.com/postgresql-client: 'true'}
      ports: [{protocol: TCP, port: 5432}]
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: cnpg-system}
          podSelector:
            matchLabels: {app.kubernetes.io/name: cloudnative-pg}
      ports: [{protocol: TCP, port: 8000}, {protocol: TCP, port: 5432}]
    - from:
        - podSelector:
            matchLabels: {cnpg.io/cluster: postgresql}
      ports: [{protocol: TCP, port: 5432}, {protocol: TCP, port: 8000}]
  egress:
    - {{ dnsEgress }}
    - to:
        - ipBlock: {cidr: '{{ .Inputs.kubeApiCidr }}'}
      ports: [{protocol: TCP, port: 443}, {protocol: TCP, port: 6443}]
    - to:
        - ipBlock: {cidr: '{{ .Inputs.backupCidr }}'}
      ports: [{protocol: TCP, port: 443}]
    - to:
        - podSelector:
            matchLabels: {cnpg.io/cluster: postgresql}
      ports: [{protocol: TCP, port: 5432}, {protocol: TCP, port: 8000}]
---
apiVersion: postgresql.cnpg.io/v1
kind: Backup
metadata:
  name: postgresql-initial
  namespace: {{ .Namespace }}
spec:
  cluster: {name: postgresql}
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
