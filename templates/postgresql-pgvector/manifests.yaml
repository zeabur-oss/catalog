apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgresql
  namespace: {{ .Namespace }}
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18-standard-trixie@sha256:d72ace96f5803b12c341bb5dac48532e8c1f92f69e8a717a59d779bfc038dea9
  enableSuperuserAccess: false
  enablePDB: true
  postgresUID: 26
  postgresGID: 26
  seccompProfile: {type: RuntimeDefault}
  bootstrap:
    initdb:
      database: zeabur
      owner: app
      encoding: UTF8
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector;
  storage:
    size: 10Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: '1', memory: 1Gi}
  postgresql:
    parameters:
      shared_buffers: 128MB
      max_connections: '100'
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ .Namespace }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgresql-connectivity
  namespace: {{ .Namespace }}
spec:
  podSelector:
    matchLabels: {cnpg.io/cluster: postgresql}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {templates.zeabur.com/postgresql-client: 'true'}
      ports: [{protocol: TCP, port: 5432}]
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: cnpg-system}
          podSelector:
            matchLabels: {app.kubernetes.io/name: cloudnative-pg}
      ports: [{protocol: TCP, port: 8000}, {protocol: TCP, port: 5432}]
    - from:
        - podSelector:
            matchLabels: {cnpg.io/cluster: postgresql}
      ports: [{protocol: TCP, port: 5432}, {protocol: TCP, port: 8000}]
  egress:
    - {{ dnsEgress }}
    - to:
        - ipBlock: {cidr: '{{ .Inputs.kubeApiCidr }}'}
      ports: [{protocol: TCP, port: 443}, {protocol: TCP, port: 6443}]
