apiVersion: catalog.zeabur.com/v1
kind: Template
metadata:
  name: RustFS
  description: >-
    Private, native-TLS S3-compatible object storage with a restricted non-root
    standalone runtime.
  license: Apache-2.0
  # Also: https://github.com/rustfs/rustfs/releases/tag/1.0.3, https://charts.rustfs.com/
  homepage: https://github.com/rustfs/rustfs
  icon: https://github.com/rustfs.png
  categories: [storage]

requires: [certificates/cert-manager]

services:
  - name: rustfs
    securityProfile: restricted
    ports: [{name: s3-https, port: 9000}]
    resources: {requests: {cpu: 250m, memory: 1Gi}, limits: {cpu: 2000m, memory: 4Gi}}

inputs:
  - name: accessKey
    description: >-
      Generate the root access key at deploy time; preserve
      rustfs-root-credentials/access-key across restarts and upgrades. Never
      distribute root credentials to tenants.
    generate: random
    secret: {name: rustfs-root-credentials, key: access-key}
    validation: {pattern: '^[A-Za-z0-9_-]{43}$'}
  - name: secretKey
    description: >-
      Generate the independent root secret key at deploy time; preserve
      rustfs-root-credentials/secret-key and protect it as an administrator and
      STS signing credential.
    generate: random
    secret: {name: rustfs-root-credentials, key: secret-key}
    validation: {pattern: '^[A-Za-z0-9_-]{43}$'}
  - name: clientNamespace
    description: >-
      One explicitly trusted client namespace. Only its Pods labeled
      templates.zeabur.com/rustfs-client=true may connect; use the deployment
      namespace for same-namespace-only operation. Cross-namespace clients
      require separately provisioned limited credentials and the public issuing
      CA.
    required: true
    validation: {pattern: '^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$'}
  - name: storageSize
    description: >-
      Initial local-path PVC capacity, for example 20Gi. Existing StatefulSet
      claim capacity is not changed by updating this input; use a supported
      storage expansion workflow.
    required: true
    validation: {pattern: '^[1-9][0-9]{0,3}Gi$'}

security:
  summary: >-
    Single non-root restricted StatefulSet, native verified TLS, generated
    credentials, private S3, loopback-only console, read-only root, token-off
    identity and deny-by-default NetworkPolicies. No public endpoint or
    unauthenticated setup flow.
  egress:
    - 'RustFS server: none'
    - 'Initialization Job: kube-dns TCP/UDP53 and rustfs TCP9000 only'
  risks:
    - risk: >-
        The upstream image only warns about missing/default root credentials;
        its default pair is publicly known.
      mitigation: >-
        Required SecretRefs plus a fail-closed nonempty/nondefault startup guard
        run before the official entrypoint. Deployment credentials are generated
        before Pods start; no public Ingress, NodePort or LoadBalancer is
        created. Initialization creates a private bucket and all four
        public-access-block controls.
    - risk: >-
        Root credentials authorize administration and sign STS tokens; upstream
        intentionally retains shared-root-secret STS signing
        (GHSA-m77q-r63m-pj89).
      mitigation: >-
        Root is used only by initialization and authorized administrators. Do
        not use the root Secret as a tenant/application account. Give each
        application its own bucket-scoped identity. Check IAM and STS behaviour
        before multi-tenant use. Known authorization/retention fixes require at
        least 1.0.2; this template pins 1.0.3.
    - risk: >-
        Node-local data has no redundancy, backup schedule or snapshots. The
        private issuing CA also requires lifecycle management.
      mitigation: >-
        Keep independent off-cluster backups and Secrets under separate custody
        and rehearse restore before valuable data or upgrades. A disposable test
        fixture can skip backups. Preserve and rotate CA trust deliberately;
        never disable client certificate verification. cert-manager renews the
        leaf but does not distribute root trust, reissue leaves after a CA
        change, or serve CRL/OCSP.
    - risk: >-
        S3 support covers only the features RustFS implements. ACL
        authorization, bucket logging and ownership controls are missing, and
        object-key and directory-marker semantics differ from AWS. RustFS cannot
        open MinIO data directories.
      mitigation: >-
        Test client applications against RustFS before use. Move data from MinIO
        through the S3 API.

scalability:
  summary: >-
    One standalone single-node single-drive RustFS server. No HA or horizontal
    scaling; the official supported single-drive topology cannot expand in place
    into a pool.
  replicas: 1
  maxReplicas: 1
  blockers:
    - >-
      Single local-path ReadWriteOnce data claim; node loss loses availability
      and may lose all stored objects.
    - >-
      Migrate through S3 into a separately designed distributed deployment
      instead of increasing replicas or reusing this volume as a new pool.
    - >-
      No backup or restore controller is included. RPO and RTO depend on the
      backup process you add.

upgradeNotes:
  - >-
    Preserve rustfs-root-credentials, the data PVC and CA trust. Root Secret
    rotation requires restarting RustFS and coordinating clients; it also
    affects STS signing. Never silently regenerate credentials on an upgrade.
  - >-
    Native cert-manager TLS Secret rustfs-server-tls contains tls.crt, tls.key
    and ca.crt; clients mount only ca.crt. The server reloads native TLS
    material every 30 seconds. The administrator distributes CA trust to other
    namespaces and creates limited application identities; the template copies
    no Secrets.
  - >-
    Endpoint https://rustfs.<namespace>.svc:9000, path-style S3, region
    us-east-1, initial private bucket zeabur. Console is bound to 127.0.0.1:9001
    and is available only through authorized port-forwarding; it has no Service
    or Ingress.
  - >-
    Initialization Job rustfs-initialize is idempotent for the zeabur bucket but
    has immutable Pod spec. For an intentional upgrade or smoke rerun, remove
    only that completed Job before reapplying it; preserve PVCs and Secrets. It
    enforces private public-access-block settings on this template-owned bucket.
  - >-
    Before an image/data-format upgrade, fence writers, take and restore an
    independent backup, and read the exact upstream release compatibility notes.
    Reverting the image does not roll back the on-disk format. Restore a cold
    copy of the full /data tree only with the same RustFS version, the same root
    credentials and UID/GID 10001 access. A live mirror of current objects does
    not include versions, deletes, IAM or bucket settings.
  - >-
    StatefulSet deletion retains its volumeClaimTemplate PVC by default;
    deleting the PVC can delete the local-path PV and data according to the
    StorageClass reclaim policy. This singleton has no PDB or HPA.

smoke:
  - name: issuing-ca-ready
    resource: certificate/rustfs-ca
    condition: condition=Ready
    timeout: 300s
  - name: native-tls-ready
    resource: certificate/rustfs-server-tls
    condition: condition=Ready
    timeout: 300s
  - name: object-storage-ready
    resource: statefulset/rustfs
    condition: jsonpath={.status.readyReplicas}=1
    timeout: 600s
  - name: private-s3-transaction
    resource: job/rustfs-initialize
    condition: condition=Complete
    timeout: 600s
