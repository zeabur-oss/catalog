apiVersion: catalog.zeabur.com/v1
kind: Template
metadata:
  name: Ollama
  version: "0.40.10"
  description: Private CPU-only local model runtime. The API has no public ingress.
  license: MIT
  homepage: https://github.com/ollama/ollama
  categories: [ai]

services:
  - name: ollama
    securityProfile: restricted
    ports: [{name: http, port: 11434}]
    resources: {requests: {cpu: 500m, memory: 2Gi}, limits: {cpu: "4", memory: 8Gi}}

security:
  summary: >-
    The container runs as UID 1000 with no extra system privileges and a
    read-only image. The API has no sign-in. Only clients in the same
    namespace that carry a specific label can reach it.
  locales:
    zh-TW:
      summary: "以 UID 1000 執行，沒有額外的系統權限，映像檔唯讀。API 沒有登入驗證，只有同一個命名空間裡、帶有指定標籤的用戶端連得到。"
    zh-CN:
      summary: "以 UID 1000 运行，没有额外的系统权限，镜像只读。API 没有登录验证，只有同一个命名空间里、带有指定标签的客户端连得到。"
  unauthenticated: [ollama]
  risks:
    - risk: >-
        The Ollama API has no sign-in, and anyone who can reach it can manage
        models.
      mitigation: >-
        There is no Ingress or NodePort. Only trusted pods in this namespace
        that carry the label templates.zeabur.com/ollama-client=true can
        connect. Do not attach a public route to this service, because it has
        no sign-in.
      locales:
        zh-TW:
          risk: "Ollama API 沒有登入驗證，連得到的人都能管理模型。"
          mitigation: "沒有 Ingress 也沒有 NodePort。只有這個命名空間裡、帶有標籤 templates.zeabur.com/ollama-client=true 的可信任 Pod 連得進來。不要幫這個服務加公開路由，因為它沒有登入驗證。"
        zh-CN:
          risk: "Ollama API 没有登录验证，连得到的人都能管理模型。"
          mitigation: "没有 Ingress 也没有 NodePort。只有这个命名空间里、带有标签 templates.zeabur.com/ollama-client=true 的可信 Pod 连得进来。不要给这个服务加公开路由，因为它没有登录验证。"
    - risk: >-
        Each model has its own license, separate from the MIT license of the
        Ollama software. Model files can also use up all your RAM and disk.
      mitigation: >-
        No model is preloaded. Read each model's license and check its size,
        then run `ollama pull MODEL` in the Pod. The Pod loads one model and
        serves one request at a time. It has an 8Gi memory limit and a 50Gi
        volume, so most large models do not fit.
      locales:
        zh-TW:
          risk: "每個模型都有自己的授權，跟 Ollama 軟體本身的 MIT 授權無關。模型檔也可能把記憶體和磁碟吃光。"
          mitigation: "不會預先載入任何模型。請先看過每個模型的授權和大小，再到 Pod 裡執行 `ollama pull MODEL`。Pod 一次只載入一個模型，一次只處理一個請求。記憶體上限是 8Gi，儲存空間是 50Gi，所以多數大型模型放不下。"
        zh-CN:
          risk: "每个模型都有自己的许可，跟 Ollama 软件本身的 MIT 许可无关。模型文件也可能把内存和磁盘用光。"
          mitigation: "不会预先加载任何模型。请先看过每个模型的许可和大小，再到 Pod 里运行 `ollama pull MODEL`。Pod 一次只加载一个模型，一次只处理一个请求。内存上限是 8Gi，存储卷是 50Gi，所以多数大型模型放不下。"

scalability:
  summary: Single replica on one volume, with no failover.
  replicas: 1
  maxReplicas: 1
  blockers:
    - A node-local default StorageClass, such as local-path, has no snapshots or failover.
    - Replicas cannot share the model store. More replicas need a shared volume.
    - Inference runs on CPU only. The template does not schedule GPUs.

upgradeNotes:
  - >-
    Breaking change: the template no longer ships its default-deny and per-pod
    NetworkPolicies, because the installer isolates project namespaces. Applying
    this version does not delete the old ones. Delete them with `kubectl delete
    networkpolicy ollama-default-deny`. ollama-access stays.
  - >-
    Back up persistent state off-node before accepting an image digest or schema
    migration; restore into a separate namespace before cutover.
  - >-
    To back up, stop writes and copy /data to encrypted off-node storage.
    Include private model definitions and private keys, as well as public model
    blobs. Keep the previous digest and a compatible data copy for rollback.
  - >-
    The Deployment uses the Recreate strategy. The API is unavailable during an
    upgrade.

smoke:
  - name: ollama-ready
    resource: deployment/ollama
    condition: condition=Available
    timeout: 600s
    http: {service: ollama, port: 11434, path: /api/tags, status: 200}
