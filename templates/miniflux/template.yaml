apiVersion: catalog.zeabur.com/v1
kind: Template
metadata:
  name: Miniflux
  version: "2.3.4"
  description: >-
    Miniflux feed reader over HTTPS, with PostgreSQL 18 managed by
    CloudNativePG.
  license: Apache-2.0 AND PostgreSQL
  # Also: https://cloudnative-pg.io/
  homepage: https://miniflux.app/
  icon: https://github.com/miniflux.png
  categories: [productivity]

requires:
  - ingress/traefik
  - certificates/cert-manager
  - databases/cloudnative-pg

services:
  - name: miniflux
    securityProfile: restricted
    ports: [{name: http, port: 8080}]
    resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: "1", memory: 512Mi}}
    domains: ['{{ .Domain }}']
  - name: miniflux-db
    securityProfile: restricted
    ports: [{name: postgresql, port: 5432}]
    resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}

inputs:
  - name: adminPassword
    description: >-
      Password of the admin user, created at the first start. Change it in
      Miniflux after you sign in; the Secret is not applied again.
    generate: random
    secret: {name: miniflux-secrets, key: admin-password}
    validation: {pattern: '^[A-Za-z0-9_-]{43}$'}

security:
  summary: >-
    Runs as UID 65534 with a read-only root filesystem, no service-account token
    and all capabilities dropped. Outbound traffic is not limited. Only the admin
    user exists after installation.
  risks:
    - risk: >-
        Feeds are fetched from addresses that users choose.
      mitigation: >-
        Miniflux refuses private network addresses by default. The template does
        not limit outbound traffic; to limit it, add an egress NetworkPolicy.
    - risk: >-
        CloudNativePG instances call the Kubernetes API with an operator-created
        identity.
      mitigation: >-
        The databases/cloudnative-pg component creates RBAC for each cluster;
        the Miniflux Pod has no token.

scalability:
  summary: One Miniflux instance with one PostgreSQL primary.
  replicas: 1
  maxReplicas: 1
  blockers:
    - >-
      Each instance runs its own feed scheduler. More replicas need the
      scheduler disabled on all but one instance.

upgradeNotes:
  - >-
    Breaking change: the template no longer ships its default-deny and per-pod
    NetworkPolicies, because the installer isolates project namespaces. Applying
    this version does not delete the old ones. Delete them with `kubectl delete
    networkpolicy miniflux-default-deny miniflux miniflux-db`.
  - >-
    New installs start without database backups. Installs made before this
    version keep their backups. To turn backups on, open the database in Zeabur
    and use the Backups tab.
  - >-
    Miniflux migrates the database on start. A rollback needs the database
    backup taken before the upgrade.
  - Deleting the namespace deletes the database. Backups in S3 stay.

smoke:
  - name: postgresql-ready
    resource: cluster/miniflux-db
    condition: condition=Ready
    timeout: 900s
  - name: miniflux-ready
    resource: deployment/miniflux
    condition: condition=Available
    timeout: 600s
    http: {service: miniflux, port: 8080, path: /healthcheck, status: 200, contains: OK}
  - name: authentication-required
    resource: deployment/miniflux
    condition: condition=Available
    timeout: 120s
    http: {service: miniflux, port: 8080, path: /v1/me, status: 401}
  - name: administrator-created
    resource: cluster/miniflux-db
    condition: condition=Ready
    timeout: 120s
    sql:
      cluster: miniflux-db
      database: miniflux
      query: SELECT count(*) FROM users WHERE is_admin
      expect: "1"